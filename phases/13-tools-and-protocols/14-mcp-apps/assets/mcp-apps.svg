<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .green { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .blue { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .orange { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .mono { font-size: 11px; font-family: Menlo, monospace; fill: #222; }
      .small { font-size: 11px; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">基于 2026-07-28 版无状态核心的 MCP Apps</text>

  <rect x="35" y="60" width="250" height="420" rx="8" class="green"/>
  <text x="160" y="86" text-anchor="middle" class="head">客户端请求</text>
  <text x="52" y="118" class="mono">POST /mcp</text>
  <text x="52" y="138" class="mono">MCP-Protocol-Version</text>
  <text x="52" y="158" class="mono">Mcp-Method + Mcp-Name</text>
  <text x="52" y="196" class="mono">params._meta</text>
  <text x="52" y="216" class="small">protocolVersion</text>
  <text x="52" y="236" class="small">clientCapabilities.extensions</text>
  <text x="68" y="256" class="mono">io.modelcontextprotocol/ui</text>
  <text x="52" y="294" class="mono">server/discover</text>
  <text x="52" y="314" class="small">随后 tools/list、tools/call、</text>
  <text x="52" y="334" class="small">resources/read</text>
  <text x="52" y="380" class="head">从不发送</text>
  <text x="52" y="402" class="mono">initialize</text>
  <text x="52" y="422" class="mono">Mcp-Session-Id</text>
  <text x="52" y="442" class="mono">独立 GET 流</text>

  <path d="M285,270 L350,270" class="edge" marker-end="url(#arrow)"/>

  <rect x="350" y="60" width="260" height="420" rx="8" class="blue"/>
  <text x="480" y="86" text-anchor="middle" class="head">MCP App 服务器</text>
  <text x="368" y="118" class="mono">server/discover</text>
  <text x="368" y="138" class="small">声明工具、资源与界面</text>
  <text x="368" y="174" class="mono">tools/list</text>
  <text x="368" y="194" class="small">_meta.ui.resourceUri</text>
  <text x="368" y="214" class="mono">ui://notes/timeline.html</text>
  <text x="368" y="250" class="mono">tools/call</text>
  <text x="368" y="270" class="small">文本 + structuredContent</text>
  <text x="368" y="306" class="mono">resources/list + read</text>
  <text x="368" y="326" class="small">HTML + CSP + 权限</text>
  <text x="368" y="346" class="small">ttlMs + cacheScope</text>
  <text x="368" y="390" class="mono">每个结果</text>
  <text x="368" y="410" class="small">resultType: complete</text>
  <text x="368" y="430" class="small">结果 _meta 中的 serverInfo</text>

  <path d="M610,270 L675,270" class="edge" marker-end="url(#arrow)"/>

  <rect x="675" y="60" width="250" height="420" rx="8" class="orange"/>
  <text x="800" y="86" text-anchor="middle" class="head">宿主沙箱与 App</text>
  <text x="692" y="118" class="mono">沙箱 iframe</text>
  <text x="692" y="138" class="small">宿主管理浏览器能力</text>
  <text x="692" y="174" class="mono">默认拒绝的 CSP</text>
  <text x="692" y="194" class="small">最小来源集合与权限</text>
  <text x="692" y="230" class="mono">postMessage JSON-RPC</text>
  <text x="692" y="250" class="small">精确的 targetOrigin</text>
  <text x="692" y="270" class="small">校验 event.origin</text>
  <text x="692" y="306" class="mono">ui/initialize</text>
  <text x="692" y="326" class="small">仅用于 Apps 连接桥</text>
  <text x="692" y="346" class="small">并非 MCP 核心初始化</text>
  <text x="692" y="390" class="mono">tools/call 连接桥</text>
  <text x="692" y="410" class="small">宿主同意后，发起新的</text>
  <text x="692" y="430" class="small">自包含 MCP 请求</text>

  <text x="480" y="515" text-anchor="middle" class="caption">此协议模型接入第 09 课的完整 Streamable HTTP 适配器。</text>
</svg>
