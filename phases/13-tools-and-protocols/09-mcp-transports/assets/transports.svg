<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">MCP 2026-07-28 传输方式及旧版边界</text>

  <rect x="35" y="55" width="280" height="410" class="cool"/>
  <text x="175" y="80" text-anchor="middle" class="head">stdio：本地</text>
  <text x="55" y="112" class="step">绑定方式</text>
  <text x="55" y="134" class="small">客户端启动子进程</text>
  <text x="55" y="152" class="small">每行一个 JSON-RPC 对象</text>
  <text x="55" y="170" class="small">stdout 传协议，stderr 写日志</text>
  <text x="55" y="208" class="step">现代协议元数据</text>
  <text x="55" y="230" class="small">每个请求携带版本与能力</text>
  <text x="55" y="248" class="small">clientInfo 应重复携带</text>
  <text x="55" y="286" class="step">生命周期</text>
  <text x="55" y="308" class="small">EOF 关闭传输进程</text>
  <text x="55" y="326" class="small">进程不是协议会话</text>
  <text x="55" y="364" class="step">恢复</text>
  <text x="55" y="386" class="small">重启、重新发现、重新列举</text>
  <text x="55" y="404" class="small">用新 ID 重试安全任务</text>

  <rect x="340" y="55" width="280" height="410" class="cold"/>
  <text x="480" y="80" text-anchor="middle" class="head">Streamable HTTP：现代协议</text>
  <text x="360" y="112" class="step">单一端点 /mcp</text>
  <text x="360" y="134" class="small">逐条 POST JSON-RPC 消息</text>
  <text x="360" y="152" class="small">响应：JSON 或限定范围的 SSE</text>
  <text x="360" y="188" class="step">必须镜像到头部的字段</text>
  <text x="360" y="210" class="small">MCP-Protocol-Version</text>
  <text x="360" y="228" class="small">Mcp-Method + 条件性 Mcp-Name</text>
  <text x="360" y="246" class="small">逐值与消息正文对照校验</text>
  <text x="360" y="282" class="step">长时间接收变更</text>
  <text x="360" y="304" class="small">POST subscriptions/listen</text>
  <text x="360" y="322" class="small">确认 + 带标签的通知 + 结果</text>
  <text x="360" y="358" class="step">现代协议已移除的行为</text>
  <text x="360" y="380" class="small">GET / DELETE 返回 405</text>
  <text x="360" y="398" class="small">忽略会话与重放头</text>
  <text x="360" y="416" class="small">服务器不发 JSON-RPC 请求</text>

  <rect x="645" y="55" width="280" height="410" class="hot"/>
  <text x="785" y="80" text-anchor="middle" class="head">仅用于旧版兼容</text>
  <text x="665" y="112" class="step">2025 Streamable HTTP</text>
  <text x="665" y="134" class="small">Mcp-Session-Id</text>
  <text x="665" y="152" class="small">独立 GET + DELETE</text>
  <text x="665" y="170" class="small">Last-Event-ID 恢复</text>
  <text x="665" y="206" class="step">2024 HTTP+SSE</text>
  <text x="665" y="228" class="small">分离的 SSE 与 POST 端点</text>
  <text x="665" y="264" class="step">安全探测两个协议世代</text>
  <text x="665" y="286" class="small">先发现代协议 POST</text>
  <text x="665" y="304" class="small">识别出的现代协议错误：继续现代协议</text>
  <text x="665" y="322" class="small">无法识别的失败：尝试旧版</text>
  <text x="665" y="358" class="step">迁移规则</text>
  <text x="665" y="380" class="small">旧版路由保持独立</text>
  <text x="665" y="398" class="small">不得标为 2026 行为</text>

  <text x="480" y="505" text-anchor="middle" class="caption">不同绑定下协议语义相同：每个现代请求都自描述。</text>
</svg>
