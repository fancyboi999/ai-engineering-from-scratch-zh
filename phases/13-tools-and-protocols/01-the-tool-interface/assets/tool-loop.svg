<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 13px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 11px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">工具调用的四步循环</text>

  <rect x="40" y="70" width="200" height="110" class="cool"/>
  <text x="140" y="96" text-anchor="middle" class="head">1 / 描述</text>
  <text x="140" y="122" text-anchor="middle" class="small">宿主注册工具</text>
  <text x="140" y="138" text-anchor="middle" class="small">名称 + 描述</text>
  <text x="140" y="154" text-anchor="middle" class="small">+ JSON Schema 输入</text>
  <text x="140" y="170" text-anchor="middle" class="small">+ 执行函数</text>

  <rect x="280" y="70" width="200" height="110" class="cold"/>
  <text x="380" y="96" text-anchor="middle" class="head">2 / 决策</text>
  <text x="380" y="122" text-anchor="middle" class="small">模型输出</text>
  <text x="380" y="138" text-anchor="middle" class="small">文本回答或</text>
  <text x="380" y="154" text-anchor="middle" class="small">tool_calls: [ {id,</text>
  <text x="380" y="170" text-anchor="middle" class="small">name, arguments} ]</text>

  <rect x="520" y="70" width="200" height="110" class="hot"/>
  <text x="620" y="96" text-anchor="middle" class="head">3 / 执行</text>
  <text x="620" y="122" text-anchor="middle" class="small">宿主校验参数</text>
  <text x="620" y="138" text-anchor="middle" class="small">是否符合结构，</text>
  <text x="620" y="154" text-anchor="middle" class="small">对有实际影响的</text>
  <text x="620" y="170" text-anchor="middle" class="small">工具设置关卡，并执行函数</text>

  <rect x="760" y="70" width="180" height="110" class="box"/>
  <text x="850" y="96" text-anchor="middle" class="head">4 / 观察</text>
  <text x="850" y="122" text-anchor="middle" class="small">宿主追加</text>
  <text x="850" y="138" text-anchor="middle" class="small">工具结果，并使用</text>
  <text x="850" y="154" text-anchor="middle" class="small">匹配的 ID；然后</text>
  <text x="850" y="170" text-anchor="middle" class="small">再次调用模型</text>

  <path d="M240,125 L280,125" class="edge" marker-end="url(#arrow)"/>
  <path d="M480,125 L520,125" class="edge" marker-end="url(#arrow)"/>
  <path d="M720,125 L760,125" class="edge" marker-end="url(#arrow)"/>
  <path d="M850,180 C850,240 380,240 380,220" class="edge" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <text x="600" y="256" text-anchor="middle" class="caption">持续循环，直到模型返回文本或宿主达到 MAX_TURNS</text>

  <rect x="40" y="290" width="440" height="210" class="box"/>
  <text x="260" y="316" text-anchor="middle" class="head">同样的循环，不同的名称</text>
  <text x="60" y="342" class="step">OpenAI         : tools / tool_calls / tool_choice</text>
  <text x="60" y="362" class="step">Anthropic      : tools / tool_use / tool_result</text>
  <text x="60" y="382" class="step">Gemini         : functionDeclarations / functionCall</text>
  <text x="60" y="402" class="step">MCP            : tools/list / tools/call / content</text>
  <text x="60" y="422" class="step">A2A：技能 / SendMessage / Artifact parts</text>
  <text x="60" y="442" class="step">WebMCP（2026）：浏览器工具清单 / 分发</text>
  <text x="60" y="472" class="small">每一行均为相同四步，只有列名不同。</text>

  <rect x="520" y="290" width="420" height="210" class="cool"/>
  <text x="730" y="316" text-anchor="middle" class="head">纯读取与有实际影响的操作</text>
  <text x="540" y="342" class="step">纯读取（可安全重试）</text>
  <text x="540" y="360" class="small">get_weather, search_docs, get_time</text>
  <text x="540" y="380" class="step">有实际影响（需要关卡）</text>
  <text x="540" y="398" class="small">send_email, delete_file, execute_trade</text>
  <text x="540" y="424" class="step">Meta 二选三规则（2026）</text>
  <text x="540" y="442" class="small">一次交互至多组合以下两项：</text>
  <text x="540" y="458" class="small">  - 不可信输入</text>
  <text x="540" y="474" class="small">  - 敏感数据</text>
  <text x="540" y="490" class="small">  - 有实际影响的操作</text>
</svg>
