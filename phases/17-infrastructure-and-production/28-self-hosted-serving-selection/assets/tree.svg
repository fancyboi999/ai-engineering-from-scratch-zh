<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cpu { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gpu { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .agent { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .maint { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">自托管引擎决策树 — 先看硬件，再看规模，最后看负载</text>

  <rect x="40" y="50" width="280" height="200" class="cpu"/>
  <text x="180" y="72" text-anchor="middle" class="head">CPU / 边缘设备</text>
  <text x="180" y="96" text-anchor="middle" class="step">llama.cpp（主流）</text>
  <text x="60" y="124" class="small">· 模型支持最广</text>
  <text x="60" y="142" class="small">· CPU 推理最快</text>
  <text x="60" y="160" class="small">· 完全控制量化 / 线程</text>
  <rect x="60" y="180" width="240" height="60" class="box"/>
  <text x="180" y="202" text-anchor="middle" class="step">Ollama = llama.cpp + 用户体验</text>
  <text x="180" y="220" text-anchor="middle" class="small">一条命令，单用户</text>
  <text x="180" y="236" text-anchor="middle" class="small">比 llama.cpp 慢 15-30%</text>

  <rect x="340" y="50" width="280" height="200" class="gpu"/>
  <text x="480" y="72" text-anchor="middle" class="head">NVIDIA GPU</text>
  <rect x="360" y="90" width="240" height="45" class="box"/>
  <text x="480" y="113" text-anchor="middle" class="step">vLLM（通用默认选择）</text>
  <text x="480" y="128" text-anchor="middle" class="small">v0.15.1 二月 2026，Blackwell SM120</text>
  <rect x="360" y="145" width="240" height="45" class="box"/>
  <text x="480" y="168" text-anchor="middle" class="step">TRT-LLM（仅限 Blackwell）</text>
  <text x="480" y="183" text-anchor="middle" class="small">B200/GB200 上的吞吐领先者</text>
  <rect x="360" y="200" width="240" height="45" class="box"/>
  <text x="480" y="222" text-anchor="middle" class="step">Ollama（仅用于开发）</text>
  <text x="480" y="237" text-anchor="middle" class="small">不适合共享生产环境</text>

  <rect x="640" y="50" width="280" height="200" class="agent"/>
  <text x="780" y="72" text-anchor="middle" class="head">agent 工作负载 / 前缀密集</text>
  <text x="780" y="96" text-anchor="middle" class="step">SGLang（专长方案）</text>
  <text x="660" y="124" class="small">· RadixAttention（阶段 17 · 06）</text>
  <text x="660" y="142" class="small">· 生产环境中有 400,000+ GPU</text>
  <text x="660" y="160" class="small">· xAI, LinkedIn, Cursor, Oracle</text>
  <text x="660" y="178" class="small">· GCP, Azure, AWS</text>
  <text x="780" y="210" text-anchor="middle" class="caption">RAG 大量复用前缀 → 选这里</text>
  <text x="780" y="228" text-anchor="middle" class="caption">多轮 agent 工具 → 选这里</text>

  <rect x="40" y="280" width="880" height="90" class="maint"/>
  <text x="480" y="302" text-anchor="middle" class="head">TGI 自十二月 11 日 2025 起进入维护模式</text>
  <text x="480" y="324" text-anchor="middle" class="step">今后仅修复缺陷 — 新项目不要默认选择 TGI</text>
  <text x="480" y="344" text-anchor="middle" class="caption">既有 TGI 部署可继续；方便时迁移至 SGLang 或 vLLM</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="412" text-anchor="middle" class="head">2026 年流水线模式</text>
  <text x="480" y="434" text-anchor="middle" class="step">开发：Ollama → 预发布：llama.cpp → 生产：vLLM（或 SGLang）</text>
  <text x="480" y="454" text-anchor="middle" class="step">需要时在层级间将 GGUF 转为 HF safetensors</text>
  <text x="480" y="476" text-anchor="middle" class="caption">工程师本地快速迭代；预发布匹配生产量化；生产是最终服务目标</text>
</svg>
