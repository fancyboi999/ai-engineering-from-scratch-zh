<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .tool { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .pattern { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM API 负载测试：两个陷阱、四种模式、五种工具</text>

  <rect x="40" y="50" width="440" height="110" class="bad"/>
  <text x="260" y="72" text-anchor="middle" class="head">GIL 陷阱（默认 Locust）</text>
  <text x="60" y="96" class="small">· 客户端在 Python GIL 下分词</text>
  <text x="60" y="114" class="small">· 与请求生成争用资源</text>
  <text x="60" y="132" class="small">· 分词积压使报告的 token 间延迟偏高</text>
  <text x="260" y="152" text-anchor="middle" class="caption">瓶颈在客户端，而非服务器</text>

  <rect x="500" y="50" width="420" height="110" class="bad"/>
  <text x="710" y="72" text-anchor="middle" class="head">prompt 单一性陷阱</text>
  <text x="520" y="96" class="small">· 循环使用同一 prompt = 100% 前缀缓存</text>
  <text x="520" y="114" class="small">· 请求合并将“N 个并发”当作 1 个处理</text>
  <text x="520" y="132" class="small">· 吞吐量看似很好，生产环境却无法支撑</text>
  <text x="710" y="152" text-anchor="middle" class="caption">修正：使用 LLMPerf --mean + --stddev 设置输入 token</text>

  <rect x="40" y="180" width="440" height="160" class="tool"/>
  <text x="260" y="202" text-anchor="middle" class="head">2026 年工具</text>
  <text x="60" y="226" class="step">LLMPerf：Anyscale、Rust 分词器、流式处理</text>
  <text x="60" y="244" class="step">NVIDIA GenAI-Perf：基于 Triton 的参考工具</text>
  <text x="60" y="262" class="step">LLM-Locust：Locust + GIL 修正</text>
  <text x="60" y="280" class="step">guidellm：大规模合成负载</text>
  <text x="60" y="298" class="step">k6 v2026.1.0 + Operator 1.0 GA</text>
  <text x="60" y="316" class="small">  感知流式响应、原生 CRD，适合作为 CI 关卡</text>

  <rect x="500" y="180" width="420" height="160" class="pattern"/>
  <text x="710" y="202" text-anchor="middle" class="head">四种负载模式</text>
  <text x="520" y="226" class="step">稳定负载：恒定 RPS，持续 30-60 分钟</text>
  <text x="520" y="244" class="small">  发现基线回归</text>
  <text x="520" y="264" class="step">爬坡：15 分钟内从 0 增至目标</text>
  <text x="520" y="280" class="small">  发现容量拐点与预热问题</text>
  <text x="520" y="300" class="step">突增：突然增加 3-10x</text>
  <text x="520" y="316" class="small">  发现自动扩缩容与冷启动影响</text>
  <text x="520" y="328" class="step">浸泡：稳定运行 4-8h</text>

  <rect x="40" y="360" width="880" height="130" class="box"/>
  <text x="480" y="382" text-anchor="middle" class="head">CI 关卡方案</text>
  <text x="480" y="406" text-anchor="middle" class="step">PR 中用 k6 以基线 RPS 运行 30-50 次迭代</text>
  <text x="480" y="426" text-anchor="middle" class="step">关卡：P50 / P95 首 token 时间、5xx &lt; 5%、每输出 token 时间阈值</text>
  <text x="480" y="446" text-anchor="middle" class="caption">超限即使构建失败：将性能问题视为编译错误</text>
  <text x="480" y="468" text-anchor="middle" class="small">GenAI-Perf 的 ITL 不含首 token 时间，LLMPerf 包含；同一服务器会得到不同 TPOT</text>
</svg>
