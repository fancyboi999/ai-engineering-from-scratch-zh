<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .gw { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .feat { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .scale { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">AI 网关：七项功能、2026 年四类领先产品</text>

  <rect x="40" y="50" width="280" height="220" class="feat"/>
  <text x="180" y="72" text-anchor="middle" class="head">核心功能</text>
  <text x="60" y="96" class="step">· 提供方路由</text>
  <text x="60" y="116" class="step">· 回退链</text>
  <text x="60" y="136" class="step">· 重试（退避）</text>
  <text x="60" y="156" class="step">· 限流（按租户）</text>
  <text x="60" y="176" class="step">· 机密引用</text>
  <text x="60" y="196" class="step">· 可观测性（OTel）</text>
  <text x="60" y="216" class="step">· 护栏（PII、越狱）</text>
  <text x="180" y="250" text-anchor="middle" class="caption">企业规模下七项均为必需</text>

  <rect x="340" y="50" width="280" height="220" class="gw"/>
  <text x="480" y="72" text-anchor="middle" class="head">2026 年网关</text>
  <rect x="360" y="90" width="240" height="35" class="box"/>
  <text x="480" y="112" text-anchor="middle" class="step">LiteLLM — MIT, Python</text>
  <rect x="360" y="132" width="240" height="35" class="box"/>
  <text x="480" y="154" text-anchor="middle" class="step">Portkey：Apache 2.0、护栏</text>
  <rect x="360" y="174" width="240" height="35" class="box"/>
  <text x="480" y="196" text-anchor="middle" class="step">Kong AI Gateway：企业级</text>
  <rect x="360" y="216" width="240" height="35" class="box"/>
  <text x="480" y="238" text-anchor="middle" class="step">Cloudflare / Vercel：托管边缘服务</text>

  <rect x="640" y="50" width="280" height="220" class="scale"/>
  <text x="780" y="72" text-anchor="middle" class="head">规模与开销（Kong 基准）</text>
  <text x="660" y="96" class="step">Kong：约 5 ms 开销（基线）</text>
  <text x="660" y="116" class="step">LiteLLM：约 10 ms 开销（&gt;2K RPS 时无法支撑）</text>
  <text x="660" y="136" class="step">Portkey：约 30 ms 开销</text>
  <text x="660" y="156" class="step">Cloudflare：约 2 ms（边缘）</text>
  <text x="660" y="190" class="small">Kong 比 Portkey 快 228%</text>
  <text x="660" y="208" class="small">Kong 比 LiteLLM 快 859%</text>
  <text x="660" y="226" class="small">使用相同的 12 个 CPU</text>
  <text x="780" y="258" text-anchor="middle" class="caption">开发选 LiteLLM，生产规模选 Kong</text>

  <rect x="40" y="290" width="440" height="130" class="box"/>
  <text x="260" y="312" text-anchor="middle" class="head">数据驻留要求推动自托管</text>
  <text x="60" y="338" class="step">医疗 / 金融 → 自托管</text>
  <text x="60" y="356" class="step">  LiteLLM OSS, Portkey OSS, Kong OSS</text>
  <text x="60" y="374" class="step">消费应用 → 托管边缘服务</text>
  <text x="60" y="392" class="step">  Cloudflare AI Gateway, Vercel AI</text>
  <text x="60" y="410" class="caption">Portkey 于 2026 年三月转为 Apache 2.0，改变了中间层格局</text>

  <rect x="500" y="290" width="420" height="130" class="box"/>
  <text x="710" y="312" text-anchor="middle" class="head">与阶段 17 · 13 + 16 组合</text>
  <text x="520" y="338" class="step">网关（19）+ 可观测性（13）+ 路由（16）</text>
  <text x="520" y="356" class="step">通常由同一工具提供：</text>
  <text x="520" y="374" class="step">  Portkey = 网关 + 可观测性 + 护栏</text>
  <text x="520" y="392" class="step">  Helicone = 网关 + 可观测性</text>
  <text x="520" y="410" class="caption">选择一个，或通过 OpenTelemetry 连接三个工具</text>

  <rect x="40" y="440" width="880" height="50" class="box"/>
  <text x="480" y="462" text-anchor="middle" class="step">回退概率：OpenAI 3% × Anthropic 2% = 0.06% 同时失败</text>
  <text x="480" y="480" text-anchor="middle" class="caption">三提供方链的有效可用性为 99.997%</text>
</svg>
