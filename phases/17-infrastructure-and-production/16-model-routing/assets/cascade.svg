<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cheap { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .front { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .signal { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">模型路由：四种信号、三种模式</text>

  <rect x="40" y="50" width="280" height="220" class="signal"/>
  <text x="180" y="72" text-anchor="middle" class="head">信号</text>
  <rect x="60" y="90" width="240" height="35" class="box"/>
  <text x="180" y="112" text-anchor="middle" class="step">1. 任务分类</text>
  <rect x="60" y="130" width="240" height="35" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="step">2. prompt 长度</text>
  <rect x="60" y="170" width="240" height="35" class="box"/>
  <text x="180" y="192" text-anchor="middle" class="step">3. 与已知难题的嵌入相似度</text>
  <rect x="60" y="210" width="240" height="35" class="box"/>
  <text x="180" y="232" text-anchor="middle" class="step">4. 自信程度（对数概率）</text>
  <text x="180" y="258" text-anchor="middle" class="caption">组合四者；单独使用均会漏判</text>

  <rect x="340" y="50" width="280" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">模式：级联（低成本优先）</text>
  <rect x="360" y="90" width="240" height="45" class="cheap"/>
  <text x="480" y="115" text-anchor="middle" class="step">低成本模型（Haiku 级别）</text>
  <text x="480" y="130" text-anchor="middle" class="small">输入 $0.25/M，输出 $1/M</text>
  <rect x="360" y="150" width="240" height="35" class="signal"/>
  <text x="480" y="172" text-anchor="middle" class="step">置信度检查</text>
  <rect x="360" y="200" width="240" height="60" class="front"/>
  <text x="480" y="222" text-anchor="middle" class="step">仅低置信度时使用前沿模型</text>
  <text x="480" y="240" text-anchor="middle" class="small">混合流量约 10% 升级</text>
  <text x="480" y="254" text-anchor="middle" class="small">升级请求延迟约 2x</text>

  <rect x="640" y="50" width="280" height="220" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">模式：预先路由</text>
  <text x="780" y="94" text-anchor="middle" class="small">前置分类器（5-10ms）</text>
  <rect x="660" y="110" width="240" height="45" class="cheap"/>
  <text x="780" y="135" text-anchor="middle" class="step">简单任务用低成本模型</text>
  <rect x="660" y="170" width="240" height="45" class="front"/>
  <text x="780" y="195" text-anchor="middle" class="step">困难任务用前沿模型</text>
  <text x="780" y="230" text-anchor="middle" class="caption">整体最快，质量下限取决于分类器准确率</text>

  <rect x="40" y="290" width="880" height="100" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">2026 年价格曲线</text>
  <text x="480" y="334" text-anchor="middle" class="step">GPT-4 级别质量：$20/M（2022 年末）→ $0.40/M（2026），成本降低约 50x</text>
  <text x="480" y="352" text-anchor="middle" class="step">LLM 总体价格每年降低约 10x，主要来自服务效率提升（阶段 17 · 04-09）</text>
  <text x="480" y="372" text-anchor="middle" class="caption">路由在应用层利用这些收益</text>

  <rect x="40" y="410" width="880" height="80" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">漂移才是真正的风险</text>
  <text x="480" y="454" text-anchor="middle" class="step">监测：各路由好评/差评、各路由的 LLM 评审抽样、升级率、拒答率</text>
  <text x="480" y="474" text-anchor="middle" class="caption">低成本模型的质量退化往往悄然发生，直到竞品基准将其揭露</text>
</svg>
