<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .control { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .target { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .safety { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .obs { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM 混沌工程：四个平面与反馈循环</text>

  <rect x="40" y="50" width="220" height="180" class="control"/>
  <text x="150" y="72" text-anchor="middle" class="head">控制平面</text>
  <text x="150" y="92" text-anchor="middle" class="step">实验调度器</text>
  <text x="60" y="116" class="small">· LitmusChaos 工作流</text>
  <text x="60" y="134" class="small">· Chaos Mesh CRD</text>
  <text x="60" y="152" class="small">· Harness 界面</text>
  <text x="60" y="170" class="small">· AWS FIS / Azure Chaos Studio</text>
  <text x="150" y="200" text-anchor="middle" class="caption">调度、参数、频次</text>

  <rect x="280" y="50" width="220" height="180" class="target"/>
  <text x="390" y="72" text-anchor="middle" class="head">目标平面</text>
  <text x="390" y="92" text-anchor="middle" class="step">服务 + 基础设施 + 数据</text>
  <text x="300" y="116" class="small">· pod、节点、负载均衡器</text>
  <text x="300" y="134" class="small">· 数据存储、向量数据库</text>
  <text x="300" y="152" class="small">· LLM 网关</text>
  <text x="300" y="170" class="small">· 上游提供方</text>

  <rect x="520" y="50" width="220" height="180" class="safety"/>
  <text x="630" y="72" text-anchor="middle" class="head">安全平面</text>
  <text x="630" y="92" text-anchor="middle" class="step">防护 + 中止</text>
  <text x="540" y="116" class="small">· 消耗速率门禁（&gt; 2x 预算）</text>
  <text x="540" y="134" class="small">· 故障影响范围上限</text>
  <text x="540" y="152" class="small">· 抑制窗口</text>
  <text x="540" y="170" class="small">· trace-ID 标签</text>
  <text x="540" y="188" class="small">· 紧急停止开关</text>

  <rect x="760" y="50" width="160" height="180" class="obs"/>
  <text x="840" y="72" text-anchor="middle" class="head">可观测性</text>
  <text x="840" y="92" text-anchor="middle" class="step">trace + 指标</text>
  <text x="780" y="116" class="small">· 区分</text>
  <text x="780" y="134" class="small">  混沌实验导致的故障</text>
  <text x="780" y="152" class="small">  与自然故障</text>
  <text x="780" y="170" class="small">· trace-ID 关联</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">LLM 特有的五种实验</text>
  <text x="60" y="308" class="step">1. 内存过载（KV 抢占风暴）</text>
  <text x="60" y="326" class="step">2. 网络故障（切断网关 ↔ 提供方）</text>
  <text x="60" y="344" class="step">3. 提供方中断（100% 429）</text>
  <text x="500" y="308" class="step">4. 畸形 prompt（分词器炸弹）</text>
  <text x="500" y="326" class="step">5. KV 淘汰风暴（强制级联重新预填充）</text>

  <rect x="40" y="380" width="880" height="80" class="box"/>
  <text x="480" y="402" text-anchor="middle" class="head">执行频次</text>
  <text x="480" y="424" text-anchor="middle" class="step">每周金丝雀与 SLO 复核 · 每月演练与复盘 · 每季度审计与依赖图</text>
  <text x="480" y="444" text-anchor="middle" class="caption">没有 SLI/SLO、可观测性、回滚、运行手册和轮值时，不在生产运行</text>
</svg>
