<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">EAGLE-3 推测解码：alpha 是唯一指标</text>

  <rect x="40" y="50" width="420" height="240" class="box"/>
  <text x="250" y="72" text-anchor="middle" class="head">处理流程（K=5）</text>
  <rect x="60" y="90" width="120" height="40" class="cool"/>
  <text x="120" y="114" text-anchor="middle" class="step">草稿输出头</text>
  <rect x="200" y="90" width="240" height="40" class="cold"/>
  <text x="320" y="114" text-anchor="middle" class="step">5 个候选 token</text>
  <line x1="180" y1="110" x2="198" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="140" width="240" height="40" class="hot"/>
  <text x="320" y="164" text-anchor="middle" class="step">目标验证（1 次前向传播）</text>
  <line x1="320" y1="132" x2="320" y2="139" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="190" width="240" height="40" class="cool"/>
  <text x="320" y="214" text-anchor="middle" class="step">接受 K * alpha 个</text>
  <line x1="320" y1="182" x2="320" y2="189" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="240" width="240" height="40" class="old" fill="#eeeeee" stroke="#888"/>
  <text x="320" y="264" text-anchor="middle" class="step">其余重新采样（第二次前向传播）</text>

  <rect x="480" y="50" width="440" height="240" class="box"/>
  <text x="700" y="72" text-anchor="middle" class="head">不同负载的 alpha</text>
  <rect x="500" y="90" width="400" height="30" class="cool"/>
  <text x="510" y="110" class="small">通用对话 + 基于 ShareGPT 训练的 EAGLE-3：alpha 0.60 - 0.80</text>
  <rect x="500" y="125" width="400" height="30" class="cold"/>
  <text x="510" y="145" class="small">专业领域（代码、法律、医疗）：alpha 0.40 - 0.60</text>
  <rect x="500" y="160" width="400" height="30" class="hot"/>
  <text x="510" y="180" class="small">领域不匹配且未重训草稿模型：alpha 0.30 - 0.45</text>
  <rect x="500" y="195" width="400" height="30" class="dsk"/>
  <text x="510" y="215" class="small">经典草稿模型（用 Llama 3.2 1B 辅助 70B）：alpha 0.30 - 0.50</text>
  <rect x="500" y="230" width="400" height="50" class="box"/>
  <text x="510" y="250" class="small">256 并发时的盈亏平衡 alpha：约 0.55</text>
  <text x="510" y="268" class="small">低于此值：即使均值改善，P99 尾延迟仍会恶化</text>

  <rect x="40" y="310" width="880" height="100" class="box"/>
  <text x="480" y="332" text-anchor="middle" class="head">各代方法</text>
  <text x="60" y="356" class="step">经典草稿模型</text>
  <text x="60" y="374" class="small">加载两个模型；目标模型每次验证需 K 次草稿前向；alpha 0.3-0.5</text>
  <text x="280" y="356" class="step">EAGLE-1</text>
  <text x="280" y="374" class="small">草稿头位于目标模型末层；alpha 约 0.5-0.6</text>
  <text x="500" y="356" class="step">EAGLE-2</text>
  <text x="500" y="374" class="small">树状草稿、自适应 K；alpha 约 0.6-0.7</text>
  <text x="720" y="356" class="step">EAGLE-3 (2025-2026)</text>
  <text x="720" y="374" class="small">多层草稿头；alpha 约 0.6-0.8</text>
  <text x="60" y="396" class="caption">所有 EAGLE 变体均可快速训练，仅增加少量参数开销</text>

  <rect x="40" y="430" width="880" height="110" class="hot"/>
  <text x="480" y="452" text-anchor="middle" class="head">生产检查清单</text>
  <text x="60" y="474" class="small">1. 对目标模型建立基线：目标并发下的首 token 时间、token 间延迟及吞吐量</text>
  <text x="60" y="490" class="small">2. 启用带 EAGLE-3 草稿的 speculative_config，重跑基准</text>
  <text x="60" y="506" class="small">3. 记录 alpha（vLLM V1 报告每请求接受的 token 数）；要求 alpha &gt;= 0.55</text>
  <text x="60" y="522" class="small">4. 关注 P99 token 间延迟，而非 P50；拒绝草稿后的两次前向决定尾延迟</text>
  <text x="60" y="538" class="small">5. vLLM v0.18.0：检查功能矩阵；推测解码可与分块预填充组合</text>
</svg>
