<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .l1 { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .l2 { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">两层缓存：L1 跳过 LLM，L2 复用 KV</text>

  <rect x="40" y="50" width="420" height="220" class="l1"/>
  <text x="250" y="72" text-anchor="middle" class="head">L1：语义缓存（应用层）</text>
  <text x="250" y="94" text-anchor="middle" class="step">嵌入 prompt → 寻找相似缓存</text>
  <text x="60" y="118" class="small">工具：GPTCache、Redis Vec、Portkey、Helicone</text>
  <text x="60" y="136" class="small">初始阈值：余弦 ≥ 0.95，再调优</text>
  <text x="60" y="154" class="small">生产命中率：</text>
  <text x="60" y="172" class="small">  开放对话：10-15%</text>
  <text x="60" y="190" class="small">  结构化 FAQ：40-70%</text>
  <text x="60" y="208" class="small">  代码问题：20-30%</text>
  <text x="60" y="226" class="small">  语音 agent 重复内容：50-80%</text>
  <text x="250" y="254" text-anchor="middle" class="caption">厂商所称“95% 准确率”是匹配正确率，而非命中率</text>

  <rect x="500" y="50" width="420" height="220" class="l2"/>
  <text x="710" y="72" text-anchor="middle" class="head">L2：提供方前缀缓存</text>
  <text x="710" y="94" text-anchor="middle" class="step">为重复前缀复用注意力 KV</text>
  <text x="520" y="118" class="small">Anthropic：显式 cache_control 标记</text>
  <text x="520" y="136" class="small">  缓存读取 $0.30/M，对比 $3.00/M（10 倍）</text>
  <text x="520" y="154" class="small">  写入溢价：1.25 倍（5-min TTL）或 2 倍（1-hr TTL）</text>
  <text x="520" y="172" class="small">OpenAI：自动启用，prompt &gt; 1024 token</text>
  <text x="520" y="190" class="small">  缓存输入便宜约 10 倍；典型命中率约 50%</text>
  <text x="520" y="208" class="small">Gemini：显式上下文缓存 API</text>
  <text x="520" y="226" class="small">自托管：阶段 17 · 第 06 课 RadixAttention</text>
  <text x="710" y="254" text-anchor="middle" class="caption">ProjectDiscovery：重组 prompt 后命中率从 7% → 74%</text>

  <rect x="40" y="290" width="880" height="110" class="bad"/>
  <text x="480" y="312" text-anchor="middle" class="head">导致命中率崩塌的反模式</text>
  <text x="60" y="338" class="step">· 并行化代价</text>
  <text x="60" y="356" class="small">  首次缓存写入前并行 10 次调用 = 10 次写入、0 次读取 → 账单提高 5-10 倍</text>
  <text x="60" y="374" class="step">· 前缀中包含动态内容</text>
  <text x="60" y="392" class="small">  当前时间、请求 ID、随机样例使每次请求唯一 → 0 命中</text>

  <rect x="40" y="420" width="880" height="80" class="box"/>
  <text x="480" y="442" text-anchor="middle" class="head">组合用于隔夜任务</text>
  <text x="480" y="464" text-anchor="middle" class="step">Batch API（50% 折扣）+ 缓存输入（输入便宜 10 倍）→ 约为同步无缓存成本的 10%</text>
  <text x="480" y="484" text-anchor="middle" class="caption">能够容忍 24 小时延迟的任务都应组合两者</text>
</svg>
