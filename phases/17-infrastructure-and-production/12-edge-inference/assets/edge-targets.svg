<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .apple { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .qcom { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .web { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .jet { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">边缘推理 — 四种目标，带宽决定上限</text>

  <rect x="40" y="50" width="220" height="190" class="apple"/>
  <text x="150" y="72" text-anchor="middle" class="head">Apple Neural Engine</text>
  <text x="150" y="95" text-anchor="middle" class="step">M4 / A18 — 最高 38 TOPS</text>
  <text x="150" y="113" text-anchor="middle" class="small">统一内存，无需复制</text>
  <text x="150" y="131" text-anchor="middle" class="small">Core ML 使用原生 ANE</text>
  <text x="150" y="149" text-anchor="middle" class="small">通过 llama.cpp 使用 MPS</text>
  <text x="150" y="175" text-anchor="middle" class="step">iPhone 16 ≈ 8 tok/s</text>
  <text x="150" y="193" text-anchor="middle" class="small">60 GB/s DRAM</text>
  <text x="150" y="211" text-anchor="middle" class="small">7B Q4，解码受内存带宽限制</text>

  <rect x="280" y="50" width="220" height="190" class="qcom"/>
  <text x="390" y="72" text-anchor="middle" class="head">Qualcomm Hexagon</text>
  <text x="390" y="95" text-anchor="middle" class="step">SD X Elite — 最高 45 TOPS</text>
  <text x="390" y="113" text-anchor="middle" class="small">SD 8 Gen 4 旗舰 Android</text>
  <text x="390" y="131" text-anchor="middle" class="small">QNN SDK，AI Hub 转换</text>
  <text x="390" y="149" text-anchor="middle" class="small">Windows ARM 助手</text>
  <text x="390" y="175" text-anchor="middle" class="step">SD 8 Gen 3 ≈ 7 tok/s</text>
  <text x="390" y="193" text-anchor="middle" class="small">77 GB/s DRAM</text>
  <text x="390" y="211" text-anchor="middle" class="small">7B Q4，典型中高端设备</text>

  <rect x="520" y="50" width="220" height="190" class="web"/>
  <text x="630" y="72" text-anchor="middle" class="head">WebGPU + WebLLM</text>
  <text x="630" y="95" text-anchor="middle" class="step">浏览器内运行，无需安装</text>
  <text x="630" y="113" text-anchor="middle" class="small">Chrome Android 121+ / Safari iOS 26</text>
  <text x="630" y="131" text-anchor="middle" class="small">Firefox Android 正在追赶</text>
  <text x="630" y="149" text-anchor="middle" class="small">覆盖约 70-75% 移动设备</text>
  <text x="630" y="175" text-anchor="middle" class="step">M3 Max ≈ 41 tok/s</text>
  <text x="630" y="193" text-anchor="middle" class="small">约为原生速度的 70-80%</text>
  <text x="630" y="211" text-anchor="middle" class="small">兼容 OpenAI 的 JS API</text>

  <rect x="760" y="50" width="160" height="190" class="jet"/>
  <text x="840" y="72" text-anchor="middle" class="head">NVIDIA Jetson</text>
  <text x="840" y="95" text-anchor="middle" class="step">Orin / AGX / Thor</text>
  <text x="840" y="113" text-anchor="middle" class="small">TensorRT Edge-LLM</text>
  <text x="840" y="131" text-anchor="middle" class="small">EAGLE-3 + NVFP4</text>
  <text x="840" y="149" text-anchor="middle" class="small">分块预填充</text>
  <text x="840" y="175" text-anchor="middle" class="step">AGX ≈ 40 tok/s</text>
  <text x="840" y="193" text-anchor="middle" class="small">gpt-oss-20b vLLM</text>
  <text x="840" y="211" text-anchor="middle" class="small">205 GB/s</text>

  <rect x="40" y="260" width="880" height="110" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">带宽决定上限 — 解码每个 token 都读取完整权重</text>
  <text x="480" y="308" text-anchor="middle" class="step">H100 HBM3：3350 GB/s → Llama 8B Q4 上限约 710 tok/s（实测 170）</text>
  <text x="480" y="326" text-anchor="middle" class="step">M3 Max 400 GB/s → 上限约 85 tok/s（实测 55）</text>
  <text x="480" y="344" text-anchor="middle" class="step">iPhone 16 60 GB/s → 上限约 12 tok/s（实测 8）</text>
  <text x="480" y="362" text-anchor="middle" class="caption">仅当运行时效率低于此上限时，计算性能才成为关键</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="412" text-anchor="middle" class="head">按目标选择量化格式</text>
  <text x="480" y="432" text-anchor="middle" class="step">ANE：INT4 权重 + FP16 激活（Core ML 路径）</text>
  <text x="480" y="450" text-anchor="middle" class="step">Hexagon：QNN INT8/INT4（AI Hub 转换器）</text>
  <text x="480" y="468" text-anchor="middle" class="step">WebGPU：Q4 GGUF（浏览器内存上限约 3-4 GB）</text>
  <text x="480" y="486" text-anchor="middle" class="step">Jetson Thor：NVFP4 + FP8 KV（Edge-LLM 路径）</text>
</svg>
