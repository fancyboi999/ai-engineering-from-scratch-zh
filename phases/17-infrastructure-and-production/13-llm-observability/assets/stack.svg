<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .dev { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .gw { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .scale { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .otel { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM 可观测性：两大类别，以 OpenTelemetry 连接</text>

  <rect x="40" y="50" width="280" height="210" class="dev"/>
  <text x="180" y="72" text-anchor="middle" class="head">开发平台</text>
  <text x="180" y="92" text-anchor="middle" class="small">trace + 评估 + prompt + 会话</text>
  <rect x="60" y="110" width="240" height="35" class="box"/>
  <text x="180" y="132" text-anchor="middle" class="step">LangSmith（$39/用户/月）</text>
  <rect x="60" y="150" width="240" height="35" class="box"/>
  <text x="180" y="172" text-anchor="middle" class="step">Langfuse（MIT + 50K 免费额度）</text>
  <rect x="60" y="190" width="240" height="35" class="box"/>
  <text x="180" y="212" text-anchor="middle" class="step">Opik (Apache 2.0)</text>
  <text x="180" y="245" text-anchor="middle" class="caption">一体化，适合开发循环</text>

  <rect x="340" y="50" width="280" height="210" class="gw"/>
  <text x="480" y="72" text-anchor="middle" class="head">网关 / 遥测</text>
  <text x="480" y="92" text-anchor="middle" class="small">trace + 指标 + 网关功能</text>
  <rect x="360" y="110" width="240" height="35" class="box"/>
  <text x="480" y="132" text-anchor="middle" class="step">Helicone（代理，MIT）</text>
  <rect x="360" y="150" width="240" height="35" class="box"/>
  <text x="480" y="172" text-anchor="middle" class="step">SigNoz (Apache 2.0)</text>
  <rect x="360" y="190" width="240" height="35" class="box"/>
  <text x="480" y="212" text-anchor="middle" class="step">OpenLLMetry（开源）</text>
  <text x="480" y="245" text-anchor="middle" class="caption">精简，可与开发平台配套</text>

  <rect x="640" y="50" width="280" height="210" class="scale"/>
  <text x="780" y="72" text-anchor="middle" class="head">规模 / 开发 / 数据湖</text>
  <text x="780" y="92" text-anchor="middle" class="small">RAG 漂移、零复制、长期分析</text>
  <rect x="660" y="110" width="240" height="35" class="box"/>
  <text x="780" y="132" text-anchor="middle" class="step">Phoenix (Elastic L2.0)</text>
  <rect x="660" y="150" width="240" height="35" class="box"/>
  <text x="780" y="172" text-anchor="middle" class="step">Arize AX（零复制）</text>
  <rect x="660" y="190" width="240" height="35" class="box"/>
  <text x="780" y="212" text-anchor="middle" class="step">TruLens（开源评估）</text>
  <text x="780" y="245" text-anchor="middle" class="caption">RAG + 长期分析</text>

  <rect x="40" y="280" width="880" height="100" class="otel"/>
  <text x="480" y="302" text-anchor="middle" class="head">OpenTelemetry GenAI 约定：连接层</text>
  <text x="480" y="325" text-anchor="middle" class="step">gen_ai.system · gen_ai.request.model · gen_ai.usage.input_tokens · gen_ai.usage.output_tokens</text>
  <text x="480" y="345" text-anchor="middle" class="small">2025 发布，2026 生产模式：</text>
  <text x="480" y="363" text-anchor="middle" class="step">网关（Helicone）+ 评估（Phoenix）+ 数据湖（Iceberg / Arize AX）</text>

  <rect x="40" y="400" width="880" height="100" class="box"/>
  <text x="480" y="422" text-anchor="middle" class="head">规模化采样：每天 1M 条原始 trace 无法全部保留</text>
  <text x="480" y="444" text-anchor="middle" class="step">保留 100% 错误 · 保留 100% 高成本 · 采样 5% 成功</text>
  <text x="480" y="462" text-anchor="middle" class="step">始终保留聚合，长尾调试保留原始数据</text>
  <text x="480" y="482" text-anchor="middle" class="caption">Arize AX 声称规模化后比单体 APM 便宜约 100 倍，基于自有数据湖实现零复制</text>
</svg>
