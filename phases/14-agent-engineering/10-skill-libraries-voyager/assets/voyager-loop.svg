<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .curr { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .lib { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .iter { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .env { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Voyager：自动课程、技能库、迭代改进</text>

  <rect x="40" y="60" width="280" height="180" class="curr"/>
  <text x="180" y="82" text-anchor="middle" class="head">自动课程</text>
  <text x="60" y="108" class="small">根据当前能力缺口提出下一个任务</text>
  <text x="60" y="126" class="small">好奇心驱动、自下而上的探索</text>
  <text x="60" y="146" class="small">先“学会制作铁镐”，再制作钻石镐</text>
  <rect x="60" y="158" width="240" height="70" class="box"/>
  <text x="78" y="178" class="step">生产环境的对应方式：</text>
  <text x="78" y="196" class="small">缺口检查：技能库缺少哪些技能</text>
  <text x="78" y="212" class="small">由人类与 agent 配对，每周检查课程</text>

  <rect x="340" y="60" width="280" height="180" class="lib"/>
  <text x="480" y="82" text-anchor="middle" class="head">技能库</text>
  <text x="360" y="108" class="small">技能 = 命名代码 + 描述 + 依赖</text>
  <text x="360" y="126" class="small">带版本、可检索、可组合</text>
  <text x="360" y="146" class="small">写入时去重，检索时按标签过滤</text>
  <rect x="360" y="158" width="240" height="70" class="box"/>
  <text x="378" y="178" class="step">2026 年生产环境对应方式：</text>
  <text x="378" y="196" class="small">Claude Agent SDK 技能</text>
  <text x="378" y="212" class="small">skillkit 注册表；MCP 资源</text>

  <rect x="640" y="60" width="280" height="180" class="iter"/>
  <text x="780" y="82" text-anchor="middle" class="head">迭代提示</text>
  <text x="660" y="108" class="small">执行错误 + 环境反馈 + 自我验证</text>
  <text x="660" y="126" class="small">重写技能，升级版本</text>
  <text x="660" y="146" class="small">v1 制作失败；v2 增加木棍依赖</text>
  <rect x="660" y="158" width="240" height="70" class="box"/>
  <text x="678" y="178" class="step">基础方法：</text>
  <text x="678" y="196" class="small">Self-Refine（第 05 课）</text>
  <text x="678" y="212" class="small">CRITIC（第 05 课），结合环境验证器</text>

  <rect x="80" y="280" width="800" height="230" class="env"/>
  <text x="480" y="302" text-anchor="middle" class="head">示例循环：craft_iron_pickaxe</text>

  <rect x="100" y="320" width="760" height="40" class="box"/>
  <text x="120" y="342" class="step">1. 检索：library.search("need a pickaxe") 返回 craft_iron_pickaxe v1</text>

  <rect x="100" y="368" width="760" height="40" class="box"/>
  <text x="120" y="390" class="step">2. 执行 v1：topo_order place_table mine_ore craft_iron_pickaxe</text>

  <rect x="100" y="416" width="760" height="40" class="box"/>
  <text x="120" y="438" class="step">3. 失败：RuntimeError "need 2 stick, have 0"，环境反馈</text>

  <rect x="100" y="464" width="760" height="40" class="box"/>
  <text x="120" y="486" class="step">4. 改进：注册带 gather_sticks 依赖的 v2；重跑成功；inventory += iron_pickaxe</text>

  <text x="480" y="540" text-anchor="middle" class="caption">操作空间是代码。技能组成有向无环图，失败推动版本升级，技能库持续增长。</text>
</svg>
