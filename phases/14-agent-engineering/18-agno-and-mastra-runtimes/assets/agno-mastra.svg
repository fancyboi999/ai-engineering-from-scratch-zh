<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .agno { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .mastra { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .diff { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Agno 与 Mastra — 两种生产运行时，两套技术栈</text>

  <rect x="40" y="50" width="440" height="280" class="agno"/>
  <text x="260" y="72" text-anchor="middle" class="head">Agno：Python、FastAPI、接近零开销</text>
  <rect x="60" y="90" width="400" height="40" class="box"/>
  <text x="78" y="112" class="step">目标：agent 实例化约 2μs</text>
  <text x="78" y="126" class="small">每秒创建数千个短生命周期 agent 时很重要</text>
  <rect x="60" y="140" width="400" height="40" class="box"/>
  <text x="78" y="162" class="step">目标：每个 agent 内存约 3.75 KiB</text>
  <text x="78" y="176" class="small">每次请求使用无状态 FastAPI 处理器</text>
  <rect x="60" y="190" width="400" height="40" class="box"/>
  <text x="78" y="212" class="step">约 23 家模型供应商，原生多模态</text>
  <text x="78" y="226" class="small">文本、图像、音频、视频、文件</text>
  <rect x="60" y="240" width="400" height="40" class="box"/>
  <text x="78" y="262" class="step">“没有图、链或复杂模式”</text>
  <text x="78" y="276" class="small">理念：纯 Python，框架接口尽量少</text>
  <rect x="60" y="290" width="400" height="34" class="box"/>
  <text x="78" y="312" class="step">会话状态存数据库；agent 是临时的</text>

  <rect x="500" y="50" width="420" height="280" class="mastra"/>
  <text x="710" y="72" text-anchor="middle" class="head">Mastra：TypeScript，以 Vercel AI SDK 为底层</text>
  <rect x="520" y="90" width="380" height="40" class="box"/>
  <text x="538" y="112" class="step">三个原语：Agent、工具（Zod）、工作流</text>
  <text x="538" y="126" class="small">Zod 类型化工具；编译时安全</text>
  <rect x="520" y="140" width="380" height="40" class="box"/>
  <text x="538" y="162" class="step">统一模型路由器：3,300+ 模型、94 家供应商</text>
  <text x="538" y="176" class="small">生态系统共用一个客户端（三月 2026）</text>
  <rect x="520" y="190" width="380" height="40" class="box"/>
  <text x="538" y="212" class="step">组合存储：记忆 / 工作流 / 可观测性</text>
  <text x="538" y="226" class="small">可观测性达到规模后推荐 ClickHouse</text>
  <rect x="520" y="240" width="380" height="40" class="box"/>
  <text x="538" y="262" class="step">服务器适配器：Express、Hono、Fastify、Koa</text>
  <text x="538" y="276" class="small">一等支持 Next.js + Astro 集成</text>
  <rect x="520" y="290" width="380" height="34" class="box"/>
  <text x="538" y="312" class="step">Mastra Studio 位于 localhost:4111，用于调试</text>

  <rect x="40" y="350" width="880" height="160" class="diff"/>
  <text x="480" y="372" text-anchor="middle" class="head">按技术栈选择</text>
  <rect x="60" y="388" width="840" height="36" class="box"/>
  <text x="78" y="410" class="step">Python 后端 + FastAPI + 短生命周期 agent：Agno</text>
  <rect x="60" y="430" width="840" height="36" class="box"/>
  <text x="78" y="452" class="step">TypeScript 后端 + Next.js/Vercel + 统一多供应商：Mastra</text>
  <rect x="60" y="472" width="840" height="36" class="box"/>
  <text x="78" y="494" class="step">持久状态、显式图、长时间运行：LangGraph（第 13 课）</text>

  <text x="480" y="540" text-anchor="middle" class="caption">仅当开销成为瓶颈时，性能目标才重要；多数时候并非如此。</text>
</svg>
