<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .htn { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .ev { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .compare { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">ChatHTN 与 AlphaEvolve：2025 年的两种混合规划器</text>

  <rect x="40" y="50" width="440" height="210" class="htn"/>
  <text x="260" y="72" text-anchor="middle" class="head">ChatHTN：符号系统 + LLM 分解器</text>
  <text x="60" y="96" class="small">复合任务：通过方法库分解</text>
  <rect x="60" y="108" width="400" height="40" class="box"/>
  <text x="78" y="130" class="step">1. 方法适用？展开子任务（可证明可靠）</text>
  <rect x="60" y="156" width="400" height="40" class="box"/>
  <text x="78" y="178" class="step">2. 没有方法？请 LLM 分解</text>
  <rect x="60" y="204" width="400" height="40" class="box"/>
  <text x="78" y="226" class="step">3. 按操作符结构校验，成功后缓存</text>

  <rect x="500" y="50" width="420" height="210" class="ev"/>
  <text x="710" y="72" text-anchor="middle" class="head">AlphaEvolve：进化式代码搜索</text>
  <text x="520" y="96" class="small">初始程序 + 确定性评估器</text>
  <rect x="520" y="108" width="380" height="40" class="box"/>
  <text x="538" y="130" class="step">1. LLM 集合提出变异</text>
  <rect x="520" y="156" width="380" height="40" class="box"/>
  <text x="538" y="178" class="step">2. 评估器对每个子代程序评分</text>
  <rect x="520" y="204" width="380" height="40" class="box"/>
  <text x="538" y="226" class="step">3. 保留前 k 个，变异并重复</text>

  <rect x="40" y="290" width="880" height="220" class="compare"/>
  <text x="480" y="312" text-anchor="middle" class="head">何时选择哪种方法</text>

  <rect x="60" y="330" width="840" height="40" class="box"/>
  <text x="78" y="352" class="step">调度、合规、受策略约束的自动化：HTN（ChatHTN）</text>
  <text x="78" y="368" class="small">可证明可靠；LLM 仅扩充方法库</text>

  <rect x="60" y="380" width="840" height="40" class="box"/>
  <text x="78" y="402" class="step">矩阵乘法计算核、编译器处理过程、调度启发式：AlphaEvolve</text>
  <text x="78" y="418" class="small">适应度必须确定；适合以测试或基准为评估器的场景</text>

  <rect x="60" y="430" width="840" height="40" class="box"/>
  <text x="78" y="452" class="step">开放式 agent 任务：ReAct / ReWOO（而非上述方法）</text>
  <text x="78" y="468" class="small">没有操作符结构或可机器校验的适应度时，参见第 01-02 课</text>

  <rect x="60" y="480" width="840" height="26" class="box"/>
  <text x="78" y="498" class="step">混合方案：顶层使用 HTN，各基本操作符按需使用 AlphaEvolve</text>

  <text x="480" y="540" text-anchor="middle" class="caption">LLM 放大能力，不负责保证正确性。符号层与评估器提供严格保证。</text>
</svg>
