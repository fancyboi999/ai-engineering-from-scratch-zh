<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .vec { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .kv { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .graph { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .fuse { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Mem0 — 三种存储并行写入，检索时融合</text>

  <rect x="40" y="50" width="200" height="46" class="box"/>
  <text x="140" y="74" text-anchor="middle" class="head">add(text, user_id, metadata)</text>
  <text x="140" y="90" text-anchor="middle" class="small">提取事实，写入全部三种存储</text>

  <rect x="40" y="120" width="280" height="260" class="vec"/>
  <text x="180" y="142" text-anchor="middle" class="head">向量存储</text>
  <text x="60" y="166" class="small">语义相似度；按余弦相似度取前 k</text>
  <text x="60" y="186" class="small">最适合：“我们讨论过什么”</text>
  <text x="60" y="206" class="small">最不适合：精确事实查找</text>
  <rect x="60" y="220" width="240" height="60" class="box"/>
  <text x="78" y="240" class="step">记录：embedding(text)、scope、user_id</text>
  <text x="78" y="258" class="small">用于融合的标签、重要性与时间戳</text>
  <text x="78" y="272" class="small">定期为高频使用的子集重新嵌入</text>
  <rect x="60" y="290" width="240" height="76" class="box"/>
  <text x="78" y="310" class="step">故障模式：嵌入漂移</text>
  <text x="78" y="328" class="small">语料增长后质量下降</text>
  <text x="78" y="344" class="small">修正：定期重新嵌入；监测 recall@k</text>
  <text x="78" y="360" class="small">LoCoMo：Mem0 论文中为 91.6</text>

  <rect x="340" y="120" width="280" height="260" class="kv"/>
  <text x="480" y="142" text-anchor="middle" class="head">KV 存储</text>
  <text x="360" y="166" class="small">按 (user_id, type, entity) 进行 O(1) 查找</text>
  <text x="360" y="186" class="small">最适合：“用户的电话是多少”</text>
  <text x="360" y="206" class="small">最不适合：语义 / 模糊匹配</text>
  <rect x="360" y="220" width="240" height="60" class="box"/>
  <text x="378" y="240" class="step">key = (user_id, fact_type, entity)</text>
  <text x="378" y="258" class="small">value = 记录 id</text>
  <text x="378" y="272" class="small">每季度审查 fact_type 集合</text>
  <rect x="360" y="290" width="240" height="76" class="box"/>
  <text x="378" y="310" class="step">故障模式：schema 膨胀</text>
  <text x="378" y="328" class="small">每个团队都发明新的 fact_type</text>
  <text x="378" y="344" class="small">修正：集中式类型注册表 + 审查</text>
  <text x="378" y="360" class="small">LongMemEval：Mem0 论文中为 93.4</text>

  <rect x="640" y="120" width="280" height="260" class="graph"/>
  <text x="780" y="142" text-anchor="middle" class="head">图存储（Mem0g）</text>
  <text x="660" y="166" class="small">有类型的边；时间有效性</text>
  <text x="660" y="186" class="small">最适合：关系推理</text>
  <text x="660" y="206" class="small">最不适合：非结构化散文</text>
  <rect x="660" y="220" width="240" height="60" class="box"/>
  <text x="678" y="240" class="step">(subject, relation, object, valid)</text>
  <text x="678" y="258" class="small">冲突检测器使记录失效，而非删除</text>
  <text x="678" y="272" class="small">时间查询：指定时点有效的子图</text>
  <rect x="660" y="290" width="240" height="76" class="box"/>
  <text x="678" y="310" class="step">故障模式：图爆炸</text>
  <text x="678" y="328" class="small">嘈杂提取器为每条消息添加 50 条边</text>
  <text x="678" y="344" class="small">修正：限制每次添加的边数；丢弃低置信度边</text>
  <text x="678" y="360" class="small">BEAM 1M：Mem0 论文中为 64.1</text>

  <rect x="80" y="400" width="800" height="110" class="fuse"/>
  <text x="480" y="422" text-anchor="middle" class="head">融合评分 score = w_rel * relevance + w_imp * importance + w_rec * recency</text>
  <text x="100" y="448" class="small">相关性：向量余弦、KV 精确匹配、图路径权重</text>
  <text x="100" y="468" class="small">重要性：写入时打标签，或从使用中学习</text>
  <text x="100" y="488" class="small">时近性：自上次写入或读取起指数衰减</text>
  <text x="500" y="448" class="small">按产品调节权重：</text>
  <text x="500" y="468" class="small">语音 agent 重时近性；合规场景重重要性</text>
  <text x="500" y="488" class="small">检索 agent 重相关性；同一提取器使用不同策略</text>

  <text x="480" y="540" text-anchor="middle" class="caption">作用域：用户 / 会话 / agent。每次写入选一种；检索时跨作用域加权查询。</text>
</svg>
