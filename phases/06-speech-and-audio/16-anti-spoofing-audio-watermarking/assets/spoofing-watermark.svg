<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三层防御：检测、水印与来源证明</text>

  <rect x="20" y="55" width="270" height="170" class="box"/>
  <text x="155" y="78" text-anchor="middle" class="label">A. 反欺骗检测</text>
  <text x="155" y="96" text-anchor="middle" class="tag">ASVspoof 5 · AASIST · RawNet2</text>
  <text x="35" y="124" class="content">输入音频 → 分类器</text>
  <text x="35" y="142" class="content">输出：“real”或“synthetic”</text>
  <text x="35" y="162" class="content">ASVspoof 2019 LA 上 EER 0.42%</text>
  <text x="35" y="180" class="content">ASVspoof 5 上 EER 7.23%（真实场景）</text>
  <text x="35" y="208" class="caption">应对不配合的对手</text>

  <rect x="305" y="55" width="270" height="170" class="hot"/>
  <text x="440" y="78" text-anchor="middle" class="label">B. 音频水印</text>
  <text x="440" y="96" text-anchor="middle" class="tag">AudioSeal · WaveVerify</text>
  <text x="320" y="124" class="content">生成器嵌入信号</text>
  <text x="320" y="142" class="content">检测器提取载荷</text>
  <text x="320" y="162" class="content">每段音频 16-bit 载荷</text>
  <text x="320" y="180" class="content">可抵抗 MP3 / EQ / 噪声</text>
  <text x="320" y="208" class="caption">攻击前比特准确率 &gt; 99%</text>

  <rect x="590" y="55" width="270" height="170" class="box"/>
  <text x="725" y="78" text-anchor="middle" class="label">C. 来源清单</text>
  <text x="725" y="96" text-anchor="middle" class="tag">C2PA · CAI</text>
  <text x="605" y="124" class="content">已签名的 JSON 清单</text>
  <text x="605" y="142" class="content">创建者 · 工具 · 时间戳</text>
  <text x="605" y="162" class="content">密码学哈希</text>
  <text x="605" y="180" class="content">可在带外验证</text>
  <text x="605" y="208" class="caption">重新编码可绕过 → 需配合水印</text>

  <rect x="20" y="245" width="840" height="95" class="box"/>
  <text x="440" y="267" text-anchor="middle" class="label">各层防御的缺口：为什么三者都需要</text>
  <text x="40" y="294" class="content">检测：分布外退化，易过拟合训练时的生成器</text>
  <text x="40" y="312" class="content">水印：变调可破坏所有 2026 水印（比特准确率 &lt; 60%）</text>
  <text x="40" y="330" class="content">来源：重新编码即可剥离 → 单独使用无效</text>

  <rect x="20" y="350" width="840" height="105" class="hot"/>
  <text x="440" y="372" text-anchor="middle" class="label">2026 语音生成部署生产清单</text>
  <text x="40" y="398" class="content">1. 每次生成嵌入 AudioSeal（CI 携带检测器）</text>
  <text x="40" y="416" class="content">2. C2PA 签名清单，包含模型 ID、用户 ID、时间戳</text>
  <text x="40" y="434" class="content">3. 对呼入音频运行 AASIST / RawNet2 检测器（欺诈、重放）</text>
  <text x="40" y="452" class="content">4. 审计日志、保留 30 天、同意产物、限流、紧急停止</text>
</svg>
