<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .bar { fill: #c0392b; opacity: 0.5; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三级 VAD 级联与轮次结束状态机</text>

  <rect x="20" y="55" width="260" height="130" class="box"/>
  <text x="150" y="78" text-anchor="middle" class="label">第 1 级：能量门控</text>
  <text x="150" y="96" text-anchor="middle" class="tag">开销低，但任何噪声都可触发</text>
  <text x="30" y="122" class="content">若 RMS &gt; -40 dBFS →“speech”</text>
  <text x="30" y="142" class="content">过滤静音，却不过滤</text>
  <text x="30" y="160" class="content">键盘声、咳嗽、椅子声</text>

  <rect x="295" y="55" width="260" height="130" class="hot"/>
  <text x="425" y="78" text-anchor="middle" class="label">第 2 级：Silero VAD</text>
  <text x="425" y="96" text-anchor="middle" class="tag">2020-2026 的默认方案</text>
  <text x="305" y="122" class="content">1M 参数 · 每 30 ms 块耗时 1 ms</text>
  <text x="305" y="142" class="content">87.7% TPR @ 5% FPR</text>
  <text x="305" y="160" class="content">在 6000+ 种语言上训练</text>
  <text x="305" y="176" class="caption">MIT · 开放 · 拒绝瞬时噪声</text>

  <rect x="570" y="55" width="285" height="130" class="box"/>
  <text x="712" y="78" text-anchor="middle" class="label">第 3 级：语义轮次检测器</text>
  <text x="712" y="96" text-anchor="middle" class="tag">LiveKit turn-detector / 自定义</text>
  <text x="580" y="122" class="content">VAD + 近期词语分类器</text>
  <text x="580" y="142" class="content">区分句中停顿与说完</text>
  <text x="580" y="160" class="content">（“hmm, let me think...”不结束）</text>
  <text x="580" y="176" class="caption">误打断减少 5-10%</text>

  <rect x="20" y="205" width="835" height="130" class="box"/>
  <text x="440" y="226" text-anchor="middle" class="label">轮次检测状态机</text>
  <text x="60" y="254" class="content">state: "idle" ─ VAD 检测到 &gt; 250 ms 语音 ─→ state: "speaking"（发出 START）</text>
  <text x="60" y="274" class="content">state: "speaking" ─ VAD 静音 500 ms ─→ state: "idle"（发出 END）</text>
  <text x="60" y="300" class="caption">预录缓冲（300 ms）：保留 VAD 触发前的音频，否则首词会被截断</text>
  <text x="60" y="318" class="caption">最短语音（250 ms）用于拒绝瞬时声；静音延续（500 ms）按场景调节</text>

  <rect x="20" y="345" width="835" height="105" class="hot"/>
  <text x="440" y="366" text-anchor="middle" class="label">flush 技巧（Kyutai Unmute 2025）：端到端低于 200 ms</text>
  <text x="60" y="392" class="content">1. VAD 在 t=0 触发语音结束</text>
  <text x="60" y="410" class="content">2. 将缓冲音频与 flush 信号发送到 STT 服务器</text>
  <text x="60" y="428" class="content">3. STT 以 4× 实时速度处理 → 500 ms 前视缓冲 → 墙钟耗时 125 ms</text>
  <text x="60" y="446" class="content">4. 转录在 t+125 ms 就绪；延迟等于 VAD 信号自身</text>
</svg>
