<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .col { font-size: 11px; fill: #1a1a1a; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="30" text-anchor="middle" class="title">音频分类器的三十年：相同的 log-mel 输入</text>

  <!-- shared input -->
  <rect x="40" y="60" width="800" height="60" class="box"/>
  <text x="440" y="82" text-anchor="middle" class="label">输入：10 秒 log-mel 频谱图 — 形状 [T=998, n_mels=80]</text>
  <text x="440" y="102" text-anchor="middle" class="caption">相同前端，三代后端</text>

  <!-- Era 1: k-NN -->
  <rect x="40" y="145" width="250" height="280" class="box"/>
  <text x="165" y="170" text-anchor="middle" class="label">1990 年代 — MFCC 上的 k-NN</text>
  <rect x="60" y="195" width="210" height="35" class="box"/>
  <text x="165" y="218" text-anchor="middle" class="content">MFCC-13 + 均值/方差池化</text>
  <line x1="165" y1="232" x2="165" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="255" width="210" height="35" class="box"/>
  <text x="165" y="278" text-anchor="middle" class="content">余弦 → 前 K 项投票</text>
  <text x="165" y="318" text-anchor="middle" class="caption">无需训练，无需 GPU</text>
  <text x="165" y="336" text-anchor="middle" class="caption">在 ESC-50 上表现良好</text>
  <text x="165" y="354" text-anchor="middle" class="caption">在 AudioSet 上失效</text>
  <text x="165" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率：约 65%</text>
  <text x="165" y="406" text-anchor="middle" class="caption">你的第一个基线</text>

  <!-- Era 2: CNN -->
  <rect x="315" y="145" width="250" height="280" class="box"/>
  <text x="440" y="170" text-anchor="middle" class="label">2015–2021 — 2D CNN</text>
  <rect x="335" y="195" width="210" height="35" class="box"/>
  <text x="440" y="218" text-anchor="middle" class="content">将 log-mel 当作图像</text>
  <line x1="440" y1="232" x2="440" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="335" y="255" width="210" height="35" class="box"/>
  <text x="440" y="278" text-anchor="middle" class="content">卷积 + 池化 × 3，softmax</text>
  <text x="440" y="318" text-anchor="middle" class="caption">3M 参数，训练 10 分钟</text>
  <text x="440" y="336" text-anchor="middle" class="caption">SpecAugment + mixup</text>
  <text x="440" y="354" text-anchor="middle" class="caption">仍是关键词识别的基线</text>
  <text x="440" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率：约 82%</text>
  <text x="440" y="406" text-anchor="middle" class="caption">边缘设备 + 语音命令</text>

  <!-- Era 3: SSL -->
  <rect x="590" y="145" width="250" height="280" class="hot"/>
  <text x="715" y="170" text-anchor="middle" class="label">2024–2026 — BEATs / AST</text>
  <rect x="610" y="195" width="210" height="35" class="box"/>
  <text x="715" y="218" text-anchor="middle" class="content">将 log-mel 切成分块（16×16）</text>
  <line x1="715" y1="232" x2="715" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="610" y="255" width="210" height="35" class="box"/>
  <text x="715" y="278" text-anchor="middle" class="content">自监督预训练 transformer</text>
  <text x="715" y="318" text-anchor="middle" class="caption">用 1-10% 标签微调</text>
  <text x="715" y="336" text-anchor="middle" class="caption">BEATs-iter3 在 AudioSet 领先</text>
  <text x="715" y="354" text-anchor="middle" class="caption">2026 年非语音任务的默认选择</text>
  <text x="715" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率：97.0%</text>
  <text x="715" y="406" text-anchor="middle" class="caption">AudioSet mAP: 0.548</text>

  <text x="440" y="450" text-anchor="middle" class="caption">30 年来特征保持不变；关键杠杆在后端</text>
</svg>
