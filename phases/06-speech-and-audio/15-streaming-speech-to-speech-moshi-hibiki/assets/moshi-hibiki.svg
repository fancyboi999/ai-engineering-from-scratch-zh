<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Moshi：全双工对话、3 条并行流、200 ms 延迟</text>

  <rect x="20" y="55" width="160" height="50" class="box"/>
  <text x="100" y="78" text-anchor="middle" class="label">用户音频输入</text>
  <text x="100" y="96" text-anchor="middle" class="caption">Mimi 12.5 Hz × 8 个码本</text>

  <line x1="182" y1="80" x2="203" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="205" y="55" width="470" height="200" class="hot"/>
  <text x="440" y="78" text-anchor="middle" class="label">Temporal Transformer（7B，80 ms/步）</text>
  <text x="440" y="98" text-anchor="middle" class="tag">观察三条流，并预测全部三条</text>

  <rect x="225" y="120" width="200" height="30" class="box"/>
  <text x="325" y="140" text-anchor="middle" class="content">用户 Mimi t-k...t</text>

  <rect x="225" y="160" width="200" height="30" class="box"/>
  <text x="325" y="180" text-anchor="middle" class="content">moshi Mimi t-k...t-1</text>

  <rect x="225" y="200" width="200" height="30" class="box"/>
  <text x="325" y="220" text-anchor="middle" class="content">moshi 文本 t-k...t-1</text>

  <rect x="445" y="130" width="210" height="40" class="hot"/>
  <text x="550" y="150" text-anchor="middle" class="content">预测 moshi text[t]</text>
  <text x="550" y="166" text-anchor="middle" class="caption">= 内心独白</text>

  <rect x="445" y="180" width="210" height="50" class="hot"/>
  <text x="550" y="200" text-anchor="middle" class="content">预测 moshi Mimi[t]</text>
  <text x="550" y="216" text-anchor="middle" class="caption">通过 Depth Transformer（8 个码本）</text>

  <line x1="678" y1="155" x2="703" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="678" y1="205" x2="703" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="705" y="140" width="150" height="40" class="box"/>
  <text x="780" y="160" text-anchor="middle" class="content">文本输出</text>
  <text x="780" y="175" text-anchor="middle" class="caption">附带生成转录</text>

  <rect x="705" y="190" width="150" height="50" class="box"/>
  <text x="780" y="210" text-anchor="middle" class="content">moshi 音频输出</text>
  <text x="780" y="228" text-anchor="middle" class="caption">通过 Mimi 解码器</text>

  <rect x="20" y="275" width="835" height="80" class="box"/>
  <text x="437" y="297" text-anchor="middle" class="label">为什么全双工优于流水线</text>
  <text x="50" y="322" class="content">流水线（VAD + STT + LLM + TTS）：延迟受最长阶段限制，轮次结构僵硬</text>
  <text x="50" y="342" class="content">全双工（Moshi）：两条流均活跃；支持打断与附和，理论延迟下限 200 ms</text>

  <rect x="20" y="365" width="835" height="90" class="hot"/>
  <text x="437" y="386" text-anchor="middle" class="label">2026 流式 S2S 选型</text>
  <text x="50" y="410" class="content">Moshi：最低延迟语音伙伴，EN + FR · CC-BY 4.0</text>
  <text x="50" y="428" class="content">Hibiki / Hibiki-Zero：流式语音到语音翻译 · CC-BY 4.0</text>
  <text x="50" y="446" class="content">GPT-4o Realtime / Gemini Live：闭源商业方案 · 商业许可</text>
</svg>
