<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">LLM agent 的 BFT — 三种攻击、三种聚合器</text>

  <rect x="40" y="60" width="880" height="200" class="box"/>
  <text x="480" y="84" text-anchor="middle" class="head">三种 LLM agent 特有攻击</text>

  <rect x="60" y="100" width="270" height="140" class="hot"/>
  <text x="195" y="122" text-anchor="middle" class="head">拜占庭谎言</text>
  <text x="195" y="146" text-anchor="middle" class="step">一个 agent 输出错误答案</text>
  <text x="195" y="164" text-anchor="middle" class="step">但置信度很高</text>
  <text x="195" y="188" text-anchor="middle" class="small">经典 BFT 在 f &lt; n/3 时可处理</text>
  <text x="195" y="212" text-anchor="middle" class="caption">缓解：任何基于多数的投票</text>

  <rect x="340" y="100" width="270" height="140" class="hot"/>
  <text x="475" y="122" text-anchor="middle" class="head">迎合式从众</text>
  <text x="475" y="146" text-anchor="middle" class="step">agent 照搬最先</text>
  <text x="475" y="164" text-anchor="middle" class="step">发言者的观点，置信度低</text>
  <text x="475" y="188" text-anchor="middle" class="small">经典 BFT 无法检测</text>
  <text x="475" y="212" text-anchor="middle" class="caption">缓解：置信度加权（CP-WBFT）</text>

  <rect x="620" y="100" width="280" height="140" class="hot"/>
  <text x="760" y="122" text-anchor="middle" class="head">同质化（相关错误）</text>
  <text x="760" y="146" text-anchor="middle" class="step">三个 agent 共享基座</text>
  <text x="760" y="164" text-anchor="middle" class="step">模型；产生相同幻觉</text>
  <text x="760" y="188" text-anchor="middle" class="small">经典 BFT 失败：看起来都诚实</text>
  <text x="760" y="212" text-anchor="middle" class="caption">缓解：模型多样性 + 验证器</text>

  <rect x="40" y="290" width="880" height="210" class="cool"/>
  <text x="480" y="314" text-anchor="middle" class="head">2025-2026 年聚合器变体</text>

  <rect x="60" y="330" width="270" height="150" class="cold"/>
  <text x="195" y="352" text-anchor="middle" class="head">CP-WBFT</text>
  <text x="195" y="372" text-anchor="middle" class="step">按置信度探针加权</text>
  <text x="195" y="392" text-anchor="middle" class="small">w(cluster) = sum(c_i)</text>
  <text x="195" y="410" text-anchor="middle" class="small">若 w/total &gt; threshold 则胜出</text>
  <text x="195" y="432" text-anchor="middle" class="caption">arXiv:2511.10400</text>
  <text x="195" y="452" text-anchor="middle" class="small">完全图上的 BFT 提升 +85.71%</text>

  <rect x="340" y="330" width="270" height="150" class="cold"/>
  <text x="475" y="352" text-anchor="middle" class="head">DecentLLMs</text>
  <text x="475" y="372" text-anchor="middle" class="step">无领导者、几何中位数</text>
  <text x="475" y="392" text-anchor="middle" class="small">工作者并行提议</text>
  <text x="475" y="410" text-anchor="middle" class="small">评估者 agent 评分</text>
  <text x="475" y="432" text-anchor="middle" class="caption">arXiv:2507.14928</text>
  <text x="475" y="452" text-anchor="middle" class="small">f &lt; n/2 时仍稳健</text>

  <rect x="620" y="330" width="280" height="150" class="cold"/>
  <text x="760" y="352" text-anchor="middle" class="head">WBFT + 层次聚类</text>
  <text x="760" y="372" text-anchor="middle" class="step">核心 + 边缘划分</text>
  <text x="760" y="392" text-anchor="middle" class="small">weight = quality * trust(history)</text>
  <text x="760" y="410" text-anchor="middle" class="small">核心先达成共识，边缘跟随</text>
  <text x="760" y="432" text-anchor="middle" class="caption">arXiv:2505.05103</text>
  <text x="760" y="452" text-anchor="middle" class="small">限制共识延迟</text>
</svg>
