<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <text x="450" y="28" text-anchor="middle" class="title">群聊：共享消息池 + 发言者选择器（AutoGen / AG2）</text>

  <rect x="220" y="60" width="460" height="80" class="cold"/>
  <text x="450" y="82" text-anchor="middle" class="head">共享消息池</text>
  <text x="450" y="104" text-anchor="middle" class="small">m1 [coder]: initial code ... | m2 [reviewer]: bug detected ... | m3 [coder]: revised ... | m4 [reviewer]: approved</text>
  <text x="450" y="122" text-anchor="middle" class="small">每个 agent 均读取所有消息</text>

  <rect x="40" y="180" width="140" height="80" class="hot"/>
  <text x="110" y="202" text-anchor="middle" class="head">开发者</text>
  <text x="110" y="222" text-anchor="middle" class="small">编写代码</text>
  <text x="110" y="240" text-anchor="middle" class="small">根据评审修订</text>

  <rect x="220" y="180" width="140" height="80" class="cool"/>
  <text x="290" y="202" text-anchor="middle" class="head">评审者</text>
  <text x="290" y="222" text-anchor="middle" class="small">评审代码</text>
  <text x="290" y="240" text-anchor="middle" class="small">返回 approved / rejected</text>

  <rect x="400" y="180" width="140" height="80" class="dsk"/>
  <text x="470" y="202" text-anchor="middle" class="head">管理者</text>
  <text x="470" y="222" text-anchor="middle" class="small">决定终止</text>
  <text x="470" y="240" text-anchor="middle" class="small">输出 TERMINATE</text>

  <rect x="580" y="180" width="260" height="80" class="box"/>
  <text x="710" y="202" text-anchor="middle" class="head">选择器</text>
  <text x="710" y="222" text-anchor="middle" class="small">轮询（固定循环）</text>
  <text x="710" y="240" text-anchor="middle" class="small">LLM 选择（感知上下文）</text>
  <text x="710" y="256" text-anchor="middle" class="small">自定义（基于规则回退）</text>

  <line x1="110" y1="180" x2="350" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="290" y1="180" x2="440" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="470" y1="180" x2="520" y2="140" class="edge" marker-end="url(#arrow)"/>

  <line x1="450" y1="140" x2="580" y2="200" class="edge" marker-end="url(#arrow)"/>
  <text x="555" y="168" class="small">选择器读取消息池</text>

  <path d="M 710 260 Q 710 320 470 300" class="edge" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="580" y="300" class="small">选择器返回：下一位发言者 = 管理者</text>

  <rect x="40" y="340" width="380" height="150" class="box"/>
  <text x="230" y="362" text-anchor="middle" class="head">群聊适用场景</text>
  <text x="230" y="384" text-anchor="middle" class="small">涌现对话、角色混合</text>
  <text x="230" y="402" text-anchor="middle" class="small">探索式问题求解</text>
  <text x="230" y="420" text-anchor="middle" class="small">不适合预先连接所有交接路径</text>
  <text x="230" y="440" text-anchor="middle" class="small">“头脑风暴会议”，而非“流水线”</text>
  <text x="230" y="468" text-anchor="middle" class="caption">选择器取代显式图边</text>

  <rect x="460" y="340" width="380" height="150" class="box"/>
  <text x="650" y="362" text-anchor="middle" class="head">失败模式</text>
  <text x="650" y="384" text-anchor="middle" class="small">热点发言者（单个 agent 主导）</text>
  <text x="650" y="402" text-anchor="middle" class="small">迎合级联（服从强势发言者）</text>
  <text x="650" y="420" text-anchor="middle" class="small">上下文膨胀（消息池无限增长）</text>
  <text x="650" y="440" text-anchor="middle" class="small">选择器不一致（LLM 非确定性）</text>
  <text x="650" y="468" text-anchor="middle" class="caption">限制轮次 · 追踪均衡 · 限制可见范围</text>
</svg>
