<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">5 层 agent 经济技术栈与核心机制</text>

  <rect x="40" y="60" width="420" height="220" class="box"/>
  <text x="250" y="84" text-anchor="middle" class="head">5 层技术栈</text>

  <rect x="70" y="100" width="360" height="34" class="cool"/>
  <text x="250" y="122" text-anchor="middle" class="step">5. 治理 — agent 化 DAO</text>

  <rect x="70" y="140" width="360" height="34" class="cold"/>
  <text x="250" y="162" text-anchor="middle" class="step">4. 结算 — ERC-4337 账户抽象</text>

  <rect x="70" y="180" width="360" height="34" class="dsk"/>
  <text x="250" y="202" text-anchor="middle" class="step">3. 认知 — LLM + RAG + MCP</text>

  <rect x="70" y="220" width="360" height="34" class="hot"/>
  <text x="250" y="242" text-anchor="middle" class="step">2. 身份 — W3C DID + 声誉</text>

  <rect x="70" y="260" width="360" height="34" class="box"/>
  <text x="250" y="278" text-anchor="middle" class="step">1. DePIN — Bittensor · Akash · Render</text>

  <rect x="500" y="60" width="420" height="220" class="cool"/>
  <text x="710" y="84" text-anchor="middle" class="head">生产网络（四月 2026）</text>

  <text x="530" y="114" class="step">Bittensor (TAO)</text>
  <text x="530" y="132" class="small">子网奖励任务专用模型；按质押加权评分</text>

  <text x="530" y="160" class="step">Fetch.ai / ASI</text>
  <text x="530" y="178" class="small">ASI-1 Mini LLM；FET token 用于 agent 间支付</text>

  <text x="530" y="206" class="step">Gonka</text>
  <text x="530" y="224" class="small">transformer 工作量证明；可验证推理任务</text>

  <text x="530" y="252" class="step">LaMAS (AAMAS 2025)</text>
  <text x="530" y="270" class="small">采用 Shapley 归因的去中心化多 agent 系统</text>

  <rect x="40" y="310" width="880" height="190" class="box"/>
  <text x="480" y="334" text-anchor="middle" class="head">三种核心机制</text>

  <text x="60" y="366" class="step">Shapley 归因</text>
  <text x="230" y="366" class="small">公平分配贡献；N&gt;6 个 agent 时采样 N 种排列</text>
  <text x="230" y="384" class="small">公理：效率、对称、线性、零贡献</text>

  <text x="60" y="414" class="step">次价拍卖</text>
  <text x="230" y="414" class="small">单调聚合下如实报价（Google Research）</text>
  <text x="230" y="432" class="small">按报价选胜者；支付第二高价格</text>

  <text x="60" y="462" class="step">声誉资本</text>
  <text x="230" y="462" class="small">DID 绑定得分，指数衰减；验证失败时惩罚</text>
  <text x="230" y="480" class="small">读取便宜（路由）；伪造昂贵（随时间累积）</text>
</svg>
