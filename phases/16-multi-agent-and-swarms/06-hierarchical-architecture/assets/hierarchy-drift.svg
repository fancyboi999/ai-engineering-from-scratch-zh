<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .bad { fill: #f8d7da; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 11px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
      .bad-edge { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    </style>
  </defs>
  <text x="450" y="28" text-anchor="middle" class="title">层级失败模式：任务分解漂移的级联</text>

  <!-- happy path -->
  <text x="220" y="58" text-anchor="middle" class="head">正常路径</text>
  <rect x="140" y="70" width="160" height="44" class="cool"/>
  <text x="220" y="90" text-anchor="middle" class="step">顶层管理者</text>
  <text x="220" y="106" text-anchor="middle" class="small">拆分：工程 + 法务</text>
  <line x1="180" y1="114" x2="140" y2="160" class="edge" marker-end="url(#arrow)"/>
  <line x1="260" y1="114" x2="300" y2="160" class="edge" marker-end="url(#arrow)"/>
  <rect x="70" y="160" width="130" height="44" class="cool"/>
  <text x="135" y="180" text-anchor="middle" class="step">工程管理者</text>
  <text x="135" y="196" text-anchor="middle" class="small">前端 + 后端</text>
  <rect x="240" y="160" width="130" height="44" class="cool"/>
  <text x="305" y="180" text-anchor="middle" class="step">法务管理者</text>
  <text x="305" y="196" text-anchor="middle" class="small">律师</text>
  <line x1="135" y1="204" x2="135" y2="240" class="edge" marker-end="url(#arrow)"/>
  <line x1="305" y1="204" x2="305" y2="240" class="edge" marker-end="url(#arrow)"/>
  <rect x="70" y="240" width="130" height="40" class="cold"/>
  <text x="135" y="265" text-anchor="middle" class="small">React + API 问题</text>
  <rect x="240" y="240" width="130" height="40" class="cold"/>
  <text x="305" y="265" text-anchor="middle" class="small">法律不合规</text>
  <line x1="135" y1="280" x2="180" y2="340" class="edge"/>
  <line x1="305" y1="280" x2="260" y2="340" class="edge"/>
  <rect x="140" y="340" width="160" height="50" class="cool"/>
  <text x="220" y="360" text-anchor="middle" class="step">顶层综合</text>
  <text x="220" y="378" text-anchor="middle" class="small">回答用户问题</text>

  <!-- perturbed path -->
  <text x="680" y="58" text-anchor="middle" class="head">受扰动路径</text>
  <rect x="600" y="70" width="160" height="44" class="bad"/>
  <text x="680" y="90" text-anchor="middle" class="step">顶层管理者</text>
  <text x="680" y="106" text-anchor="middle" class="small">拆分：工程 + 财务（！）</text>
  <line x1="640" y1="114" x2="600" y2="160" class="edge" marker-end="url(#arrow)"/>
  <line x1="720" y1="114" x2="760" y2="160" class="bad-edge" marker-end="url(#arrow)"/>
  <rect x="530" y="160" width="130" height="44" class="cool"/>
  <text x="595" y="180" text-anchor="middle" class="step">工程管理者</text>
  <text x="595" y="196" text-anchor="middle" class="small">前端 + 后端</text>
  <rect x="700" y="160" width="130" height="44" class="bad"/>
  <text x="765" y="180" text-anchor="middle" class="step">财务管理者</text>
  <text x="765" y="196" text-anchor="middle" class="small">服从错误标签</text>
  <line x1="595" y1="204" x2="595" y2="240" class="edge" marker-end="url(#arrow)"/>
  <line x1="765" y1="204" x2="765" y2="240" class="bad-edge" marker-end="url(#arrow)"/>
  <rect x="530" y="240" width="130" height="40" class="cold"/>
  <text x="595" y="265" text-anchor="middle" class="small">React + API 问题</text>
  <rect x="700" y="240" width="130" height="40" class="bad"/>
  <text x="765" y="265" text-anchor="middle" class="small">每月超预算 $42k</text>
  <line x1="595" y1="280" x2="640" y2="340" class="edge"/>
  <line x1="765" y1="280" x2="720" y2="340" class="bad-edge"/>
  <rect x="600" y="340" width="160" height="50" class="bad"/>
  <text x="680" y="360" text-anchor="middle" class="step">顶层综合</text>
  <text x="680" y="378" text-anchor="middle" class="small">法律问题未回答</text>

  <rect x="60" y="420" width="780" height="80" class="box"/>
  <text x="450" y="442" text-anchor="middle" class="head">护栏</text>
  <text x="450" y="462" text-anchor="middle" class="small">树深度上限 2 · 有限协调轮次 · 各层金丝雀工作者 · 任务分解漂移告警</text>
  <text x="450" y="482" text-anchor="middle" class="small">CrewAI Process.hierarchical 与嵌套 LangGraph 监督者都具有这一失败面</text>
</svg>
