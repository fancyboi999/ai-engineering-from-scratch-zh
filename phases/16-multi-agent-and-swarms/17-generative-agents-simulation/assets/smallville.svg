<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">生成式 agent — Park 等人 2023 年的三个组件</text>

  <rect x="40" y="60" width="280" height="220" class="cool"/>
  <text x="180" y="84" text-anchor="middle" class="head">记忆流</text>
  <text x="180" y="108" text-anchor="middle" class="step">仅追加日志</text>
  <text x="60" y="136" class="small">[t=0]  observation :: saw Isabella</text>
  <text x="60" y="154" class="small">[t=1]  observation :: invited to party</text>
  <text x="60" y="172" class="small">[t=2]  reflection  :: I enjoy parties</text>
  <text x="60" y="190" class="small">[t=3]  plan        :: attend at 5pm</text>
  <text x="60" y="208" class="small">[t=4]  action      :: head to cafe</text>
  <text x="180" y="240" text-anchor="middle" class="caption">检索：时近性 + 重要性 + 相关性</text>
  <text x="180" y="258" text-anchor="middle" class="caption">前 k 项输入 prompt</text>

  <rect x="340" y="60" width="280" height="220" class="cold"/>
  <text x="480" y="84" text-anchor="middle" class="head">反思</text>
  <text x="480" y="108" text-anchor="middle" class="step">高阶信念</text>
  <text x="480" y="136" text-anchor="middle" class="small">定期触发：</text>
  <text x="480" y="154" text-anchor="middle" class="small">未处理的重要性 &gt; 阈值</text>
  <text x="480" y="180" text-anchor="middle" class="small">prompt：“根据近期记忆，</text>
  <text x="480" y="196" text-anchor="middle" class="small">有什么更高层的洞见？”</text>
  <text x="480" y="222" text-anchor="middle" class="small">输出：新的反思条目</text>
  <text x="480" y="240" text-anchor="middle" class="small">重新写入记忆流</text>
  <text x="480" y="258" text-anchor="middle" class="caption">没有反思：无法形成信念</text>

  <rect x="640" y="60" width="280" height="220" class="box"/>
  <text x="780" y="84" text-anchor="middle" class="head">规划</text>
  <text x="780" y="108" text-anchor="middle" class="step">天 / 小时 / 行动</text>
  <text x="780" y="136" text-anchor="middle" class="small">天：上班、吃晚饭</text>
  <text x="780" y="156" text-anchor="middle" class="small">小时：9am 咖啡馆，12pm 午饭……</text>
  <text x="780" y="176" text-anchor="middle" class="small">行动：走到咖啡馆、点咖啡</text>
  <text x="780" y="206" text-anchor="middle" class="small">修订触发条件：</text>
  <text x="780" y="222" text-anchor="middle" class="small">观察与计划相矛盾</text>
  <text x="780" y="240" text-anchor="middle" class="small">仅重新规划受影响的片段</text>
  <text x="780" y="258" text-anchor="middle" class="caption">没有规划：只有被动反应的噪声</text>

  <rect x="40" y="310" width="880" height="200" class="hot"/>
  <text x="480" y="334" text-anchor="middle" class="head">涌现行为 — 情人节聚会</text>

  <text x="70" y="362" class="step">时刻 0</text>
  <text x="140" y="362" class="small">agent-0（Isabella）的初始设定：“在咖啡馆举办聚会，5pm”</text>

  <text x="70" y="382" class="step">时刻 0-2</text>
  <text x="140" y="382" class="small">Isabella 邀请邻居；每次邀请都成为邻居记忆流中的观察</text>

  <text x="70" y="402" class="step">时刻 1-3</text>
  <text x="140" y="402" class="small">受邀邻居反思 -&gt; 形成“我受邀参加聚会”的信念 -&gt; 计划出席</text>

  <text x="70" y="422" class="step">时刻 2-4</text>
  <text x="140" y="422" class="small">受邀者告诉其他邻居；形成二度传播</text>

  <text x="70" y="442" class="step">时刻 5</text>
  <text x="140" y="442" class="small">三个组件共同作用：3-5 个 agent 准时到达咖啡馆</text>

  <text x="70" y="470" class="caption">一个初始设定 + 三个组件 = 无需编排器也能协调到达</text>
  <text x="70" y="490" class="caption">已记录的失败：空间规范（已关门店铺、单人卫生间）</text>
</svg>
