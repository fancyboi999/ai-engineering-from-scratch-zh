<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">多 agent 系统的持久执行</text>

  <rect x="40" y="60" width="880" height="180" class="cool"/>
  <text x="480" y="84" text-anchor="middle" class="head">超级步 + 检查点模式（LangGraph、Temporal、Restate）</text>

  <rect x="60" y="110" width="110" height="100" class="box"/>
  <text x="115" y="135" text-anchor="middle" class="step">超级步 1</text>
  <text x="115" y="158" text-anchor="middle" class="small">规划</text>
  <line x1="115" y1="175" x2="115" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <text x="115" y="220" text-anchor="middle" class="caption">写检查点</text>

  <rect x="200" y="110" width="110" height="100" class="box"/>
  <text x="255" y="135" text-anchor="middle" class="step">超级步 2</text>
  <text x="255" y="158" text-anchor="middle" class="small">研究</text>
  <line x1="255" y1="175" x2="255" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <text x="255" y="220" text-anchor="middle" class="caption">写检查点</text>

  <rect x="340" y="110" width="110" height="100" class="hot"/>
  <text x="395" y="135" text-anchor="middle" class="step">超级步 3</text>
  <text x="395" y="158" text-anchor="middle" class="small">崩溃</text>
  <line x1="395" y1="175" x2="395" y2="195" stroke="#c0392b"/>

  <rect x="480" y="110" width="110" height="100" class="cold"/>
  <text x="535" y="135" text-anchor="middle" class="step">恢复</text>
  <text x="535" y="158" text-anchor="middle" class="small">从检查点 2 恢复</text>
  <line x1="535" y1="175" x2="535" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <text x="535" y="220" text-anchor="middle" class="caption">另一工作者</text>

  <rect x="620" y="110" width="110" height="100" class="box"/>
  <text x="675" y="135" text-anchor="middle" class="step">超级步 3'</text>
  <text x="675" y="158" text-anchor="middle" class="small">研究（重新执行）</text>
  <text x="675" y="220" text-anchor="middle" class="caption">幂等工具调用</text>

  <rect x="760" y="110" width="140" height="100" class="box"/>
  <text x="830" y="135" text-anchor="middle" class="step">超级步 4</text>
  <text x="830" y="158" text-anchor="middle" class="small">综合 + 回复</text>

  <line x1="170" y1="160" x2="196" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <line x1="310" y1="160" x2="336" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <line x1="590" y1="160" x2="616" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/>
  <line x1="730" y1="160" x2="756" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/>

  <rect x="40" y="270" width="420" height="230" class="cold"/>
  <text x="250" y="294" text-anchor="middle" class="head">按负载分层选择</text>

  <text x="60" y="326" class="step">层级 1（Bedi 法则）</text>
  <text x="60" y="346" class="small">FastAPI + Postgres + outbox</text>
  <text x="60" y="364" class="small">&lt; 100 个并发运行，任务不足一小时</text>

  <text x="60" y="396" class="step">层级 2</text>
  <text x="60" y="416" class="small">LangGraph 运行时或 Temporal</text>
  <text x="60" y="434" class="small">小时级运行、中断/恢复、重试</text>

  <text x="60" y="466" class="step">层级 3</text>
  <text x="60" y="486" class="small">定制 outbox + 事件溯源，专用实现</text>

  <rect x="500" y="270" width="420" height="230" class="cool"/>
  <text x="710" y="294" text-anchor="middle" class="head">I/O 密集型 LLM 调用：异步与线程</text>

  <rect x="520" y="320" width="180" height="80" class="box"/>
  <text x="610" y="344" text-anchor="middle" class="step">asyncio / 纤程</text>
  <text x="610" y="366" text-anchor="middle" class="small">I/O 时协作式让出执行权</text>
  <text x="610" y="386" text-anchor="middle" class="small">10k 并发：可承受</text>

  <rect x="720" y="320" width="180" height="80" class="hot"/>
  <text x="810" y="344" text-anchor="middle" class="step">每次调用一个线程</text>
  <text x="810" y="366" text-anchor="middle" class="small">每个线程栈约 1MB</text>
  <text x="810" y="386" text-anchor="middle" class="small">10k 并发：约 10GB</text>

  <text x="710" y="430" text-anchor="middle" class="caption">LLM 调用有 99% 时间在等待 I/O；线程只增加内存开销，毫无收益</text>
  <text x="710" y="450" text-anchor="middle" class="caption">CPU 密集型后处理仍使用线程 / 进程</text>
  <text x="710" y="475" text-anchor="middle" class="caption">彩虹部署让长时间运行的 agent 在代码推送后仍保持存活</text>
</svg>
