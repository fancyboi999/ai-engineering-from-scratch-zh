<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">多 agent 工厂 — 架构师 / 编码者 / 审查者 / 测试者</text>

  <rect x="380" y="50" width="200" height="44" class="dsk"/>
  <text x="480" y="70" text-anchor="middle" class="step">架构师（Opus 4.7）</text>
  <text x="480" y="86" text-anchor="middle" class="small">规划 + 子任务 + 接口</text>

  <rect x="40" y="130" width="180" height="70" class="cool"/>
  <text x="130" y="150" text-anchor="middle" class="step">编码者 A（Sonnet 4.7）</text>
  <text x="130" y="168" text-anchor="middle" class="small">工作树 A + Daytona</text>
  <text x="130" y="186" text-anchor="middle" class="small">子任务：解析器</text>

  <rect x="240" y="130" width="180" height="70" class="cool"/>
  <text x="330" y="150" text-anchor="middle" class="step">编码者 B</text>
  <text x="330" y="168" text-anchor="middle" class="small">工作树 B</text>
  <text x="330" y="186" text-anchor="middle" class="small">子任务：缓存</text>

  <rect x="440" y="130" width="180" height="70" class="cool"/>
  <text x="530" y="150" text-anchor="middle" class="step">编码者 C</text>
  <text x="530" y="168" text-anchor="middle" class="small">工作树 C</text>
  <text x="530" y="186" text-anchor="middle" class="small">子任务：API</text>

  <rect x="640" y="130" width="180" height="70" class="cool"/>
  <text x="730" y="150" text-anchor="middle" class="step">编码者 D</text>
  <text x="730" y="168" text-anchor="middle" class="small">工作树 D</text>
  <text x="730" y="186" text-anchor="middle" class="small">子任务：迁移</text>

  <path d="M480,94 L130,130" class="edge"/>
  <path d="M480,94 L330,130" class="edge"/>
  <path d="M480,94 L530,130" class="edge"/>
  <path d="M480,94 L730,130" class="edge"/>

  <rect x="340" y="240" width="280" height="54" class="cold"/>
  <text x="480" y="262" text-anchor="middle" class="step">合并协调者</text>
  <text x="480" y="280" text-anchor="middle" class="small">三方合并 + LLM 冲突解决器</text>

  <path d="M130,200 L440,240" class="edge"/>
  <path d="M330,200 L460,240" class="edge"/>
  <path d="M530,200 L500,240" class="edge"/>
  <path d="M730,200 L540,240" class="edge"/>

  <rect x="340" y="320" width="280" height="54" class="hot"/>
  <text x="480" y="342" text-anchor="middle" class="step">审查者（GPT-5.4）</text>
  <text x="480" y="360" text-anchor="middle" class="small">不能批准自己编写的差异</text>
  <path d="M480,294 L480,320" class="edge"/>

  <rect x="340" y="400" width="280" height="54" class="dsk"/>
  <text x="480" y="422" text-anchor="middle" class="step">测试者（Gemini 2.5 Pro）</text>
  <text x="480" y="440" text-anchor="middle" class="small">在干净沙箱中运行测试集</text>
  <path d="M480,374 L480,400" class="edge"/>

  <rect x="340" y="480" width="280" height="40" class="cool"/>
  <text x="480" y="504" text-anchor="middle" class="step">创建 PR</text>
  <path d="M480,454 L480,480" class="edge"/>

  <rect x="40" y="300" width="260" height="240" class="box"/>
  <text x="170" y="322" text-anchor="middle" class="head">指标</text>
  <text x="170" y="344" text-anchor="middle" class="small">SWE-bench Pro pass@1</text>
  <text x="170" y="362" text-anchor="middle" class="small">与单 agent 比较总耗时</text>
  <text x="170" y="380" text-anchor="middle" class="small">缺陷探针中的误批准率</text>
  <text x="170" y="398" text-anchor="middle" class="small">token 用量放大比</text>
  <text x="170" y="416" text-anchor="middle" class="small">合并冲突率</text>
  <text x="170" y="440" text-anchor="middle" class="small">目标：</text>
  <text x="170" y="456" text-anchor="middle" class="small">pass@1 &gt; 单 agent</text>
  <text x="170" y="472" text-anchor="middle" class="small">并行任务加速 2-3 倍</text>
  <text x="170" y="490" text-anchor="middle" class="small">token 放大 &lt; 2 倍</text>
  <text x="170" y="508" text-anchor="middle" class="small">误批准率 &lt; 5%</text>
  <text x="170" y="528" text-anchor="middle" class="caption">SWE-AF / MetaGPT / AutoGen 架构形态</text>

  <rect x="660" y="300" width="260" height="240" class="box"/>
  <text x="790" y="322" text-anchor="middle" class="head">交接核算</text>
  <text x="790" y="344" text-anchor="middle" class="small">每个角色边界 = 一个 span</text>
  <text x="790" y="362" text-anchor="middle" class="small">具有 A2A 类型的消息</text>
  <text x="790" y="380" text-anchor="middle" class="small">以文件为底层的任务看板</text>
  <text x="790" y="398" text-anchor="middle" class="small">Langfuse 角色标签 + token</text>
  <text x="790" y="422" text-anchor="middle" class="small">事后复盘直方图：</text>
  <text x="790" y="438" text-anchor="middle" class="small">规划模糊 / 合并冲突 /</text>
  <text x="790" y="454" text-anchor="middle" class="small">审查者误批准 /</text>
  <text x="790" y="470" text-anchor="middle" class="small">测试者不稳定</text>
  <text x="790" y="496" text-anchor="middle" class="small">随每次失败运行一同交付</text>
  <text x="790" y="516" text-anchor="middle" class="caption">交接处就是故障面</text>
</svg>
