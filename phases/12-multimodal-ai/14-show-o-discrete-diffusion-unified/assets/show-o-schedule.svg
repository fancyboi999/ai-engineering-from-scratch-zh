  <text x="480" y="250" text-anchor="middle" class="small">每步并行预测所有掩码，提交置信度最高的 K 个</text>

  <rect x="30" y="290" width="900" height="230" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">Show-o 与其他方案</text>

  <rect x="50" y="330" width="210" height="180" class="hot"/>
  <text x="155" y="352" text-anchor="middle" class="step">Chameleon / Emu3</text>
  <text x="155" y="372" text-anchor="middle" class="small">离散 + NTP</text>
  <text x="155" y="390" text-anchor="middle" class="small">1024 次前向计算</text>
  <text x="155" y="406" text-anchor="middle" class="small">约 2 min / 512x512</text>
  <text x="155" y="430" text-anchor="middle" class="small">训练最简单</text>
  <text x="155" y="448" text-anchor="middle" class="small">质量上限受分词器限制</text>

  <rect x="280" y="330" width="210" height="180" class="cool"/>
  <text x="385" y="352" text-anchor="middle" class="step">Show-o / MaskGIT</text>
  <text x="385" y="372" text-anchor="middle" class="small">离散 + 掩码扩散</text>
  <text x="385" y="390" text-anchor="middle" class="small">约 16 次前向计算</text>
  <text x="385" y="406" text-anchor="middle" class="small">约 4-8s / 512x512</text>
  <text x="385" y="430" text-anchor="middle" class="small">单一损失，简洁</text>
  <text x="385" y="448" text-anchor="middle" class="small">天然支持图像补全</text>

  <rect x="510" y="330" width="210" height="180" class="cold"/>
  <text x="615" y="352" text-anchor="middle" class="step">Transfusion / MMDiT</text>
  <text x="615" y="372" text-anchor="middle" class="small">连续 + 扩散</text>
  <text x="615" y="390" text-anchor="middle" class="small">约 20 次前向计算</text>
  <text x="615" y="406" text-anchor="middle" class="small">约 5-10s / 512x512</text>
  <text x="615" y="430" text-anchor="middle" class="small">质量最高</text>
  <text x="615" y="448" text-anchor="middle" class="small">需调节双重损失</text>

  <rect x="740" y="330" width="180" height="180" class="reg"/>
  <text x="830" y="352" text-anchor="middle" class="step">Stable Diffusion</text>
  <text x="830" y="372" text-anchor="middle" class="small">连续潜空间</text>
  <text x="830" y="390" text-anchor="middle" class="small">约 20 次计算</text>
  <text x="830" y="406" text-anchor="middle" class="small">约 2-5s / 512x512</text>
  <text x="830" y="430" text-anchor="middle" class="small">专用模型</text>
  <text x="830" y="448" text-anchor="middle" class="small">不支持 VQA/推理</text>
</svg>
