<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">LLaVA-OneVision：统一 token 预算与三阶段训练流程</text>

  <rect x="30" y="50" width="900" height="200" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">三个场景共享约 4000 个视觉 token 的预算</text>

  <rect x="60" y="90" width="260" height="140" class="hot"/>
  <text x="190" y="110" text-anchor="middle" class="step">单图像</text>
  <text x="190" y="130" text-anchor="middle" class="small">AnyRes：9 个图块 + 缩略图</text>
  <text x="190" y="146" text-anchor="middle" class="small">每块 384，2x 池化</text>
  <text x="190" y="162" text-anchor="middle" class="small">每块 182 个 token</text>
  <text x="190" y="182" text-anchor="middle" class="step">共 1820 个 token</text>
  <text x="190" y="202" text-anchor="middle" class="small">感知 + OCR + 细节</text>

  <rect x="340" y="90" width="260" height="140" class="cool"/>
  <text x="470" y="110" text-anchor="middle" class="step">多图像</text>
  <text x="470" y="130" text-anchor="middle" class="small">6 张分辨率 384 的图像</text>
  <text x="470" y="146" text-anchor="middle" class="small">不池化，每张图像 729 个 token</text>
  <text x="470" y="162" text-anchor="middle" class="small">跨图像推理</text>
  <text x="470" y="182" text-anchor="middle" class="step">共 4374 个 token</text>
  <text x="470" y="202" text-anchor="middle" class="small">比较、计数、识别差异</text>

  <rect x="620" y="90" width="280" height="140" class="cold"/>
  <text x="760" y="110" text-anchor="middle" class="step">视频</text>
  <text x="760" y="130" text-anchor="middle" class="small">32 帧，分辨率 384</text>
  <text x="760" y="146" text-anchor="middle" class="small">3x 池化 -&gt; 每帧 81 个 token</text>
  <text x="760" y="162" text-anchor="middle" class="small">时间定位</text>
  <text x="760" y="182" text-anchor="middle" class="step">共 2592 个 token</text>
  <text x="760" y="202" text-anchor="middle" class="small">事件与动作识别</text>

  <rect x="30" y="270" width="900" height="250" class="box"/>
  <text x="480" y="292" text-anchor="middle" class="head">三阶段训练流程 + 涌现能力</text>

  <rect x="60" y="310" width="200" height="190" class="reg"/>
  <text x="160" y="332" text-anchor="middle" class="step">SI 阶段</text>
  <text x="160" y="354" text-anchor="middle" class="small">仅单图像</text>
  <text x="160" y="370" text-anchor="middle" class="small">AnyRes 高分辨率</text>
  <text x="160" y="390" text-anchor="middle" class="small">基础感知能力</text>
  <text x="160" y="410" text-anchor="middle" class="small">MMMU + OCR + 细节</text>
  <text x="160" y="444" text-anchor="middle" class="caption">反转顺序（视频优先）</text>
  <text x="160" y="460" text-anchor="middle" class="caption">MMMU 降低 2-4 分</text>
  <text x="160" y="476" text-anchor="middle" class="caption">据 OneVision 消融实验</text>

  <path d="M 265 410 L 325 410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="310" width="200" height="190" class="cool"/>
  <text x="430" y="332" text-anchor="middle" class="step">OV 阶段</text>
  <text x="430" y="354" text-anchor="middle" class="small">50% 单图像</text>
  <text x="430" y="370" text-anchor="middle" class="small">30% 多图像</text>
  <text x="430" y="390" text-anchor="middle" class="small">20% 视频</text>
  <text x="430" y="410" text-anchor="middle" class="small">统一预算</text>
  <text x="430" y="444" text-anchor="middle" class="caption">跨场景对齐</text>
  <text x="430" y="460" text-anchor="middle" class="caption">结构推理</text>

  <path d="M 535 410 L 595 410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="310" width="200" height="190" class="hot"/>
  <text x="700" y="332" text-anchor="middle" class="step">TT 阶段</text>
  <text x="700" y="354" text-anchor="middle" class="small">按任务混合数据</text>
  <text x="700" y="370" text-anchor="middle" class="small">例如 agent / 文档</text>
  <text x="700" y="390" text-anchor="middle" class="small">/ 机器人 / 视频</text>
  <text x="700" y="410" text-anchor="middle" class="small">部署调优</text>
  <text x="700" y="444" text-anchor="middle" class="caption">可选，保留基础能力</text>

  <rect x="820" y="310" width="100" height="190" class="reg"/>
  <text x="870" y="332" text-anchor="middle" class="step">涌现能力</text>
  <text x="870" y="354" text-anchor="middle" class="small">多摄像头</text>
  <text x="870" y="370" text-anchor="middle" class="small">推理</text>
  <text x="870" y="390" text-anchor="middle" class="small">标记集合</text>
  <text x="870" y="406" text-anchor="middle" class="small">prompt</text>
  <text x="870" y="426" text-anchor="middle" class="small">iPhone 屏幕</text>
  <text x="870" y="442" text-anchor="middle" class="small">agent</text>
  <text x="870" y="476" text-anchor="middle" class="caption">均未经专项训练</text>
</svg>
