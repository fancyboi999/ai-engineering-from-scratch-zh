<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .frozen { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .train { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .stage { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">LLaVA 方案：更简单的投影器、更低的训练成本、更大的生态</text>

  <rect x="40" y="50" width="880" height="250" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">前向传播：图像 -&gt; 投影器 -&gt; LLM</text>

  <rect x="60" y="90" width="160" height="180" class="frozen"/>
  <text x="140" y="112" text-anchor="middle" class="step">CLIP ViT-L/14</text>
  <text x="140" y="130" text-anchor="middle" class="small">@ 336x336</text>
  <text x="140" y="148" text-anchor="middle" class="small">阶段 1 冻结</text>
  <text x="140" y="166" text-anchor="middle" class="small">303M 参数</text>
  <text x="140" y="194" text-anchor="middle" class="small">576 个图像块 token</text>
  <text x="140" y="212" text-anchor="middle" class="small">每个 1024 维</text>
  <text x="140" y="240" text-anchor="middle" class="caption">24x24 网格</text>

  <path d="M 225 180 L 290 180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="295" y="90" width="180" height="180" class="train"/>
  <text x="385" y="112" text-anchor="middle" class="step">2 层 MLP 投影器</text>
  <text x="385" y="130" text-anchor="middle" class="small">1024 -&gt; 4096 -&gt; 4096</text>
  <text x="385" y="148" text-anchor="middle" class="small">GELU 激活函数</text>
  <text x="385" y="168" text-anchor="middle" class="small">约 22M 参数</text>
  <text x="385" y="196" text-anchor="middle" class="small">全部图像块共享</text>
  <text x="385" y="214" text-anchor="middle" class="small">阶段 1 训练</text>
  <text x="385" y="232" text-anchor="middle" class="small">阶段 2 微调</text>
  <text x="385" y="252" text-anchor="middle" class="caption">整个连接桥</text>

  <path d="M 480 180 L 545 180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="90" width="160" height="180" class="box"/>
  <text x="630" y="112" text-anchor="middle" class="step">576 个视觉 token</text>
  <text x="630" y="130" text-anchor="middle" class="small">每个 4096 维</text>
  <text x="630" y="148" text-anchor="middle" class="small">替换 &lt;image&gt;</text>
  <text x="630" y="166" text-anchor="middle" class="small">位于文本 prompt 中</text>
  <text x="630" y="194" text-anchor="middle" class="small">token 预算：</text>
  <text x="630" y="212" text-anchor="middle" class="small">576 / 2048 = 28%</text>
  <text x="630" y="230" text-anchor="middle" class="small">576 / 32k = 1.8%</text>
  <text x="630" y="252" text-anchor="middle" class="small">AnyRes：2880 个 token</text>

  <path d="M 715 180 L 780 180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="785" y="90" width="130" height="180" class="frozen"/>
  <text x="850" y="112" text-anchor="middle" class="step">Vicuna 13B</text>
  <text x="850" y="130" text-anchor="middle" class="small">或 Llama-3.1</text>
  <text x="850" y="150" text-anchor="middle" class="small">阶段 1 冻结</text>
  <text x="850" y="170" text-anchor="middle" class="small">阶段 2 训练</text>
  <text x="850" y="200" text-anchor="middle" class="small">自回归</text>
  <text x="850" y="218" text-anchor="middle" class="small">下一个 token</text>
  <text x="850" y="236" text-anchor="middle" class="small">生成</text>
  <text x="850" y="256" text-anchor="middle" class="caption">与纯文本相同</text>

  <rect x="40" y="320" width="880" height="220" class="box"/>
  <text x="480" y="342" text-anchor="middle" class="head">两阶段训练</text>

  <rect x="60" y="360" width="410" height="160" class="stage"/>
  <text x="80" y="382" class="step">阶段 1：投影器对齐</text>
  <text x="80" y="402" class="small">冻结 ViT，冻结 LLM</text>
  <text x="80" y="418" class="small">仅训练 2 层 MLP</text>
  <text x="80" y="434" class="small">数据：558k 组图像-描述对（LAION-CC-SBU）</text>
  <text x="80" y="450" class="small">损失：以视觉 token 为条件，对图像描述计算语言模型损失</text>
  <text x="80" y="468" class="small">成本：8xA100 运行约 4 小时</text>
  <text x="80" y="490" class="small">目标：投影器学习 ViT 空间 -&gt; LLM 空间</text>
  <text x="80" y="508" class="caption">无特定任务目标</text>

  <rect x="490" y="360" width="410" height="160" class="train"/>
  <text x="510" y="382" class="step">阶段 2：视觉指令微调</text>
  <text x="510" y="402" class="small">解冻 LLM（全量或 LoRA）</text>
  <text x="510" y="418" class="small">投影器保持可训练</text>
  <text x="510" y="434" class="small">数据：158k 轮 GPT-4 生成的对话</text>
  <text x="510" y="450" class="small">  （对话 / 描述 / 推理）</text>
  <text x="510" y="468" class="small">成本：8xA100 运行约 20 小时</text>
  <text x="510" y="490" class="small">目标：对话、VQA、遵循指令</text>
  <text x="510" y="508" class="caption">LLaVA-NeXT 加入 ShareGPT4V 和学术数据混合</text>
</svg>
