<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">音频 LLM 演进：从 Whisper（2022）到 Audio Flamingo 3（2025）</text>

  <rect x="30" y="50" width="900" height="230" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">流水线：频谱图 -&gt; 编码器 -&gt; Q-former -&gt; LLM</text>

  <rect x="50" y="90" width="180" height="170" class="hot"/>
  <text x="140" y="110" text-anchor="middle" class="step">1. 波形</text>
  <text x="140" y="128" text-anchor="middle" class="small">16 kHz 单声道</text>
  <text x="140" y="150" text-anchor="middle" class="step">2. 对数梅尔频谱</text>
  <text x="140" y="168" text-anchor="middle" class="small">25ms 窗长、10ms 帧移</text>
  <text x="140" y="184" text-anchor="middle" class="small">80 个梅尔频带</text>
  <text x="140" y="200" text-anchor="middle" class="small">对数压缩</text>
  <text x="140" y="222" text-anchor="middle" class="small">30s = 3000 帧</text>

  <path d="M 235 170 L 275 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="90" width="200" height="170" class="cool"/>
  <text x="380" y="110" text-anchor="middle" class="step">3. 音频编码器</text>
  <text x="380" y="132" text-anchor="middle" class="small">Whisper：擅长语音</text>
  <text x="380" y="148" text-anchor="middle" class="small">BEATs：擅长音乐</text>
  <text x="380" y="164" text-anchor="middle" class="small">AF-Whisper：拼接</text>
  <text x="380" y="186" text-anchor="middle" class="small">每 10ms 为 1 帧</text>
  <text x="380" y="210" text-anchor="middle" class="small">12 层 transformer</text>
  <text x="380" y="230" text-anchor="middle" class="caption">训练连接桥时冻结</text>

  <path d="M 485 170 L 525 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="90" width="200" height="170" class="cold"/>
  <text x="630" y="110" text-anchor="middle" class="step">4. 音频 Q-former</text>
  <text x="630" y="132" text-anchor="middle" class="small">32-64 个可学习 query</text>
  <text x="630" y="148" text-anchor="middle" class="small">对各帧做交叉注意力</text>
  <text x="630" y="164" text-anchor="middle" class="small">输出定长 token</text>
  <text x="630" y="186" text-anchor="middle" class="step">训练</text>
  <text x="630" y="202" text-anchor="middle" class="small">阶段 1：ITM + ITC + ITG</text>
  <text x="630" y="218" text-anchor="middle" class="small">阶段 2：指令微调</text>

  <path d="M 735 170 L 775 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="90" width="140" height="170" class="reg"/>
  <text x="850" y="110" text-anchor="middle" class="step">5. LLM</text>
  <text x="850" y="128" text-anchor="middle" class="small">Qwen2.5-7B</text>
  <text x="850" y="144" text-anchor="middle" class="small">或 Llama 3.1</text>
  <text x="850" y="166" text-anchor="middle" class="step">输出</text>
  <text x="850" y="184" text-anchor="middle" class="small">图像描述</text>
  <text x="850" y="200" text-anchor="middle" class="small">问答结果</text>
  <text x="850" y="216" text-anchor="middle" class="small">带思维链</text>

  <rect x="30" y="300" width="900" height="210" class="box"/>
  <text x="480" y="322" text-anchor="middle" class="head">级联系统与端到端系统的任务覆盖</text>

  <rect x="50" y="340" width="400" height="160" class="hot"/>
  <text x="250" y="362" text-anchor="middle" class="step">级联（Whisper -&gt; LLM）</text>
  <text x="250" y="384" text-anchor="middle" class="small">转写：支持</text>
  <text x="250" y="400" text-anchor="middle" class="small">总结：支持</text>
  <text x="250" y="416" text-anchor="middle" class="small">情绪：不支持</text>
  <text x="250" y="432" text-anchor="middle" class="small">音乐类型：不支持</text>
  <text x="250" y="448" text-anchor="middle" class="small">环境声音：不支持</text>
  <text x="250" y="464" text-anchor="middle" class="small">深度伪造：不支持</text>
  <text x="250" y="488" text-anchor="middle" class="caption">MMAU ~0.50</text>

  <rect x="470" y="340" width="440" height="160" class="cool"/>
  <text x="690" y="362" text-anchor="middle" class="step">端到端音频 LLM（AF3）</text>
  <text x="690" y="384" text-anchor="middle" class="small">级联系统的所有任务：支持</text>
  <text x="690" y="400" text-anchor="middle" class="small">情绪 / 心境：支持</text>
  <text x="690" y="416" text-anchor="middle" class="small">音乐 / 乐器：支持</text>
  <text x="690" y="432" text-anchor="middle" class="small">环境声音：支持</text>
  <text x="690" y="448" text-anchor="middle" class="small">时间定位：支持</text>
  <text x="690" y="464" text-anchor="middle" class="small">按需思维链：+3-5 分</text>
  <text x="690" y="488" text-anchor="middle" class="caption">MMAU 0.72（2025 年开放模型最佳水平）</text>
</svg>
