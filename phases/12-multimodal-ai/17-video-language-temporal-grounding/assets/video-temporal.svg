<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">视频 VLM — 帧采样、时间 token 与定位输出</text>

  <rect x="30" y="50" width="900" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">2023 至 2025 的三种架构模式</text>

  <rect x="50" y="90" width="280" height="160" class="hot"/>
  <text x="190" y="110" text-anchor="middle" class="step">Video-LLaMA (2023)</text>
  <text x="190" y="128" text-anchor="middle" class="small">Q-Former + 音频分支</text>
  <text x="190" y="144" text-anchor="middle" class="small">16 帧 @ 固定 2 FPS</text>
  <text x="190" y="160" text-anchor="middle" class="small">32 个视频 query、32 个音频 query</text>
  <text x="190" y="184" text-anchor="middle" class="step">优势：音频定位</text>
  <text x="190" y="204" text-anchor="middle" class="small">不足：固定 8s 片段</text>
  <text x="190" y="220" text-anchor="middle" class="small">无法定位事件时间</text>

  <rect x="340" y="90" width="280" height="160" class="cool"/>
  <text x="480" y="110" text-anchor="middle" class="step">Video-LLaVA (2023)</text>
  <text x="480" y="128" text-anchor="middle" class="small">MLP + 共享编码器</text>
  <text x="480" y="144" text-anchor="middle" class="small">8 帧 @ 1-2 FPS</text>
  <text x="480" y="160" text-anchor="middle" class="small">先对齐，再投影</text>
  <text x="480" y="184" text-anchor="middle" class="step">优势：简单且有效</text>
  <text x="480" y="204" text-anchor="middle" class="small">不足：仅支持短片段</text>
  <text x="480" y="220" text-anchor="middle" class="small">不支持动态帧率</text>

  <rect x="630" y="90" width="280" height="160" class="cold"/>
  <text x="770" y="110" text-anchor="middle" class="step">Qwen2.5-VL (2025)</text>
  <text x="770" y="128" text-anchor="middle" class="small">TMRoPE + 动态帧率</text>
  <text x="770" y="144" text-anchor="middle" class="small">任意时长</text>
  <text x="770" y="160" text-anchor="middle" class="small">绝对时间 M-RoPE</text>
  <text x="770" y="184" text-anchor="middle" class="step">优势：事件定位</text>
  <text x="770" y="204" text-anchor="middle" class="small">JSON 输出格式</text>
  <text x="770" y="220" text-anchor="middle" class="small">开放模型 SOTA 2026</text>

  <rect x="30" y="290" width="900" height="230" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">帧采样 + 输出格式</text>

  <rect x="60" y="330" width="260" height="170" class="reg"/>
  <text x="190" y="352" text-anchor="middle" class="step">帧采样策略</text>
  <text x="190" y="372" text-anchor="middle" class="small">均匀采样：N 帧 / 时长</text>
  <text x="190" y="388" text-anchor="middle" class="small">- 简单，但会错过动作峰值</text>
  <text x="190" y="408" text-anchor="middle" class="small">动态帧率：按动作幅度加权</text>
  <text x="190" y="424" text-anchor="middle" class="small">- 高动态片段采样更密集</text>
  <text x="190" y="444" text-anchor="middle" class="small">事件驱动：检测器 + 采样</text>
  <text x="190" y="460" text-anchor="middle" class="small">- 最适合动作识别</text>
  <text x="190" y="480" text-anchor="middle" class="caption">配合每帧 3x3 池化</text>

  <rect x="340" y="330" width="280" height="170" class="hot"/>
  <text x="480" y="352" text-anchor="middle" class="step">定位输出格式</text>
  <text x="480" y="372" text-anchor="middle" class="small">自由文本：</text>
  <text x="480" y="388" text-anchor="middle" class="small">"The cat jumps around 4s"</text>
  <text x="480" y="412" text-anchor="middle" class="small">JSON:</text>
  <text x="480" y="428" text-anchor="middle" class="small">{"event":"jump","start":4.1,"end":4.3}</text>
  <text x="480" y="452" text-anchor="middle" class="small">token:</text>
  <text x="480" y="468" text-anchor="middle" class="small">"&lt;time&gt;4.1&lt;/time&gt; jump"</text>
  <text x="480" y="488" text-anchor="middle" class="caption">JSON 最便于下游解析</text>

  <rect x="640" y="330" width="280" height="170" class="cool"/>
  <text x="780" y="352" text-anchor="middle" class="step">基准</text>
  <text x="780" y="372" text-anchor="middle" class="small">VideoMME：通用，2500 个样本</text>
  <text x="780" y="388" text-anchor="middle" class="small">TempCompass：之前/之后</text>
  <text x="780" y="404" text-anchor="middle" class="small">EgoSchema：3min 第一人称视频</text>
  <text x="780" y="420" text-anchor="middle" class="small">Video-MMMU：多学科</text>
  <text x="780" y="446" text-anchor="middle" class="step">开放模型 SOTA 2026</text>
  <text x="780" y="462" text-anchor="middle" class="small">Qwen2.5-VL-72B</text>
  <text x="780" y="478" text-anchor="middle" class="small">TMRoPE 是关键差异</text>
</svg>
