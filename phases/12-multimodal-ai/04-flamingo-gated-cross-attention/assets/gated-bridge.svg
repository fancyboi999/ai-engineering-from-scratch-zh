<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .frozen { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .train { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .gate { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Flamingo：在冻结的 70B Chinchilla LLM 内插入门控交叉注意力</text>

  <rect x="40" y="50" width="220" height="480" class="box"/>
  <text x="150" y="72" text-anchor="middle" class="head">图像 / 视频流水线</text>

  <rect x="60" y="92" width="180" height="50" class="frozen"/>
  <text x="150" y="114" text-anchor="middle" class="step">冻结的 ViT</text>
  <text x="150" y="130" text-anchor="middle" class="small">每张图像 196-900 个图像块</text>

  <path d="M 150 148 L 150 172" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="180" width="180" height="100" class="train"/>
  <text x="150" y="202" text-anchor="middle" class="step">Perceiver 重采样器</text>
  <text x="150" y="220" text-anchor="middle" class="small">K=64 个可学习潜变量</text>
  <text x="150" y="238" text-anchor="middle" class="small">对图像块执行交叉注意力</text>
  <text x="150" y="256" text-anchor="middle" class="small">6 个块、64M 参数</text>
  <text x="150" y="272" text-anchor="middle" class="small">固定输出 64 个 token</text>

  <path d="M 150 288 L 150 318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="328" width="180" height="60" class="cool"/>
  <text x="150" y="350" text-anchor="middle" class="step">64 个视觉 token</text>
  <text x="150" y="368" text-anchor="middle" class="small">每张图像（或每段视频）</text>

  <rect x="60" y="408" width="180" height="110" class="box"/>
  <text x="150" y="428" text-anchor="middle" class="head">可变输入</text>
  <text x="150" y="448" text-anchor="middle" class="small">图像：196 个图像块 -&gt; 64</text>
  <text x="150" y="464" text-anchor="middle" class="small">高分辨率：900 个图像块 -&gt; 64</text>
  <text x="150" y="482" text-anchor="middle" class="small">视频：T * 64</text>
  <text x="150" y="500" text-anchor="middle" class="small">输出形状：始终 K=64</text>

  <path d="M 265 350 L 340 350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="345" y="50" width="570" height="480" class="box"/>
  <text x="630" y="72" text-anchor="middle" class="head">冻结 LLM，插入门控交叉注意力</text>

  <rect x="365" y="92" width="530" height="52" class="frozen"/>
  <text x="630" y="114" text-anchor="middle" class="step">LLM 自注意力 + FFN（块 1-4）</text>
  <text x="630" y="132" text-anchor="middle" class="small">冻结的 Chinchilla 70B 层</text>

  <rect x="365" y="154" width="530" height="80" class="gate"/>
  <text x="630" y="176" text-anchor="middle" class="step">门控交叉注意力（训练）</text>
  <text x="390" y="200" class="small">y = tanh(alpha) * cross_attn(text, visual_tokens) + x</text>
  <text x="390" y="218" class="small">alpha 初始化为 0 -&gt; tanh(0) = 0 -&gt; 输出 == 输入</text>
  <text x="390" y="234" class="small">-&gt; 第 0 步保留 LLM 文本能力</text>

  <rect x="365" y="244" width="530" height="52" class="frozen"/>
  <text x="630" y="266" text-anchor="middle" class="step">LLM 自注意力 + FFN（块 5-8）</text>
  <text x="630" y="284" text-anchor="middle" class="small">文本 token 继续执行因果自注意力</text>

  <rect x="365" y="306" width="530" height="80" class="gate"/>
  <text x="630" y="328" text-anchor="middle" class="step">门控交叉注意力（训练）</text>
  <text x="390" y="352" class="small">随 alpha 增大，逐步混入视觉信息</text>
  <text x="390" y="370" class="small">训练结束时 alpha 为 O(1-2)、tanh 约 0.8</text>
  <text x="390" y="386" class="caption">每 M=4 个 LLM 层插入一次</text>

  <rect x="365" y="396" width="530" height="52" class="frozen"/>
  <text x="630" y="418" text-anchor="middle" class="step">LLM 自注意力 + FFN（块 9-12、...、N）</text>

  <rect x="365" y="458" width="530" height="60" class="cool"/>
  <text x="630" y="478" text-anchor="middle" class="step">交叉注意力层总数：N/4</text>
  <text x="630" y="496" text-anchor="middle" class="small">80 层的 70B LLM -&gt; 20 个门控连接桥</text>
  <text x="630" y="510" text-anchor="middle" class="small">可训练参数：约 10B / 总计 80B</text>
</svg>
