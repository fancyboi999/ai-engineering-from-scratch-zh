<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Qwen-VL 代际谱系 — 2023 至 2025</text>

  <line x1="60" y1="170" x2="920" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="180" class="small">2023</text>
  <text x="310" y="180" class="small">九月 2024</text>
  <text x="560" y="180" class="small">二月 2025</text>
  <text x="820" y="180" class="small">十一月 2025</text>

  <rect x="40" y="60" width="200" height="100" class="hot"/>
  <text x="140" y="82" text-anchor="middle" class="step">Qwen-VL</text>
  <text x="140" y="100" text-anchor="middle" class="small">OpenCLIP + Q-Former</text>
  <text x="140" y="116" text-anchor="middle" class="small">448x448 分辨率</text>
  <text x="140" y="132" text-anchor="middle" class="small">定位 + 边界框 token</text>
  <text x="140" y="148" text-anchor="middle" class="small">中文 + 英文多语言</text>

  <rect x="290" y="60" width="200" height="100" class="cool"/>
  <text x="390" y="82" text-anchor="middle" class="step">Qwen2-VL</text>
  <text x="390" y="100" text-anchor="middle" class="small">M-RoPE（3D 位置）</text>
  <text x="390" y="116" text-anchor="middle" class="small">原生动态分辨率</text>
  <text x="390" y="132" text-anchor="middle" class="small">仅用 MLP 投影器</text>
  <text x="390" y="148" text-anchor="middle" class="small">可变帧率视频</text>

  <rect x="540" y="60" width="200" height="100" class="cold"/>
  <text x="640" y="82" text-anchor="middle" class="step">Qwen2.5-VL</text>
  <text x="640" y="100" text-anchor="middle" class="small">动态帧率采样器</text>
  <text x="640" y="116" text-anchor="middle" class="small">绝对时间 M-RoPE</text>
  <text x="640" y="132" text-anchor="middle" class="small">窗口注意力 ViT</text>
  <text x="640" y="148" text-anchor="middle" class="small">JSON agent 模式</text>

  <rect x="790" y="60" width="140" height="100" class="reg"/>
  <text x="860" y="82" text-anchor="middle" class="step">Qwen3-VL</text>
  <text x="860" y="100" text-anchor="middle" class="small">Qwen3-72B 基座</text>
  <text x="860" y="116" text-anchor="middle" class="small">思考模式</text>
  <text x="860" y="132" text-anchor="middle" class="small">扩展 OCR 能力</text>
  <text x="860" y="148" text-anchor="middle" class="small">数据 + 规模</text>

  <rect x="30" y="210" width="900" height="140" class="box"/>
  <text x="480" y="232" text-anchor="middle" class="head">M-RoPE：一个位置，三个轴</text>

  <rect x="60" y="250" width="260" height="80" class="hot"/>
  <text x="190" y="270" text-anchor="middle" class="step">时间频段</text>
  <text x="190" y="288" text-anchor="middle" class="small">16 维（共 48 维）</text>
  <text x="190" y="304" text-anchor="middle" class="small">t=0 表示图像，t=frame 表示视频</text>
  <text x="190" y="322" text-anchor="middle" class="small">按 t * theta_i 旋转</text>

  <rect x="340" y="250" width="260" height="80" class="cool"/>
  <text x="470" y="270" text-anchor="middle" class="step">高度频段</text>
  <text x="470" y="288" text-anchor="middle" class="small">16 维</text>
  <text x="470" y="304" text-anchor="middle" class="small">h = 图像分块行索引</text>
  <text x="470" y="322" text-anchor="middle" class="small">按 h * theta_i 旋转</text>

  <rect x="620" y="250" width="280" height="80" class="cold"/>
  <text x="760" y="270" text-anchor="middle" class="step">宽度频段</text>
  <text x="760" y="288" text-anchor="middle" class="small">16 维</text>
  <text x="760" y="304" text-anchor="middle" class="small">w = 图像分块列索引</text>
  <text x="760" y="322" text-anchor="middle" class="small">按 w * theta_i 旋转</text>

  <rect x="30" y="370" width="900" height="160" class="box"/>
  <text x="480" y="392" text-anchor="middle" class="head">动态帧率：每段视频 token 数 = duration * fps * tokens_per_frame</text>

  <rect x="60" y="410" width="200" height="100" class="reg"/>
  <text x="160" y="430" text-anchor="middle" class="step">高动态场景</text>
  <text x="160" y="448" text-anchor="middle" class="small">网球、烹饪</text>
  <text x="160" y="464" text-anchor="middle" class="small">4-8 FPS</text>
  <text x="160" y="480" text-anchor="middle" class="small">事件密集</text>
  <text x="160" y="496" text-anchor="middle" class="small">约 19k token / 30s</text>

  <rect x="280" y="410" width="200" height="100" class="cool"/>
  <text x="380" y="430" text-anchor="middle" class="step">中动态场景</text>
  <text x="380" y="448" text-anchor="middle" class="small">对话、演示</text>
  <text x="380" y="464" text-anchor="middle" class="small">2-4 FPS</text>
  <text x="380" y="480" text-anchor="middle" class="small">均衡</text>
  <text x="380" y="496" text-anchor="middle" class="small">约 10k token / 30s</text>

  <rect x="500" y="410" width="200" height="100" class="cold"/>
  <text x="600" y="430" text-anchor="middle" class="step">低动态场景</text>
  <text x="600" y="448" text-anchor="middle" class="small">安防、讲座</text>
  <text x="600" y="464" text-anchor="middle" class="small">0.5-1 FPS</text>
  <text x="600" y="480" text-anchor="middle" class="small">长时间范围</text>
  <text x="600" y="496" text-anchor="middle" class="small">约 24k token / 10min</text>

  <rect x="720" y="410" width="200" height="100" class="hot"/>
  <text x="820" y="430" text-anchor="middle" class="step">agent 回放</text>
  <text x="820" y="448" text-anchor="middle" class="small">界面录屏</text>
  <text x="820" y="464" text-anchor="middle" class="small">2-4 FPS</text>
  <text x="820" y="480" text-anchor="middle" class="small">JSON 输出模式</text>
  <text x="820" y="496" text-anchor="middle" class="small">点击/滚动调用</text>
</svg>
