<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">STaR 自举循环（以及捷径如何混入）</text>

  <!-- Left: the loop -->
  <rect x="40" y="56" width="380" height="480" class="box"/>
  <text x="230" y="80" text-anchor="middle" class="label">STaR 循环</text>

  <rect x="60" y="100" width="340" height="56" class="cool"/>
  <text x="230" y="124" text-anchor="middle" class="content">1. 采样（推理过程、答案）</text>
  <text x="230" y="140" text-anchor="middle" class="small">基座模型，T &gt; 0</text>

  <path d="M230 160 L230 180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="186" width="340" height="56" class="hot"/>
  <text x="230" y="210" text-anchor="middle" class="content">2. 筛选：仅保留 answer == label</text>
  <text x="230" y="226" text-anchor="middle" class="small">完全丢弃错误推理过程</text>

  <path d="M230 246 L230 266" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="272" width="340" height="56" class="cool"/>
  <text x="230" y="296" text-anchor="middle" class="content">3. 对保留的推理过程进行 SFT</text>
  <text x="230" y="312" text-anchor="middle" class="small">在 (problem, rationale, answer) 上使用教师强制</text>

  <path d="M230 332 L230 352" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="358" width="340" height="56" class="cold"/>
  <text x="230" y="382" text-anchor="middle" class="content">4. 为失败案例补充推理</text>
  <text x="230" y="398" text-anchor="middle" class="small">注入答案，重新询问推理过程</text>

  <path d="M60 386 Q 20 386 20 140 Q 20 100 60 128" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="28" y="260" class="small">重复</text>

  <rect x="60" y="438" width="340" height="80" class="box"/>
  <text x="230" y="458" text-anchor="middle" class="label">循环强化的内容</text>
  <text x="230" y="478" text-anchor="middle" class="content">可靠推理 · 正确答案</text>
  <text x="230" y="494" text-anchor="middle" class="content">捷径推理 · 正确答案</text>
  <text x="230" y="510" text-anchor="middle" class="small">两者都保留。筛选器无法区分。</text>

  <!-- Right: three variants -->
  <rect x="450" y="56" width="410" height="480" class="box"/>
  <text x="655" y="80" text-anchor="middle" class="label">三种变体，三种信号形式</text>

  <rect x="470" y="100" width="372" height="106" class="cool"/>
  <text x="480" y="122" class="label">STaR (Zelikman 2022)</text>
  <text x="480" y="142" class="content">对生成器按答案正确性筛选。</text>
  <text x="480" y="158" class="content">重复进行 SFT。</text>
  <text x="480" y="174" class="content">GPT-J + STaR ≈ 微调后的 30 倍大模型</text>
  <text x="480" y="190" class="content">在 GSM8K 上（无需新增人工标签）。</text>

  <rect x="470" y="212" width="372" height="110" class="cold"/>
  <text x="480" y="234" class="label">V-STaR (Hosseini 2024)</text>
  <text x="480" y="254" class="content">同时用正确与错误推理过程</text>
  <text x="480" y="270" class="content">（STaR 丢弃的部分）进行 DPO 验证器训练。</text>
  <text x="480" y="286" class="content">推理时：采样 N 个，选择验证器最高分。</text>
  <text x="480" y="302" class="content">相比既有自改进方法提升 +4 至 +17 个百分点。</text>

  <rect x="470" y="328" width="372" height="110" class="hot"/>
  <text x="480" y="350" class="label">Quiet-STaR (Zelikman 2024)</text>
  <text x="480" y="370" class="content">每个 token 的内部推理。</text>
  <text x="480" y="386" class="content">思考结束 token + 混合头。</text>
  <text x="480" y="402" class="content">Mistral 7B GSM8K 5.9% -&gt; 10.9%</text>
  <text x="480" y="418" class="content">无需针对任务微调。</text>

  <rect x="470" y="444" width="372" height="84" class="box"/>
  <text x="480" y="466" class="label">共同弱点</text>
  <text x="480" y="486" class="content">三者都使用依赖答案的梯度。</text>
  <text x="480" y="502" class="content">捷径推理也能得到标签。</text>
  <text x="480" y="518" class="content">修正：过程奖励模型 + 分布外评测。</text>
</svg>
