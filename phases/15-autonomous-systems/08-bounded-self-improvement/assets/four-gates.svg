<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">有界自我改进的四项原语</text>

  <rect x="40" y="50" width="800" height="440" class="box"/>

  <!-- Proposed edit -->
  <rect x="80" y="80" width="140" height="60" class="cool"/>
  <text x="150" y="108" text-anchor="middle" class="label">待议修改</text>
  <text x="150" y="126" text-anchor="middle" class="small">来自自我改进循环</text>

  <!-- Four gate boxes -->
  <rect x="260" y="80" width="140" height="60" class="hot"/>
  <text x="330" y="102" text-anchor="middle" class="label">1. 不变量</text>
  <text x="330" y="120" text-anchor="middle" class="small">模块哈希、</text>
  <text x="330" y="134" text-anchor="middle" class="small">工具清单</text>

  <rect x="420" y="80" width="140" height="60" class="cold"/>
  <text x="490" y="102" text-anchor="middle" class="label">2. 对齐锚点</text>
  <text x="490" y="120" text-anchor="middle" class="small">章程哈希</text>
  <text x="490" y="134" text-anchor="middle" class="small">固定为只读</text>

  <rect x="580" y="80" width="140" height="60" class="dsk"/>
  <text x="650" y="102" text-anchor="middle" class="label">3. 多目标</text>
  <text x="650" y="120" text-anchor="middle" class="small">性能 + 安全 +</text>
  <text x="650" y="134" text-anchor="middle" class="small">公平性 + 稳健性</text>

  <rect x="740" y="80" width="90" height="60" class="cool"/>
  <text x="785" y="102" text-anchor="middle" class="label">4. 回归</text>
  <text x="785" y="120" text-anchor="middle" class="small">逐维度</text>
  <text x="785" y="134" text-anchor="middle" class="small">检查历史</text>

  <!-- Arrows left-to-right -->
  <path d="M220 110 L260 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 110 L420 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 110 L580 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 110 L740 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- What each catches -->
  <rect x="260" y="170" width="140" height="90" class="box"/>
  <text x="330" y="190" text-anchor="middle" class="label">捕获</text>
  <text x="330" y="210" text-anchor="middle" class="small">夹带的工具</text>
  <text x="330" y="225" text-anchor="middle" class="small">未授权 API</text>
  <text x="330" y="240" text-anchor="middle" class="small">评估器修改</text>
  <text x="330" y="255" text-anchor="middle" class="small">（DGM 案例）</text>

  <rect x="420" y="170" width="140" height="90" class="box"/>
  <text x="490" y="190" text-anchor="middle" class="label">捕获</text>
  <text x="490" y="210" text-anchor="middle" class="small">目标漂移</text>
  <text x="490" y="225" text-anchor="middle" class="small">重新解释</text>
  <text x="490" y="240" text-anchor="middle" class="small">章程</text>
  <text x="490" y="255" text-anchor="middle" class="small">文本修改</text>

  <rect x="580" y="170" width="140" height="90" class="box"/>
  <text x="650" y="190" text-anchor="middle" class="label">捕获</text>
  <text x="650" y="210" text-anchor="middle" class="small">单维度</text>
  <text x="650" y="225" text-anchor="middle" class="small">优化</text>
  <text x="650" y="240" text-anchor="middle" class="small">安全下降而</text>
  <text x="650" y="255" text-anchor="middle" class="small">性能上升</text>

  <rect x="740" y="170" width="90" height="90" class="box"/>
  <text x="785" y="190" text-anchor="middle" class="label">捕获</text>
  <text x="785" y="210" text-anchor="middle" class="small">静默的</text>
  <text x="785" y="225" text-anchor="middle" class="small">能力</text>
  <text x="785" y="240" text-anchor="middle" class="small">下降被吞入</text>
  <text x="785" y="255" text-anchor="middle" class="small">移动平均</text>

  <!-- Information-theoretic limit box -->
  <rect x="80" y="290" width="740" height="78" class="hot"/>
  <text x="100" y="312" class="label">信息论上限</text>
  <text x="100" y="332" class="content">Kolmogorov 复杂度限制系统能对其后继证明什么。</text>
  <text x="100" y="350" class="content">Löb 定理：系统可以依据“应该行动”而行动，却无法证明它应该行动。</text>
  <text x="100" y="365" class="content">这些是缓解措施，不是安全证明。</text>

  <!-- Accept/reject -->
  <rect x="80" y="388" width="360" height="80" class="cool"/>
  <text x="260" y="412" text-anchor="middle" class="label">四道门禁全部通过后才落地修改</text>
  <text x="260" y="432" text-anchor="middle" class="content">任一道门禁失败 -&gt; 拒绝修改</text>
  <text x="260" y="450" text-anchor="middle" class="small">回归门禁 + 对临界拒绝项进行人工复核</text>

  <rect x="460" y="388" width="360" height="80" class="hot"/>
  <text x="640" y="412" text-anchor="middle" class="label">生产现实（RSI Workshop 2026）</text>
  <text x="640" y="432" text-anchor="middle" class="content">实验室只实现部分机制；完整栈少见</text>
  <text x="640" y="450" text-anchor="middle" class="small">Meta HyperAgents、SAHOO（2026 年三月）为部分参考</text>
</svg>
