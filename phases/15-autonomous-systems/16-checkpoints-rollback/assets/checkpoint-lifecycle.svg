<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">检查点生命周期：幂等性 + 前置条件 + 验证 + 回滚</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Approved action -->
  <rect x="60" y="80" width="160" height="60" class="cool"/>
  <text x="140" y="104" text-anchor="middle" class="label">已批准操作</text>
  <text x="140" y="122" text-anchor="middle" class="small">幂等键 k</text>

  <!-- Preconditions -->
  <rect x="240" y="80" width="160" height="60" class="cold"/>
  <text x="320" y="104" text-anchor="middle" class="label">前置条件检查</text>
  <text x="320" y="122" text-anchor="middle" class="small">状态是否仍然一致？</text>

  <!-- Mark-as-done-first -->
  <rect x="420" y="80" width="180" height="60" class="warn"/>
  <text x="510" y="104" text-anchor="middle" class="label">先标记完成</text>
  <text x="510" y="122" text-anchor="middle" class="small">执行前持久化 "committed"</text>

  <!-- Execute -->
  <rect x="620" y="80" width="180" height="60" class="hot"/>
  <text x="710" y="104" text-anchor="middle" class="label">执行有副作用的操作</text>
  <text x="710" y="122" text-anchor="middle" class="small">工具调用 / 数据库写入 / 发送</text>

  <path d="M220 110 L240 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 110 L420 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 110 L620 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verify -->
  <rect x="60" y="180" width="160" height="60" class="cool"/>
  <text x="140" y="204" text-anchor="middle" class="label">操作后验证</text>
  <text x="140" y="222" text-anchor="middle" class="small">重新读取目标资源</text>

  <rect x="240" y="180" width="160" height="60" class="cool"/>
  <text x="320" y="204" text-anchor="middle" class="label">验证通过</text>
  <text x="320" y="222" text-anchor="middle" class="small">完成</text>

  <rect x="420" y="180" width="180" height="60" class="hot"/>
  <text x="510" y="204" text-anchor="middle" class="label">验证失败</text>
  <text x="510" y="222" text-anchor="middle" class="small">发现已知错误状态</text>

  <rect x="620" y="180" width="180" height="60" class="hot"/>
  <text x="710" y="204" text-anchor="middle" class="label">触发回滚</text>
  <text x="710" y="222" text-anchor="middle" class="small">原路回滚 / 补偿操作 / 告警</text>

  <path d="M220 210 L240 210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 210 L620 210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Double-execute hazard -->
  <rect x="60" y="270" width="760" height="100" class="hot"/>
  <text x="440" y="294" text-anchor="middle" class="label">严重失败：崩溃后重试导致重复执行</text>
  <text x="80" y="316" class="content">1. 开始提交 · 2. 执行成功 · 3. 持久化 "committed" 前崩溃</text>
  <text x="80" y="332" class="content">4. 恢复后看到“已批准、未提交”· 5. 再次执行 · 6. 副作用发生两次</text>
  <text x="80" y="352" class="content">缓解：执行前持久化 "committed"（“先标记完成”模式）</text>

  <!-- Article 14 -->
  <rect x="60" y="400" width="760" height="90" class="cold"/>
  <text x="440" y="424" text-anchor="middle" class="label">欧盟《人工智能法案》第 14 条：运行层面的解读</text>
  <text x="80" y="446" class="content">检查点可查询（审计员可访问，而非仅有日志）</text>
  <text x="80" y="462" class="content">已演练回滚（端到端测试，而非文档意图）</text>
  <text x="80" y="478" class="content">审计轨迹跨部署保留（PostgreSQL 或 Durable Objects，而非内存）</text>
</svg>
