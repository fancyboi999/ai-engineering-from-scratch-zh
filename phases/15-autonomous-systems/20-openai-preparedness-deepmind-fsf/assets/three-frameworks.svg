<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三种扩展策略，同一能力，三种分类</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Column headers -->
  <rect x="60" y="80" width="250" height="36" class="cool"/>
  <text x="185" y="104" text-anchor="middle" class="label">OpenAI PF v2（四月 2025）</text>

  <rect x="320" y="80" width="240" height="36" class="cold"/>
  <text x="440" y="104" text-anchor="middle" class="label">Anthropic RSP v3.0（二月 2026）</text>

  <rect x="570" y="80" width="250" height="36" class="warn"/>
  <text x="695" y="104" text-anchor="middle" class="label">DeepMind FSF v3（九月 2025 + 四月 2026）</text>

  <!-- Long-range Autonomy row -->
  <rect x="60" y="130" width="760" height="46" class="box"/>
  <text x="76" y="152" class="label">长期自主性</text>
  <text x="76" y="170" class="content">OpenAI：研究项（不触发门槛）· Anthropic：具名能力；到达阈值需肯定性论证 · DeepMind：并入机器学习研发 / 网络安全</text>

  <!-- Undermining safeguards -->
  <rect x="60" y="184" width="760" height="46" class="box"/>
  <text x="76" y="206" class="label">破坏安全防护</text>
  <text x="76" y="224" class="content">OpenAI：研究项 · Anthropic：硬编码禁止（拒绝）· DeepMind：欺骗性对齐监测</text>

  <!-- R&D automation -->
  <rect x="60" y="238" width="760" height="46" class="box"/>
  <text x="76" y="260" class="label">研发自动化</text>
  <text x="76" y="278" class="content">OpenAI：跟踪项 · Anthropic：AI 研发-4 阈值（肯定性论证）· DeepMind：机器学习研发自主等级 1（TCL，四月 2026）</text>

  <!-- Sandbagging -->
  <rect x="60" y="292" width="760" height="46" class="box"/>
  <text x="76" y="314" class="label">故意压低表现</text>
  <text x="76" y="332" class="content">OpenAI：研究项 · Anthropic：通过评测环境差距处理 · DeepMind：欺骗性对齐监测（工具性推理）</text>

  <!-- Cyber uplift -->
  <rect x="60" y="346" width="760" height="46" class="box"/>
  <text x="76" y="368" class="label">网络安全能力提升</text>
  <text x="76" y="386" class="content">OpenAI：跟踪项 · Anthropic：ASL-3 触发（安全 + 部署）· DeepMind：网络安全 CCL</text>

  <!-- Convergence note -->
  <rect x="60" y="400" width="760" height="90" class="hot"/>
  <text x="440" y="424" text-anchor="middle" class="label">趋同与差异</text>
  <text x="80" y="446" class="content">趋同：内部安全咨询组、将欺骗性对齐列为具名风险类别、持续维护产物</text>
  <text x="80" y="462" class="content">差异：仅 PF v2 区分跟踪项与研究项；DeepMind 合并自主性；Anthropic 移除暂停条款</text>
  <text x="80" y="478" class="content">测量依赖：只有能力测量无法被操纵，这三套框架才能发挥作用</text>
</svg>
