<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">RSP v2（2023）→ v3.0（2026 年二月 24 日）：变化</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Two columns: additions / removals -->
  <rect x="60" y="80" width="370" height="280" class="cool"/>
  <text x="245" y="104" text-anchor="middle" class="label">v3.0 新增</text>
  <text x="76" y="126" class="content">• 两层缓解计划</text>
  <text x="76" y="142" class="small">  （Anthropic 单方承诺与行业建议）</text>
  <text x="76" y="162" class="content">• AI R&amp;D-4 阈值（研究自动化）</text>
  <text x="76" y="178" class="small">  一旦跨越：发布正面安全论证</text>
  <text x="76" y="198" class="content">• 前沿安全路线图（持续维护文档）</text>
  <text x="76" y="214" class="content">• 风险报告（持续维护、回顾性文档）</text>
  <text x="76" y="234" class="content">• 引用 RAND SL-4 安全标准</text>
  <text x="76" y="250" class="small">  （位于行业建议层）</text>
  <text x="76" y="270" class="content">• 承认：“有把握地排除</text>
  <text x="76" y="286" class="content">   AI R&amp;D-4 正变得困难”</text>
  <text x="76" y="318" class="small">v3.0 公告指出，该阈值已是现实问题</text>
  <text x="76" y="334" class="small">即使对当代 Claude Opus 4.6 也是如此</text>

  <rect x="450" y="80" width="370" height="280" class="hot"/>
  <text x="635" y="104" text-anchor="middle" class="label">v3.0 删除或弱化</text>
  <text x="466" y="126" class="content">• 删除 2023 年暂停承诺</text>
  <text x="466" y="142" class="small">  （移除明确的训练暂停条款）</text>
  <text x="466" y="162" class="content">• 定量阈值弱化为</text>
  <text x="466" y="178" class="small">  定性判断</text>
  <text x="466" y="198" class="content">• 具体缓解措施替换为</text>
  <text x="466" y="214" class="content">  “正面安全论证”表述</text>
  <text x="466" y="234" class="content">• 独立审查仍较弱</text>
  <text x="466" y="250" class="small">  （主要依赖内部安全咨询组）</text>
  <text x="466" y="270" class="content">• 行业建议层允许</text>
  <text x="466" y="286" class="content">  仅倡导政策，而不作出承诺</text>

  <!-- SaferAI rating -->
  <rect x="60" y="380" width="760" height="110" class="warn"/>
  <text x="440" y="404" text-anchor="middle" class="label">SaferAI 独立评级</text>
  <text x="80" y="426" class="content">v2（2023）：2.2，适中</text>
  <text x="80" y="442" class="content">v3.0（2026）：1.9，较弱（与 OpenAI Preparedness、DeepMind FSF 同属“较弱”）</text>
  <text x="80" y="462" class="content">降级原因：定性阈值、移除暂停承诺、独立监督有限</text>
  <text x="80" y="482" class="small">政策表述更加精致，要求却更宽松；需要仔细阅读。</text>
</svg>
