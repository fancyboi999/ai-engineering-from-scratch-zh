<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">提议 → 展示 → 提交 → 验证（四步缺一不可）</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Phases -->
  <rect x="60" y="80" width="170" height="90" class="cool"/>
  <text x="145" y="104" text-anchor="middle" class="label">1. 提议</text>
  <text x="76" y="126" class="small">意图 + 来源链 +</text>
  <text x="76" y="142" class="small">权限 + 影响范围 +</text>
  <text x="76" y="158" class="small">回滚 + 幂等性</text>

  <rect x="250" y="80" width="170" height="90" class="cold"/>
  <text x="335" y="104" text-anchor="middle" class="label">2. 展示</text>
  <text x="266" y="126" class="small">持久存储</text>
  <text x="266" y="142" class="small">(PostgreSQL, Redis,</text>
  <text x="266" y="158" class="small">Durable Object)</text>

  <rect x="440" y="80" width="170" height="90" class="cool"/>
  <text x="525" y="104" text-anchor="middle" class="label">3. 提交</text>
  <text x="456" y="126" class="small">质询与回应</text>
  <text x="456" y="142" class="small">检查清单、明确确认</text>
  <text x="456" y="158" class="small">幂等地重新执行</text>

  <rect x="630" y="80" width="170" height="90" class="cool"/>
  <text x="715" y="104" text-anchor="middle" class="label">4. 验证</text>
  <text x="646" y="126" class="small">重新读取目标</text>
  <text x="646" y="142" class="small">确认副作用</text>
  <text x="646" y="158" class="small">不一致时告警</text>

  <path d="M230 125 L250 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420 125 L440 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M610 125 L630 125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rubber stamp vs checklist -->
  <rect x="60" y="200" width="360" height="140" class="hot"/>
  <text x="240" y="224" text-anchor="middle" class="label">走过场审批（无法通过审计）</text>
  <text x="76" y="248" class="content">只有一个“批准？”按钮</text>
  <text x="76" y="264" class="content">不展示结构化元数据</text>
  <text x="76" y="280" class="content">审查者不到 1s 就点击</text>
  <text x="76" y="296" class="content">批准与结果毫无预测关系</text>
  <text x="76" y="320" class="small">欧盟 AI 法案第 14 条明确要求：有效人工监督</text>
  <text x="76" y="334" class="small">排除走过场的模式。</text>

  <rect x="460" y="200" width="360" height="140" class="cool"/>
  <text x="640" y="224" text-anchor="middle" class="label">质询与回应（可通过）</text>
  <text x="476" y="248" class="content">[ ] 我理解这会影响什么</text>
  <text x="476" y="264" class="content">[ ] 我已核实影响范围</text>
  <text x="476" y="280" class="content">[ ] 我有回滚计划</text>
  <text x="476" y="296" class="content">三项全部勾选后才可批准</text>
  <text x="476" y="320" class="small">Anthropic 与 MS 合规文档均有说明；</text>
  <text x="476" y="334" class="small">欧盟 AI 法案第 14 条要求高风险系统采用此方式。</text>

  <!-- Idempotency detail -->
  <rect x="60" y="370" width="760" height="120" class="cold"/>
  <text x="440" y="394" text-anchor="middle" class="label">幂等键 = hash(thread_id, action, payload)</text>
  <text x="80" y="416" class="content">propose(P) + propose(P) -&gt; 同一条记录（不重复）</text>
  <text x="80" y="432" class="content">commit(k) + commit(k) -&gt; 仅执行一次，后续提交不再操作</text>
  <text x="80" y="448" class="content">临时故障后重试：复用 Stripe/AWS 式幂等性进行 agent 审批</text>
  <text x="80" y="468" class="content">键中的时钟时间是日志时间戳，不是幂等键</text>
  <text x="80" y="484" class="small">LangGraph interrupt() · MS RequestInfoEvent · Cloudflare waitForApproval() — 形态相同，名称不同</text>
</svg>
