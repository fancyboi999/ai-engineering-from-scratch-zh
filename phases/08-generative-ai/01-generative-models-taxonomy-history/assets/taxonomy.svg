<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">生成模型的五大家族</text>
  <text x="450" y="50" text-anchor="middle" class="caption">按建模对象与采样方式划分</text>

  <rect x="380" y="70" width="140" height="44" class="box"/>
  <text x="450" y="90" text-anchor="middle" class="label">p_data(x)</text>
  <text x="450" y="106" text-anchor="middle" class="caption">分布未知，需要采样器</text>

  <line x1="450" y1="114" x2="180" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="340" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="500" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="660" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="820" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="155" width="230" height="180" class="box"/>
  <text x="175" y="178" text-anchor="middle" class="label">1. 显式、可精确计算</text>
  <text x="175" y="200" text-anchor="middle" class="mono">p(x) = &#8719; p(x_i | x_&lt;i)</text>
  <text x="175" y="225" text-anchor="middle" class="content">自回归：GPT、PixelCNN</text>
  <text x="175" y="245" text-anchor="middle" class="content">流模型：Glow、RealNVP</text>
  <text x="175" y="275" text-anchor="middle" class="caption">精确 log p(x)</text>
  <text x="175" y="293" text-anchor="middle" class="caption">顺序推理较慢</text>
  <text x="175" y="311" text-anchor="middle" class="caption">架构受限（流模型）</text>

  <rect x="305" y="155" width="230" height="180" class="hot"/>
  <text x="420" y="178" text-anchor="middle" class="label">2. 显式、近似计算</text>
  <text x="420" y="200" text-anchor="middle" class="mono">最大化 ELBO ≤ log p(x)</text>
  <text x="420" y="225" text-anchor="middle" class="content">VAE：编码器 + 解码器</text>
  <text x="420" y="245" text-anchor="middle" class="content">扩散：DDPM、SD3</text>
  <text x="420" y="275" text-anchor="middle" class="caption">2026 年占主流</text>
  <text x="420" y="293" text-anchor="middle" class="caption">迭代采样（20-50 步）</text>
  <text x="420" y="311" text-anchor="middle" class="caption">可扩展至文本、图像、视频、3D</text>

  <rect x="550" y="155" width="230" height="180" class="box"/>
  <text x="665" y="178" text-anchor="middle" class="label">3. 隐式密度</text>
  <text x="665" y="200" text-anchor="middle" class="mono">G(z) -> x,  D(x) -> real/fake</text>
  <text x="665" y="225" text-anchor="middle" class="content">GAN, StyleGAN, Pix2Pix</text>
  <text x="665" y="255" text-anchor="middle" class="caption">一次采样</text>
  <text x="665" y="273" text-anchor="middle" class="caption">完全没有 log p(x)</text>
  <text x="665" y="291" text-anchor="middle" class="caption">训练不稳定，模式坍塌</text>
  <text x="665" y="309" text-anchor="middle" class="caption">特定写实场景仍领先</text>

  <rect x="60" y="350" width="350" height="150" class="box"/>
  <text x="235" y="373" text-anchor="middle" class="label">4. 分数 / 连续时间</text>
  <text x="235" y="395" text-anchor="middle" class="mono">学习 s(x) = ∇_x log p(x)</text>
  <text x="235" y="418" text-anchor="middle" class="content">分数 SDE、流匹配</text>
  <text x="235" y="438" text-anchor="middle" class="content">修正流、一致性模型</text>
  <text x="235" y="465" text-anchor="middle" class="caption">无模拟训练</text>
  <text x="235" y="483" text-anchor="middle" class="caption">直线路径 =&gt; 1-4 步采样</text>

  <rect x="430" y="350" width="350" height="150" class="box"/>
  <text x="605" y="373" text-anchor="middle" class="label">5. token + 自回归 transformer</text>
  <text x="605" y="395" text-anchor="middle" class="mono">VQ-VAE + 基于 token 的 transformer</text>
  <text x="605" y="418" text-anchor="middle" class="content">DALL-E 1, Parti, MuseNet</text>
  <text x="605" y="438" text-anchor="middle" class="content">AudioLM、VALL-E、MusicGen、Sora 分块</text>
  <text x="605" y="465" text-anchor="middle" class="caption">复用 LLM 技术栈</text>
  <text x="605" y="483" text-anchor="middle" class="caption">质量受分词器上限约束</text>
</svg>
