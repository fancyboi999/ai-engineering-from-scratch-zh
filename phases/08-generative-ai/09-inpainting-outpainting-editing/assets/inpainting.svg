<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cold { fill: #eaf4ff; stroke: #2c5f8c; stroke-width: 1.5; }
      .mask { fill: #2c3e50; stroke: #1a1a1a; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">局部重绘、画布外扩与 SDEdit</text>

  <!-- inpainting panel -->
  <text x="165" y="70" text-anchor="middle" class="label">局部重绘</text>
  <rect x="40" y="80" width="250" height="130" class="box"/>
  <rect x="55" y="95" width="220" height="100" class="cold"/>
  <rect x="120" y="120" width="80" height="50" class="mask"/>
  <text x="160" y="230" text-anchor="middle" class="caption">内部掩码，外部固定</text>
  <text x="160" y="248" text-anchor="middle" class="caption">9 通道 U-Net：</text>
  <text x="160" y="264" text-anchor="middle" class="mono">noisy | encoded_src | mask</text>

  <!-- outpainting -->
  <text x="450" y="70" text-anchor="middle" class="label">画布外扩</text>
  <rect x="310" y="80" width="260" height="130" class="box"/>
  <rect x="410" y="110" width="70" height="70" class="cold"/>
  <rect x="325" y="95" width="85" height="100" class="mask"/>
  <rect x="480" y="95" width="85" height="100" class="mask"/>
  <text x="450" y="230" text-anchor="middle" class="caption">反转掩码</text>
  <text x="450" y="248" text-anchor="middle" class="caption">扩展至画布之外</text>
  <text x="450" y="264" text-anchor="middle" class="caption">相同模型，相同损失</text>

  <!-- SDEdit -->
  <text x="720" y="70" text-anchor="middle" class="label">SDEdit（无需重训）</text>
  <rect x="590" y="80" width="270" height="130" class="box"/>
  <text x="725" y="110" text-anchor="middle" class="mono">x_0 -&gt; 加噪到 t -&gt; 去噪</text>
  <text x="725" y="135" text-anchor="middle" class="caption">t/T = 0.3 → 轻微修改</text>
  <text x="725" y="153" text-anchor="middle" class="caption">t/T = 0.6 → 中等修改</text>
  <text x="725" y="171" text-anchor="middle" class="caption">t/T = 0.9 → 接近随机</text>
  <text x="725" y="195" text-anchor="middle" class="caption">无掩码，仅调整噪声级别</text>

  <!-- pipeline flow -->
  <rect x="40" y="310" width="820" height="100" class="hot"/>
  <text x="450" y="335" text-anchor="middle" class="label">局部重绘推理循环</text>
  <text x="450" y="358" text-anchor="middle" class="mono">for t = T .. 1:  x_t[masked] = denoise;  x_t[unmasked] = noise(clean_source, t)</text>
  <text x="450" y="380" text-anchor="middle" class="caption">每步用重新前向加噪的干净图像替换未掩码区域</text>
  <text x="450" y="398" text-anchor="middle" class="caption">最后一步：未掩码像素与原始干净图像严格一致</text>

  <!-- tools -->
  <rect x="40" y="425" width="820" height="60" class="box"/>
  <text x="450" y="448" text-anchor="middle" class="label">2026 年编辑技术栈</text>
  <text x="450" y="470" text-anchor="middle" class="caption">SAM 2 掩码 → SD-Inpaint / Flux-Fill / GPT-Image Edit → Flux-Kontext 指令编辑</text>
</svg>
