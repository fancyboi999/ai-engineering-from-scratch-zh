<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cold { fill: #eaf4ff; stroke: #2c5f8c; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">生成模型评估的三支柱</text>

  <!-- FID column -->
  <rect x="30" y="60" width="270" height="200" class="box"/>
  <text x="165" y="85" text-anchor="middle" class="label">FID（样本质量）</text>
  <text x="165" y="110" text-anchor="middle" class="mono">||&#956;_r - &#956;_g||&#178; + Tr(&#931;_r + &#931;_g - 2&#8730;&#931;_r&#931;_g)</text>
  <text x="165" y="140" text-anchor="middle" class="caption">Fréchet 距离，比较</text>
  <text x="165" y="158" text-anchor="middle" class="caption">Inception-v3 空间中的高斯拟合</text>
  <text x="165" y="188" text-anchor="middle" class="caption">使用 N ≥ 10k，否则数值不可信</text>
  <text x="165" y="206" text-anchor="middle" class="caption">受 ImageNet 偏差影响；分布外使用 FD-DINO</text>
  <text x="165" y="224" text-anchor="middle" class="caption">或 CMMD</text>
  <text x="165" y="252" text-anchor="middle" class="caption">越低越好</text>

  <!-- CLIP column -->
  <rect x="315" y="60" width="270" height="200" class="box"/>
  <text x="450" y="85" text-anchor="middle" class="label">CLIP 评分（遵循程度）</text>
  <text x="450" y="110" text-anchor="middle" class="mono">cos( CLIP_image(x), CLIP_text(p) )</text>
  <text x="450" y="140" text-anchor="middle" class="caption">输出与 prompt 有多匹配？</text>
  <text x="450" y="170" text-anchor="middle" class="caption">组合性失败可能漏检</text>
  <text x="450" y="188" text-anchor="middle" class="caption">短 prompt 会机械地获得更高分</text>
  <text x="450" y="206" text-anchor="middle" class="caption">CMMD + VQA 测试弥补 CLIP 盲点</text>
  <text x="450" y="252" text-anchor="middle" class="caption">越高越好</text>

  <!-- preference column -->
  <rect x="600" y="60" width="270" height="200" class="box"/>
  <text x="735" y="85" text-anchor="middle" class="label">人类偏好（真实标准）</text>
  <text x="735" y="110" text-anchor="middle" class="mono">由成对胜负计算 Elo</text>
  <text x="735" y="140" text-anchor="middle" class="caption">同一 prompt 上对比 A 与 B</text>
  <text x="735" y="158" text-anchor="middle" class="caption">HPSv2 / ImageReward / PickScore</text>
  <text x="735" y="188" text-anchor="middle" class="caption">作为自动代理指标</text>
  <text x="735" y="206" text-anchor="middle" class="caption">Chatbot Arena 形式的图像擂台</text>
  <text x="735" y="252" text-anchor="middle" class="caption">胜率越高越好</text>

  <!-- failure modes -->
  <rect x="30" y="285" width="840" height="100" class="hot"/>
  <text x="450" y="310" text-anchor="middle" class="label">每个指标都有已知投机方式</text>
  <text x="450" y="333" text-anchor="middle" class="caption">FID：过拟合 Inception 先验 → FID 降低，质量不变</text>
  <text x="450" y="353" text-anchor="middle" class="caption">CLIP：堆砌“masterpiece, 4k”→ 分数虚高</text>
  <text x="450" y="373" text-anchor="middle" class="caption">偏好：prompt 集与训练重叠 → 结果失真</text>

  <!-- production report -->
  <rect x="30" y="410" width="840" height="100" class="cold"/>
  <text x="450" y="435" text-anchor="middle" class="label">生产评估报告</text>
  <text x="450" y="458" text-anchor="middle" class="caption">1. 在 10-30k 样本上测 FID + 2. 同一批样本测 CLIP / CMMD +</text>
  <text x="450" y="478" text-anchor="middle" class="caption">3. 200+ 次盲评配对 Elo + 4. 人工审计 50 个输出的失败</text>
  <text x="450" y="498" text-anchor="middle" class="caption">单一指标是宣传；四项组合才是证据</text>
</svg>
