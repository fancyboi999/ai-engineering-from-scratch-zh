<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">Q-learning 与 SARSA：只差一行代码</text>

  <rect x="40" y="60" width="820" height="70" class="box"/>
  <text x="60" y="85" class="label">状态转移</text>
  <text x="60" y="108" class="content">(s, a) --env.step--&gt; (r, s')（单步、在线，无须回合边界）</text>

  <rect x="40" y="150" width="400" height="180" class="hot"/>
  <text x="240" y="175" text-anchor="middle" class="label">Q-learning（离策略）</text>
  <text x="60" y="205" class="content">target = r + gamma * max_{a'} Q(s', a')</text>
  <text x="60" y="228" class="content">Q(s, a) += alpha * (target - Q(s, a))</text>
  <text x="60" y="260" class="caption">假定从 s' 开始采用贪心策略</text>
  <text x="60" y="278" class="caption">探索时仍学习 Q*</text>
  <text x="60" y="300" class="caption">最大化偏差：高估带噪声的 Q</text>
  <text x="60" y="320" class="caption">深度版本：DQN</text>

  <rect x="460" y="150" width="400" height="180" class="cool"/>
  <text x="660" y="175" text-anchor="middle" class="label">SARSA（同策略）</text>
  <text x="480" y="205" class="content">a' = epsilon_greedy(Q, s')</text>
  <text x="480" y="228" class="content">target = r + gamma * Q(s', a')</text>
  <text x="480" y="251" class="content">Q(s, a) += alpha * (target - Q(s, a))</text>
  <text x="480" y="283" class="caption">使用实际执行的动作</text>
  <text x="480" y="301" class="caption">学习当前 epsilon-greedy 的 Q^pi</text>
  <text x="480" y="319" class="caption">在悬崖或危险附近更保守</text>

  <rect x="40" y="350" width="820" height="70" class="box"/>
  <text x="450" y="375" text-anchor="middle" class="label">相同结构：target - Q(s,a)，再乘 alpha</text>
  <text x="450" y="398" text-anchor="middle" class="caption">唯一符号差异：max 与采样 a'；对应离策略与同策略</text>

  <text x="450" y="450" text-anchor="middle" class="caption">阶段 9 后续内容都是这两种更新的深度函数近似变体</text>
</svg>
