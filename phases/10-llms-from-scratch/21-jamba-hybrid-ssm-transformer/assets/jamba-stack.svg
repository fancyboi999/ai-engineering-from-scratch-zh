<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .mamba { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.2; }
      .attn { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.2; }
      .moe { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 11px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Jamba：每 7 层 Mamba 配 1 层 Transformer，交替使用 MoE</text>

  <!-- One Jamba block (8 layers) -->
  <rect x="60" y="50" width="280" height="480" class="box"/>
  <text x="200" y="72" text-anchor="middle" class="head">一个 Jamba 模块（8 层）</text>

  <!-- 7 Mamba + 1 Attention, MoE on alternating -->
  <rect x="80" y="90" width="240" height="44" class="mamba"/>
  <text x="200" y="110" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="126" text-anchor="middle" class="small">+ MoE 路由器</text>

  <rect x="80" y="140" width="240" height="44" class="mamba"/>
  <text x="200" y="160" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="176" text-anchor="middle" class="small">稠密 MLP</text>

  <rect x="80" y="190" width="240" height="44" class="mamba"/>
  <text x="200" y="210" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="226" text-anchor="middle" class="small">+ MoE 路由器</text>

  <rect x="80" y="240" width="240" height="44" class="mamba"/>
  <text x="200" y="260" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="276" text-anchor="middle" class="small">稠密 MLP</text>

  <rect x="80" y="290" width="240" height="44" class="mamba"/>
  <text x="200" y="310" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="326" text-anchor="middle" class="small">+ MoE 路由器</text>

  <rect x="80" y="340" width="240" height="44" class="mamba"/>
  <text x="200" y="360" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="376" text-anchor="middle" class="small">稠密 MLP</text>

  <rect x="80" y="390" width="240" height="44" class="mamba"/>
  <text x="200" y="410" text-anchor="middle" class="step">Mamba (SSM)</text>
  <text x="200" y="426" text-anchor="middle" class="small">+ MoE 路由器</text>

  <rect x="80" y="440" width="240" height="44" class="attn"/>
  <text x="200" y="460" text-anchor="middle" class="step">Transformer（注意力）</text>
  <text x="200" y="476" text-anchor="middle" class="small">稠密 MLP</text>

  <text x="200" y="510" text-anchor="middle" class="caption">将此模块重复 N 次</text>

  <!-- Memory comparison -->
  <rect x="380" y="50" width="540" height="220" class="box"/>
  <text x="650" y="72" text-anchor="middle" class="head">256k 上下文的内存占用（BF16）</text>

  <text x="400" y="104" class="step">纯 Transformer MHA 32L</text>
  <text x="680" y="104" class="step" fill="#c0392b">128 GB</text>
  <rect x="400" y="110" width="495" height="14" fill="#c0392b"/>

  <text x="400" y="144" class="step">纯 Transformer GQA(8) 32L</text>
  <text x="680" y="144" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="150" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="184" class="step">Jamba 1:3 混合架构 32L</text>
  <text x="680" y="184" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="190" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="224" class="step">Jamba 1:7 混合架构 32L</text>
  <text x="680" y="224" class="step" fill="#2e7d32">16 GB</text>
  <rect x="400" y="230" width="62" height="14" fill="#2e7d32"/>

  <text x="400" y="260" class="step">纯 Mamba 32L</text>
  <text x="680" y="260" class="step" fill="#2e7d32">&lt;1 MB</text>
  <rect x="400" y="262" width="4" height="14" fill="#2e7d32"/>

  <!-- Ratio rationale -->
  <rect x="380" y="290" width="540" height="240" class="box"/>
  <text x="650" y="312" text-anchor="middle" class="head">为什么选择 1:7</text>

  <text x="400" y="340" class="step">1:1（纯 Transformer）</text>
  <text x="620" y="340" class="small">质量最佳，内存开销最大</text>

  <text x="400" y="362" class="step">1:3（25% 注意力）</text>
  <text x="620" y="362" class="small">KV 仍较大，质量略有提升</text>

  <text x="400" y="384" class="step">1:7（12.5% 注意力）✓</text>
  <text x="620" y="384" class="small">AI21 的均衡点：一张 80GB GPU 支持 256k</text>

  <text x="400" y="406" class="step">1:15（6% 注意力）</text>
  <text x="620" y="406" class="small">上下文内召回开始失败</text>

  <text x="400" y="428" class="step">0:N（纯 Mamba）</text>
  <text x="620" y="428" class="small">没有注意力时状态追踪失败</text>

  <text x="400" y="465" class="step">Mamba-3 (ICLR 2026)</text>
  <text x="620" y="465" class="small">复数状态 + MIMO；能否进一步降低比例？</text>

  <text x="400" y="488" class="step">2026 年的前沿混合架构</text>
  <text x="620" y="488" class="small">Jamba 1.5 Large：398B/94B 激活参数，面向企业</text>
  <text x="620" y="504" class="small">下一代：可能为 Mamba-3 + 注意力，比例 1:10+</text>
</svg>
