<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .shared { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">顺序多 token 预测 — DeepSeek-V3 风格</text>

  <!-- Main backbone -->
  <rect x="30" y="60" width="200" height="60" class="box"/>
  <text x="130" y="80" text-anchor="middle" class="head">主模型骨干</text>
  <text x="130" y="100" text-anchor="middle" class="step">h_i^(0)  ·  L_main</text>

  <!-- Shared embedding -->
  <rect x="30" y="150" width="200" height="50" class="shared"/>
  <text x="130" y="170" text-anchor="middle" class="head">共享嵌入 E</text>
  <text x="130" y="188" text-anchor="middle" class="small">供主模型与每个 MTP 深度使用</text>

  <!-- Depth 1 module -->
  <rect x="280" y="60" width="260" height="140" class="cool"/>
  <text x="410" y="82" text-anchor="middle" class="head">MTP 模块 k=1</text>
  <text x="410" y="100" text-anchor="middle" class="small">组合：M_1 * [RMSNorm(h^0); RMSNorm(E(t_{i+1}))]</text>
  <text x="410" y="118" text-anchor="middle" class="small">transformer 块 T_1（注意力 + MLP）</text>
  <text x="410" y="138" text-anchor="middle" class="step">h_i^(1)</text>
  <text x="410" y="160" text-anchor="middle" class="small">共享 LM 头 -&gt; 预测 t_{i+2}</text>
  <text x="410" y="180" text-anchor="middle" class="step">L_1 = CE(logits, t_{i+2})</text>

  <!-- Depth 2 module -->
  <rect x="580" y="60" width="260" height="140" class="cool"/>
  <text x="710" y="82" text-anchor="middle" class="head">MTP 模块 k=2</text>
  <text x="710" y="100" text-anchor="middle" class="small">组合：M_2 * [RMSNorm(h^1); RMSNorm(E(t_{i+2}))]</text>
  <text x="710" y="118" text-anchor="middle" class="small">transformer 块 T_2（注意力 + MLP）</text>
  <text x="710" y="138" text-anchor="middle" class="step">h_i^(2)</text>
  <text x="710" y="160" text-anchor="middle" class="small">共享 LM 头 -&gt; 预测 t_{i+3}</text>
  <text x="710" y="180" text-anchor="middle" class="step">L_2 = CE(logits, t_{i+3})</text>

  <!-- Arrows between modules -->
  <line x1="230" y1="90" x2="280" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="580" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="80" text-anchor="middle" class="small">h^(1)</text>

  <!-- Shared head -->
  <rect x="340" y="230" width="280" height="50" class="shared"/>
  <text x="480" y="250" text-anchor="middle" class="head">共享输出头 Out</text>
  <text x="480" y="268" text-anchor="middle" class="small">复用主模型的 LM 头 — 无额外参数</text>

  <!-- E feeds into modules -->
  <line x1="230" y1="175" x2="285" y2="175" stroke="#5a4fcf" stroke-width="1.2"/>
  <line x1="285" y1="175" x2="285" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="175" x2="585" y2="175" stroke="#5a4fcf" stroke-width="1.0" stroke-dasharray="3,2"/>
  <line x1="585" y1="175" x2="585" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Joint loss -->
  <rect x="30" y="320" width="900" height="60" class="box"/>
  <text x="480" y="343" text-anchor="middle" class="head">联合损失</text>
  <text x="480" y="363" text-anchor="middle" class="step">L_total = L_main + (lambda / D) * sum_{k=1..D} L_k</text>

  <!-- Inference repurpose -->
  <rect x="30" y="400" width="900" height="120" class="hot"/>
  <text x="480" y="423" text-anchor="middle" class="label">推理时：MTP 模块成为推测解码草稿</text>
  <text x="50" y="450" class="step">模块 k=1</text>
  <text x="220" y="450" class="small">根据 h^(0) + E(t_{i+1}) 起草 t_{i+2} · DeepSeek-V3 报告接受率超过 80%</text>
  <text x="50" y="470" class="step">模块 k=2</text>
  <text x="220" y="470" class="small">根据 h^(1) + E(t_{i+2}) 起草 t_{i+3} · 在深度间串联</text>
  <text x="50" y="490" class="step">验证器</text>
  <text x="220" y="490" class="small">主模型按 Leviathan 规则接受/拒绝（阶段 10 · 15）</text>
  <text x="50" y="510" class="step">加速比</text>
  <text x="220" y="510" class="small">生成吞吐约提升 1.8 倍 — 论文报告的实测值</text>
</svg>
