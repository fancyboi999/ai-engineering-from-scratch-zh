<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">公平性：三大家族，一个不可能性</text>

  <rect x="40" y="60" width="280" height="200" class="box"/>
  <text x="180" y="85" text-anchor="middle" class="head">群体公平</text>
  <rect x="60" y="100" width="240" height="50" class="cool"/>
  <text x="180" y="122" text-anchor="middle" class="step">人口统计均等</text>
  <text x="180" y="140" text-anchor="middle" class="small">P(Y=1 | A=a) 相等</text>
  <rect x="60" y="160" width="240" height="50" class="cool"/>
  <text x="180" y="182" text-anchor="middle" class="step">均等化胜算</text>
  <text x="180" y="200" text-anchor="middle" class="small">各群体的 TPR/FPR 相等</text>
  <rect x="60" y="220" width="240" height="30" class="cool"/>
  <text x="180" y="242" text-anchor="middle" class="step">条件使用准确率相等</text>

  <rect x="340" y="60" width="280" height="200" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">个体公平</text>
  <rect x="360" y="100" width="240" height="80" class="cold"/>
  <text x="480" y="125" text-anchor="middle" class="step">Dwork et al. 2012</text>
  <text x="480" y="145" text-anchor="middle" class="small">|f(x) - f(x')| &lt;= L * d(x, x')</text>
  <text x="480" y="165" text-anchor="middle" class="small">满足 Lipschitz 条件；d 取决于任务</text>
  <rect x="360" y="190" width="240" height="60" class="cold"/>
  <text x="480" y="215" text-anchor="middle" class="step">相似个体</text>
  <text x="480" y="233" text-anchor="middle" class="small">得到相似决策</text>

  <rect x="640" y="60" width="280" height="200" class="box"/>
  <text x="780" y="85" text-anchor="middle" class="head">反事实公平</text>
  <rect x="660" y="100" width="240" height="80" class="hot"/>
  <text x="780" y="125" text-anchor="middle" class="step">Kusner et al. 2017</text>
  <text x="780" y="145" text-anchor="middle" class="small">受保护属性的反事实变化</text>
  <text x="780" y="165" text-anchor="middle" class="small">不改变结果</text>
  <rect x="660" y="190" width="240" height="60" class="hot"/>
  <text x="780" y="215" text-anchor="middle" class="step">需要因果 DAG</text>
  <text x="780" y="233" text-anchor="middle" class="small">回溯方法（2024）绕开该问题</text>

  <rect x="40" y="290" width="880" height="200" class="box"/>
  <text x="480" y="315" text-anchor="middle" class="head">不可能性与调和</text>
  <text x="60" y="345" class="small">Chouldechova、KMR 2017：基率不同时，三项群体标准不能同时成立。</text>
  <text x="60" y="365" class="small">政策选择：人口统计均等提供平等准入；均等化胜算保持准确性公平；</text>
  <text x="60" y="385" class="small">条件使用准确率相等保持预测值公平。各项标准面向不同利益群体。</text>
  <text x="60" y="415" class="small">2024 NeurIPS：反事实公平与准确率的权衡有界；可将最优不公平模型以模型无关方式转为反事实公平模型。</text>
  <text x="60" y="435" class="small">回溯反事实（arXiv:2401.13935）：避免对受保护属性施加干预。</text>
  <text x="60" y="455" class="small">ICLR 2024 的调和：有显式因果图时，群体公平与反事实公平是同一结构的不同侧面。</text>
  <text x="60" y="475" class="small">基率上的不可能性仍成立；调和讨论的是测量对象。</text>
</svg>
