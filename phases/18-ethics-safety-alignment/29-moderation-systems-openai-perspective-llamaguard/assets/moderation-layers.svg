<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">三层内容审核：2026 年的默认部署模式</text>

  <rect x="40" y="60" width="180" height="100" class="cool"/>
  <text x="130" y="90" text-anchor="middle" class="step">用户 prompt</text>
  <text x="130" y="115" text-anchor="middle" class="small">Llama Guard 3/4</text>
  <text x="130" y="135" text-anchor="middle" class="small">OpenAI Moderation</text>

  <rect x="240" y="60" width="180" height="100" class="cold"/>
  <text x="330" y="90" text-anchor="middle" class="step">自定义规则</text>
  <text x="330" y="115" text-anchor="middle" class="small">金融免责声明</text>
  <text x="330" y="135" text-anchor="middle" class="small">医疗拒答</text>

  <rect x="440" y="60" width="180" height="100" class="hot"/>
  <text x="530" y="90" text-anchor="middle" class="step">模型</text>
  <text x="530" y="115" text-anchor="middle" class="small">GPT-5, Claude, Gemini</text>
  <text x="530" y="135" text-anchor="middle" class="small">或开源模型</text>

  <rect x="640" y="60" width="180" height="100" class="cool"/>
  <text x="730" y="90" text-anchor="middle" class="step">输出审核</text>
  <text x="730" y="115" text-anchor="middle" class="small">Llama Guard 3/4</text>
  <text x="730" y="135" text-anchor="middle" class="small">OpenAI Moderation</text>

  <path d="M 220 110 L 240 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" fill="none"/>
  <path d="M 420 110 L 440 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" fill="none"/>
  <path d="M 620 110 L 640 110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" fill="none"/>

  <rect x="40" y="180" width="880" height="160" class="box"/>
  <text x="480" y="205" text-anchor="middle" class="head">类别体系</text>
  <rect x="60" y="225" width="280" height="100" class="cool"/>
  <text x="200" y="250" text-anchor="middle" class="step">OpenAI Moderation（13 类）</text>
  <text x="200" y="270" text-anchor="middle" class="small">骚扰（+威胁）/ 仇恨（+威胁）</text>
  <text x="200" y="288" text-anchor="middle" class="small">自伤（+意图、+指令）/ 性内容（+未成年人）</text>
  <text x="200" y="306" text-anchor="middle" class="small">暴力（+血腥）/ 非法行为（+暴力）</text>

  <rect x="360" y="225" width="280" height="100" class="cool"/>
  <text x="500" y="250" text-anchor="middle" class="step">Llama Guard 3（14 类）</text>
  <text x="500" y="270" text-anchor="middle" class="small">MLCommons AILuminate 分类体系</text>
  <text x="500" y="288" text-anchor="middle" class="small">+ 代码解释器滥用、选举</text>
  <text x="500" y="306" text-anchor="middle" class="small">+ 诽谤、专业建议</text>

  <rect x="660" y="225" width="240" height="100" class="cool"/>
  <text x="780" y="250" text-anchor="middle" class="step">Perspective（毒性基线）</text>
  <text x="780" y="270" text-anchor="middle" class="small">毒性 / 严重 / 侮辱</text>
  <text x="780" y="288" text-anchor="middle" class="small">LLM 时代之前</text>
  <text x="780" y="306" text-anchor="middle" class="small">研究中仍在使用</text>

  <rect x="40" y="360" width="880" height="130" class="box"/>
  <text x="480" y="385" text-anchor="middle" class="head">弃用与迁移</text>
  <text x="60" y="415" class="small">Azure Content Moderator：2024 年二月弃用，2027 年二月退役。</text>
  <text x="60" y="435" class="small">替代方案：Azure AI Content Safety（基于 LLM，集成 Azure OpenAI）。</text>
  <text x="60" y="455" class="small">受影响部署的迁移项目在 2024-2027 年进行；应纳入欧盟《人工智能法案》的时间安排。</text>
  <text x="60" y="475" class="small">omni-moderation-latest（2024）：对多数开发者免费；支持文本与图像；多语言表现提升 42%。</text>
</svg>
