<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">EchoLeak：跨越三个边界的 LLM 作用域违规</text>

  <rect x="40" y="60" width="280" height="180" class="box"/>
  <text x="180" y="82" text-anchor="middle" class="head">边界 1：检索</text>
  <rect x="60" y="100" width="240" height="60" class="hot"/>
  <text x="180" y="125" text-anchor="middle" class="step">不可信内容</text>
  <text x="180" y="145" text-anchor="middle" class="small">RAG 上下文中的攻击者邮件</text>
  <rect x="60" y="170" width="240" height="60" class="cool"/>
  <text x="180" y="195" text-anchor="middle" class="step">防御：作用域标签</text>
  <text x="180" y="215" text-anchor="middle" class="small">IFC + 不可信标签</text>

  <rect x="340" y="60" width="280" height="180" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">边界 2：作用域</text>
  <rect x="360" y="100" width="240" height="60" class="hot"/>
  <text x="480" y="125" text-anchor="middle" class="step">特权访问</text>
  <text x="480" y="145" text-anchor="middle" class="small">邮箱 / 仓库 / 人力资源作用域</text>
  <rect x="360" y="170" width="240" height="60" class="cool"/>
  <text x="480" y="195" text-anchor="middle" class="step">防御：能力关卡</text>
  <text x="480" y="215" text-anchor="middle" class="small">仅从可信意图发起工具调用</text>

  <rect x="640" y="60" width="280" height="180" class="box"/>
  <text x="780" y="82" text-anchor="middle" class="head">边界 3：输出</text>
  <rect x="660" y="100" width="240" height="60" class="hot"/>
  <text x="780" y="125" text-anchor="middle" class="step">数据外泄</text>
  <text x="780" y="145" text-anchor="middle" class="small">CSP 允许的 URL；图像渲染</text>
  <rect x="660" y="170" width="240" height="60" class="cool"/>
  <text x="780" y="195" text-anchor="middle" class="step">防御：狭窄白名单</text>
  <text x="780" y="215" text-anchor="middle" class="small">出口域名限制</text>

  <path d="M 320 150 L 340 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>
  <path d="M 620 150 L 640 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>

  <rect x="40" y="270" width="880" height="220" class="box"/>
  <text x="480" y="295" text-anchor="middle" class="head">同类 CVE（2025）</text>
  <text x="60" y="325" class="small">CVE-2025-32711 EchoLeak（CVSS 9.3）：M365 Copilot；零点击；经 CSP 允许的通道外泄。</text>
  <text x="60" y="345" class="small">CamoLeak（CVSS 9.6）：通过 Camo 图像代理攻击 GitHub Copilot Chat；禁用图像渲染后修复。</text>
  <text x="60" y="365" class="small">CVE-2025-53773：通过代码建议界面的 prompt 注入在 GitHub Copilot 中执行远程代码。</text>
  <text x="60" y="395" class="small">严重性校准：供应商起初低估风险。Aim Labs 通过演示 MFA 验证码外泄升级报告。</text>
  <text x="60" y="415" class="small">NIST AI SPD 2024：“生成式 AI 最大的安全缺陷。”OWASP LLM01 2025：#1 威胁。</text>
  <text x="60" y="445" class="small">策略：三个边界需要三项独立控制。只修复一个并不充分。</text>
  <text x="60" y="465" class="small">负责任披露：MSRC 服务端修补；Aim Labs 发表；生态学习。持续迭代。</text>
</svg>
