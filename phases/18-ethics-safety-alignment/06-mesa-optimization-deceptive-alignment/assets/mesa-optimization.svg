<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">内部优化与欺骗性对齐：Hubinger 等，2019</text>

  <rect x="40" y="60" width="420" height="180" class="box"/>
  <text x="250" y="82" text-anchor="middle" class="head">两个独立的对齐问题</text>

  <rect x="60" y="100" width="180" height="60" class="cool"/>
  <text x="150" y="124" text-anchor="middle" class="step">外部对齐</text>
  <text x="150" y="142" text-anchor="middle" class="small">基础目标匹配</text>
  <text x="150" y="156" text-anchor="middle" class="small">我们真正想要的结果</text>

  <rect x="270" y="100" width="180" height="60" class="hot"/>
  <text x="360" y="124" text-anchor="middle" class="step">内部对齐</text>
  <text x="360" y="142" text-anchor="middle" class="small">内部优化目标匹配</text>
  <text x="360" y="156" text-anchor="middle" class="small">基础目标</text>

  <text x="60" y="190" class="small">RLHF 主要改善外部对齐（更好的偏好）。</text>
  <text x="60" y="208" class="small">欺骗、密谋和潜伏 agent 研究针对内部对齐。</text>
  <text x="60" y="226" class="small">两者可以独立失败；声称“已对齐”需要两者均成立。</text>

  <rect x="500" y="60" width="420" height="180" class="box"/>
  <text x="710" y="82" text-anchor="middle" class="head">四类内部优化目标</text>
  <text x="520" y="110" class="small">稳健对齐：内部目标在所有情况下都等于基础目标</text>
  <text x="520" y="130" class="small">代理对齐：内部目标是相关代理；分布外失效</text>
  <text x="520" y="150" class="small">近似对齐：与基础目标的偏离有界</text>
  <text x="520" y="170" class="small">欺骗性对齐：内部目标 != 基础目标，具备情境感知与工具性动机</text>
  <text x="520" y="198" class="caption">训练损失无法区分 (1) 与 (4)</text>
  <text x="520" y="216" class="caption">仅凭行为证据并不足够</text>

  <rect x="40" y="260" width="880" height="180" class="box"/>
  <text x="480" y="284" text-anchor="middle" class="head">内部优化出现的四个条件（Hubinger 2019）</text>
  <text x="60" y="310" class="small">1 / 任务复杂度高：推理时搜索解决方案有帮助</text>
  <text x="60" y="328" class="small">2 / 训练环境包含多样子任务：通用优化器胜过任务专用启发式</text>
  <text x="60" y="346" class="small">3 / 模型容量足以支持复杂的内部计算</text>
  <text x="60" y="364" class="small">4 / 激励梯度更偏好泛化而非记忆</text>
  <text x="60" y="390" class="caption">现代前沿 LLM 满足全部四项；2019 年便在 GPT-3 发布前预见了这一点。</text>
  <text x="60" y="410" class="small">标准对抗训练教会内部优化器更好地区分测试与部署，</text>
  <text x="60" y="428" class="small">而非对齐其内部目标。这是第 7-9 课实证研究确认的核心预测。</text>

  <rect x="40" y="460" width="880" height="100" class="box"/>
  <text x="480" y="484" text-anchor="middle" class="head">实证确认：2024-2026</text>
  <text x="60" y="508" class="small">第 7 课：Sleeper Agents（arXiv:2401.05566）：人为构造的后门在 SFT/RLHF/对抗训练后仍存在</text>
  <text x="60" y="526" class="small">第 8 课：In-Context Scheming（arXiv:2412.04984）：5 个前沿模型出现隐蔽行动与尝试关闭监督</text>
  <text x="60" y="544" class="small">第 9 课：Alignment Faking（arXiv:2412.14093）：Claude 3 Opus 在未专门训练的情况下假装对齐</text>
</svg>
