name: build

# 中文翻译版的轻量 CI：
#   1. 验证站点能正常构建（node site/build.js 生成 data.js）
#   2. 课程数一致性校验（node site/build.js --check），以文件系统课程目录数
#      核对 README 表格、badge、散文、阶段标题和 ROADMAP 总计。
#   3. 测验答案位置去偏校验，避免新题重新集中到某一个选项槽位。
#   4. Claude 认证课程、评估、实验和答案位置合约。
#   5. 交互图表按需加载清单与浏览器朗读状态机回归。
# audit_lessons.py 读取 docs/zh.md，校验课程结构、测验与相对链接。
# build.js --check 负责 README/ROADMAP 的课数契约。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "api/**"
      - "learning-paths/**"
      - "README.md"
      - "ROADMAP.md"
      - "glossary/**"
      - "phases/**"
      - "certifications/**"
      - "skills/**"
      - ".claude/skills/**"
      - "scripts/audit_certifications.py"
      - "scripts/check_mcpa_wire.py"
      - "scripts/mcpa_negative_fixtures.json"
      - "scripts/test_check_mcpa_wire.py"
      - "scripts/audit_mcpa.py"
      - "scripts/test_audit_mcpa.py"
      - "scripts/audit_lessons.py"
      - "scripts/test_audit_certifications.py"
      - "scripts/backfill_certification_references.py"
      - "scripts/debias_certification_questions.py"
      - "scripts/debias_quizzes.py"
      - "scripts/test_debias_quizzes.py"
      - "scripts/check_figure_loader.js"
      - "scripts/test_figures_i18n_zh.js"
      - "scripts/test_lesson_mobile_css.js"
      - "scripts/test_tts.js"
      - "scripts/test_agent_negotiation.js"
      - "scripts/test_agent_readiness.py"
      - "scripts/test_seo_routes.js"
      - "scripts/test_skill_artifact_bundles.py"
  pull_request:
    branches: [main]

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build data.js
        run: node site/build.js
      - name: verify output
        run: |
          test -f site/data.js || { echo "data.js 未生成"; exit 1; }
          grep -q "const PHASES" site/data.js || { echo "PHASES 缺失"; exit 1; }
          echo "✅ 站点构建成功，data.js 已生成"
      - name: 课程数一致性校验（防 README/ROADMAP 课数漂移）
        run: node site/build.js --check
      - name: 中文课程结构与站内链接校验
        run: python3 scripts/audit_lessons.py --strict
      - name: Claude 认证课程合约校验
        run: python3 scripts/audit_certifications.py
      - name: 认证学习计划调度回归
        run: python3 scripts/test_audit_certifications.py
      - name: MCPA wire checker 回归
        run: python3 scripts/test_check_mcpa_wire.py
      - name: MCPA 课程与认证题结构审计
        run: python3 scripts/audit_mcpa.py
      - name: MCPA 审计回归
        run: python3 scripts/test_audit_mcpa.py
      - name: MCPA 课程 transcript 协议校验
        run: python3 scripts/check_mcpa_wire.py
      - name: 认证补强引用完整性
        run: python3 scripts/backfill_certification_references.py --check
      # audit_certifications.py 校验答案位置、长度可预测性和多选组合分布，
      # 以题目结构与答案分布作为中文认证题的校验依据。
      - name: 运行认证课程实验测试
        run: find certifications -path '*/lessons/*/code/tests/test_*.py' -print0 | xargs -0 -r -n1 python3
      - name: 运行认证课程 demo
        run: find certifications -path '*/lessons/*/code/main.py' -print0 | xargs -0 -r -n1 python3
      - name: 站点 JavaScript 语法校验
        run: find site -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Agent 内容协商回归
        run: node scripts/test_agent_negotiation.js
      - name: Agent 可读性与公开资源契约
        run: python3 scripts/test_agent_readiness.py
      - name: SEO 路由与服务端降级页
        run: node scripts/test_seo_routes.js
      - name: 站点构建产物与学习路径契约
        run: |
          node site/test_build_artifacts.js
          node site/test_learning_paths.js
          node site/test_static_preview_routes.js
      - name: 课程导师 Skill Bundle 回归
        run: python3 scripts/test_skill_artifact_bundles.py
      - name: 课程页移动端布局合约
        run: node scripts/test_lesson_mobile_css.js
      - name: 测验答案位置去偏校验
        run: python3 scripts/debias_quizzes.py --check
      - name: 测验重排语义校验
        run: |
          if git diff --quiet HEAD^ -- scripts/debias_quizzes.py; then
            echo "去偏算法未变更，跳过迁移语义审计"
          else
            python3 scripts/audit_quiz_debias.py --base HEAD^
          fi
      - name: 统计数值回归校验
        run: python3 phases/01-math-foundations/15-statistics-for-ml/code/test_statistics.py
      - name: 去偏锚点回归校验
        run: python3 scripts/test_debias_quizzes.py
      - name: 交互图表按需加载校验
        run: |
          node scripts/check_figure_loader.js
          node scripts/test_figures_i18n_zh.js
      - name: 浏览器朗读回归校验
        run: node scripts/test_tts.js
