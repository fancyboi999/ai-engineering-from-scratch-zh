name: build

# 中文翻译版的轻量 CI：
#   1. 验证站点能正常构建（node site/build.js 生成 data.js）
#   2. 课程数一致性校验（node site/build.js --check），以文件系统课程目录数
#      核对 README 表格、badge、散文、阶段标题和 ROADMAP 总计。
#   3. 测验答案位置去偏校验，避免新题重新集中到某一个选项槽位。
#   4. Claude 认证课程、评估、实验和答案位置合约。
#   5. 交互图表按需加载清单与浏览器朗读状态机回归。
# audit_lessons.py 读取 docs/zh.md，校验课程结构、测验与相对链接。
# build.js --check 负责 README/ROADMAP 的课数契约。

on:
  push:
    branches: [main]
    paths:
      - "practice/**"
      - "research/**"
      - "scripts/practice/**"
      - "scripts/decompiler-machine/**"
      - "scripts/gpu-machine/**"
      - "cheatsheets/**"
      - "scripts/agent-machine/**"
      - "scripts/check_lesson_math.js"
      - "scripts/build-og-fonts.js"
      - "projects/**"
      - "manuals/**"
      - "site/**"
      - "api/**"
      - "lib/**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "learning-paths/**"
      - "README.md"
      - "ROADMAP.md"
      - "glossary/**"
      - "phases/**"
      - "certifications/**"
      - "skills/**"
      - ".claude/skills/**"
      - "scripts/audit_certifications.py"
      - "scripts/check_mcpa_wire.py"
      - "scripts/mcpa_negative_fixtures.json"
      - "scripts/test_check_mcpa_wire.py"
      - "scripts/audit_mcpa.py"
      - "scripts/test_audit_mcpa.py"
      - "scripts/audit_lessons.py"
      - "scripts/test_audit_certifications.py"
      - "scripts/backfill_certification_references.py"
      - "scripts/debias_certification_questions.py"
      - "scripts/debias_quizzes.py"
      - "scripts/test_debias_quizzes.py"
      - "scripts/check_figure_loader.js"
      - "scripts/test_figures_i18n_zh.js"
      - "scripts/test_lesson_mobile_css.js"
      - "scripts/test_tts.js"
      - "scripts/test_agent_negotiation.js"
      - "scripts/test_agent_api.js"
      - "scripts/test_agent_wire.js"
      - "scripts/serve-agent-site.js"
      - "scripts/test_agent_readiness.py"
      - "scripts/test_seo_routes.js"
      - "scripts/test_function_bundles.js"
      - "scripts/test_skill_artifact_bundles.py"
  pull_request:

jobs:
  build:
    name: build site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: build data.js
        run: node site/build.js
      - name: 冻结速查表英文证据来源（不将英文行号冒充中文行号）
        run: |
          git fetch --no-tags https://github.com/rohitg00/ai-engineering-from-scratch.git 45fa4084de6ba2f88fa96a41e69efa2166f868b3
          mkdir -p "$RUNNER_TEMP/aifs-cheatsheet-evidence"
          git archive 45fa4084de6ba2f88fa96a41e69efa2166f868b3 phases manuals projects cheatsheets | tar -x -C "$RUNNER_TEMP/aifs-cheatsheet-evidence"
          echo 45fa4084de6ba2f88fa96a41e69efa2166f868b3 > "$RUNNER_TEMP/aifs-cheatsheet-evidence/.aifs-upstream-revision"
          echo "AIFS_CHEATSHEET_EVIDENCE_ROOT=$RUNNER_TEMP/aifs-cheatsheet-evidence" >> "$GITHUB_ENV"
      - name: 冻结本轮更新的速查表证据来源
        run: |
          git fetch --no-tags https://github.com/rohitg00/ai-engineering-from-scratch.git 3f9715c62a3bedcffb68a260f1a65ee2dd9cc10a
          mkdir -p "$RUNNER_TEMP/aifs-cheatsheet-evidence-updated"
          git archive 3f9715c62a3bedcffb68a260f1a65ee2dd9cc10a phases manuals projects cheatsheets | tar -x -C "$RUNNER_TEMP/aifs-cheatsheet-evidence-updated"
          echo 3f9715c62a3bedcffb68a260f1a65ee2dd9cc10a > "$RUNNER_TEMP/aifs-cheatsheet-evidence-updated/.aifs-upstream-revision"
          echo "AIFS_CHEATSHEET_EVIDENCE_ROOTS=$RUNNER_TEMP/aifs-cheatsheet-evidence:$RUNNER_TEMP/aifs-cheatsheet-evidence-updated" >> "$GITHUB_ENV"
      - name: verify output
        run: |
          test -f site/data.js || { echo "data.js 未生成"; exit 1; }
          grep -q "const PHASES" site/data.js || { echo "PHASES 缺失"; exit 1; }
          echo "✅ 站点构建成功，data.js 已生成"
      - name: 课程数一致性校验（防 README/ROADMAP 课数漂移）
        run: node site/build.js --check
      - name: 中文数学与速查表校验
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const html = fs.readFileSync('site/lesson.html', 'utf8');
          const base = /var KATEX_BASE = '([^']+)'/.exec(html)[1];
          const integrity = /var KATEX_JS_SRI = '([^']+)'/.exec(html)[1];
          const response = await fetch(base + 'katex.min.js');
          if (!response.ok) throw new Error(`KaTeX download failed: ${response.status}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          const actual = 'sha384-' + crypto.createHash('sha384').update(bytes).digest('base64');
          if (actual !== integrity) throw new Error('Pinned KaTeX integrity mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/aieng-katex.cjs', bytes);
          NODE
          node scripts/check_lesson_math.js --katex "$RUNNER_TEMP/aieng-katex.cjs"
          node site/build-cheatsheets.js --check
          node site/build-cheatsheets.js --check-quality
      - name: 中文课程结构与站内链接校验
        run: python3 scripts/audit_lessons.py --strict
      - name: Claude 认证课程合约校验
        run: python3 scripts/audit_certifications.py
      - name: 认证学习计划调度回归
        run: python3 scripts/test_audit_certifications.py
      - name: MCPA wire checker 回归
        run: python3 scripts/test_check_mcpa_wire.py
      - name: MCPA 课程与认证题结构审计
        run: python3 scripts/audit_mcpa.py
      - name: MCPA 审计回归
        run: python3 scripts/test_audit_mcpa.py
      - name: MCPA 课程 transcript 协议校验
        run: python3 scripts/check_mcpa_wire.py
      - name: 认证补强引用完整性
        run: python3 scripts/backfill_certification_references.py --check
      # audit_certifications.py 校验答案位置、长度可预测性和多选组合分布，
      # 以题目结构与答案分布作为中文认证题的校验依据。
      - name: 运行认证课程实验测试
        run: find certifications -path '*/lessons/*/code/tests/test_*.py' -print0 | xargs -0 -r -n1 python3
      - name: 运行认证课程 demo
        run: find certifications -path '*/lessons/*/code/main.py' -print0 | xargs -0 -r -n1 python3
      - name: 站点 JavaScript 语法校验
        run: find site -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: 部署函数文件追踪与独立 bundle 运行
        run: |
          npm install --prefix "$RUNNER_TEMP/function-trace" --no-save --no-package-lock @vercel/nft@1.5.0 @vercel/routing-utils@6.6.0
          NODE_PATH="$RUNNER_TEMP/function-trace/node_modules" node --test scripts/test_function_bundles.js
      - name: Agent 内容协商、REST 和 MCP 协议回归
        run: |
          node scripts/test_agent_negotiation.js
          node scripts/test_agent_api.js
          node scripts/test_agent_wire.js
      - name: Agent 可读性与公开资源契约
        run: python3 scripts/test_agent_readiness.py
      - name: SEO 路由与服务端降级页
        run: node scripts/test_seo_routes.js
      - name: 站点构建产物与学习路径契约
        run: |
          node site/test_build_artifacts.js
          node site/test_learning_paths.js
          node site/test_static_preview_routes.js
      - name: 课程导师 Skill Bundle 回归
        run: python3 scripts/test_skill_artifact_bundles.py
      - name: 课程页移动端布局合约
        run: node scripts/test_lesson_mobile_css.js
      - name: 测验答案位置去偏校验
        run: python3 scripts/debias_quizzes.py --check
      - name: 测验重排语义校验
        run: |
          if git diff --quiet HEAD^ -- scripts/debias_quizzes.py; then
            echo "去偏算法未变更，跳过迁移语义审计"
          else
            python3 scripts/audit_quiz_debias.py --base HEAD^
          fi
      - name: 统计数值回归校验
        run: python3 phases/01-math-foundations/15-statistics-for-ml/code/test_statistics.py
      - name: 去偏锚点回归校验
        run: python3 scripts/test_debias_quizzes.py
      - name: 交互图表按需加载校验
        run: |
          node scripts/check_figure_loader.js
          node scripts/check_figure_locales.js
          node scripts/test_figures_i18n_zh.js
      - name: 浏览器朗读回归校验
        run: node scripts/test_tts.js
      - name: 冻结图表计算 oracle（不依赖浅克隆的 lane 对象）
        run: |
          git fetch --no-tags https://github.com/rohitg00/ai-engineering-from-scratch.git 56c886c8821fc488b6f9608895c983d18f0d1ea3
          mkdir -p "$RUNNER_TEMP/aifs-figure-frozen"
          git archive 56c886c8821fc488b6f9608895c983d18f0d1ea3 site/figures/projects | tar -x -C "$RUNNER_TEMP/aifs-figure-frozen"
          echo "AIFS_FIGURE_FROZEN_ROOT=$RUNNER_TEMP/aifs-figure-frozen" >> "$GITHUB_ENV"
          echo "AIFS_FIGURES_FROZEN_ROOT=$RUNNER_TEMP/aifs-figure-frozen" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Rust 核心运行器
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: 项目严格离线参考评分（缺运行时或 skip 均失败）
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GOPROXY: "off"
          GOSUMDB: "off"
        run: python3 scripts/project_test.py --all --solution --strict --report "$RUNNER_TEMP/project-grade.json"
      - name: 逆向验证器真实对象回归
        run: |
          command -v clang
          python3 -m unittest discover -s phases/13-tools-and-protocols/36-rebuild-and-prove-equal/code/tests -v
          # Apple clang 冻结字节与 macOS 运行记录不要求 Linux 编译器重现；
          # 此 gate 运行可移植的真实重定位边界，包含符号、addend 和节偏移。
          python3 -m unittest discover -s phases/13-tools-and-protocols/45-ai-assisted-reverse-engineering/code/tests -k ByteFieldTests -v
      - name: 项目、图表、Hub、手册与课程读取集成回归
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          node --test site/test*.js lib/test*.js scripts/test_lesson_reader.js scripts/test_site_integration.js scripts/test_hub_negotiation.js scripts/test_reader_sidebar_routes.js
          node scripts/check_hubs.js
          node scripts/audit_manuals.js --skip-capture
          node scripts/check_manual_outputs.js
          node manuals/_shared/figkit.js check manuals/a2a-101
          node manuals/_shared/figkit.js check manuals/docker-sandboxes-101
          python3 manuals/a2a-101/tests/test_static_contract.py
          node scripts/test_og.js
          node scripts/check_og_cards.js --require-manifests
      - name: 编程练习真实参考解与错误实现校验
        run: |
          python3 -m pip install 'numpy>=2.2,<3'
          python3 scripts/practice/test_harness.py
          python3 scripts/practice/validate.py
          node site/build-practice.js --check
      - name: 真实 DOM 安全与有界显示回归（非视觉验收）
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo "缺少 Chrome，真实 DOM gate 未执行"; exit 1; }
          export CHROME_PATH
          node scripts/test_attribute_safety.js
          node scripts/test_project_layout.js
          node scripts/test_ui_display.js
          node scripts/audit_figure_localization.js --mode dynamic --check --output "$RUNNER_TEMP/figure-localization.json"
