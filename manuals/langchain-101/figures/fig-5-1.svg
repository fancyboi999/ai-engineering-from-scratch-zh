<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">一次 agent 运行在各个流模式下的数据块</title>
  <desc id="fig-5-1-desc">八行，对应同一次 agent 运行的八种流，分四列：输入、第 1 步的 model 节点、第 2 步的 tools 节点、第 3 步的 model 节点。每个标记是从录制中读出的一个数据块，颜色表示它携带的内容：靛蓝是整个状态，梅紫是模型输出，绿色是工具输出，琥珀色是开始或结束的任务。updates 有 3 个，values 4 个，messages 13 个，tasks 6 个，debug 6 个，custom 0 个，slow_sum agent 上的 tools 模式 4 个，stream_events v3 有 23 个事件。v3 流在每一步结束时发出一个 values 事件。</desc>
