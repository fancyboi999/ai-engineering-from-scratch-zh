<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-4-title">三次调用回答并行两个节点提出的三个问题</title>
  <desc id="fig-2-4-desc">四个节点与四次调用组成的网格，在同一个线程上使用 InMemorySaver，模型为 x86 服务器虚拟机上的 Qwen3 4B。ask、approve 和 other 在 START 之后并行运行，after 最后运行。ask 和 approve 在调用 interrupt 之前，各自先让模型提出一个问题。调用 1 启动运行：ask 在它的第一个中断处停止，id 为 462dc352，approve 停止，id 为 11314d20，other 完成。调用 2a 用一个普通值恢复，抛出 RuntimeError，因为有两个中断在等待，且不产生任何模型调用。调用 2b 用一个从 id 到答案的映射恢复：approve 再次询问模型，得到 OK，完成。ask 再次询问模型，重放它的第一个答案，提出第二个问题，并以 id 177b6fc6 停止。other 不运行，因为它已保存的写入被重新应用。调用 3 用 A2 恢复：ask 第三次运行，共两次模型调用，完成，随后 after 运行。四次调用分别产生 3、0、3 和 3 次模型调用，五个提示词共 9 次。线程保存了 4 个检查点，步为 -1、0、1、2。</desc>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">第几次调用</text>
  <text x="20" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">恢复值</text>
  <text x="181" y="22" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">调用 1</text>
  <text x="181" y="40" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">invoke(input)</text>
  <text x="294" y="22" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">调用 2a</text>
  <text x="294" y="40" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">&#39;yes&#39;</text>
  <text x="407" y="22" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">调用 2b</text>
  <text x="407" y="40" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">{id: answer}</text>
  <text x="554" y="22" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">调用 3</text>
  <text x="554" y="40" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">&#39;A2&#39;</text>
  <text x="20" y="96" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">ask</text>
  <line x1="16" y1="58" x2="624" y2="58" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.3"/>
  <text x="20" y="172" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">approve</text>
  <line x1="16" y1="134" x2="624" y2="134" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.3"/>
  <text x="20" y="248" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">other</text>
  <line x1="16" y1="210" x2="624" y2="210" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.3"/>
  <text x="20" y="324" font-size="12" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">after</text>
  <line x1="16" y1="286" x2="624" y2="286" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.3"/>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <rect x="108" y="62" width="146" height="66" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="114" y="77" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">进入，列表 []</text>
  <text x="114" y="92" font-size="11" fill="var(--m-plum-ink, #8a3d72)">1 次模型调用</text>
  <text x="114" y="107" font-size="11" fill="var(--m-amber-ink, #85590c)">调用 #0 停止</text>
  <text x="114" y="122" font-size="11" fill="var(--m-amber-ink, #85590c)">id 462dc352</text>
  <rect x="108" y="138" width="146" height="66" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="114" y="153" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">进入，列表 []</text>
  <text x="114" y="168" font-size="11" fill="var(--m-plum-ink, #8a3d72)">1 次模型调用</text>
  <text x="114" y="183" font-size="11" fill="var(--m-amber-ink, #85590c)">调用 #0 停止</text>
  <text x="114" y="198" font-size="11" fill="var(--m-amber-ink, #85590c)">id 11314d20</text>
  <rect x="108" y="214" width="146" height="66" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="114" y="229" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">运行一次</text>
  <text x="114" y="244" font-size="11" fill="var(--m-plum-ink, #8a3d72)">1 次模型调用</text>
  <text x="114" y="259" font-size="11" fill="var(--m-teal-ink, #18696a)">完成</text>
  <text x="114" y="274" font-size="11" fill="var(--m-teal-ink, #18696a)">写入已保存</text>
  <text x="181" y="326" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">-</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <rect x="334" y="62" width="146" height="66" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="340" y="77" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">进入，列表 [A1]</text>
  <text x="340" y="92" font-size="11" fill="var(--m-plum-ink, #8a3d72)">2 次模型调用</text>
  <text x="340" y="107" font-size="11" fill="var(--m-amber-ink, #85590c)">#0 返回 A1</text>
  <text x="340" y="122" font-size="11" fill="var(--m-amber-ink, #85590c)">#1 停止 177b6fc6</text>
  <rect x="334" y="138" width="146" height="66" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="340" y="153" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">进入，列表 [OK]</text>
  <text x="340" y="168" font-size="11" fill="var(--m-plum-ink, #8a3d72)">1 次模型调用</text>
  <text x="340" y="183" font-size="11" fill="var(--m-teal-ink, #18696a)">#0 返回 OK</text>
  <text x="340" y="198" font-size="11" fill="var(--m-teal-ink, #18696a)">完成</text>
  <rect x="334" y="214" width="146" height="66" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)" stroke-dasharray="5 4"/>
  <text x="340" y="229" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">未运行</text>
  <text x="340" y="244" font-size="11" fill="var(--m-plum-ink, #8a3d72)">0 次模型调用</text>
  <text x="340" y="259" font-size="11" fill="var(--m-teal-ink, #18696a)">已保存的写入</text>
  <text x="340" y="274" font-size="11" fill="var(--m-teal-ink, #18696a)">重新应用</text>
  <text x="407" y="326" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">-</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <rect x="486" y="62" width="136" height="66" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="492" y="77" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">进入，列表 [A1]</text>
  <text x="492" y="92" font-size="11" fill="var(--m-plum-ink, #8a3d72)">2 次模型调用</text>
  <text x="492" y="107" font-size="11" fill="var(--m-teal-ink, #18696a)">#0 重放 A1</text>
  <text x="492" y="122" font-size="11" fill="var(--m-teal-ink, #18696a)">#1 得到 A2，完成</text>
  <text x="554" y="174" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">-</text>
  <text x="554" y="250" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">-</text>
  <rect x="486" y="290" width="136" height="66" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="492" y="305" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">运行</text>
  <text x="492" y="320" font-size="11" fill="var(--m-plum-ink, #8a3d72)">1 次模型调用</text>
  <text x="492" y="335" font-size="11" fill="var(--m-teal-ink, #18696a)">完成</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <rect x="260" y="62" width="68" height="218" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="294" y="102" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">Runtime</text>
  <text x="294" y="118" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">Error</text>
  <text x="294" y="150" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2 个在等待</text>
  <text x="294" y="166" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">没有节点</text>
  <text x="294" y="182" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">运行</text>
  </g>
  <g data-beat="5"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.842;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.85s" begin="indefinite" fill="freeze"/>
  <text x="20" y="388" font-size="11.5" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">模型调用</text>
  <text x="20" y="414" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">检查点</text>
  <text x="181" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">3</text>
  <text x="181" y="414" font-size="11" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">第 -1、0 步</text>
  <text x="294" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">0</text>
  <text x="294" y="414" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">无</text>
  <text x="407" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">3</text>
  <text x="407" y="414" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">无</text>
  <text x="554" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">3</text>
  <text x="554" y="414" font-size="11" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">第 1、2 步</text>
  <text x="407" y="430" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">答案作为写入保存</text>
  <text x="407" y="444" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">在第 0 步的检查点上</text>
  </g>
  <rect x="20" y="475" width="22" height="14" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="48" y="486" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">在中断处停止</text>
  <rect x="220" y="475" width="22" height="14" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="248" y="486" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">完成</text>
