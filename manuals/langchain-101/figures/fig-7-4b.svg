<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-7-4b-title fig-7-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-4b-title">create_deep_agent 添加的工具与状态</title>
  <desc id="fig-7-4b-desc">该录制在 Ollama 上用 Qwen3 4B 调用 create_deep_agent，工具为 add，系统提示词为 You keep notes。主智能体绑定了九个工具：来自 FilesystemMiddleware 的 ls、read_file、write_file、edit_file、delete、glob 和 grep，来自 SubAgentMiddleware 的 task，以及调用方提供的 add。它的状态新增了一个保存 /notes.md 的 files 通道。task 工具启动 general-purpose 子智能体，它绑定的工具相同但没有 task，其系统提示词有 286 个字符。图新增了两个中间件节点：PatchToolCallsMiddleware.before_agent 与 _ParentNotifierMiddleware.after_agent。没有 write_todos 工具，也没有 execute 工具。</desc>
  <defs><marker id="fig-7-4b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="20" y="14" width="600" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="30.95" font-size="11.5" text-anchor="middle" font-weight="700">create_deep_agent(model=llm(), tools=[add], system_prompt=&quot;You keep notes.&quot;)</text>
  <text x="320" y="48.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">你的调用</text>
  <text x="20" y="84" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">主模型每次调用绑定的工具：9 个</text>
  <rect x="20" y="96" width="300" height="60" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="113.75" font-size="12.5" font-weight="700">FilesystemMiddleware</text>
  <text x="32" y="131.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ls, read_file, write_file, edit_file,</text>
  <text x="32" y="146.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">delete, glob, grep</text>
  <rect x="336" y="96" width="140" height="60" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="348" y="113.75" font-size="12.5" font-weight="700">SubAgent</text>
  <text x="348" y="131.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Middleware</text>
  <text x="348" y="146.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">task</text>
  <rect x="492" y="96" width="128" height="60" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="504" y="121.25" font-size="12.5" font-weight="700">你的</text>
  <text x="504" y="138.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">add</text>
  <text x="20" y="186" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">状态与图</text>
  <rect x="20" y="198" width="300" height="60" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="32" y="215.75" font-size="12.5" font-weight="700">状态中的 files 通道</text>
  <text x="32" y="233.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">/notes.md：content、encoding、</text>
  <text x="32" y="248.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">created_at、modified_at</text>
  <rect x="336" y="198" width="284" height="60" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="348" y="215.75" font-size="12.5" font-weight="700">两个中间件节点</text>
  <text x="348" y="233.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">PatchToolCallsMiddleware.before_agent</text>
  <text x="348" y="248.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">_ParentNotifierMiddleware.after_agent</text>
  <rect x="336" y="300" width="284" height="60" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="348" y="317.75" font-size="12.5" font-weight="700">general-purpose 子智能体</text>
  <text x="348" y="335.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">8 个工具：相同，但没有 task</text>
  <text x="348" y="350.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">自己的提示词，286 个字符</text>
  <path d="M406 156 V178 H628 V330 H621" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-4b-head-ink)"/>
  <text x="20" y="318" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.7.38 中未绑定：</text>
  <text x="20" y="336" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">write_todos（现为选用），以及</text>
  <text x="20" y="354" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">execute（文档字符串中列出）。</text>
  <text x="20" y="390" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">来自 Qwen3 4B 上的录制工具包运行：共 6 次调用，第 5 次是子智能体。</text>
</svg>
