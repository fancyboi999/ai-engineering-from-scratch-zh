<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1-title">四个项目及其在锁定版本下的包</title>
  <desc id="fig-1-1-desc">六个色带自上而下堆叠，每个色带是一个项目，标出它的包和锁定版本：Deep Agents 对应 deepagents 0.7.38，因为是可选的所以画成虚线；LangChain 对应 langchain 1.5.0；LangGraph 对应 langgraph 1.2.22；provider 包，如 langchain-openai 1.8.0；LangChain core 对应 langchain-core 1.8.0；以及 Python 3.13 与 pydantic 2.14.3。LangGraph 色带内是 create_agent 返回的图，类型为 CompiledStateGraph，节点有 __start__、model、tools、__end__。四个编号箭头：create_deep_agent 调用 create_agent，create_agent 返回该图，model 节点调用某个 provider 包里的聊天模型类，该类继承 core 里的 BaseChatModel。侧边的 LangSmith 0.14.17 为橄榄色。一条橄榄色虚线箭头从 core 指向它，表示一次被追踪的 agent 轮次发出 7 个 POST /runs 和 7 个 PATCH 请求，且追踪在你打开之前保持关闭。</desc>
