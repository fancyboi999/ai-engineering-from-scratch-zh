<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="fig-4-8b-title fig-4-8b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-8b-title">AutoModeMiddleware 如何处理一次工具调用</title>
  <desc id="fig-4-8b-desc">模型请求两次工具调用：参数 name 为 main 的 delete_branch，以及参数为 2 和 3 的 add。对每个列出的工具，AutoModeMiddleware 向决策模型提出 noul 类型的问题 is_risky，附带指令、该工具调用、工具描述、最多 30 条消息，以及 criteria 为 null。delete_branch 得分 0.999，不低于 0.5，所以得到一条错误的 ToolMessage，没有运行。add 得分 0.0，所以运行并返回 5。未列出的工具不经提问直接运行。</desc>
  <defs><marker id="fig-4-8b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-4-8b-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="170" y="12" width="300" height="48" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="320" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">AIMessage tool_calls</text>
  <text x="320" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">delete_branch(main), add(2, 3)</text>
  <rect x="120" y="100" width="400" height="84" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="129.75" font-size="12.5" text-anchor="middle" font-weight="700">问题 is_risky，类型 noul</text>
  <text x="320" y="147.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">instructions、tool_call、tool_description、</text>
  <text x="320" y="162.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">最多 30 条消息、criteria: null</text>
  <line x1="320" y1="60" x2="320" y2="99" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8b-head-ink)"/>
  <rect class="m-knock" x="325" y="68.53" width="86.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="79.5" font-size="11.5">每个列出的工具</text>
  <rect x="20" y="250" width="280" height="64" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="32" y="269.75" font-size="12.5" font-weight="700">delete_branch: 0.999</text>
  <text x="32" y="287.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">不低于 0.5：错误的 ToolMessage，</text>
  <text x="32" y="302.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">工具不运行</text>
  <rect x="340" y="250" width="280" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="352" y="269.75" font-size="12.5" font-weight="700">add: 0.0</text>
  <text x="352" y="287.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">低于 0.5：工具运行，</text>
  <text x="352" y="302.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ToolMessage 为 5</text>
  <path d="M220 184 V249" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-4-8b-head-rose)"/>
  <path d="M420 184 V249" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-4-8b-head-ink)"/>
  <rect class="m-knock" x="225" y="211.42" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="228" y="222" font-size="11" fill="var(--m-rose-ink, #b0344d)">有风险</text>
  <rect class="m-knock" x="425" y="211.42" width="28" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="428" y="222" font-size="11">放行</text>
  <rect x="20" y="344" width="600" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="32" y="363.25" font-size="12.5" font-weight="700">不在 tools= 里的工具</text>
  <text x="32" y="380.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">不向决策模型提问，直接运行</text>
  <text x="20" y="418" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">这些概率是 Qwen3 4B 通过录制工具包里的 OllamaDecisionModel 给出的回答。</text>
</svg>
