<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" aria-labelledby="fig-7-6b-title fig-7-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-6b-title">从最后一次运行到进程退出的秒数，按端点分组</title>
  <desc id="fig-7-6b-desc">Mac 上从最后一次 agent 运行到进程退出的耗时点图，每种端点条件一个进程，每个进程做 50 次 Qwen3 4B agent 运行。结尾调用 wait_for_all_tracers 时：端点正常为 0.4 s，端点很慢为 0.4 s。不调用时：端点很慢 3.7 s，端点很慢且关闭后台回调 3.7 s，端点返回 500 为 17.1 s，端点宕机为 9.9 s（收到 350 次运行中的 0 次），端点挂起则在最后一次运行后 208 s 仍然存活，300 s 时被杀（收到 350 次运行中的 50 次）。所有条件下每次 agent 运行都返回了答案。</desc>
  <defs><marker id="fig-7-6b-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <line x1="70" y1="282" x2="610" y2="282" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="286" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="70" y1="224.5" x2="610" y2="224.5" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="228.5" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">5</text>
  <line x1="70" y1="167" x2="610" y2="167" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="171" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">10</text>
  <line x1="70" y1="109.5" x2="610" y2="109.5" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="113.5" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">15</text>
  <line x1="70" y1="52" x2="610" y2="52" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="56" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">20</text>
  <line x1="70" y1="282" x2="610" y2="282" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="70" y1="52" x2="70" y2="282" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="70" y="40" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">最后一次运行到退出的秒数</text>
  <circle cx="108.57" cy="277.4" r="3.4" fill="var(--m-olive-ink, #515f26)"/>
  <rect class="m-knock" x="89.07" y="256.82" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="108.57" y="267.4" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">0.4 s</text>
  <rect class="m-knock" x="82.47" y="242.82" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="108.57" y="253.4" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="108.57" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">正常</text>
  <text x="108.57" y="314" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">flush</text>
  <circle cx="185.71" cy="277.4" r="3.4" fill="var(--m-olive-ink, #515f26)"/>
  <rect class="m-knock" x="166.21" y="256.82" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="185.71" y="267.4" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">0.4 s</text>
  <rect class="m-knock" x="159.61" y="242.82" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="185.71" y="253.4" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="185.71" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">很慢</text>
  <text x="185.71" y="314" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">flush</text>
  <circle cx="262.86" cy="239.45" r="3.4" fill="var(--m-olive-ink, #515f26)"/>
  <rect class="m-knock" x="243.36" y="218.87" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="262.86" y="229.45" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">3.7 s</text>
  <rect class="m-knock" x="236.76" y="204.87" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="262.86" y="215.45" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="262.86" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">很慢</text>
  <text x="262.86" y="314" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">后台关闭</text>
  <circle cx="340" cy="239.45" r="3.4" fill="var(--m-olive-ink, #515f26)"/>
  <rect class="m-knock" x="320.5" y="218.87" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="340" y="229.45" font-size="11" text-anchor="middle" fill="var(--m-olive-ink, #515f26)">3.7 s</text>
  <rect class="m-knock" x="313.9" y="204.87" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="340" y="215.45" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="340" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">很慢</text>
  <circle cx="417.14" cy="85.35" r="3.4" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="394.34" y="64.77" width="45.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="417.14" y="75.35" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">17.1 s</text>
  <rect class="m-knock" x="391.04" y="50.77" width="52.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="417.14" y="61.35" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">350/350</text>
  <text x="417.14" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">返回</text>
  <text x="417.14" y="314" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">500</text>
  <circle cx="494.29" cy="168.15" r="3.4" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="474.79" y="147.57" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="494.29" y="158.15" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">9.9 s</text>
  <rect class="m-knock" x="474.79" y="133.57" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="494.29" y="144.15" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0/350</text>
  <text x="494.29" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">宕机</text>
  <line x1="571.43" y1="144" x2="571.43" y2="44" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-6b-head-rose)"/>
  <text x="571.43" y="38" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">已终止</text>
  <rect class="m-knock" x="548.63" y="147.22" width="45.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="571.43" y="157.8" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">50/350</text>
  <rect class="m-knock" x="543.13" y="165.62" width="56.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="571.43" y="176.2" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">于 300 s</text>
  <text x="571.43" y="300" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">挂起</text>
  <text x="70" y="344" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每个点是一个含 50 次 agent 运行的进程，共 350 次追踪运行。</text>
  <text x="70" y="362" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">点上方的分数是到达端点的追踪运行数。</text>
  <text x="70" y="380" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">flush：最后一次运行后调用 wait_for_all_tracers()。后台关闭：</text>
  <text x="70" y="398" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">LANGCHAIN_CALLBACKS_BACKGROUND=false。每个进程中的 50 次运行都给出了答案。</text>
</svg>
