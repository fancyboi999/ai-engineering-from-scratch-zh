<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-labelledby="fig-7-4e-title fig-7-4e-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-4e-title">deep agent 的图</title>
  <desc id="fig-7-4e-desc">带 tools=[add] 的 create_deep_agent 的已编译图，由 draw_mermaid 输出绘制。它有 6 个节点。PatchToolCallsMiddleware.before_agent 在 model 之前运行，_ParentNotifierMiddleware.after_agent 在结束之前运行。tools 节点含 10 个工具：ls, read_file, write_file, edit_file, delete, glob, grep, execute, task, add。model 节点还有一条条件边回到自身。</desc>
  <defs><marker id="fig-7-4e-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-7-4e-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">CREATE_DEEP_AGENT 的 GET_GRAPH()</text>
  <text x="620" y="20" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">6 个节点，10 个工具</text>
  <line x1="320" y1="110" x2="320" y2="127" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4e-head-ink)"/>
  <line x1="320" y1="68" x2="320" y2="85" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4e-head-ink)"/>
  <line x1="336" y1="152" x2="466" y2="191.5" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4e-head-amber)"/>
  <line x1="304" y1="152" x2="166" y2="169" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4e-head-amber)"/>
  <line x1="182" y1="170" x2="320" y2="153" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4e-head-amber)"/>
  <line x1="466" y1="216.5" x2="466" y2="256" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4e-head-ink)"/>
  <path d="M362 134 H380 V146 H363" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-4e-head-amber)"/>
  <rect x="274" y="44" width="92" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="320" y="60" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__start__</text>
  <rect x="278" y="128" width="84" height="24" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="320" y="143.45" font-size="11.5" text-anchor="middle" font-weight="700">model</text>
  <rect x="47" y="170" width="254" height="69" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="174" y="184.45" font-size="11.5" text-anchor="middle" font-weight="700">tools</text>
  <text x="174" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__tools = ls, read_file, write_file,</text>
  <text x="174" y="216.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">edit_file, delete, glob, grep, execute,</text>
  <text x="174" y="231.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">task, add</text>
  <rect x="327" y="192.5" width="278" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="466" y="207.95" font-size="11.5" text-anchor="middle" font-weight="400">_ParentNotifierMiddleware.after_agent</text>
  <rect x="181" y="86" width="278" height="24" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="101.45" font-size="11.5" text-anchor="middle" font-weight="400">PatchToolCallsMiddleware.before_agent</text>
  <rect x="427" y="257" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="466" y="273" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <line x1="20" y1="307" x2="54" y2="307" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4e-head-ink)"/>
  <text x="62" y="311" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">普通边</text>
  <line x1="119" y1="307" x2="153" y2="307" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-4e-head-amber)"/>
  <text x="161" y="311" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">条件边，运行时选择</text>
</svg>
