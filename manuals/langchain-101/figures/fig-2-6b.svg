<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-2-6b-title fig-2-6b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-6b-title">每个超步的框架耗时，按 saver 与持久性模式划分</title>
  <desc id="fig-2-6b-desc">七根横条，每个 saver 与持久性模式组合一根，对象是 x86 服务器虚拟机上用 Qwen3 4B、含 10 次工具往返的一次 create_agent 运行，共 22 个超步，每行 30 次运行，取中位数。虚拟机当时有负载，所以请看占比和各条的顺序，不要看毫秒数。框架耗时是总耗时减去 Ollama 调用和工具函数内部的耗时。每根条给出每个超步的毫秒数：无 saver async 1.70，InMemorySaver async 2.33，InMemorySaver sync 2.51，InMemorySaver exit 1.79，SqliteSaver async 2.89，SqliteSaver sync 5.31，SqliteSaver exit 2.24。靛蓝部分是循环函数：规划、应用、构建检查点和记录任务写入。灰色部分是其余：节点包装，以及循环等待的 saver 工作。最右列是框架耗时占总耗时的比例，为 0.144 到 0.449%，运行时长约 25.9 s，其余时间都被模型占用。</desc>
