  <text x="466" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">配置 101</text>
  <text x="466" y="274" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">51 次调用</text>
  <circle cx="538" cy="160.4" r="3.5" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="525.1" y="139.82" width="25.8" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="538" y="150.4" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">242</text>
  <text x="538" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">默认</text>
  <text x="538" y="274" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">121 次调用</text>
  <text x="214" y="296" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-indigo-ink, #4b4f9e)">StateGraph 循环，Mac</text>
  <text x="466" y="296" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">create_agent，Qwen3 4B</text>
  <text x="70" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">agent 情形下方的调用数是它的模型调用次数。agent 在 x86 服务器虚拟机上运行。</text>
  <text x="70" y="344" font-size="11" class="m-serif" fill="var(--m-rose-ink, #b0344d)">玫红色的默认运行没有触到上限：实验脚本在 1260 s 后把它停下。</text>
</svg>
