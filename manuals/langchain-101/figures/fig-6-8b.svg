<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="fig-6-8b-title fig-6-8b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-8b-title">GraphRecursionError 之前的步数</title>
  <desc id="fig-6-8b-desc">按对数刻度绘制每次运行在停止前走的步数的点图。Mac 上不带模型的 StateGraph 循环，在 recursion_limit 为 25 和环境变量设为 25 时都在 25 步停止，不带配置时在 10007 步停止。x86 服务器虚拟机上用 Qwen3 4B 的 create_agent agent，在 13 次模型调用后于 25 步停止，在 51 次后于 101 步停止，各 3 次运行全部如此。使用默认上限时，实验脚本在 21 分钟后把它停下，此时已走 242 步、做了 121 次模型调用。</desc>
  <line x1="70" y1="240" x2="610" y2="240" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="244" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">10</text>
  <line x1="70" y1="182.48" x2="610" y2="182.48" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="186.48" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="70" y1="124.96" x2="610" y2="124.96" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="128.96" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">1k</text>
  <line x1="70" y1="67.44" x2="610" y2="67.44" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="71.44" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">10k</text>
  <line x1="70" y1="240" x2="610" y2="240" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="70" y1="40" x2="70" y2="240" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="70" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">停止前的步数，对数刻度</text>
  <circle cx="142" cy="217.11" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <rect class="m-knock" x="132.4" y="196.53" width="19.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="142" y="207.11" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">25</text>
  <text x="142" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">配置 25</text>
  <circle cx="214" cy="217.11" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <rect class="m-knock" x="204.4" y="196.53" width="19.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="214" y="207.11" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">25</text>
  <text x="214" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">环境变量 25</text>
  <circle cx="286" cy="67.43" r="3.5" fill="var(--m-indigo-ink, #4b4f9e)"/>
  <rect class="m-knock" x="266.5" y="46.85" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="286" y="57.43" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">10007</text>
  <text x="286" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">默认</text>
  <circle cx="394" cy="217.11" r="3.5" fill="var(--m-blue-ink, #2f5d9a)"/>
  <rect class="m-knock" x="384.4" y="196.53" width="19.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="394" y="207.11" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">25</text>
  <text x="394" y="258" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">配置 25</text>
  <text x="394" y="274" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">13 次调用</text>
  <circle cx="466" cy="182.23" r="3.5" fill="var(--m-blue-ink, #2f5d9a)"/>
