<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">检索录制的索引时与查询时</title>
  <desc id="fig-7-1-desc">两行。索引时，三个 Markdown 文件交给 langchain-text-splitters 的 RecursiveCharacterTextSplitter，切成 7 个最长 80 个字符的块。langchain-ollama 的 OllamaEmbeddings 用模型 nomic-embed-text 把每个块转成 768 个数字，langchain-core 的 InMemoryVectorStore 把它们存为 doc-0 到 doc-6。查询时，create_agent 询问模型，模型调用工具 search_docs，工具调用由 as_retriever 得到的检索器（k 等于 1），检索器搜索 store，ToolMessage 把块 doc-0 带回模型，其开头为 &quot;[checkpoints.md] A checkpointer saves graph state after each step.&quot;</desc>
  <defs><marker id="fig-7-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">索引时：只做一次</text>
  <rect x="20" y="32" width="128" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="84" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">3 个文件</text>
  <text x="84" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">checkpoints.md</text>
  <text x="84" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">另外两个</text>
  <rect x="176" y="32" width="136" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="244" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">TextSplitter</text>
  <text x="244" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">递归切分，大小 80</text>
  <text x="244" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">7 个块</text>
  <rect x="340" y="32" width="130" height="58" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="405" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">嵌入</text>
  <text x="405" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">nomic-embed-text</text>
  <text x="405" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每块 768 个数字</text>
  <rect x="498" y="32" width="122" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="559" y="48.75" font-size="12.5" text-anchor="middle" font-weight="700">向量存储</text>
  <text x="559" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">InMemory</text>
  <text x="559" y="81.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">doc-0 to doc-6</text>
  <line x1="148" y1="61" x2="175" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="312" y1="61" x2="339" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="470" y1="61" x2="497" y2="61" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="176" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langchain-text-splitters</text>
  <text x="340" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langchain-ollama</text>
  <text x="498" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langchain-core</text>
  <text x="20" y="146" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">查询时：每次工具调用</text>
  <rect x="20" y="160" width="128" height="58" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="84" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">create_agent</text>
  <text x="84" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">模型节点</text>
  <text x="84" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">工具节点</text>
  <rect x="176" y="160" width="136" height="58" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="244" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">search_docs</text>
  <text x="244" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">@tool，只有一个</text>
  <text x="244" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">参数：query</text>
  <rect x="340" y="160" width="130" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="405" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">retriever</text>
  <text x="405" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">as_retriever</text>
  <text x="405" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">k=1</text>
  <line x1="148" y1="177" x2="175" y2="177" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="175" y1="203" x2="149" y2="203" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="312" y1="189" x2="339" y2="189" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <path d="M470 189 H604 V91" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="562" y="160" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">检索</text>
  <text x="20" y="246" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">返回模型的 ToolMessage 的开头：</text>
  <rect x="20" y="256" width="600" height="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="276.45" font-size="11.5" font-weight="400">[checkpoints.md] A checkpointer saves graph state after each step.</text>
  <text x="20" y="316" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Ollama 上的 nomic-embed-text 为模型的问题选出了 7 个块中的第 0 块。</text>
</svg>
