<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-9-5-title fig-9-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-5-title">五个故障、span 中的尝试，以及各模型对客户说了什么</title>
  <desc id="fig-9-5-desc">对每个注入的故障，展示 Mac 上第一次套件运行的工具与模型 span，以及 Qwen3 4B、Qwen3 14B、Claude Haiku 5.5 的回复。search_faq 失败 一次：Qwen3 4B no tool call, said no data bad，Qwen3 14B answered after the retry ok，Claude Haiku 5.5 answered after the retry ok。read_order 挂起 每次尝试：Qwen3 4B said order not found bad，Qwen3 14B said it cannot look it up now ok，Claude Haiku 5.5 said lookup timed out ok。create_ticket 失败一次：Qwen3 4B said it could not open one ok，Qwen3 14B said it could not open one ok，Claude Haiku 5.5 said it could not open one ok。主模型 抛出异常：Qwen3 4B answered from backup ok，Qwen3 14B answered from backup ok，Claude Haiku 5.5 answered from backup ok。模型一直请求 search_faq：Qwen3 4B answered after 8 calls ok，Qwen3 14B answered after 8 calls ok，Claude Haiku 5.5 answered after 8 calls ok。</desc>
