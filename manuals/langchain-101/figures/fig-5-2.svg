<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-2-title">SQLite 文件中同一线程的三个回合</title>
  <desc id="fig-5-2-desc">SqliteSaver 的 checkpoints 表中线程 sqlite-thread 的 11 行，排在一条从 -1 到 9 的步轴上。第 1 回合“What is 2 + 3?”在第 -1 步有一个输入检查点，在第 0、1、2、3 步有循环检查点，结束后状态里有 4 条消息。第 2 回合“What did I ask you?”在第 4 步有一个输入检查点，在第 5、6 步有循环检查点，结束后状态里有 6 条消息。第 3 回合“Remind me what my first question was.”在第 7 步有一个输入检查点，在第 8、9 步有循环检查点，结束后状态里有 8 条消息。第 2 回合与第 3 回合之间，连接被关闭，一个新进程打开同一个文件。文件里有 11 行检查点和 13 行待处理写入。</desc>
