<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-0-1-title fig-0-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-0-1-title">如何阅读本手册中的时序图</title>
  <desc id="fig-0-1-desc">六条生命线：你的代码、由 create_agent 返回的 agent 图、运行在 Ollama 上的聊天模型 Qwen3 4B、一个工具、checkpointer，以及进程之外的 LangSmith。八个编号行展示八种箭头样式：以 What is 2 + 3? 调用 invoke 是墨色实线调用；系统提示 You add numbers. 是梅紫实线模型调用；带 a=2、b=3 的工具调用 add 是墨色虚线回复；checkpoint step 1 是青绿实线持久写入；next tools 是琥珀虚线状态迁移；自定义流值 lookup A-17 是靛蓝点线流；7 次 POST /runs 请求是橄榄虚线外部副作用；RuntimeError disk on fire 是玫红虚线失败。</desc>
