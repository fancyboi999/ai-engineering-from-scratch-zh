  <title id="fig-5-2b-title">同一个 AsyncPostgresSaver 上，每秒运行数与检查点写入 p99 随线程数的变化</title>
  <desc id="fig-5-2b-desc">两幅点图，横轴是同时运行的线程数 1、4、16 和 64，对数刻度，每个点两次运行，在 x86 服务器虚拟机上用 CPU 上的 Qwen3 4B。左：每秒运行数。单个连接在 1 个线程时为 0.18 and 0.22，64 个线程时为 0.22 and 0.22。20 个连接的连接池在 1 个线程时为 0.23 and 0.23，64 个线程时为 0.22 and 0.22。右：aput 的 p99，单位 ms，对数刻度。64 个线程时，单个连接为 450 and 318 ms，连接池为 273 and 254 ms。</desc>
