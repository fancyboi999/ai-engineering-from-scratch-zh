<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-3-5-title fig-3-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-5-title">model 节点如何构建每个请求</title>
  <desc id="fig-3-5-desc">两行，每行对应 06-agent-run.txt 中那次运行的一次模型调用。每行左侧是调用之前的 state.messages，青绿色：调用 1 之前有 1 条消息，调用 2 之前有 3 条。中间是聊天模型收到的请求：先是紫色的系统提示词“You add numbers.”，因为它不在状态里，所以用虚线；然后是来自状态的同样那些消息。一条梅紫色箭头把请求送到聊天模型。一条青绿色箭头把回复带回，model 节点把它追加到 state.messages：调用 1 之后是对 add 的工具调用，调用 2 之后是“2 + 3 = 5.”。两行之间，tools 节点追加 ToolMessage。状态最终有 4 条消息，不含系统消息。</desc>
