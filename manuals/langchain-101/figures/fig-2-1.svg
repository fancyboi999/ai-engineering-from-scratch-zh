<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1-title">一次 create_agent 运行的六个超步及通道版本</title>
  <desc id="fig-2-1-desc">一张网格，列出一次含两次工具调用的 create_agent 运行中规划的 6 个超步，从输入步 -1 到找不到任务的步 4。最上一行是各步规划的任务：__start__、model、tools 的两个 PUSH 任务、再一次 model，以及无任务。下面四行给出每步之后 __start__、messages、branch:to:model 和 __pregel_tasks 的版本。实心格表示该步写入的通道，虚线格表示被读取方清空并换了新版本的通道，灰色数字表示沿用的版本。同一步中变化的通道得到相同的版本号。琥珀色箭头从触发任务的通道版本指向下一步里的该任务。最后一行是 model 已经见过的 branch:to:model 版本。在第 4 步，通道版本为 5，model 见过的是 4，但通道为空，所以没有任务运行。</desc>
