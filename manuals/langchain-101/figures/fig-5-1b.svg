<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="fig-5-1b-title fig-5-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1b-title">同一个工具结果在 v1、v2 和 v3 中的样子</title>
  <desc id="fig-5-1b-desc">三列，每列对应一种流 API，都携带 add 工具的 ToolMessage 5。使用两种模式的 v1 产出一个由模式和数据组成的元组，数据是带元数据的 ToolMessage。v2 产出一个带 type、ns 和 data 的 StreamPart 字典。v3 产出一个带 type、method、params 和 seq 的事件帧，其中 method 为 tools，数据是以 ToolMessage 为 output 的 tool-finished 事件。</desc>
  <defs><marker id="fig-5-1b-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <text x="16" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">V1，两种模式</text>
  <rect x="16" y="30" width="196" height="64" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="28" y="49.75" font-size="12.5" font-weight="700">一个元组</text>
  <text x="28" y="67.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">(mode, data)</text>
  <text x="28" y="82.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">形状随模式变化</text>
  <rect x="16" y="128" width="196" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="28" y="147.75" font-size="12.5" font-weight="700">data</text>
  <text x="28" y="165.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">(ToolMessage, metadata)</text>
  <text x="28" y="180.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">langgraph_node: tools</text>
  <line x1="114" y1="94" x2="114" y2="127" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-5-1b-head-indigo)"/>
  <text x="16" y="218" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">messages 的第 3 个块</text>
  <text x="222" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">V2，任意模式</text>
  <rect x="222" y="30" width="196" height="64" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="234" y="49.75" font-size="12.5" font-weight="700">一个 StreamPart 字典</text>
  <text x="234" y="67.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">type, ns, data</text>
  <text x="234" y="82.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">type: messages</text>
  <rect x="222" y="128" width="196" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="234" y="147.75" font-size="12.5" font-weight="700">data</text>
  <text x="234" y="165.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">message: ToolMessage</text>
  <text x="234" y="180.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">metadata: node tools</text>
  <line x1="320" y1="94" x2="320" y2="127" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-5-1b-head-indigo)"/>
  <text x="222" y="218" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">第 3 个 part</text>
  <text x="428" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">V3 事件</text>
  <rect x="428" y="30" width="196" height="64" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="440" y="49.75" font-size="12.5" font-weight="700">一个事件帧</text>
  <text x="440" y="67.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">type, method, params, seq</text>
  <text x="440" y="82.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">method: tools</text>
  <rect x="428" y="128" width="196" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="440" y="147.75" font-size="12.5" font-weight="700">params.data</text>
  <text x="440" y="165.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">event: tool-finished</text>
  <text x="440" y="180.05" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">output: ToolMessage</text>
  <line x1="526" y1="94" x2="526" y2="127" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-5-1b-head-indigo)"/>
  <text x="428" y="218" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seq 9</text>
  <line x1="217" y1="10" x2="217" y2="226" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="423" y1="10" x2="423" y2="226" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="16" y="254" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">三者携带的是同一个 ToolMessage，content 为 5，并带有该次调用的 tool_call_id。</text>
</svg>
