  <text x="500" y="152" font-size="11" fill="var(--m-indigo-ink, #4b4f9e)">subgraph inner</text>
  <line x1="440" y1="88" x2="440" y2="105" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
