  <line x1="20" y1="324" x2="54" y2="324" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
  <text x="62" y="328" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">普通边</text>
  <line x1="119" y1="324" x2="153" y2="324" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-7b-head-amber)"/>
  <text x="161" y="328" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">条件边，运行时选择</text>
