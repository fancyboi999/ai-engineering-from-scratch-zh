<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" role="img" aria-labelledby="fig-6-7b-title fig-6-7b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-7b-title">同一个父图，分别用 xray 和不用 xray 绘制</title>
  <desc id="fig-6-7b-desc">子图示例的父图，由 draw_mermaid 输出绘制两次。get_graph() 有 5 个节点，把子图显示为一个名为 inner 的节点。get_graph(xray=True) 有 6 个节点，把子图画成包住节点 inner:shout 和 inner:ask_ok 的方框 inner，父图的边指向 inner:shout，并从 inner:ask_ok 引出。</desc>
  <defs><marker id="fig-6-7b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-7b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">GET_GRAPH()</text>
  <text x="300" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">GET_GRAPH(XRAY=TRUE)</text>
  <text x="20" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">5 个节点，inner 是一个节点</text>
  <text x="300" y="40" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">6 个节点，子图已展开</text>
  <line x1="280" y1="12" x2="280" y2="302" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <line x1="160" y1="88" x2="160" y2="105" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
  <line x1="160" y1="172" x2="160" y2="189" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
  <line x1="160" y1="130" x2="160" y2="147" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
  <line x1="160" y1="214" x2="160" y2="231" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-7b-head-ink)"/>
