  <text x="440" y="121.45" font-size="11.5" text-anchor="middle" font-weight="700">prepare</text>
  <rect x="398" y="232" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="440" y="247.45" font-size="11.5" text-anchor="middle" font-weight="700">finish</text>
  <rect x="401" y="274" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="440" y="290" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <rect x="398" y="190" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="440" y="205.45" font-size="11.5" text-anchor="middle" font-weight="700">ask_ok</text>
  <rect x="398" y="148" width="84" height="24" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
