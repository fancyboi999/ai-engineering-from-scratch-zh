<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" role="img" aria-labelledby="fig-5-4b-title fig-5-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-4b-title">两个用户、一个 deep agent，以及记忆文件存放的位置</title>
  <desc id="fig-5-4b-desc">StoreBackend 在 /memories/ 下的四种命名空间设置，每种在 InMemoryStore 和 PostgresStore 上各运行 10 个会话，模型为 Qwen3 8B。每个会话里，alice 先让 agent 保存一个储物柜密码，然后 bob 在新线程里索要储物柜密码：前三行通过 /memories/ 下的文件，最后一行通过 recall 工具。每个会话一个方块。文档示例：InMemoryStore 上，已保存的 10 个密码中有 10 个被告诉了 bob，PostgresStore 上，已保存的 10 个密码中有 10 个被告诉了 bob。按用户：InMemoryStore 上，已保存的 10 个密码中有 0 个被告诉了 bob，PostgresStore 上，已保存的 10 个密码中有 0 个被告诉了 bob。按用户 + recall 工具：InMemoryStore 上，已保存的 10 个密码中有 0 个被告诉了 bob，PostgresStore 上，已保存的 10 个密码中有 0 个被告诉了 bob。同上，bob 要求使用 recall：InMemoryStore 上，已保存的 10 个密码中有 10 个被告诉了 bob，PostgresStore 上，已保存的 10 个密码中有 10 个被告诉了 bob。</desc>
