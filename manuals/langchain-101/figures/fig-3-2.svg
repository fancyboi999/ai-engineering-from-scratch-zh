<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2-title">init_chat_model 如何解析模型字符串</title>
  <desc id="fig-3-2-desc">一张按顺序做三项判断的决策图。第一，第一个冒号之前的部分是不是已知的 provider？openai:gpt-4.1 和 ollama:qwen3:4b 都是，分别构建 ChatOpenAI 和 ChatOllama。第二，名称是否以已知前缀开头，如 gpt-、o3 或 claude？gpt-4.1-mini 和 claude-haiku-4-5 都是，分别构建 ChatOpenAI 和 ChatAnthropic。第三，其他任何字符串，如 qwen3:4b，会在发出任何请求之前抛出 ValueError: Unable to infer model provider。</desc>
  <defs><marker id="fig-3-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="20" width="260" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="43.25" font-size="12.5" font-weight="700">是已知的 provider 前缀？</text>
  <text x="32" y="60.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">第一个冒号之前的部分</text>
  <rect x="360" y="20" width="260" height="56" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="43.25" font-size="12.5" font-weight="700">ollama:qwen3:4b</text>
  <text x="372" y="60.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ChatOllama，模型 qwen3:4b</text>
  <rect x="20" y="120" width="260" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="32" y="143.25" font-size="12.5" font-weight="700">名称以已知前缀开头？</text>
  <text x="32" y="160.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">gpt-, o1, o3, claude, gemini</text>
  <rect x="360" y="120" width="260" height="56" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="372" y="143.25" font-size="12.5" font-weight="700">claude-haiku-4-5</text>
  <text x="372" y="160.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ChatAnthropic</text>
  <rect x="360" y="220" width="260" height="56" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="372" y="243.25" font-size="12.5" font-weight="700">qwen3:4b</text>
  <text x="372" y="260.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ValueError: Unable to infer</text>
  <line x1="280" y1="48" x2="359" y2="48" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <rect class="m-knock" x="310.75" y="31.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="319.5" y="42" font-size="11.5" text-anchor="middle">是</text>
  <line x1="280" y1="148" x2="359" y2="148" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <rect class="m-knock" x="310.75" y="131.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="319.5" y="142" font-size="11.5" text-anchor="middle">是</text>
  <line x1="150" y1="76" x2="150" y2="119" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <rect class="m-knock" x="155" y="86.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="158" y="97.5" font-size="11.5">否</text>
  <path d="M150 176 L150 248 L359 248" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="158" y="196" font-size="11.5">否</text>
  <text x="20" y="300" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">qwen3 不是已知的 provider，所以 ollama:qwen3:4b 只在第一个冒号处切分。</text>
  <text x="20" y="320" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">这个错误发生在任何请求到达 provider 之前。</text>
</svg>
