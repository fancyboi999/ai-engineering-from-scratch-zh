<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-6-7-title fig-6-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-7-title">经过子图的 steps 列表</title>
  <desc id="fig-6-7-desc">五行，自上而下，每行是一个节点及其执行后的 steps 列表。prepare 写入 outer.prepare。在子图 inner 的命名空间内，shout 添加 inner.shout，ask_ok 添加 inner.ask_ok=yes，所以子图返回三个条目。父图用 operator.add 把这个输出并入已含 outer.prepare 的列表，所以 outer.prepare 出现两次。finish 添加 outer.finish，最终列表有五个条目。</desc>
  <defs><marker id="fig-6-7-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">节点</text>
  <text x="128" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">节点之后的 STEPS 列表</text>
  <rect x="10" y="92" width="620" height="126" fill="none" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-dasharray="5 4"/>
  <text x="620" y="210" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-indigo-ink, #4b4f9e)">命名空间 inner:&lt;uuid-1&gt;</text>
  <rect x="16" y="32" width="100" height="42" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
