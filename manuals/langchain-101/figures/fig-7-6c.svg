<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-7-6c-title fig-7-6c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-6c-title">tracing_context(enabled=&quot;local&quot;) 保留与发送的内容</title>
  <desc id="fig-7-6c-desc">四条生命线：你的代码、langsmith 的 traceable 包装器、LangChain 回调管理器和 LangSmith 客户端。enabled 设为 local 的 tracing_context 内，traceable 函数构建一棵运行树并交给 on_end，客户端收不到任何请求。同一上下文内的 agent.invoke 会打开追踪，因为回调管理器把字符串 local 当作真值，并添加 LangChainTracer，它发送 7 次 POST /runs 和 7 次 PATCH。enabled 设为 False 的 tracing_context 加 collect_runs 内的同一个 invoke，把四个顶层运行保留在内存中，什么也不发送。</desc>
