<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-3-2b-title fig-3-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2b-title">一次失败的模型调用在中继处的尝试次数</title>
  <desc id="fig-3-2b-desc">点图，记录在 x86 服务器虚拟机上、Ollama 前面的中继处看到的模型尝试次数，模型为 Qwen3 4B，每个单元格运行 3 次。三组分别是每次调用都断开连接、端口被拒绝，以及每次调用都超时。在每一组里，ChatOpenAI 的客户端默认重试尝试了 3 次，关闭客户端重试的 ModelRetryMiddleware 尝试了 3 次，两层一起尝试了 9 次。每个单元格的三次运行次数完全相同。</desc>
  <line x1="70" y1="270" x2="610" y2="270" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="274" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="70" y1="247" x2="610" y2="247" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="251" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">1</text>
  <line x1="70" y1="201" x2="610" y2="201" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="205" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">3</text>
  <line x1="70" y1="109" x2="610" y2="109" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="113" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">7</text>
  <line x1="70" y1="63" x2="610" y2="63" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="64" y="67" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">9</text>
  <line x1="70" y1="270" x2="610" y2="270" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="70" y1="40" x2="70" y2="270" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="70" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">中继处的模型尝试次数</text>
  <line x1="70" y1="109" x2="610" y2="109" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect class="m-knock" x="424.36" y="92.42" width="184.64" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="606" y="103" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-mute, #666660)">文档所述的 6 次重试，共 7 次尝试</text>
