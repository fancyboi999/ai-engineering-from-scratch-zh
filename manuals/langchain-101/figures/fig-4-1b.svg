<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="fig-4-1b-title fig-4-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-1b-title">从 draw_mermaid 的各行到一幅图</title>
  <desc id="fig-4-1b-desc">带一个工具的 agent 的 draw_mermaid 输出，逐行列出，旁边是它所描述的图。4 行节点定义给出每个节点的 id 和标签：:::first 与 :::last 类标出 __start__ 和 __end__，tools 的标签带有元数据 __tools = add。随后是 4 行边定义：--&gt; 是普通边，-.-&gt; 是条件边。图中有 4 个节点、1 条普通边和 3 条条件边。</desc>
  <defs><marker id="fig-4-1b-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-4-1b-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">DRAW_MERMAID() 的各行</text>
  <text x="420" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">对应的图</text>
  <text x="20" y="50" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">节点行：id(label)，编号与图对应</text>
  <circle cx="30" cy="68" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="30" y="72" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">1</text>
  <text x="46" y="72" font-size="11">__start__([&lt;p&gt;__start__&lt;/p&gt;]):::first</text>
  <circle cx="30" cy="92" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="30" y="96" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">2</text>
  <text x="46" y="96" font-size="11">model(model)</text>
  <circle cx="30" cy="116" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="30" y="120" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">3</text>
  <text x="46" y="120" font-size="11">tools(tools&lt;hr/&gt;&lt;small&gt;&lt;em&gt;__tools = add&lt;/em&gt;&lt;/small&gt;)</text>
  <circle cx="30" cy="140" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="30" y="144" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">4</text>
  <text x="46" y="144" font-size="11">__end__([&lt;p&gt;__end__&lt;/p&gt;]):::last</text>
  <text x="20" y="174" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">边行：--&gt; 普通，-.-&gt; 条件</text>
  <line x1="20" y1="192" x2="40" y2="192" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-1b-head-ink)"/>
  <text x="46" y="196" font-size="11">__start__ --&gt; model;</text>
  <line x1="20" y1="212" x2="40" y2="212" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <text x="46" y="216" font-size="11" fill="var(--m-amber-ink, #85590c)">model -.-&gt; __end__;</text>
  <line x1="20" y1="232" x2="40" y2="232" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <text x="46" y="236" font-size="11" fill="var(--m-amber-ink, #85590c)">model -.-&gt; tools;</text>
  <line x1="20" y1="252" x2="40" y2="252" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <text x="46" y="256" font-size="11" fill="var(--m-amber-ink, #85590c)">tools -.-&gt; model;</text>
  <line x1="520" y1="84" x2="520" y2="101" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-1b-head-ink)"/>
  <line x1="536" y1="126" x2="578" y2="150.5" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <line x1="504" y1="126" x2="455" y2="143" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <line x1="471" y1="144" x2="520" y2="127" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-1b-head-amber)"/>
  <rect x="474" y="60" width="92" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="520" y="76" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__start__</text>
  <rect x="478" y="102" width="84" height="24" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="520" y="117.45" font-size="11.5" text-anchor="middle" font-weight="700">model</text>
  <rect x="413" y="144" width="100" height="39" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="463" y="158.45" font-size="11.5" text-anchor="middle" font-weight="700">tools</text>
  <text x="463" y="175.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__tools = add</text>
  <rect x="539" y="151.5" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="578" y="167.5" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <circle cx="460" cy="72" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="460" y="76" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">1</text>
  <circle cx="464" cy="114" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="464" y="118" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">2</text>
  <circle cx="399" cy="163.5" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="399" y="167.5" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">3</text>
  <circle cx="525" cy="163.5" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1"/>
  <text x="525" y="167.5" font-size="11" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">4</text>
  <text x="20" y="284" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">frontmatter 和 classDef 行只设置样式。</text>
</svg>
