<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">一次 sync 运行中，每个完成的任务要等多久才完成 put_writes</title>
  <desc id="fig-2-3-desc">四个面板，对应一次 create_agent 运行（Qwen3 4B，持久性模式 sync，使用 x86 服务器虚拟机上的 SqliteSaver）的四个超步。每个面板覆盖该步第一个任务返回之后的 7 ms。上方泳道是循环：每个返回的任务一个点，下一个超步开始处一条琥珀线。下方泳道是后台 saver：实心块是保存检查点的 put 调用，空心块是保存单个任务写入的 put_writes 调用。玫红色条带从每个任务返回时起，到它的 put_writes 结束止。这些时间跨度为 3.0 到 4.4 ms，是在一台负载较高的虚拟机上的一次运行。在第 3 步，检查点的 put 先于任务 7f67758b 的 put_writes 结束。面板之间是模型运行的数秒。</desc>
