<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" role="img" aria-labelledby="fig-5-7-title fig-5-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-7-title">assistant 的七个进程，以及每个进程留下的内容</title>
  <desc id="fig-5-7-desc">一张表，assistant 在 Mac 上运行的七个进程各占一行，每一列是进程结束时读到的一个计数。进程 3 批准了邮件、发出了邮件，随后以退出码 137 被杀。进程 4 恢复后发现同一个审批又在等待。进程 5 再次批准，send_email 第二次运行，幂等键检查跳过了发送。最后 send_email 一共运行了 2 次，发件箱里有 1 封邮件。新线程上的进程 7 在 store 里仍然找到 2 条记忆。</desc>
