  <title id="fig-7-4g-title">Claude Haiku 5.5 带 eval 工具，提示词有无要求使用</title>
  <desc id="fig-7-4g-desc">两条带，对应 39 个 chain 与 sql 任务，每个任务一个方块，显示哪些运行调用了 eval 工具：提示词没有要求时 0 次，提示词要求时 12 次。两组中每个任务都通过。下方的成对条形比较两组的模型调用数、提示词 token、输出 token、美元、eval 调用数和 eval 错误数：调用数分别为 173 和 187，成本分别为 $0.028 和 $0.038。</desc>
