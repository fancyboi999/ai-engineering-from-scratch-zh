<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" role="img" aria-labelledby="fig-2-5b-title fig-2-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5b-title">三种 v3 消费循环下，文本增量的发出与收到</title>
  <desc id="fig-2-5b-desc">三对行，时间轴以秒计，取自每种消费循环五次运行中的第 0 次，对一次 create_agent 运行使用 stream_events 版本 v3。模型是 x86 服务器虚拟机上 Ollama 里开启推理的 Qwen3 8B。它从第一秒起发出约 211 个推理增量，持续到约 31.3 s，然后在约 8.6 s 内发出 60 个文本增量。每对行的上一行标出每个文本增量的发出时刻，下一行标出循环收到它的时刻。仅文本循环与原始事件循环在几毫秒内就收到每个增量；五次运行中它们最大的延迟分别为 4.9 ms 和 0.9 ms。先读取 message.reasoning 的循环在 40.5 s 一次收到全部 60 个文本增量，最多比发出时刻晚 8786.6 ms。五次运行中，它的第一个文本增量晚了 8786.6 到 9036.1 ms。</desc>
