<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 211" role="img" aria-labelledby="fig-1-3c-title fig-1-3c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-3c-title">本次运行中 agent 的图</title>
  <desc id="fig-1-3c-desc">带一个工具的 create_agent 编译图，根据它的 draw_mermaid 输出绘制。共有 4 个节点：__start__、model、tools、__end__。一条普通边从 __start__ 到 model。三条条件边分别从 model 到 tools、从 model 到 __end__、从 tools 回到 model。tools 节点列出工具 add。</desc>
  <defs><marker id="fig-1-3c-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-1-3c-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">编译后的图</text>
  <text x="620" y="20" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">4 个节点，1 条普通边，3 条条件边</text>
  <line x1="320" y1="68" x2="320" y2="85" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3c-head-ink)"/>
  <line x1="336" y1="110" x2="378" y2="134.5" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3c-head-amber)"/>
  <line x1="304" y1="110" x2="255" y2="127" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3c-head-amber)"/>
  <line x1="271" y1="128" x2="320" y2="111" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3c-head-amber)"/>
  <rect x="274" y="44" width="92" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="320" y="60" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__start__</text>
  <rect x="278" y="86" width="84" height="24" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="320" y="101.45" font-size="11.5" text-anchor="middle" font-weight="700">model</text>
  <rect x="213" y="128" width="100" height="39" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="263" y="142.45" font-size="11.5" text-anchor="middle" font-weight="700">tools</text>
  <text x="263" y="159.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__tools = add</text>
  <rect x="339" y="135.5" width="78" height="24" rx="12" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <text x="378" y="151.5" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">__end__</text>
  <line x1="20" y1="193" x2="54" y2="193" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3c-head-ink)"/>
  <text x="62" y="197" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">plain edge</text>
  <line x1="145.4" y1="193" x2="179.4" y2="193" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3c-head-amber)"/>
  <text x="187.4" y="197" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">conditional edge, chosen at run time</text>
</svg>
