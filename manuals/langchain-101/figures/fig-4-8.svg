  <text x="44" y="381.25" font-size="12.5" font-weight="700">&#39;email&#39;</text>
  <text x="44" y="398.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">strategy=&#39;block&#39;</text>
  <rect x="250" y="364" width="324" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="262" y="381.1" font-size="12" font-weight="700">PIIDetectionError</text>
  <text x="262" y="398.3" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Detected 1 instance(s) of email in text content</text>
  <line x1="222" y1="386" x2="249" y2="386" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-8-head-rose)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-rose-ink, #b0344d)" opacity="0"><animateMotion path="M222 386 L249 386" keyPoints="0;0;1;1" keyTimes="0;0.75;0.922;1" calcMode="linear" dur="3.2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.775;0.922;1" dur="3.2s" begin="indefinite" fill="freeze"/></circle>
  <text x="600" y="391" font-size="13" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">0</text>
  </g>
  <text x="20" y="442" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每行是一次运行。灰色：输入原本的内容。粗体：实际保存并发送的内容。</text>
  <text x="20" y="458" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">只有最新的用户消息发生了变化，因为 apply_to_input 是默认值。</text>
</svg>
