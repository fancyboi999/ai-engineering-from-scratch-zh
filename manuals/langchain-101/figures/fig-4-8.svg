<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" role="img" aria-labelledby="fig-4-8-title fig-4-8-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-8-title">同一输入上的四种 PII 策略</title>
  <desc id="fig-4-8-desc">一条用户消息包含一个电子邮件地址、一个卡号、一个 IP 地址和一个 URL，各自用匹配它的那一行的颜色画下划线。五行各运行一个 PIIMiddleware。email 配合 redact 把“ada@example.com”替换成“[REDACTED_EMAIL]”；credit_card 配合 mask 把“4111 1111 1111”替换成“**** **** ****”；ip 配合 hash 把“192.168.1.20”替换成“&lt;ip_hash:55235459&gt;”；url 配合 redact 把“https://example.com/x”替换成“[REDACTED_URL]”。email 配合 block 抛出 PIIDetectionError，“Detected 1 instance(s) of email in text content”，模型收到 0 次调用。其他每次运行都有 1 次模型调用，且只有最新用户消息中匹配的片段发生了变化。</desc>
  <defs><marker id="fig-4-8-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-4-8-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">用户消息</text>
  <rect x="20" y="28" width="600" height="76" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <line x1="68" y1="65" x2="176" y2="65" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="122" y="46" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">1</text>
  <line x1="226.4" y1="65" x2="327.2" y2="65" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="276.8" y="46" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">2</text>
  <text x="32" y="60" font-size="12">Mail ada@example.com, card 4111 1111 1111 1111,</text>
  <line x1="68" y1="97" x2="154.4" y2="97" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="111.2" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">3</text>
  <line x1="197.6" y1="97" x2="348.8" y2="97" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="273.2" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">4</text>
  <text x="32" y="92" font-size="12">from 192.168.1.20, see https://example.com/x</text>
  <text x="32" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">PIIMIDDLEWARE</text>
  <text x="250" y="128" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">匹配的片段变成</text>
  <text x="620" y="128" font-size="11" text-anchor="end" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">模型调用</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <circle cx="16" cy="162" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="166" font-size="11" text-anchor="middle">1</text>
  <rect x="32" y="140" width="190" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="44" y="157.25" font-size="12.5" font-weight="700">&#39;email&#39;</text>
  <text x="44" y="174.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">strategy=&#39;redact&#39;</text>
  <rect x="250" y="140" width="324" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="262" y="158" font-size="11" fill="var(--m-ink-mute, #666660)">ada@example.com</text>
  <text x="262" y="175" font-size="12" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">[REDACTED_EMAIL]</text>
  <line x1="222" y1="162" x2="249" y2="162" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M222 162 L249 162" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" calcMode="linear" dur="0.8s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.1;0.688;1" dur="0.8s" begin="indefinite" fill="freeze"/></circle>
  <text x="600" y="167" font-size="13" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">1</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <circle cx="16" cy="218" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="222" font-size="11" text-anchor="middle">2</text>
  <rect x="32" y="196" width="190" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="44" y="213.25" font-size="12.5" font-weight="700">&#39;credit_card&#39;</text>
  <text x="44" y="230.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">strategy=&#39;mask&#39;</text>
  <rect x="250" y="196" width="324" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="262" y="214" font-size="11" fill="var(--m-ink-mute, #666660)">4111 1111 1111</text>
  <text x="262" y="231" font-size="12" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">**** **** ****</text>
  <line x1="222" y1="218" x2="249" y2="218" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M222 218 L249 218" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" calcMode="linear" dur="1.4s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.429;0.486;0.821;1" dur="1.4s" begin="indefinite" fill="freeze"/></circle>
  <text x="600" y="223" font-size="13" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">1</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <circle cx="16" cy="274" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="278" font-size="11" text-anchor="middle">3</text>
  <rect x="32" y="252" width="190" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="44" y="269.25" font-size="12.5" font-weight="700">&#39;ip&#39;</text>
  <text x="44" y="286.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">strategy=&#39;hash&#39;</text>
  <rect x="250" y="252" width="324" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="262" y="270" font-size="11" fill="var(--m-ink-mute, #666660)">192.168.1.20</text>
  <text x="262" y="287" font-size="12" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">&lt;ip_hash:55235459&gt;</text>
  <line x1="222" y1="274" x2="249" y2="274" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M222 274 L249 274" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" calcMode="linear" dur="2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.875;1" dur="2s" begin="indefinite" fill="freeze"/></circle>
  <text x="600" y="279" font-size="13" text-anchor="middle" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">1</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <circle cx="16" cy="330" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="16" y="334" font-size="11" text-anchor="middle">4</text>
