<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" role="img" aria-labelledby="fig-8-1b-title fig-8-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-1b-title">各 multitask 策略下运行 A 与运行 B 的节点</title>
  <desc id="fig-8-1b-desc">时间轴 0 到 7 秒上的四条轨道，每条是 x86 服务器虚拟机上 langgraph dev 下的一个线程。运行 A 运行两个各 2 s 的节点，运行 B 约 1 s 后在同一线程上发出，运行两个各 1 s 的节点。reject 下，B 被以 HTTP 409 拒绝，A 完成。enqueue 下，B 在 A 于 4.8 s 结束时开始。interrupt 下，B 在 1.0 s 开始，A 的第一个节点永远没有完成。rollback 下，A 的第一个节点在 B 发出前刚好开始，B 在 1.0 s 开始，A 被删除。</desc>
  <line x1="214" y1="30" x2="214" y2="318" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="214" y="22" font-size="11" text-anchor="middle" font-weight="700" fill="var(--m-rose-ink, #b0344d)">运行 B 发出</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <text x="20" y="46" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">REJECT</text>
  <text x="20" y="62" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">B 被拒绝，HTTP 409</text>
  <text x="136" y="80" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="100" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="76" x2="598" y2="76" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="96" x2="598" y2="96" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="205.04" y="68" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="269.04" y="80" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">first</text>
  <rect x="333.04" y="68" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="397.04" y="80" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">second</text>
  <rect class="m-knock" x="217" y="89.42" width="80.8" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="220" y="100" font-size="11" fill="var(--m-rose-ink, #b0344d)">409，没有运行</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <text x="20" y="116" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">ENQUEUE</text>
  <text x="20" y="132" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">B 等 A 结束后再运行</text>
  <text x="136" y="150" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="170" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="146" x2="598" y2="146" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="166" x2="598" y2="166" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="200.56" y="138" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="264.56" y="150" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">first</text>
  <rect x="328.56" y="138" width="126" height="16" fill="var(--m-amber-ink, #85590c)"/>
  <text x="392.56" y="150" font-size="11" text-anchor="middle" fill="var(--m-paper, #fafaf5)">second</text>
  <rect x="457.2" y="158" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="489.2" y="170" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="521.2" y="158" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="553.2" y="170" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">second</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <text x="20" y="186" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">INTERRUPT</text>
  <text x="20" y="202" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A 被中断，其节点丢失</text>
  <text x="136" y="220" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="240" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="216" x2="598" y2="216" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="236" x2="598" y2="236" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="196.08" y="208" width="17.92" height="16" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect class="m-knock" x="221" y="209.42" width="142.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="224" y="220" font-size="11" fill="var(--m-rose-ink, #b0344d)">A 的 first 节点从未写入</text>
  <rect x="215.28" y="228" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="247.28" y="240" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="279.28" y="228" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="311.28" y="240" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">second</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <text x="20" y="256" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">ROLLBACK</text>
  <text x="20" y="272" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A 被删除，B 单独运行</text>
  <text x="136" y="290" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">A</text>
  <text x="136" y="310" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">B</text>
  <line x1="150" y1="286" x2="598" y2="286" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="150" y1="306" x2="598" y2="306" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="212.72" y="278" width="8" height="16" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <rect class="m-knock" x="227.72" y="279.42" width="142.4" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="230.72" y="290" font-size="11" fill="var(--m-rose-ink, #b0344d)">A 的 first 节点从未写入</text>
  <rect x="215.28" y="298" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="247.28" y="310" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">first</text>
  <rect x="279.28" y="298" width="62" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="311.28" y="310" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">second</text>
  </g>
  <line x1="150" y1="326" x2="598" y2="326" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="150" y1="322" x2="150" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="150" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0 s</text>
  <line x1="214" y1="322" x2="214" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="214" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1 s</text>
  <line x1="278" y1="322" x2="278" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="278" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2 s</text>
  <line x1="342" y1="322" x2="342" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="342" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">3 s</text>
  <line x1="406" y1="322" x2="406" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="406" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4 s</text>
  <line x1="470" y1="322" x2="470" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="470" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">5 s</text>
  <line x1="534" y1="322" x2="534" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="534" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">6 s</text>
  <line x1="598" y1="322" x2="598" y2="330" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="598" y="344" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">7 s</text>
  <text x="20" y="370" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A 行：运行 A 的节点，实心。B 行：运行 B 的节点，空心。玫红虚线：开始了</text>
  <text x="20" y="386" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">却从未写入的 A 节点。时间来自节点事件，各运行一次。</text>
</svg>
