<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 732" role="img" aria-labelledby="fig-8-2-title fig-8-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-2-title">Agent Chat UI 一次审批的请求</title>
  <desc id="fig-8-2-desc">三条生命线：浏览器中的 Agent Chat UI、langgraph dev 下的 Agent Server，以及 Ollama 上的 agent 图。步骤 1，加载时 UI 调用 GET /info 和 POST /threads/search（graph_id 为 agent，limit 为 100），线程的第一条消息会调用 POST /threads。步骤 2，消息以 POST runs/stream 发出，流模式为 values, messages-tuple, custom，on_disconnect 为 continue。模型在 POST 之后 15.20 s 返回完整的 send_email 调用，一个 messages 事件携带它，一个 values 事件携带 __interrupt__。UI 随后调用 POST /history。步骤 3，Approve 发出 POST runs/stream，带 command.resume 的 decisions approve、on_disconnect cancel 和 stream_resumable false。工具运行，首个 token 在 POST 之后 2.72 s 到达，UI 再晚 0.09 s 把它绘出。</desc>
