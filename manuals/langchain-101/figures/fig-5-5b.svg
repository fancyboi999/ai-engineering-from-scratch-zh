<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-5-5b-title fig-5-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-5b-title">一个线程的存储量随步数的变化，普通通道与 DeltaChannel 对比</title>
  <desc id="fig-5-5b-desc">双对数点图，展示一个线程的存储量（MB）与步数（10 到 5,000）的关系，使用 x86 服务器虚拟机上的 PostgresSaver。普通通道存储 0.05、3.08、292.58 和 7289.37 MB。每 100 步做一次快照的 DeltaChannel 在 5,000 步时存储 81.2 MB，每 1,000 步做一次快照的存储 15.7 MB。</desc>
