<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-6-8-title fig-6-8-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-8-title">节点一次尝试失败后的路径</title>
  <desc id="fig-6-8-desc">一张决策图。节点的一次尝试抛出异常，或超过超时而以 NodeTimeoutError 失败。第一道判断是 retry_on 是否匹配且还有剩余尝试：是，则再次运行节点，如 flaky 在 retry_on 为 ValueError 时的第 1 到 3 次尝试。若没有剩余尝试，或异常不被 retry_on 接受，下一道判断是 error_handler。有处理器时，运行节点 __error_handler__flaky，它的 Command 转到 report。没有处理器时，invoke 抛出异常，如默认 retry_on 下第 1 次尝试就失败的 ValueError upstream failed。</desc>
  <defs><marker id="fig-6-8-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-6-8-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="170" y="14" width="300" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="320" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">节点一次尝试失败</text>
  <text x="320" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">抛出异常，或 NodeTimeoutError</text>
  <rect x="500" y="14" width="126" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="563" y="31.1" font-size="12" text-anchor="middle" font-weight="700">超时</text>
  <text x="563" y="48.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">slow，0.05 s</text>
  <line x1="499" y1="36" x2="471" y2="36" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-8-head-rose)"/>
  <rect x="170" y="100" width="300" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="117.25" font-size="12.5" text-anchor="middle" font-weight="700">retry_on 匹配且还有尝试次数？</text>
  <text x="320" y="134.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">节点的 RetryPolicy</text>
  <line x1="320" y1="58" x2="320" y2="99" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-8-head-rose)"/>
  <path d="M170 122 H150 V36 H169" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-8-head-ink)"/>
  <text x="20" y="74" font-size="11.5" font-weight="700">是：再次运行</text>
  <text x="20" y="90" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">flaky，第 1 到 3 次尝试</text>
  <rect x="170" y="196" width="300" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="213.25" font-size="12.5" text-anchor="middle" font-weight="700">设置了 error_handler？</text>
  <text x="320" y="230.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">设在节点上，或经 set_node_defaults 设置</text>
  <line x1="320" y1="144" x2="320" y2="195" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-8-head-ink)"/>
  <rect class="m-knock" x="325" y="158.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="169.5" font-size="11.5">否</text>
  <rect class="m-knock" x="325" y="173.92" width="174.74" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="184.5" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">默认 retry_on 下的 ValueError</text>
  <rect x="20" y="296" width="280" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="160" y="313.25" font-size="12.5" text-anchor="middle" font-weight="700">__error_handler__flaky</text>
  <text x="160" y="330.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Command(goto=&#39;report&#39;)</text>
  <path d="M260 240 V268 H160 V295" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-8-head-ink)"/>
  <text x="150" y="262" font-size="11.5" text-anchor="end" font-weight="700">是</text>
  <rect x="340" y="296" width="280" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="480" y="313.25" font-size="12.5" text-anchor="middle" font-weight="700">invoke 抛出异常</text>
  <text x="480" y="330.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ValueError: upstream failed on try 1</text>
  <path d="M380 240 V268 H480 V295" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-6-8-head-rose)"/>
  <text x="490" y="262" font-size="11.5" font-weight="700">否</text>
  <rect x="20" y="364" width="280" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="160" y="381.25" font-size="12.5" text-anchor="middle" font-weight="700">report</text>
  <text x="160" y="398.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">status: recovered from flaky</text>
  <line x1="160" y1="340" x2="160" y2="363" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-8-head-ink)"/>
  <text x="340" y="392" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">只有左侧路径让运行继续。</text>
  <text x="340" y="408" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">右侧路径让运行终止。</text>
</svg>
