<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-labelledby="fig-task-states-title fig-task-states-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-task-states-title">九种任务状态与套件的转换</title>
  <desc id="fig-task-states-desc">九个 TaskState 值去掉 TASK_STATE_ 前缀，按采集顺序显示套件转换。05 中 SUBMITTED 转 WORKING，03、05 中 WORKING 结束为 COMPLETED。06 中 reviewer 提问时 SUBMITTED 转 INPUT_REQUIRED，客户端回答时回到 WORKING。07 中 WORKING 转 AUTH_REQUIRED，操作员批准后恢复。08 中 deployer 拒绝生产部署，SUBMITTED 转 REJECTED。09 中缺少提交使 WORKING 结束为 FAILED，10 中 CancelTask 使其结束为 CANCELED。四种终态有双边框，无出边。零值 UNSPECIFIED 独立显示，套件从不发送。</desc>
  <defs><marker id="fig-task-states-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <rect x="20" y="56" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="90" y="72.25" font-size="12.5" text-anchor="middle" font-weight="700">AUTH_REQUIRED</text>
  <text x="90" y="89.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 8</text>
  <rect x="20" y="168" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="90" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">SUBMITTED</text>
  <text x="90" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 1</text>
  <rect x="250" y="168" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">WORKING</text>
  <text x="320" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 2</text>
  <rect x="250" y="290" width="140" height="42" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="320" y="306.25" font-size="12.5" text-anchor="middle" font-weight="700">INPUT_REQUIRED</text>
  <text x="320" y="323.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 6</text>
  <text x="470" y="12" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">终态</text>
  <rect x="470" y="20" width="150" height="54" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="473" y="23" width="144" height="48" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="545" y="34.75" font-size="12.5" text-anchor="middle" font-weight="700">COMPLETED</text>
  <text x="545" y="52.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 3</text>
  <text x="545" y="67.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">见 03 05 06 07</text>
  <rect x="470" y="92" width="150" height="54" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="473" y="95" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="106.75" font-size="12.5" text-anchor="middle" font-weight="700">FAILED</text>
  <text x="545" y="124.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 4</text>
  <text x="545" y="139.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">提交缺失，见 09</text>
  <rect x="470" y="162" width="150" height="54" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="473" y="165" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="176.75" font-size="12.5" text-anchor="middle" font-weight="700">CANCELED</text>
  <text x="545" y="194.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 5</text>
  <text x="545" y="209.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CancelTask，见 10</text>
  <rect x="470" y="324" width="150" height="54" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="473" y="327" width="144" height="48" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="545" y="338.75" font-size="12.5" text-anchor="middle" font-weight="700">REJECTED</text>
  <text x="545" y="356.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 7</text>
  <text x="545" y="371.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">见 08</text>
  <rect x="20" y="396" width="140" height="42" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="90" y="412.25" font-size="12.5" text-anchor="middle" font-weight="700">UNSPECIFIED</text>
  <text x="90" y="429.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">值 0，未使用</text>
  <text x="176" y="414" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">所有名称省略 TASK_STATE_ 前缀。</text>
  <text x="176" y="430" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">虚线框：中断态。双边框：终态。</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <line x1="160" y1="189" x2="249" y2="189" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-task-states-head-amber)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-amber-ink, #85590c)" opacity="0"><animateMotion path="M160 189 L249 189" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" calcMode="linear" dur="0.8s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.1;0.688;1" dur="0.8s" begin="indefinite" fill="freeze"/></circle>
  <text x="205" y="183" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">开始（05）</text>
  </g>
