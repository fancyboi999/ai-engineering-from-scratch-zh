<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="plate-planner-run-title plate-planner-run-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-planner-run-title">一个 planner，三个远程 agent</title>
  <desc id="plate-planner-run-desc">左侧为 capture/planner.py 的 planner，三条泳道各对应一次委派，按运行顺序排列。每条泳道中 planner 调用显示端口和技能的远程 agent，agent 运行显示状态的任务。test-runner 完成，13 passed。code-reviewer 询问基准分支，planner 回答 main，任务完成并给出一项发现。deployer 在 TASK_STATE_AUTH_REQUIRED 等待操作员批准，planner 用 SubscribeToTask 跟踪，随后完成。</desc>
