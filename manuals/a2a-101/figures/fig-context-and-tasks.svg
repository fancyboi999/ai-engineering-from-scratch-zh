<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-context-and-tasks-title fig-context-and-tasks-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-context-and-tasks-title">一个上下文，两个任务</title>
  <desc id="fig-context-and-tasks-desc">树图根为上下文 49c5a238。第一个子节点是已完成审查任务 e5c95b09，历史包含两次 SendMessage 的四条消息：planner 的 diff 请求、agent 问题、带 taskId 和 contextId 的 planner 回答 main、agent 回复，之后是产物 review.json。第二个子节点为同上下文的后续任务，采集未到此处，因此用虚线绘制。其首条消息携带 contextId 49c5a238、referenceTaskIds 引用 e5c95b09，不带 taskId。</desc>
