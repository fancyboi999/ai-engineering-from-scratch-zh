  <text x="170" y="116.25" font-size="12.5" text-anchor="middle" font-weight="700">任务 e5c95b09 · 审查</text>
  <text x="170" y="133.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TASK_STATE_COMPLETED, status: 2 findings</text>
  <path d="M36 146 V399" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
