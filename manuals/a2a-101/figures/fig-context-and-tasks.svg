  <rect x="190" y="12" width="260" height="46" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="320" y="31" font-size="12.5" text-anchor="middle" font-weight="700">上下文 49c5a238</text>
  <text x="320" y="48" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">code-reviewer 创建，对你不透明</text>
