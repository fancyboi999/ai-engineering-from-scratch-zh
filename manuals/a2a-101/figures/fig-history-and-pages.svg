<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-labelledby="fig-history-and-pages-title fig-history-and-pages-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-history-and-pages-title">历史规则与列表分页</title>
  <desc id="fig-history-and-pages-desc">顶部为审查任务 e5c95b09 的存储历史，history[0] 至 history[3] 四条消息，另有从不属于历史的当前状态消息 2 findings。historyLength 未设置时 GetTask 返回全部四条，值为 1 时只返回 history[3]，为 0 时无 history 字段。底部为 test-runner 的五个任务，按状态时间戳最新优先排序。pageSize 2 的 ListTasks 先返回 f22ed7af、8ae21dcb，再返回 728ba084、d0c28826，每页末尾是不透明的下一页游标 token。第五个任务 3d8f7801 未被请求。两页都没有产物或历史。第三次调用按 TASK_STATE_CANCELED 过滤，不带 historyLength，得到 f22ed7af 及完整历史。</desc>
