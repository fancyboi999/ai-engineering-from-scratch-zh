<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" role="img" aria-labelledby="fig-trust-boundaries-title fig-trust-boundaries-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-trust-boundaries-title">套件中的信任边界</title>
  <desc id="fig-trust-boundaries-desc">六行按 planner 遇到的顺序展示套件双方之间的数据跨界位置。agent 卡片：伪造卡片将消息送往别处，planner 因此通过 HTTPS 验证签名。回复 part 如 review.json：文本可能写成指令，planner 验证 data part，按有类型字段决策。文件与 URL part：恶意文件或 agent 获取任意 URL，agent 检查类型、大小和 URL。webhook URL：SSRF，agent 拒绝私有主机。入站通知：伪造，planner 检查 Authorization 和任务 ID。存储记录：秘密明文保存，agent 脱敏、限定读取范围并设置保留期。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">数据跨界位置</text>
  <text x="232" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">威胁</text>
  <text x="432" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">检查</text>
