<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="fig-reading-a-sequence-title fig-reading-a-sequence-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-reading-a-sequence-title">如何阅读本手册时序图</title>
  <desc id="fig-reading-a-sequence-desc">五条生命线：planner、test-runner、test-runner 的任务存储、/a2a-events 的 webhook 接收器、操作员。八个编号行各展示一种箭头样式：SendMessage 为墨色实线调用，任务保存为青色实线写入，TASK_STATE_WORKING 为琥珀色虚线状态变化，statusUpdate 流帧和推送 POST 为靛蓝色点线事件，planner 向操作员请求批准为 A2A 之外的橄榄色虚线效果，TaskNotFoundError 为玫红色虚线失败，SendMessage 结果为墨色虚线回复。</desc>
