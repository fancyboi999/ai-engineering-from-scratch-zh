<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="fig-spec-layers-title fig-spec-layers-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-spec-layers-title">test-runner 的 A2A 协议栈</title>
  <desc id="fig-spec-layers-desc">顶部是客户端 agent planner，含卡片缓存与接口选择。下方是 A2A 为 localhost:41241 的 test-runner 定义的三层：包含 /.well-known/agent-card.json、/a2a/jsonrpc、/a2a/rest 路径的绑定，操作，数据模型。虚线下是 test-runner 自建的 HTTP 路由器、请求处理器、任务存储、事件广播，再下面是不透明的 agent 逻辑，真实 agent 也在这里放模型与工具。</desc>
  <defs><marker id="fig-spec-layers-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">客户端 AGENT</text>
