  <line x1="548" y1="26" x2="552" y2="26" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
  <line x1="548" y1="90" x2="552" y2="90" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1"/>
