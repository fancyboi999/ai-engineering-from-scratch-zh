  <text x="20" y="118" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A2A 协议</text>
  <rect x="20" y="126" width="520" height="60" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="28" y="143" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">卡片与</text>
  <text x="28" y="157" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">绑定</text>
  <rect x="20" y="192" width="520" height="60" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="28" y="209" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">操作</text>
  <rect x="20" y="258" width="520" height="46" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #6f6f6a)"/>
  <text x="28" y="275" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">数据模型</text>
