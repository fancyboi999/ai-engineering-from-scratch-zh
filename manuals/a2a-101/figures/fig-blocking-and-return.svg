<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" role="img" aria-labelledby="fig-blocking-and-return-title fig-blocking-and-return-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-blocking-and-return-title">阻塞调用与立即返回调用</title>
  <desc id="fig-blocking-and-return-desc">两条时间线在请求处对齐，使用套件时钟。A：任务 3d8f7801 的阻塞 SendMessage 在 TASK_STATE_SUBMITTED、TASK_STATE_WORKING 和六个产物分块到达期间保持打开，客户端看不到这两种状态。09:00:00.750 到 TASK_STATE_COMPLETED 时回复。B：任务 d0c28826 的 SendMessage 设置 returnImmediately，在 09:00:01.000 的 TASK_STATE_SUBMITTED 返回。首次 GetTask 在 09:00:01.250 看到 TASK_STATE_WORKING 和一个日志 part，第二次在 09:00:01.500 看到 TASK_STATE_COMPLETED 及全部产物。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">A · 阻塞</text>
  <text x="150" y="18" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SendMessage 无 configuration，任务 3d8f7801</text>
  <line x1="40" y1="64" x2="620" y2="64" stroke="var(--m-ink-mute, #666660)" stroke-width="1"/>
  <text x="20" y="118" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">B · 立即返回</text>
  <text x="150" y="118" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">returnImmediately 后 GetTask 两次，任务 d0c28826</text>
  <line x1="40" y1="164" x2="620" y2="164" stroke="var(--m-ink-mute, #666660)" stroke-width="1"/>
  <line x1="40" y1="212" x2="620" y2="212" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="200" y1="208" x2="200" y2="216" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="200" y="230" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">TASK_STATE_SUBMITTED</text>
  <line x1="360" y1="208" x2="360" y2="216" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="360" y="230" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">TASK_STATE_WORKING</text>
  <line x1="520" y1="208" x2="520" y2="216" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="520" y="230" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">TASK_STATE_COMPLETED</text>
  <text x="20" y="230" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">套件时钟</text>
  <circle cx="30" cy="254" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="30" y="258" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1</text>
  <text x="48" y="258" font-size="11" class="m-serif">阻塞 SendMessage：一次回复，已完成任务含 test-log.txt 和 summary.json</text>
  <circle cx="30" cy="274" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="30" y="278" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">2</text>
  <text x="48" y="278" font-size="11" class="m-serif">带 returnImmediately 的 SendMessage：回复含 TASK_STATE_SUBMITTED</text>
  <circle cx="30" cy="294" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
  <text x="30" y="298" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">3</text>
  <text x="48" y="298" font-size="11" class="m-serif">GetTask，historyLength 0：TASK_STATE_WORKING 和五个日志 part 的第一个</text>
  <circle cx="30" cy="314" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1"/>
