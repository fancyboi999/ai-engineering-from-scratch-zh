<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="fig-task-object-model-title fig-task-object-model-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-task-object-model-title">一个任务的对象模型</title>
  <desc id="fig-task-object-model-desc">虚线框标记上下文 ac3830af。框内以表格绘制阻塞运行的任务 3d8f7801，按运行填写顺序出现：id、contextId，随后两条 history 消息，带各自角色的 user 消息 21636369、agent 消息 10cc3c92，再是带名称及 part 数量的 test-log、summary 产物，最后 status.state 为 TASK_STATE_COMPLETED、status.message 为 1 failed, 11 passed、status.timestamp 为 2026-10-06T09:00:00.750Z。下方四个小块说明 part 恰好包含 text、raw、url、data 之一，各有一个示例。</desc>
  <rect x="26" y="40" width="310" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="38" y="57.6" font-size="12" font-weight="700">Task</text>
  <text x="20" y="324" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">每条消息和每个产物都包含 PART</text>
  <rect x="20" y="332" width="144" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="92" y="350.1" font-size="12" text-anchor="middle" font-weight="700">text</text>
  <text x="92" y="367.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">collected 12 items</text>
  <rect x="172" y="332" width="144" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="244" y="350.1" font-size="12" text-anchor="middle" font-weight="700">raw</text>
  <text x="244" y="367.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">refunds.diff, base64</text>
  <rect x="324" y="332" width="144" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="396" y="350.1" font-size="12" text-anchor="middle" font-weight="700">url</text>
  <text x="396" y="367.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">screenshot.png</text>
  <rect x="476" y="332" width="144" height="46" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="548" y="350.1" font-size="12" text-anchor="middle" font-weight="700">data</text>
  <text x="548" y="367.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">&quot;passed&quot;: 11</text>
  <text x="20" y="400" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每个 part 恰好包含这四种内容之一，还可有 mediaType、filename、metadata。</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <rect x="14" y="8" width="612" height="290" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-dasharray="5 4"/>
  <text x="26" y="28" font-size="12" font-weight="700">上下文 ac3830af</text>
  <text x="158" y="28" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">归组相关任务和消息，本次运行创建一个任务</text>
