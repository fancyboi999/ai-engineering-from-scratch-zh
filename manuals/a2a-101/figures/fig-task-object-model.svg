  <text x="372" y="70.8" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">name: test-log.txt</text>
  <text x="372" y="85.8" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">parts：5 个 text part</text>
  <rect x="360" y="98" width="256" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
