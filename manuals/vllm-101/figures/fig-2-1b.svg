  <text x="20" y="148" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">最大并发量为 2.94，即启动日志中的数值</text>
  <text x="20" y="176" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">每个用户使用 640 个 TOKEN 时</text>
