<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-2-1b-title fig-2-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1b-title">缓存池 token 容量决定可容纳的用户数</title>
  <desc id="fig-2-1b-desc">L4 的缓存池可容纳 24,096 个 token。启动日志报告并发量 2.94，因为它假设每个用户都使用满 8,192-token 上下文。提示词为 512 token、输出为 128 token 时，每个用户占 640 token，因此可容纳 37 个用户。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">L4 上的 QWEN3-8B KV 缓存池</text>
  <rect x="20" y="28" width="600" height="34" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="var(--m-green-ink, #336b40)">24,096 个 token；每个 144 KiB，共 3.31 GiB</text>
  <text x="20" y="92" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">每个用户都使用 8,192 个 TOKEN 时</text>
  <rect x="20" y="100" width="200.98" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <rect x="223.98" y="100" width="200.98" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
