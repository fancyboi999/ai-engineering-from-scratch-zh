<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 654" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">每项排障信息：症状、第一项检查和修复位置</title>
  <desc id="fig-7-1-desc">24 种症状分为五组：服务器无法启动、请求失败、服务器速度较慢、输出不正确和基准测试结果异常。每行给出优先检查的日志或指标，以及对应的修复章节或操作。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">症状</text>
  <text x="300" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">首先检查</text>
  <text x="500" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">再修复</text>
  <rect x="20" y="33" width="600" height="16" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="28" y="45" font-size="11" font-weight="700">服务器无法启动</text>
  <text x="28" y="66" font-size="11">下载模型时卡住</text>
  <text x="300" y="66" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">缓存目录大小</text>
  <text x="500" y="66" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">hf download</text>
  <line x1="20" y1="73" x2="620" y2="73" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="87" font-size="11">模型不受支持</text>
  <text x="300" y="87" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">错误中的架构名称</text>
  <text x="500" y="87" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">支持列表</text>
  <line x1="20" y1="94" x2="620" y2="94" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="108" font-size="11">driver 或 PTX 错误</text>
  <text x="300" y="108" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">错误文本</text>
  <text x="500" y="108" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">升级 driver</text>
  <line x1="20" y1="115" x2="620" y2="115" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="129" font-size="11">KV cache 无法满足最大长度</text>
  <text x="300" y="129" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">错误中的长度</text>
  <text x="500" y="129" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.2</text>
  <line x1="20" y1="136" x2="620" y2="136" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="150" font-size="11">空闲显存不足</text>
  <text x="300" y="150" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">nvidia-smi</text>
  <text x="500" y="150" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.2</text>
  <line x1="20" y1="157" x2="620" y2="157" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="171" font-size="11">FP8 KV cache 导致崩溃</text>
  <text x="300" y="171" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">backend 日志行</text>
  <text x="500" y="171" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.4</text>
  <line x1="20" y1="178" x2="620" y2="178" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="192" font-size="11">DGX Spark 显存不足</text>
  <text x="300" y="192" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">free -g</text>
  <text x="500" y="192" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.3</text>
  <line x1="20" y1="199" x2="620" y2="199" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="213" font-size="11">GB10 首次启动缓慢</text>
  <text x="300" y="213" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Model loading took</text>
  <text x="500" y="213" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.3</text>
  <line x1="20" y1="220" x2="620" y2="220" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="234" font-size="11">编译阶段失败</text>
  <text x="300" y="234" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">torch.compile 错误</text>
  <text x="500" y="234" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">清除缓存</text>
  <line x1="20" y1="241" x2="620" y2="241" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="255" font-size="11">多 GPU 启动卡住</text>
  <text x="300" y="255" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">NCCL_DEBUG=TRACE</text>
  <text x="500" y="255" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">6.1</text>
  <line x1="20" y1="262" x2="620" y2="262" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="276" font-size="11">最大长度变短</text>
  <text x="300" y="276" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">推导长度</text>
  <text x="500" y="276" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">2.6</text>
  <line x1="20" y1="283" x2="620" y2="283" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <rect x="20" y="286" width="600" height="16" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="28" y="298" font-size="11" font-weight="700">请求失败</text>
  <text x="28" y="319" font-size="11">HTTP 400，超出 context length</text>
  <text x="300" y="319" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">错误中的 token 数</text>
  <text x="500" y="319" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">缩短请求</text>
  <line x1="20" y1="326" x2="620" y2="326" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="340" font-size="11">所有请求都失败</text>
  <text x="300" y="340" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">EngineCore 错误</text>
  <text x="500" y="340" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">重启</text>
  <line x1="20" y1="347" x2="620" y2="347" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <rect x="20" y="350" width="600" height="16" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="28" y="362" font-size="11" font-weight="700">服务器速度较慢</text>
  <text x="28" y="383" font-size="11">首 token 等待数秒</text>
  <text x="300" y="383" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">waiting 与 KV 使用率</text>
  <text x="500" y="383" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.1</text>
  <line x1="20" y1="390" x2="620" y2="390" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="404" font-size="11">并发用户多，token 间隔长</text>
  <text x="300" y="404" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">P99 对比中位数</text>
  <text x="500" y="404" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.3</text>
  <line x1="20" y1="411" x2="620" y2="411" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="425" font-size="11">preemption 增长</text>
  <text x="300" y="425" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">num_preemptions</text>
  <text x="500" y="425" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.1</text>
  <line x1="20" y1="432" x2="620" y2="432" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="446" font-size="11">N-gram 收益较低</text>
  <text x="300" y="446" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">async warning</text>
  <text x="500" y="446" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">4.2</text>
  <line x1="20" y1="453" x2="620" y2="453" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="467" font-size="11">eager mode 首次启动慢</text>
  <text x="300" y="467" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">首批请求</text>
  <text x="500" y="467" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">4.3</text>
  <line x1="20" y1="474" x2="620" y2="474" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="488" font-size="11">GB10 上 NVFP4 较慢</text>
  <text x="300" y="488" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TPOT 对比 0.28</text>
  <text x="500" y="488" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">固定版本</text>
  <line x1="20" y1="495" x2="620" y2="495" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <rect x="20" y="498" width="600" height="16" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="28" y="510" font-size="11" font-weight="700">输出不正确</text>
  <text x="28" y="531" font-size="11">回答开头包含 think</text>
  <text x="300" y="531" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">content 字段</text>
  <text x="500" y="531" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.10</text>
  <line x1="20" y1="538" x2="620" y2="538" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="552" font-size="11">命中缓存后重复一个 token</text>
  <text x="300" y="552" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">cache hit 与 spec</text>
  <text x="500" y="552" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">关闭其中一个</text>
  <line x1="20" y1="559" x2="620" y2="559" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="573" font-size="11">开启 spec 后 JSON 无效</text>
  <text x="300" y="573" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">关闭 spec 再运行</text>
  <text x="500" y="573" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.5</text>
  <line x1="20" y1="580" x2="620" y2="580" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <text x="28" y="594" font-size="11">不同运行输出变化</text>
  <text x="300" y="594" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">单独发送相同请求</text>
  <text x="500" y="594" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">3.8</text>
  <line x1="20" y1="601" x2="620" y2="601" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
  <rect x="20" y="604" width="600" height="16" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="28" y="616" font-size="11" font-weight="700">基准测试结果异常</text>
  <text x="28" y="637" font-size="11">第二次运行更快</text>
  <text x="300" y="637" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">prefix cache hits</text>
  <text x="500" y="637" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">5.1</text>
  <line x1="20" y1="644" x2="620" y2="644" stroke="var(--m-grey-ink, #5e5e59)" stroke-width="1"/>
</svg>
