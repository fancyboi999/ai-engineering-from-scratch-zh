<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="fig-4-2-title fig-4-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2-title">单用户使用 n-gram speculation 后，每 token 耗时约降至三分之一</title>
  <desc id="fig-4-2-desc">NVIDIA L4 使用 Qwen3-8B、小型 KV 缓存池、两个随机种子和随机提示词时，每个输出 token 的耗时中位数。单用户时，不使用 speculation 为 241.7 ms，使用 n-gram 为 76.6 ms。四用户时分别为 272.6 ms 和 101.3 ms。四次运行的 GPU 时钟均为 375 至 443 MHz。</desc>
  <line x1="66" y1="250" x2="606" y2="250" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="60" y="254" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="66" y1="183.33" x2="606" y2="183.33" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="60" y="187.33" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="66" y1="116.67" x2="606" y2="116.67" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="60" y="120.67" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <line x1="66" y1="50" x2="606" y2="50" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="60" y="54" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">300</text>
  <line x1="66" y1="250" x2="606" y2="250" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="66" y1="50" x2="66" y2="250" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="66" y="38" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每 token 耗时中位数，ms</text>
  <rect x="98.5" y="88.87" width="70" height="161.13" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="133.5" y="82.87" font-size="11" text-anchor="middle" fill="var(--m-grey-ink, #5e5e59)">241.7</text>
  <text x="133.5" y="267" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1 个用户，不使用</text>
  <rect x="233.5" y="198.95" width="70" height="51.05" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="268.5" y="192.95" font-size="11" text-anchor="middle" fill="var(--m-green-ink, #336b40)">76.6</text>
  <text x="268.5" y="267" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1 个用户，n-gram</text>
  <rect x="368.5" y="68.27" width="70" height="181.73" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="403.5" y="62.27" font-size="11" text-anchor="middle" fill="var(--m-grey-ink, #5e5e59)">272.6</text>
  <text x="403.5" y="267" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4 个用户，不使用</text>
  <rect x="503.5" y="182.5" width="70" height="67.5" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="538.5" y="176.5" font-size="11" text-anchor="middle" fill="var(--m-green-ink, #336b40)">101.3</text>
  <text x="538.5" y="267" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4 个用户，n-gram</text>
  <text x="66" y="306" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">数值越低越快。使用随机提示词，未记录 acceptance counter。</text>
</svg>
