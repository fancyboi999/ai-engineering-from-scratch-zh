<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">并发 sweep 定位延迟拐点：L4 在 32 个用户时吞吐最高</title>
  <desc id="fig-5-1-desc">NVIDIA L4 上使用 vLLM 0.31.0 和 Qwen3-8B 时，并发用户数与输出 token/s 的关系。每个数据点来自三个随机种子。吞吐从单用户时的 13.5 升至 32 个用户时的 275.1，再在 64 个用户时降至 242.3；此时请求开始等待 KV cache 空间。</desc>
