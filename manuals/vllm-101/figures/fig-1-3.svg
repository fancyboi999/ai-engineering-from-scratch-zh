<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-3-title">一个请求经过 vLLM 的三个进程</title>
  <desc id="fig-1-3-desc">客户端通过 HTTP 将请求发给 API server 进程。该进程为请求分词，再通过 ZeroMQ 发给 engine core。engine core 负责调度，并将 batch 发给 GPU worker，每块 GPU 对应一个 worker。token ID 沿原路径返回，API server 再将文本流式发给客户端。</desc>
  <defs><marker id="fig-1-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-1-3-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">客户端</text>
  <text x="160" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">进程 1</text>
  <text x="330" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">进程 2</text>
  <text x="500" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">每块 GPU 各一个</text>
  <rect x="20" y="40" width="116" height="64" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="78" y="59.75" font-size="12.5" text-anchor="middle" font-weight="700">客户端</text>
  <text x="78" y="77.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">curl、OpenAI</text>
  <text x="78" y="92.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SDK、基准测试</text>
  <rect x="160" y="40" width="150" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="235" y="59.75" font-size="12.5" text-anchor="middle" font-weight="700">API server</text>
  <text x="235" y="77.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">HTTP 路由</text>
  <text x="235" y="92.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">分词器</text>
  <rect x="330" y="40" width="150" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="405" y="59.75" font-size="12.5" text-anchor="middle" font-weight="700">engine core</text>
  <text x="405" y="77.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">调度器</text>
  <text x="405" y="92.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">KVCacheManager</text>
  <rect x="500" y="40" width="120" height="64" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="560" y="59.75" font-size="12.5" text-anchor="middle" font-weight="700">GPU worker</text>
  <text x="560" y="77.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GPUModelRunner</text>
  <text x="560" y="92.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">前向计算</text>
  <line x1="136" y1="62" x2="159" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3-head-ink)"/>
  <line x1="310" y1="62" x2="329" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3-head-ink)"/>
  <line x1="480" y1="62" x2="499" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-3-head-ink)"/>
  <line x1="499" y1="88" x2="481" y2="88" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3-head-ink)"/>
  <line x1="329" y1="88" x2="311" y2="88" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-3-head-ink)"/>
  <line x1="159" y1="88" x2="137" y2="88" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-1-3-head-indigo)"/>
  <circle cx="148" cy="50" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="148" y="54" font-size="11" text-anchor="middle">1</text>
  <circle cx="320" cy="50" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="320" y="54" font-size="11" text-anchor="middle">2</text>
  <circle cx="490" cy="50" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="490" y="54" font-size="11" text-anchor="middle">3</text>
  <circle cx="42" cy="136" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="140" font-size="11" text-anchor="middle">1</text>
  <text x="72" y="140" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">HTTP 请求，文本输入</text>
  <circle cx="42" cy="160" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="164" font-size="11" text-anchor="middle">2</text>
  <text x="72" y="164" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ZeroMQ 消息，token ID</text>
  <circle cx="42" cy="184" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="188" font-size="11" text-anchor="middle">3</text>
  <text x="72" y="188" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">共享内存队列，每步一个 batch</text>
  <line x1="24" y1="208" x2="60" y2="208" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="72" y="212" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">token ID 按步骤返回</text>
  <line x1="24" y1="232" x2="60" y2="232" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>
  <text x="72" y="236" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">文本流式返回客户端</text>
  <text x="20" y="280" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">worker 崩溃会出现在 engine core 日志中。分词器变慢会拖慢首 token。</text>
</svg>
