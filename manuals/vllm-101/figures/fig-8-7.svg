<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-8-7-title fig-8-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-7-title">一次 verify 会保留首个拒绝位置之前的 draft，并额外生成一个 token</title>
  <desc id="fig-8-7-desc">上方：proposer 生成三个 draft token，目标模型一次性验证，保留前两个、拒绝第三个，并再生成自己的一个 token。下方：我们在 L4 上使用 Qwen3-8B 和 EAGLE3，每步生成三个 draft 的真实请求，总共输出 12 个 token。一个来自 prefill，另 11 个来自 6 次 verify；这 6 次共保留 18 个 draft 中的 5 个。</desc>
  <defs><marker id="fig-8-7-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">按位置说明规则</text>
  <rect x="20" y="28" width="116" height="36" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="78" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">草稿 1</text>
  <rect x="150" y="28" width="116" height="36" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="208" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">草稿 2</text>
  <rect x="280" y="28" width="116" height="36" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="338" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">草稿 3</text>
  <line x1="78" y1="64" x2="78" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="20" y="96" width="116" height="36" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="78" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <line x1="208" y1="64" x2="208" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="150" y="96" width="116" height="36" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="208" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <line x1="338" y1="64" x2="338" y2="95" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="280" y="96" width="116" height="36" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="338" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">拒绝</text>
  <rect x="410" y="96" width="140" height="36" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="480" y="117.75" font-size="12.5" text-anchor="middle" font-weight="700">目标 token</text>
  <line x1="396" y1="114" x2="409" y2="114" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <text x="20" y="158" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">目标模型一次通过即可写入保留的 draft，并额外生成一个 token。</text>
  <text x="20" y="196" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">真实请求：L4 上的 QWEN3-8B、EAGLE3，每步 3 个 DRAFT</text>
  <rect x="20" y="206" width="92" height="44" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="66" y="223.1" font-size="12" text-anchor="middle" font-weight="700">Paris</text>
  <text x="66" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">12095</text>
  <rect x="120" y="206" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="166" y="223.1" font-size="12" text-anchor="middle" font-weight="700">.</text>
  <text x="166" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">13</text>
  <rect x="220" y="206" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="266" y="223.1" font-size="12" text-anchor="middle" font-weight="700">The</text>
  <text x="266" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">576</text>
  <rect x="320" y="206" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="366" y="223.1" font-size="12" text-anchor="middle" font-weight="700">capital</text>
  <text x="366" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">6722</text>
  <rect x="420" y="206" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="466" y="223.1" font-size="12" text-anchor="middle" font-weight="700">of</text>
  <text x="466" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">315</text>
  <rect x="520" y="206" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="566" y="223.1" font-size="12" text-anchor="middle" font-weight="700">Italy</text>
  <text x="566" y="240.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">15344</text>
  <rect x="20" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="66" y="277.1" font-size="12" text-anchor="middle" font-weight="700">is</text>
  <text x="66" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">374</text>
  <rect x="120" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="166" y="277.1" font-size="12" text-anchor="middle" font-weight="700">Rome</text>
  <text x="166" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">21718</text>
  <rect x="220" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="266" y="277.1" font-size="12" text-anchor="middle" font-weight="700">.</text>
  <text x="266" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">13</text>
  <rect x="320" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="366" y="277.1" font-size="12" text-anchor="middle" font-weight="700">The</text>
  <text x="366" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">576</text>
  <rect x="420" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="466" y="277.1" font-size="12" text-anchor="middle" font-weight="700">capital</text>
  <text x="466" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">6722</text>
  <rect x="520" y="260" width="92" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="566" y="277.1" font-size="12" text-anchor="middle" font-weight="700">of</text>
  <text x="566" y="294.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">315</text>
  <text x="20" y="336" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Token 1 来自 prefill，其余 11 个来自 6 次 verify。</text>
  <text x="20" y="358" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每次保留的 draft 数：3 次为 0，2 次为 1，1 次为 3。</text>
  <text x="20" y="380" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">因此保留了 18 个 draft 中的 5 个，平均每次约 1.8 个 token。</text>
</svg>
