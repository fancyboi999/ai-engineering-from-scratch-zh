<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-2b-title fig-3-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2b-title">开启缓存后，不同共享长度的首 token 延迟都约为 400 ms</title>
  <desc id="fig-3-2b-desc">NVIDIA L4 使用 Qwen3-8B、8 个用户、三个随机种子时，首 token 延迟中位数随共享 system prompt 长度变化，采用对数刻度。开启缓存时为 375 至 488 ms。关闭缓存时，1,024 token 长度达到 1,213 ms，4,096 token 长度达到 13,353 ms，且此时 GPU 时钟也下降。</desc>
