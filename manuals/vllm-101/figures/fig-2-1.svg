<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1-title">KV cache 中每个 token 的内存占用</title>
  <desc id="fig-2-1-desc">每个 token 的字节数等于层数乘 KV 头数、头维度和 2（key 与 value），再乘 BF16 每个值的 2 字节。Qwen3-8B 有 36 层、8 个 KV 头、头维度 128，占 144 KiB。Qwen3-30B-A3B 有 48 层、4 个 KV 头，占 96 KiB。</desc>
  <text x="170" y="30" font-size="11" text-anchor="middle" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">层数</text>
  <text x="260" y="30" font-size="11" text-anchor="middle" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">KV 头数</text>
  <text x="350" y="30" font-size="11" text-anchor="middle" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">头维度</text>
  <text x="440" y="30" font-size="11" text-anchor="middle" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">K 与 V</text>
  <text x="530" y="30" font-size="11" text-anchor="middle" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">BF16 字节数</text>
  <text x="20" y="30" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">模型</text>
  <rect x="20" y="48" width="116" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="78" y="73.45" font-size="11.5" text-anchor="middle" font-weight="700">Qwen3-8B</text>
  <rect x="140" y="48" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="170" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">36</text>
  <text x="215" y="75" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="230" y="48" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="260" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">8</text>
  <text x="305" y="75" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="320" y="48" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="350" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">128</text>
  <text x="395" y="75" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="410" y="48" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="440" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">2</text>
  <text x="485" y="75" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="500" y="48" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="73.75" font-size="12.5" text-anchor="middle" font-weight="700">2</text>
  <text x="20" y="110" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">144 KiB，每个用户的每个 token 均如此</text>
  <rect x="20" y="118" width="116" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="78" y="143.45" font-size="11.5" text-anchor="middle" font-weight="700">Qwen3-30B-A3B</text>
  <rect x="140" y="118" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="170" y="143.75" font-size="12.5" text-anchor="middle" font-weight="700">48</text>
  <text x="215" y="145" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="230" y="118" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="260" y="143.75" font-size="12.5" text-anchor="middle" font-weight="700">4</text>
  <text x="305" y="145" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="320" y="118" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="350" y="143.75" font-size="12.5" text-anchor="middle" font-weight="700">128</text>
  <text x="395" y="145" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="410" y="118" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="440" y="143.75" font-size="12.5" text-anchor="middle" font-weight="700">2</text>
  <text x="485" y="145" font-size="12" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">x</text>
  <rect x="500" y="118" width="60" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="143.75" font-size="12.5" text-anchor="middle" font-weight="700">2</text>
  <text x="20" y="180" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">96 KiB，每个用户的每个 token 均如此</text>
</svg>
