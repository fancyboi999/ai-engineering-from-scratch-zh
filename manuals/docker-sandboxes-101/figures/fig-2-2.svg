<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" role="img" aria-labelledby="fig-2-2-title fig-2-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-2-title">从停止沙箱到模板、tar和新沙箱</title>
  <desc id="fig-2-2-desc">顶行从左到右：带标记文件的已停止 m101-demo，template save 将 library/m101-tpl:v1 写运行时镜像存储，--output 导出 OCI 布局 m101-tpl.tar。底行：create --pull never -t m101-tpl:v1 从存储创建带标记的 m101-from-tpl；tar 复制到另一宿主，由 template load 导入。</desc>
  <defs><marker id="fig-2-2-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-2-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-2-2-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker></defs>
  <text x="20" y="40" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">在录制 MAC</text>
