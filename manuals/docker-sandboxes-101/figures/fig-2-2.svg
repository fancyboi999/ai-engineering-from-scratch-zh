  <text x="555" y="80.25" font-size="12.5" text-anchor="middle" font-weight="700">m101-tpl.tar</text>
  <text x="555" y="97.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">OCI 布局</text>
  <text x="555" y="112.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">blobs/sha256/</text>
  <rect x="260" y="200" width="170" height="65" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="345" y="220.25" font-size="12.5" text-anchor="middle" font-weight="700">m101-from-tpl</text>
  <text x="345" y="237.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无工作区挂载</text>
  <text x="345" y="252.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">/opt/marker-from-demo</text>
  <rect x="490" y="200" width="130" height="65" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
