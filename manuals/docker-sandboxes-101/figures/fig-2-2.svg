  <rect class="m-knock" x="560" y="151.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="563" y="162" font-size="11.5" fill="var(--m-olive-ink, #515f26)">复制</text>
  <rect class="m-knock" x="560" y="166.42" width="28" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="563" y="177" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">手动</text>
  <text x="20" y="284" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">另一宿主的加载依据帮助，未录制</text>
