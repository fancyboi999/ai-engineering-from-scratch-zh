<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" role="img" aria-labelledby="fig-5-6-title fig-5-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-6-title">同一轮次轴的两次运行及两项评估</title>
  <desc id="fig-5-6-desc">顶为轮次0至4的三个会话，每格一个模型回复。-1/-2为files.yaml重放，依次list_directory、单文件答案、被拒wc -l、read_file README、单行答案，五轮匹配。-3为guarded的restricted，第0轮echo m101-ok首个分歧，之后不比较。相同退出0，--fail-on-divergence分歧退出1。底eval：数行预期/实际shell，F1 1.0、相关性1/1、长度S；列文件预期list_directory，实际加shell，F1 0.67、相关性1/1、长度S。</desc>
