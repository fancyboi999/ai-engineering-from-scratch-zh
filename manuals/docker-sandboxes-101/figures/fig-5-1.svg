<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">docker-agent run 从文件到输出</title>
  <desc id="fig-5-1-desc">顶：files.yaml唯一root、local模型、两工具集由run --exec及两消息加载，无exec则TUI。中：root循环调用localhost:12434的dmr/ai/qwen3:4b与filesystem/shell十工具。底：stdout最终答案、--json67事件、session.db一会话；record写18-files.yaml模型交互，fake代替runner重放。</desc>
  <defs><marker id="fig-5-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-5-1-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker><marker id="fig-5-1-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker><marker id="fig-5-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-5-1-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">CAPTURE/FIXTURES/AGENTS/FILES.YAML 的一次运行</text>
  <rect x="20" y="34" width="165" height="56" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="102.5" y="49.75" font-size="12.5" text-anchor="middle" font-weight="700">files.yaml</text>
  <text x="102.5" y="67.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">一个 agent：root</text>
  <text x="102.5" y="82.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">模型 local，2工具集</text>
  <rect x="237" y="34" width="165" height="56" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="319.5" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">docker-agent run</text>
  <text x="319.5" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--exec，两条消息</text>
  <rect x="455" y="34" width="165" height="56" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="537.5" y="57.25" font-size="12.5" text-anchor="middle" font-weight="700">TUI</text>
  <text x="537.5" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无 --exec</text>
  <line x1="185" y1="62" x2="236" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <rect class="m-knock" x="196" y="45.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="210.5" y="56" font-size="11.5" text-anchor="middle">加载</text>
  <line x1="402" y1="62" x2="454" y2="62" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-ink)"/>
  <rect x="20" y="150" width="165" height="60" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="102.5" y="167.75" font-size="12.5" text-anchor="middle" font-weight="700">dmr/ai/qwen3:4b</text>
  <text x="102.5" y="185.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Model Runner</text>
  <text x="102.5" y="200.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">localhost:12434</text>
  <rect x="237" y="150" width="165" height="60" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="319.5" y="175.25" font-size="12.5" text-anchor="middle" font-weight="700">agent 循环：root</text>
  <text x="319.5" y="192.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每模型调用一轮</text>
  <rect x="455" y="150" width="165" height="60" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="537.5" y="167.75" font-size="12.5" text-anchor="middle" font-weight="700">filesystem, shell</text>
  <text x="537.5" y="185.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">10工具，例如</text>
  <text x="537.5" y="200.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">list_directory, shell</text>
  <line x1="319.5" y1="90" x2="319.5" y2="149" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-ink)"/>
  <rect class="m-knock" x="324.5" y="108.53" width="54.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="327.5" y="119.5" font-size="11.5">第1、2轮</text>
  <line x1="237" y1="170" x2="186" y2="170" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-5-1-head-plum)"/>
  <line x1="185" y1="190" x2="236" y2="190" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="402" y1="170" x2="454" y2="170" stroke="var(--m-olive-ink, #515f26)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-olive)"/>
  <line x1="455" y1="190" x2="403" y2="190" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-ink)"/>
  <rect x="20" y="276" width="140" height="56" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="90" y="299.25" font-size="12.5" text-anchor="middle" font-weight="700">18-files.yaml</text>
  <text x="90" y="316.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">cassette 文件</text>
  <rect x="175" y="276" width="140" height="56" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="245" y="291.75" font-size="12.5" text-anchor="middle" font-weight="700">stdout</text>
  <text x="245" y="309.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">仅最终答案</text>
  <text x="245" y="324.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">带 --last</text>
  <rect x="330" y="276" width="140" height="56" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="400" y="299.25" font-size="12.5" text-anchor="middle" font-weight="700">--json</text>
  <text x="400" y="316.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">NDJSON，67事件</text>
  <rect x="485" y="276" width="135" height="56" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="552.5" y="299.25" font-size="12.5" text-anchor="middle" font-weight="700">session.db</text>
  <text x="552.5" y="316.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每运行一个会话</text>
  <line x1="60" y1="210" x2="60" y2="275" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-teal)"/>
  <rect class="m-knock" x="65" y="231.53" width="61.2" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="68" y="242.5" font-size="11.5" fill="var(--m-teal-ink, #18696a)">--record</text>
  <line x1="140" y1="275" x2="140" y2="211" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-ink)"/>
  <rect class="m-knock" x="145" y="232.03" width="47.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="148" y="243" font-size="11.5">--fake</text>
  <line x1="270" y1="210" x2="245" y2="275" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-5-1-head-ink)"/>
  <line x1="370" y1="210" x2="400" y2="275" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-5-1-head-indigo)"/>
  <line x1="402" y1="204" x2="552.5" y2="275" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-5-1-head-teal)"/>
  <text x="20" y="360" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">虚线框未运行；实线框来自 capture/out/18-*。</text>
