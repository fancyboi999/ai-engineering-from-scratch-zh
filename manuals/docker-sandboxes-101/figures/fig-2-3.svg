<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">macOS的sandboxd状态目录</title>
  <desc id="fig-2-3-desc">顶部两个根：Application Support 的 com.docker.sandboxes 含 sandboxes/sandboxd 的 sandboxd.sock、daemon.log 及 sandboxes/agent-skills；Logs 的同名目录含 sandboxes/auditkit 的审计 JSONL。下方 ~/.sbx/run 符号链接指状态目录，含 containerd ttrpc socket；灰框为2025插件 ~/.docker/sandboxes。</desc>
  <defs><marker id="fig-2-3-head-ink-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink-mute, #6f6f6a)"/></marker></defs>
  <rect x="20" y="30" width="240" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="140" y="50.25" font-size="12.5" text-anchor="middle" font-weight="700">com.docker.sandboxes/</text>
  <text x="140" y="67.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">~/Library/Application Support/</text>
  <rect x="385" y="30" width="240" height="50" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="505" y="50.25" font-size="12.5" text-anchor="middle" font-weight="700">com.docker.sandboxes/</text>
  <text x="505" y="67.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">~/Library/Logs/</text>
  <rect x="20" y="120" width="170" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="105" y="139.75" font-size="12.5" text-anchor="middle" font-weight="700">sandboxes/sandboxd/</text>
  <text x="105" y="157.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sandboxd.sock</text>
  <text x="105" y="172.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">daemon.log</text>
  <rect x="200" y="120" width="165" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="282.5" y="139.75" font-size="12.5" text-anchor="middle" font-weight="700">agent-skills/</text>
  <text x="282.5" y="157.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sandboxes/agent-skills/</text>
  <text x="282.5" y="172.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">共享skills存储</text>
  <rect x="385" y="120" width="240" height="64" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="505" y="139.75" font-size="12.5" text-anchor="middle" font-weight="700">sandboxes/auditkit/</text>
  <text x="505" y="157.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">audit-&lt;utc-timestamp&gt;-</text>
  <text x="505" y="172.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">&lt;process-uuid&gt;-&lt;seq&gt;.jsonl</text>
  <path d="M140 80 V100 H105 V120" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M140 100 H282.5 V120" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M505 80 V120" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="20" y="220" width="240" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)" stroke-dasharray="5 4"/>
  <text x="140" y="239.75" font-size="12.5" text-anchor="middle" font-weight="700">~/.sbx/run</text>
  <text x="140" y="257.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">链接到状态目录</text>
  <text x="140" y="272.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">d/containerd/containerd.sock.ttrpc</text>
  <path d="M20 65 H10 V252 H19" fill="none" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-2-3-head-ink-mute)"/>
  <rect x="385" y="220" width="240" height="80" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="505" y="240.25" font-size="12.5" text-anchor="middle" font-weight="700">~/.docker/sandboxes/</text>
  <text x="505" y="257.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">vm/&lt;name&gt;/, image-cache/</text>
  <text x="505" y="272.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2025年的docker sandbox插件</text>
  <text x="505" y="287.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">docker sandbox reset删除</text>
  <text x="20" y="330" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">虚线框：符号链接或sbx不用的插件目录树 · 青绿：存储记录</text>
</svg>
