<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" role="img" aria-labelledby="fig-5-3-title fig-5-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-3-title">每个工具集给模型什么</title>
  <desc id="fig-5-3-desc">三列：文件条目、运行内容、模型请求工具名。已录filesystem内置进程提供directory_tree、edit_file、list_directory、read_file、read_multiple_files、search_files_content、write_file、create_directory、remove_directory；shell提供cmd/cwd/timeout，每调用一命令。未录文档三mcp：docker:duckduckgo经网关容器；command/args/env经stdio子进程与aqua自动安装；remote.url经流式HTTP/SSE网络，各提供服务器工具。</desc>
  <defs><marker id="fig-5-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">AGENT 文件条目</text>
  <text x="215" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">运行内容</text>
  <text x="400" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">模型拿到的工具名</text>
  <rect x="20" y="30" width="170" height="104" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="105" y="77.25" font-size="12.5" text-anchor="middle" font-weight="700">type: filesystem</text>
  <text x="105" y="94.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">files.yaml</text>
  <rect x="215" y="30" width="160" height="104" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="295" y="69.75" font-size="12.5" text-anchor="middle" font-weight="700">内置工具集</text>
  <text x="295" y="87.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">位于</text>
  <text x="295" y="102.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">docker-agent 进程</text>
  <rect x="400" y="30" width="220" height="104" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="410" y="50" font-size="11">directory_tree, edit_file,</text>
  <text x="410" y="65" font-size="11">list_directory, read_file,</text>
  <text x="410" y="80" font-size="11">read_multiple_files,</text>
  <text x="410" y="95" font-size="11">search_files_content,</text>
  <text x="410" y="110" font-size="11">write_file, create_directory,</text>
  <text x="410" y="125" font-size="11">remove_directory</text>
