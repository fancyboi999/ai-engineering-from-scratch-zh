<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" role="img" aria-labelledby="fig-4-2-title fig-4-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2-title">三个 kit 解析为授权集合</title>
  <desc id="fig-4-2-desc">顶为三kit：录制hello-kit workload允许example.com；规范gh mixin的network-policy@1允许及GitHub凭据；另一个mixin的@2有界允许与两拒绝。中间sbx解析恰有一个workload的闭合集合。下方锁定记录保存合并后的五行允许、拒绝、安装及凭据。下一版两分支：授权仍在集合内则静默应用；移除DELETE拒绝则扩权，需批准。</desc>
  <defs><marker id="fig-4-2-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-4-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-4-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">声明的 KIT</text>
  <rect x="20" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="120" y="65.1" font-size="12" text-anchor="middle" font-weight="700">hello-kit，工作负载</text>
  <text x="120" y="82.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">fixtures/kits/hello-kit</text>
  <text x="120" y="97.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">network-policy@2，运行时：</text>
  <text x="120" y="112.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">allow example.com</text>
  <rect x="220" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="320" y="42.6" font-size="12" text-anchor="middle" font-weight="700">gh，混入配置</text>
  <text x="320" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kitspec 2 示例</text>
  <text x="320" y="74.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">network-policy@1 runtime allow</text>
  <text x="320" y="89.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">github.com, api.github.com,</text>
  <text x="320" y="104.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">uploads.github.com</text>
  <text x="320" y="119.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">credential@1: github, runtime,</text>
  <text x="320" y="134.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GH_TOKEN proxyManaged</text>
  <rect x="420" y="26" width="200" height="118" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="520" y="42.6" font-size="12" text-anchor="middle" font-weight="700">bounds，混入配置</text>
  <text x="520" y="59.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kitcap network-policy@2 config</text>
  <text x="520" y="74.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">install: registry.npmjs.org</text>
  <text x="520" y="89.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">runtime: allow api.github.com</text>
  <text x="520" y="104.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">对 /repos/** 使用 GET 与 HEAD</text>
  <text x="520" y="119.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">deny api.github.com DELETE</text>
  <text x="520" y="134.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">deny telemetry.example.com</text>
  <rect x="120" y="190" width="400" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="209.25" font-size="12.5" text-anchor="middle" font-weight="700">sbx 解析集合（kitspec5.3）</text>
  <text x="320" y="226.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">闭合集合，一个 workload，每名称一提供者，拒绝优先</text>
  <path d="M120 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M320 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M520 144 V166 H320 V189" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="320" y1="238" x2="320" y2="269" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-4-2-head-teal)"/>
  <rect class="m-knock" x="325" y="242.53" width="121" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="253.5" font-size="11.5" fill="var(--m-teal-ink, #18696a)">锁定记录保存授权集合</text>
  <rect x="20" y="270" width="600" height="170" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <rect x="23" y="273" width="594" height="164" fill="none" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="32" y="292" font-size="12" font-weight="700" fill="var(--m-teal-ink, #18696a)">沙箱合并授权集合（kitspec7.4）</text>
  <rect x="32" y="300" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="316" font-size="11" fill="var(--m-teal-ink, #18696a)">运行时允许</text>
  <text x="142" y="316" font-size="11" class="m-serif">example.com, github.com, uploads.github.com</text>
  <rect x="32" y="326" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="342" font-size="11" fill="var(--m-teal-ink, #18696a)">运行时允许</text>
  <text x="142" y="342" font-size="11" class="m-serif">api.github.com，任意方法/路径（丢弃有界项，kitspec9.5）</text>
  <rect x="32" y="352" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="368" font-size="11" fill="var(--m-teal-ink, #18696a)">运行时拒绝</text>
  <text x="142" y="368" font-size="11" class="m-serif">api.github.com DELETE、telemetry.example.com（拒绝优先，kitcap）</text>
  <rect x="32" y="378" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="394" font-size="11" fill="var(--m-teal-ink, #18696a)">安装时允许</text>
  <text x="142" y="394" font-size="11" class="m-serif">registry.npmjs.org（agent启动前关闭，kitspec12）</text>
  <rect x="32" y="404" width="576" height="24" fill="var(--m-paper, #fafaf5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="40" y="420" font-size="11" fill="var(--m-teal-ink, #18696a)">凭证</text>
  <text x="142" y="420" font-size="11" class="m-serif">运行时 github，GH_TOKEN proxyManaged，注入 api.github.com</text>
  <text x="330" y="464" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kit 下一版本</text>
  <rect x="20" y="482" width="280" height="64" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="160" y="501.75" font-size="12.5" text-anchor="middle" font-weight="700">仍在集合内</text>
  <text x="160" y="519.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">已获准主机上的有界允许</text>
  <text x="160" y="534.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">静默应用（kitspec7.4）</text>
  <rect x="340" y="482" width="280" height="64" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="480" y="501.6" font-size="12" text-anchor="middle" font-weight="700">移除 deny api.github.com DELETE</text>
  <text x="480" y="518.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">移除拒绝就是扩权</text>
  <text x="480" y="533.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">应用前停下询问</text>
  <line x1="160" y1="440" x2="160" y2="481" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-2-head-amber)"/>
  <rect class="m-knock" x="165" y="449.53" width="52" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="168" y="460.5" font-size="11.5" fill="var(--m-amber-ink, #85590c)">相同授权</text>
  <line x1="480" y1="440" x2="480" y2="481" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-2-head-rose)"/>
  <rect class="m-knock" x="485" y="449.53" width="52" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="488" y="460.5" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">更广授权</text>
  <text x="20" y="572" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kit 不自行授权；各行是宿主回答的请求，锁定记录判断下一版。</text>
  <text x="20" y="590" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">来源：hello-kit/kit.yaml、kitspec2/5.3/7.4/9.5、kitcap network-policy@2/credential@1。</text>
</svg>
