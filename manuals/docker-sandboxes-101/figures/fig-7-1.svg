<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">sbx move 搬到云端什么</title>
  <desc id="fig-7-1-desc">顶本地m101-demo停止并捕获模板，上传，带后缀moved-m101-demo在云启动。左列随镜像：文件系统、kit网络规则、重新发布为云URL的TCP端口、本地环境变量。右列留宿主：绑定挂载、secret存储密钥、本地策略、运行进程；活跃HTTP方法规则先提示。底目的地TTL默认一小时，创建起24小时上限。</desc>
  <defs><marker id="fig-7-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-7-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-7-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">SBX MOVE M101-DEMO --TO CLOUD</text>
  <rect x="20" y="30" width="200" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="120" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">m101-demo</text>
  <text x="120" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sandboxd 的本地沙箱</text>
  <text x="120" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">捕获时停止</text>
  <rect x="260" y="30" width="160" height="58" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="340" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">模板镜像</text>
  <text x="340" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">沙箱文件系统</text>
  <text x="340" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">一个 OCI 镜像，推送</text>
  <rect x="460" y="30" width="160" height="58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="540" y="46.75" font-size="12.5" text-anchor="middle" font-weight="700">moved-m101-demo</text>
  <text x="540" y="64.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">加唯一后缀</text>
  <text x="540" y="79.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">新 id，small 规格</text>
  <line x1="220" y1="59" x2="259" y2="59" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-teal)"/>
  <rect class="m-knock" x="225" y="42.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="239.5" y="53" font-size="11.5" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">捕获</text>
  <line x1="420" y1="59" x2="459" y2="59" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <rect class="m-knock" x="425" y="42.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="439.5" y="53" font-size="11.5" text-anchor="middle">上传</text>
  <text x="20" y="124" font-size="11" letter-spacing="1.2" fill="var(--m-green-ink, #336b40)">随镜像迁移</text>
  <text x="330" y="124" font-size="11" letter-spacing="1.2" fill="var(--m-grey-ink, #5e5e59)">留在宿主</text>
  <rect x="20" y="134" width="290" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="165" y="149.1" font-size="12" text-anchor="middle" font-weight="700">沙箱容器文件系统</text>
  <text x="165" y="166.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">文件、包、agent 状态</text>
  <rect x="20" y="182" width="290" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="165" y="197.1" font-size="12" text-anchor="middle" font-weight="700">kit 网络规则</text>
  <text x="165" y="214.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">env-mixin的example.org（12-kit-add.txt）</text>
  <rect x="20" y="230" width="290" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="165" y="245.1" font-size="12" text-anchor="middle" font-weight="700">发布的 TCP 端口</text>
  <text x="165" y="262.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">重新发布为云 HTTPS URL</text>
  <rect x="20" y="278" width="290" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="165" y="293.1" font-size="12" text-anchor="middle" font-weight="700">环境变量</text>
  <text x="165" y="310.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">本地镜像的一部分</text>
  <rect x="330" y="134" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="475" y="149.1" font-size="12" text-anchor="middle" font-weight="700">宿主绑定挂载</text>
  <text x="475" y="166.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">$CAPTURE/fixtures/repo，不在镜像内</text>
  <rect x="330" y="182" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="475" y="197.1" font-size="12" text-anchor="middle" font-weight="700">sbx secret 存储的密钥</text>
  <text x="475" y="214.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">M101_RECV_KEY，云存储独立</text>
  <rect x="330" y="230" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="475" y="245.1" font-size="12" text-anchor="middle" font-weight="700">本地策略规则</text>
  <text x="475" y="262.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">local:&lt;uuid&gt; 规则，改用云策略</text>
  <rect x="330" y="278" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="475" y="293.1" font-size="12" text-anchor="middle" font-weight="700">运行进程与内存</text>
  <text x="475" y="310.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">目的地从镜像启动</text>
  <path d="M300 133 V110 H340 V89" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-7-1-head-teal)"/>
  <rect class="m-knock" x="147" y="95.42" width="61" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="150" y="106" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">复制入镜像</text>
  <rect x="330" y="326" width="290" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="475" y="341.1" font-size="12" text-anchor="middle" font-weight="700">活跃 HTTP 方法规则</text>
  <text x="475" y="358.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">先提示，--force保留warning</text>
  <rect x="20" y="376" width="600" height="58" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="392.75" font-size="12.5" text-anchor="middle" font-weight="700">目的地 TTL</text>
  <text x="320" y="410.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">服务器默认1h，创建起硬上限24h</text>
  <text x="320" y="425.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">--on-timeout stop保留，delete删除，sbx --cloud ttl +2h延长</text>
  <path d="M540 89 V100 H632 V405 H621" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-7-1-head-amber)"/>
  <rect class="m-knock" x="561" y="101.42" width="50" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="586" y="112" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">时钟启动</text>
</svg>
