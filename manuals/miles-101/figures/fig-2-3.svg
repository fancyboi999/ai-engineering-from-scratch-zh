<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">Ray 读取整台 GB10 的内存</title>
  <desc id="fig-2-3-desc">Ray 停止第一次 4B 训练时读取的内存占用，以一条 121.69 GB 的长条表示。训练器进程使用了 36.77 GB，引擎进程使用了 4.06 GB。已使用的 115.86 GB 中，其余内存没有出现在进程列表里。我们判断其中大部分是 GPU 分配。空闲内存为 5.83 GB。</desc>
  <text x="20" y="30" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">RAY 停止训练器时的节点内存，121.7 GB</text>
  <rect x="20" y="48" width="181.3" height="56" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <polyline points="110.65,104 110.65,119" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="110.65" cy="119" r="2" fill="var(--m-ink-mute, #666660)"/>
  <text x="110.65" y="132" font-size="11.5" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">训练器进程, 36.8 GB</text>
  <rect x="201.3" y="48" width="20.02" height="56" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <polyline points="211.31,104 211.31,141" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="211.31" cy="141" r="2" fill="var(--m-ink-mute, #666660)"/>
  <text x="211.31" y="154" font-size="11.5" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">引擎, 4.1 GB</text>
  <rect x="221.31" y="48" width="369.94" height="56" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <polyline points="406.28,104 406.28,119" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="406.28" cy="119" r="2" fill="var(--m-ink-mute, #666660)"/>
  <text x="406.28" y="132" font-size="11.5" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">其他已用内存, 75.0 GB</text>
  <rect x="591.25" y="48" width="28.75" height="56" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-dasharray="5 4"/>
  <polyline points="605.63,104 605.63,141" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="605.63" cy="141" r="2" fill="var(--m-ink-mute, #666660)"/>
  <text x="570" y="154" font-size="11.5" text-anchor="middle" fill="var(--m-green-ink, #336b40)">空闲, 5.8 GB</text>
  <line x1="590" y1="40" x2="590" y2="112" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="586" y="40" font-size="11" text-anchor="end" fill="var(--m-rose-ink, #b0344d)">使用率超过 95% 时停止</text>
  <text x="20" y="210" font-size="12" class="m-serif">GB10 上的 GPU 和 CPU 共用此内存。</text>
  <text x="20" y="234" font-size="12" class="m-serif">我们的判断：GPU 分配也计入已用内存，因此 Ray 停止是实际警告。</text>
  <text x="20" y="270" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">进程大小是 Ray 列出的主要进程常驻内存。</text>
</svg>
