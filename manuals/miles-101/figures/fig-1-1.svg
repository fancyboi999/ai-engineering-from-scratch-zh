<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1-title">一张 GPU 上的一个 GRPO 步骤</title>
  <desc id="fig-1-1-desc">在搭载 GB10 的 DGX Spark 上使用 Qwen3-0.6B，每一步都会重复六个阶段。prompt 发送到 SGLang engine，生成 256 个答案，耗时 47.5 s。随后 math reward 为每个答案评分。FSDP trainer 用 23.4 s 计算 log probability，再用 77.0 s 执行梯度步骤。两者组成耗时 100.3 s 的训练阶段。权重更新耗时 0.64 s，并将新权重传给 engine。耗时取自启用 heat guard 前的一次 48 步运行，因此没有暂停影响。</desc>
  <defs><marker id="fig-1-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-1-1-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker><marker id="fig-1-1-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker><marker id="fig-1-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-1-1-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <rect x="20" y="36" width="160" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="100" y="63.25" font-size="12.5" text-anchor="middle" font-weight="700">GSM8K prompt</text>
  <text x="100" y="80.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每步 32 个 prompt</text>
  <rect x="240" y="36" width="170" height="64" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="325" y="55.75" font-size="12.5" text-anchor="middle" font-weight="700">SGLang engine</text>
  <text x="325" y="73.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sglang::scheduler</text>
  <text x="325" y="88.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">256 个答案，47.5 s</text>
  <rect x="470" y="36" width="150" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="545" y="63.25" font-size="12.5" text-anchor="middle" font-weight="700">math reward</text>
  <text x="545" y="80.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每个答案计 1 或 0</text>
  <rect x="470" y="176" width="150" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="545" y="195.6" font-size="12" text-anchor="middle" font-weight="700">log probability</text>
  <text x="545" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">FSDPTrainRayActor</text>
  <text x="545" y="227.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">23.4 s</text>
  <rect x="240" y="176" width="170" height="64" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="325" y="195.75" font-size="12.5" text-anchor="middle" font-weight="700">GRPO 更新</text>
  <text x="325" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Adam，一步</text>
  <text x="325" y="228.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">77.0 s</text>
  <rect x="20" y="176" width="160" height="64" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="100" y="195.75" font-size="12.5" text-anchor="middle" font-weight="700">权重更新</text>
  <text x="100" y="213.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GPU 句柄，GPU 内复制</text>
  <text x="100" y="228.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.64 s</text>
  <line x1="180" y1="68" x2="239" y2="68" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-1-head-ink)"/>
  <circle cx="210" cy="56" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="210" y="60" font-size="11" text-anchor="middle">1</text>
  <line x1="410" y1="68" x2="469" y2="68" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-1-1-head-plum)"/>
  <circle cx="440" cy="56" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="440" y="60" font-size="11" text-anchor="middle">2</text>
  <line x1="545" y1="100" x2="545" y2="175" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-1-1-head-indigo)"/>
  <circle cx="563" cy="138" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="563" y="142" font-size="11" text-anchor="middle">3</text>
  <line x1="470" y1="208" x2="411" y2="208" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-1-1-head-plum)"/>
  <circle cx="440" cy="196" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="440" y="200" font-size="11" text-anchor="middle">4</text>
  <line x1="240" y1="208" x2="181" y2="208" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-1-1-head-teal)"/>
  <circle cx="210" cy="196" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="210" y="200" font-size="11" text-anchor="middle">5</text>
  <path d="M100 176 V138 H325 V101" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-1-1-head-amber)"/>
  <circle cx="118" cy="126" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="118" y="130" font-size="11" text-anchor="middle">6</text>
  <text x="20" y="290" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">ONE STEP, MEDIAN OF 48 STEPS, RUN BEFORE THE HEAT GUARD</text>
  <text x="20" y="314" font-size="12" class="m-serif">共计 152.6 s。训练阶段耗时最长，权重更新最短。</text>
  <text x="20" y="336" font-size="12" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">engine 和 trainer 轮流使用同一块 GPU 内存。</text>
</svg>
