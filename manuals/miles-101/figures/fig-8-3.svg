<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-3-title">两种方法分别解决两类问题</title>
  <desc id="fig-8-3-desc">trainer 和 engine 使用不同 kernel 计算相同模型，因此 log probability 会有差异。deterministic inference 只修复 engine 一端：相同输入在任何 batch 中都会得到相同输出。true on-policy 模式通过让两端使用相同 kernel 来消除差距，但只在契约适用时有效：Hopper GPU 上的 FlashAttention 3、compute capability 9.0，以及 dense Qwen3 模型。</desc>
  <defs><marker id="fig-8-3-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <rect x="20" y="40" width="270" height="76" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="155" y="65.75" font-size="12.5" text-anchor="middle" font-weight="700">trainer，FSDP</text>
  <text x="155" y="83.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">使用自身的 attention kernel</text>
  <text x="155" y="98.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">matmul 和求和顺序独立</text>
  <rect x="350" y="40" width="270" height="76" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="485" y="65.75" font-size="12.5" text-anchor="middle" font-weight="700">engine，SGLang</text>
  <text x="485" y="83.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">使用自身的 attention backend</text>
  <text x="485" y="98.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">求和顺序会随 batch 改变</text>
  <line x1="290" y1="78" x2="349" y2="78" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="320" y="140" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">差距约为 0.015</text>
  <rect x="350" y="156" width="270" height="64" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="485" y="183.25" font-size="12.5" text-anchor="middle" font-weight="700">deterministic inference</text>
  <text x="485" y="200.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">engine 可在任意 batch 下重复输出</text>
  <line x1="485" y1="116" x2="485" y2="155" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-8-3-head-amber)"/>
  <text x="350" y="238" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">我们的运行中差距仍约为 0.015</text>
  <rect x="20" y="156" width="270" height="64" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="155" y="183.25" font-size="12.5" text-anchor="middle" font-weight="700">true on-policy 契约</text>
  <text x="155" y="200.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">两端使用相同 kernel</text>
  <line x1="155" y1="116" x2="155" y2="155" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-8-3-head-amber)"/>
  <text x="20" y="238" font-size="11.5" fill="var(--m-green-ink, #336b40)">契约适用时差距为零</text>
  <text x="20" y="278" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">WHAT THE CONTRACT PINS AT MILES MAIN</text>
  <text x="20" y="300" font-size="12" class="m-serif">两端均使用 FlashAttention 3，仅支持 Hopper GPU</text>
  <text x="20" y="320" font-size="12" class="m-serif">仅支持 dense Qwen3 模型</text>
  <text x="20" y="344" font-size="12" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">GB10 的 compute capability 为 12.1，不满足该契约。</text>
</svg>
