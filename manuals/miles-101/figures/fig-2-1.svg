  <text x="452" y="72.84" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)"> </text>
  <text x="452" y="283" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4B，第 1 次</text>
  <rect x="534" y="73.48" width="60" height="192.52" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="564" y="67.48" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)"> </text>
  <text x="564" y="283" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4B，第 2 次</text>
  <text x="452" y="152.92" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">115.9 GB</text>
  <text x="564" y="152.92" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">119.2 GB</text>
  <path d="M60 18 H78" fill="none" stroke="var(--m-blue-ink, #2f5d9a)" stroke-width="2" stroke-linejoin="round"/>
  <text x="84" y="22" font-size="11" fill="var(--m-blue-ink, #2f5d9a)">trainer 状态估算值</text>
  <path d="M209.8 18 H227.8" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2" stroke-linejoin="round"/>
  <text x="233.8" y="22" font-size="11" fill="var(--m-rose-ink, #b0344d)">Ray 停止时的节点内存</text>
  <text x="60" y="324" font-size="12" class="m-serif">降低 engine 内存仍无法运行 4B。所有测试都将答案上限设为 256 token。</text>
</svg>
