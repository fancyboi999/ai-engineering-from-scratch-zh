<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">从观察到的现象开始</title>
  <desc id="fig-7-1-desc">我们运行中出现的五种症状，以及每种情况的首要检查项和修复方法。GPU 空闲但日志增长表示 engine 已退出。FlashAttention 3 错误表示 GPU 不是 Hopper，因为镜像中的 FA3 只为 Hopper 构建。Ray 内存不足错误表示节点内存已满。步骤耗时变化表示可能受 heat pause 影响。trainer 拒绝 attention 名称表示已安装的 transformers 库不支持该名称。</desc>
  <defs><marker id="fig-7-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-rose-ink, #b0344d)">症状</text>
  <text x="240" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-amber-ink, #85590c)">首先检查</text>
  <text x="440" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-green-ink, #336b40)">修正</text>
  <rect x="20" y="42" width="190" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="115" y="67.45" font-size="11.5" text-anchor="middle" font-weight="700">GPU 空闲，日志增长</text>
  <rect x="240" y="42" width="166" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="323" y="67.45" font-size="11.5" text-anchor="middle" font-weight="400">统计 503 行数</text>
  <rect x="440" y="42" width="180" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="67.45" font-size="11.5" text-anchor="middle" font-weight="400">阅读首个错误</text>
  <line x1="210" y1="64" x2="239" y2="64" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="406" y1="64" x2="439" y2="64" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <rect x="20" y="100" width="190" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="115" y="125.45" font-size="11.5" text-anchor="middle" font-weight="700">FlashAttention 3 错误</text>
  <rect x="240" y="100" width="166" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="323" y="125.45" font-size="11.5" text-anchor="middle" font-weight="400">计算能力</text>
  <rect x="440" y="100" width="180" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="125.45" font-size="11.5" text-anchor="middle" font-weight="400">非 Hopper：不使用 FA3</text>
  <line x1="210" y1="122" x2="239" y2="122" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="406" y1="122" x2="439" y2="122" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <rect x="20" y="158" width="190" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="115" y="183.45" font-size="11.5" text-anchor="middle" font-weight="700">Ray OutOfMemoryError</text>
  <rect x="240" y="158" width="166" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="323" y="183.45" font-size="11.5" text-anchor="middle" font-weight="400">被终止时的内存</text>
  <rect x="440" y="158" width="180" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="183.45" font-size="11.5" text-anchor="middle" font-weight="400">使用更小模型</text>
  <line x1="210" y1="180" x2="239" y2="180" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="406" y1="180" x2="439" y2="180" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <rect x="20" y="216" width="190" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="115" y="241.45" font-size="11.5" text-anchor="middle" font-weight="700">步骤耗时不同</text>
  <rect x="240" y="216" width="166" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="323" y="241.45" font-size="11.5" text-anchor="middle" font-weight="400">热暂停</text>
  <rect x="440" y="216" width="180" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="241.45" font-size="11.5" text-anchor="middle" font-weight="400">对比未受干扰的步骤</text>
  <line x1="210" y1="238" x2="239" y2="238" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="406" y1="238" x2="439" y2="238" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <rect x="20" y="274" width="190" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="115" y="299.45" font-size="11.5" text-anchor="middle" font-weight="700">注意力后端名称被拒绝</text>
  <rect x="240" y="274" width="166" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="323" y="299.45" font-size="11.5" text-anchor="middle" font-weight="400">ValueError 中的列表</text>
  <rect x="440" y="274" width="180" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="299.45" font-size="11.5" text-anchor="middle" font-weight="400">选择列表内名称</text>
  <line x1="210" y1="296" x2="239" y2="296" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <line x1="406" y1="296" x2="439" y2="296" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="20" y="342" font-size="12" class="m-serif">第 7.1 节列出了我们遇到的所有症状，以及 issue 报告中的另外六项。</text>
</svg>
