  <title id="fig-2-4-title">捕获中各 provider 声明的副作用</title>
  <desc id="fig-2-4-desc">表格五列分别为：可用 ghidra 的 30 个操作、不可用 hopper 的 37 个操作、不可用 ida 的 13 个操作、不可用 kuna 的 13 个操作，以及未绑定 provider 的 19 个无需目标操作。七行各对应一个副作用标志。launches_process 为真的数量依次为 30/30、37/37、0、13/13、12/19；may_write_filesystem 为 30/30、6/37、0、13/13、6/19；may_show_ui 为 0、37/37、4/13、0、2/19；may_access_network 为 0、0、13/13、0、2/19；mutates_artifact 为 3/30、6/37、0、0、0；changes_permissions、requires_root 全为假。</desc>
