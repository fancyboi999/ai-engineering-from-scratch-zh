<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fig-2-2-title fig-2-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-2-title">rea doctor 针对 Ghidra 的九项检查</title>
  <desc id="fig-2-2-desc">九个框排成三行，从左向右再向下读，各带录制 Mac 返回的详情：node 22.22.0；ghidra 的 GHIDRA_INSTALL_DIR 为 ghidra/12.1.4/libexec；ghidra-platform 为 darwin；ghidra-architecture 为 arm64；ghidra-installation 为 application.properties；ghidra-version 12.1.4 满足 12.1.x、JDK 21 策略；ghidra-headless 为 support/analyzeHeadless；ghidra-native_decompiler 的 os/mac_arm_64/decompile 报告匹配的 mach-o arm64；ghidra-java 为 64 位 JDK 21.0.12.1。箭头依次连接检查。底部两个结果框：explicit 范围、providers ghidra 的 healthy true、退出 0；捕获过滤排除的整体审计集合 environment_healthy false。</desc>
  <defs><marker id="fig-2-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-2-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">REA DOCTOR --PROVIDER GHIDRA · 按顺序</text>
  <rect x="20" y="30" width="190" height="64" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
