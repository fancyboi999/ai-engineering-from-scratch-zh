<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img" aria-labelledby="fig-4-5-title fig-4-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5-title">-O0 的跳转表与 -O1 的值表</title>
  <desc id="fig-4-5-desc">两列对比。左侧为第 33 课夹具 ledger-x86_64-O0.o 的 grade：边界检查、带 .rodata 重定位的 leaq、缩放读取、加法，再经 rax 执行 jmpq；.rela.rodata 的五个重定位目标为 0x91、0x88、0x7f、0x76、0x76，因此图有八块十一边。右侧为 arm64 -O1 捕获中的 _grade：比较与 b.hi、构造 0x1000007d0 的 adrp 和 add，再用一次 ldr 返回五个值 1、2、3、4、4 中的一个；档案含三块两边，jump_tables 列表为空。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · -O0 的 GRADE，X86-64 对象文件</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">B · -O1 的 _GRADE，ARM64 可执行文件</text>
  <line x1="320" y1="8" x2="320" y2="314" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="28" width="284" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="162" y="51.45" font-size="11.5" text-anchor="middle" font-weight="400">第 33 课夹具 ledger-x86_64-O0.o</text>
  <rect x="336" y="28" width="284" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="478" y="51.45" font-size="11.5" text-anchor="middle" font-weight="400">捕获 06-function-grade.json</text>
  <text x="20" y="90" font-size="11">5d: subl $0x4, %eax</text>
  <text x="20" y="104" font-size="11">60: ja 0x9a</text>
  <text x="20" y="118" font-size="11">66: leaq (%rip), %rcx</text>
  <text x="20" y="132" font-size="11">    R_X86_64_PC32 .rodata-0x4</text>
  <text x="20" y="146" font-size="11">6d: movslq (%rcx,%rax,4), %rax</text>
  <text x="20" y="160" font-size="11">71: addq %rcx, %rax</text>
  <text x="20" y="174" font-size="11">74: jmpq *%rax</text>
  <text x="336" y="90" font-size="11">0x534: cmp w8, #0x4</text>
  <text x="336" y="104" font-size="11">0x538: b.hi 0x10000054c</text>
  <text x="336" y="118" font-size="11">0x53c: adrp x9, 0x100000000</text>
  <text x="336" y="132" font-size="11">0x540: add x9, x9, #0x7d0</text>
  <text x="336" y="146" font-size="11">0x544: ldr w0, [x9, w8, UXTW #0x2]</text>
  <text x="336" y="160" font-size="11">0x548: ret</text>
  <text x="336" y="174" font-size="11">0x54c: mov w0, #0x0</text>
  <rect x="20" y="200" width="284" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="162" y="220.25" font-size="12.5" text-anchor="middle" font-weight="700">.rela.rodata：五个重定位</text>
  <text x="162" y="237.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">目标 0x91 0x88 0x7f 0x76 0x76</text>
  <rect x="336" y="200" width="284" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="478" y="220.25" font-size="12.5" text-anchor="middle" font-weight="700">0x1000007d0 的 __const</text>
  <text x="478" y="237.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">u32 值 1 2 3 4 4 · 文件偏移 2000</text>
  <rect x="20" y="262" width="284" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="162" y="282.25" font-size="12.5" text-anchor="middle" font-weight="700">jmpq *%rax 到达五个块</text>
  <text x="162" y="299.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">计入表后八块十一边</text>
  <rect x="336" y="262" width="284" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="478" y="282.25" font-size="12.5" text-anchor="middle" font-weight="700">ldr 返回一个值</text>
  <text x="478" y="299.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">三块 · 两边 · jump_tables []</text>
</svg>
