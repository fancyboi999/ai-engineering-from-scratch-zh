  <title id="fig-7-3-title">八个候选各在哪里停止</title>
  <desc id="fig-7-3-desc">左侧从上到下检查 size、masked bytes、relocation records、referenced constants，最后 pass。大小检查右侧三个候选停止：percent_change_wide 为 16 对 26 字节，percent_change_div_first 为 16 对 18，grade_thresholds 为 46 对 39 字节、1 对 0 重定位。没有候选在掩码字节或重定位记录处停止。在引用常量处，grade_case10_wrong 的表为 1、2、3、4、4 对 1、2、3、4、3，因此停止。四个候选通过：percent_change_mul_first 与 percent_change_split 为 16 字节、无重定位，grade_switch 与 grade_table 为 46 字节、表 1、2、3、4、4。</desc>
