  <rect x="440" y="168" width="180" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="530" y="188.25" font-size="12.5" text-anchor="middle" font-weight="700">0x10000811b</text>
  <text x="530" y="205.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">delta 0x3c · DATA</text>
  <line x1="440" y1="193" x2="411" y2="193" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-6-head-ink)"/>
  <rect x="230" y="234" width="180" height="50" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="254.25" font-size="12.5" text-anchor="middle" font-weight="700">_grade_label</text>
