  <text x="110" y="271.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">UNCONDITIONAL_CALL</text>
  <line x1="200" y1="259" x2="229" y2="259" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-6-head-ink)"/>
  <rect x="440" y="234" width="180" height="50" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
