<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3-title">ledger-arm64-O1 的十三个过程</title>
  <desc id="fig-4-3-desc">按地址排序的十三行。libSystem 提供 EXTERNAL:0x1 至 0x4 四个外部函数。__text 内有五个内部函数：0x100000500 的 _percent_change，24 字节；0x100000518 的 _grade，60 字节；0x100000554 的 _total，52 字节；0x100000588 的 _grade_label，72 字节；0x1000005d0 的 entry，368 字节。__stubs 从 0x100000740 起有四个各 12 字节的 thunk，各解析到一个外部函数。内部函数体共 576 字节，等于 __text 大小。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">地址</text>
  <text x="150" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">名称</text>
  <text x="330" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">函数体</text>
  <text x="410" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">分类</text>
  <rect x="20" y="28" width="600" height="26" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="45" font-size="11">EXTERNAL:0x1</text>
  <text x="150" y="45" font-size="11" font-weight="700">___stack_chk_fail</text>
  <text x="410" y="45" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">外部 · libSystem.B.dylib</text>
  <rect x="20" y="54" width="600" height="26" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="71" font-size="11">EXTERNAL:0x2</text>
  <text x="150" y="71" font-size="11" font-weight="700">_atoi</text>
  <text x="410" y="71" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">外部 · libSystem.B.dylib</text>
  <rect x="20" y="80" width="600" height="26" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="97" font-size="11">EXTERNAL:0x3</text>
  <text x="150" y="97" font-size="11" font-weight="700">_fwrite</text>
  <text x="410" y="97" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">外部 · libSystem.B.dylib</text>
  <rect x="20" y="106" width="600" height="26" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="123" font-size="11">EXTERNAL:0x4</text>
  <text x="150" y="123" font-size="11" font-weight="700">_printf</text>
  <text x="410" y="123" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">外部 · libSystem.B.dylib</text>
  <rect x="20" y="132" width="600" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="149" font-size="11">0x100000500</text>
  <text x="150" y="149" font-size="11" font-weight="700">_percent_change</text>
  <text x="330" y="149" font-size="11">24 B</text>
  <text x="410" y="149" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">函数体 0x500 至 0x517，ledger.c</text>
  <rect x="20" y="158" width="600" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="175" font-size="11">0x100000518</text>
  <text x="150" y="175" font-size="11" font-weight="700">_grade</text>
  <text x="330" y="175" font-size="11">60 B</text>
  <text x="410" y="175" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">函数体 0x518 至 0x553，ledger.c</text>
  <rect x="20" y="184" width="600" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="201" font-size="11">0x100000554</text>
  <text x="150" y="201" font-size="11" font-weight="700">_total</text>
  <text x="330" y="201" font-size="11">52 B</text>
  <text x="410" y="201" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">函数体 0x554 至 0x587，ledger.c</text>
  <rect x="20" y="210" width="600" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="227" font-size="11">0x100000588</text>
  <text x="150" y="227" font-size="11" font-weight="700">_grade_label</text>
  <text x="330" y="227" font-size="11">72 B</text>
  <text x="410" y="227" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">函数体 0x588 至 0x5cf，ledger.c</text>
  <rect x="20" y="236" width="600" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="253" font-size="11">0x1000005d0</text>
  <text x="150" y="253" font-size="11" font-weight="700">entry</text>
  <text x="330" y="253" font-size="11">368 B</text>
  <text x="410" y="253" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">函数体 0x5d0 至 0x73f · LC_MAIN</text>
  <rect x="20" y="262" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="279" font-size="11">0x100000740</text>
  <text x="150" y="279" font-size="11" font-weight="700">___stack_chk_fail</text>
  <text x="330" y="279" font-size="11">12 B</text>
  <text x="410" y="279" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__stubs 桩 → EXTERNAL:0x1</text>
  <rect x="20" y="288" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="305" font-size="11">0x10000074c</text>
  <text x="150" y="305" font-size="11" font-weight="700">_atoi</text>
  <text x="330" y="305" font-size="11">12 B</text>
  <text x="410" y="305" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__stubs 桩 → EXTERNAL:0x2</text>
  <rect x="20" y="314" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="331" font-size="11">0x100000758</text>
  <text x="150" y="331" font-size="11" font-weight="700">_fwrite</text>
  <text x="330" y="331" font-size="11">12 B</text>
  <text x="410" y="331" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__stubs 桩 → EXTERNAL:0x3</text>
  <rect x="20" y="340" width="600" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-panel-edge, #e4e1d4)"/>
  <text x="28" y="357" font-size="11">0x100000764</text>
  <text x="150" y="357" font-size="11" font-weight="700">_printf</text>
  <text x="330" y="357" font-size="11">12 B</text>
  <text x="410" y="357" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">__stubs 桩 → EXTERNAL:0x4</text>
  <text x="20" y="390" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">内部函数体 24 + 60 + 52 + 72 + 368 = 576 字节，等于 __text · stubs 4 × 12 = 48 字节</text>
</svg>
