  <line x1="55" y1="70" x2="55" y2="165" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="60" y="106.53" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="63" y="117.5" font-size="11.5">编写</text>
  <line x1="560" y1="136" x2="560" y2="165" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="565" y="139.53" width="40.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="568" y="150.5" font-size="11.5">反编译</text>
  <rect x="20" y="166" width="190" height="134" fill="var(--m-paper, #fafaf5)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="26" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">你编写 · ledger.c</text>
  <text x="26" y="199" font-size="11">int percent_change(</text>
  <text x="26" y="214" font-size="11">  int before, int after) {</text>
  <text x="26" y="229" font-size="11">  if (before == 0)</text>
  <text x="26" y="244" font-size="11">    return 0;</text>
  <text x="26" y="259" font-size="11">  return (after - before)</text>
  <text x="26" y="274" font-size="11">    * 100 / before;</text>
  <text x="26" y="289" font-size="11">}</text>
  <rect x="220" y="166" width="185" height="119" fill="var(--m-paper, #fafaf5)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="226" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">clang -O1 生成 · 24 字节</text>
  <text x="226" y="199" font-size="11">500  cbz w0, 0x100000514</text>
  <text x="226" y="214" font-size="11">504  sub w8, w1, w0</text>
  <text x="226" y="229" font-size="11">508  mov w9, #0x64</text>
  <text x="226" y="244" font-size="11">50c  mul w8, w8, w9</text>
  <text x="226" y="259" font-size="11">510  sdiv w0, w8, w0</text>
  <text x="226" y="274" font-size="11">514  ret</text>
  <rect x="415" y="166" width="205" height="179" fill="var(--m-paper, #fafaf5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="421" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Ghidra 反编译</text>
  <text x="421" y="199" font-size="11">ulong _percent_change(</text>
  <text x="421" y="214" font-size="11">  ulong param_1,int param_2)</text>
  <text x="421" y="229" font-size="11">iVar2 = (int)param_1;</text>
  <text x="421" y="244" font-size="11">if (iVar2 != 0) {</text>
  <text x="421" y="259" font-size="11">  uVar1 = 0;</text>
  <text x="421" y="274" font-size="11">  if (iVar2 != 0) {</text>
  <text x="421" y="289" font-size="11">  uVar1 = ((param_2 - iVar2)</text>
  <text x="421" y="304" font-size="11">    * 100) / iVar2;</text>
  <text x="421" y="319" font-size="11">  param_1 = (ulong)uVar1;</text>
  <text x="421" y="334" font-size="11">return param_1;</text>
  <line x1="517" y1="345" x2="517" y2="365" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-teal)"/>
