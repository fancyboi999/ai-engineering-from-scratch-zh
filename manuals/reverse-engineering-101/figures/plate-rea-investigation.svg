  <line x1="367.5" y1="70" x2="367.5" y2="91" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="372.5" y="69.53" width="98" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
