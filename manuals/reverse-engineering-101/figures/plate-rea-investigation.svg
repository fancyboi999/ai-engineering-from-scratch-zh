<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img" aria-labelledby="plate-rea-investigation-title plate-rea-investigation-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-rea-investigation-title">一个函数，四个视角</title>
  <desc id="plate-rea-investigation-desc">使用 Ghidra provider 对 ledger-arm64-O1 的 _percent_change 运行 rea function 的记录。顶部，你调用 rea 6.7.0，将问题交给已绑定 ghidra 的 BinarySession；会话通过 bridge.sock 调用 GhidraClient，后者启动无界面 Ghidra 12.1.4 JVM，导入分析 33872 字节的 mach-o arm64 可执行文件 ledger-arm64-O1。三列展示同一函数：你在 ledger.c 写的 C；clang -O1 生成的六条指令，从 0x100000500 的 cbz w0 到 0x100000514 的 ret；Ghidra 反编译伪代码，含源码没有的第二次零值检查。底部 Evidence ev_b492c85e 标明操作 analyze_function、provider ghidra 12.1.4、配置摘要、confidence observed、静态读取的权威来源、十条限制、对象 sha256。</desc>
  <defs><marker id="plate-rea-investigation-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="plate-rea-investigation-head-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-olive-ink, #515f26)"/></marker><marker id="plate-rea-investigation-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">四个视角</text>
  <text x="620" y="18" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">rea function ledger-arm64-O1 _percent_change --provider ghidra</text>
  <rect x="20" y="30" width="70" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="55" y="44.95" font-size="11.5" text-anchor="middle" font-weight="700">你</text>
  <text x="55" y="62.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ledger.c</text>
  <rect x="150" y="30" width="100" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="200" y="44.95" font-size="11.5" text-anchor="middle" font-weight="700">rea 6.7.0</text>
  <text x="200" y="62.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CLI</text>
  <rect x="310" y="30" width="115" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="367.5" y="44.95" font-size="11.5" text-anchor="middle" font-weight="700">BinarySession</text>
  <text x="367.5" y="62.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">已绑定 ghidra</text>
  <rect x="500" y="30" width="120" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="560" y="44.95" font-size="11.5" text-anchor="middle" font-weight="700">GhidraClient</text>
  <text x="560" y="62.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">bridge.sock</text>
  <line x1="90" y1="50" x2="149" y2="50" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="88.9" y="33.03" width="61.2" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="119.5" y="44" font-size="11.5" text-anchor="middle">function</text>
  <line x1="250" y1="50" x2="309" y2="50" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="265" y="33.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="279.5" y="44" font-size="11.5" text-anchor="middle">执行</text>
  <line x1="425" y1="50" x2="499" y2="50" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#plate-rea-investigation-head-ink)"/>
  <rect class="m-knock" x="447.5" y="33.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="462" y="44" font-size="11.5" text-anchor="middle">调用</text>
  <rect x="500" y="92" width="120" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
