  <text x="320" y="424.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">confidence observed · 十条限制</text>
  <text x="320" y="439.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">对象 ledger-arm64-O1 · mach-o arm64</text>
