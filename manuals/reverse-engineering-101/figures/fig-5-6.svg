<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-5-6-title fig-5-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-6-title">比较 -O1 与 -O2 构建中的两个函数</title>
  <desc id="fig-5-6-desc">两表各八个比较维度。左侧 _percent_change：identity、pseudocode 272 对 272 码点、assembly 161 对 161、comments 0 对 0、calls 1 对 1、strings_names 1 对 1、cfg 3 对 3 均 unchanged；references 3 对 3 为 unknown，因为未命名引用端点在两个不同 artifact 间没有稳定身份，因此整体 status unknown。右侧 _total：identity、comments、calls 未变，pseudocode 从 300 增至 2904 码点、assembly 336 至 1866、references 4 至 13、strings_names 2 至 11、cfg 5 至 16 基本块，因此五维 changed，整体 status changed。注释说明 references 为何 unknown。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">A · _PERCENT_CHANGE，-O1 对 -O2</text>
