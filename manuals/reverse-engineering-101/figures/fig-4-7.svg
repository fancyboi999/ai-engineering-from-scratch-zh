  <text x="500" y="185" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">_grade_label</text>
  <rect x="20" y="198" width="600" height="34" fill="var(--m-paper, #fafaf5)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="28" y="219" font-size="11" font-weight="700">代码签名</text>
  <text x="250" y="219" font-size="11">0x10000831c</text>
  <text x="450" y="219" font-size="11">1</text>
  <text x="500" y="219" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ledger-arm64-O1</text>
  <text x="20" y="262" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">string_count 39 · 各项 encoding 均 US-ASCII · 10 个程序字符串、29 个名称与路径</text>
