<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="fig-8-4-title fig-8-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-4-title">会话观察到了什么，哪些仍未知</title>
  <desc id="fig-8-4-desc">两列。左列五项已观察主张及 Evidence ID：ev_41e8ca1c 中 0x100000518 的 _grade 为 60 字节；ev_2c883c7b 与 ev_41e8ca1c 用 0x66666667 除十；cmp #0x4、ldr UXTW #0x2 表明 0x1000007d0 有五个四字节条目；ev_41e8ca1c 与 ev_644b3495 仅有来自 0x10000811a 的一个 DATA 引用，无调用边；ev_ad37f574 显示 0x100000770 至 0x100000778 的 F D C B A 字符串。右列四项未结论及关闭它的调用：五个表值需 read_bytes 0x1000007d0、length 20；0x1000007e8 的五个八字节条目需该处 length 40；95 分的字母需两表，再看 0x100004030 的 _labels；谁传分数给 _grade_label，需 analyze_function entry。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-teal-ink, #18696a)">已观察，附记录</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-rose-ink, #b0344d)">未解决，附关闭它的调用</text>
  <line x1="320" y1="8" x2="320" y2="282" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="30" width="284" height="42" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="162" y="46.1" font-size="12" text-anchor="middle" font-weight="700">_grade 位于 0x100000518，60 字节</text>
  <text x="162" y="63.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_41e8ca1c, procedure.body</text>
  <rect x="20" y="80" width="284" height="42" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="162" y="96.1" font-size="12" text-anchor="middle" font-weight="700">通过 0x66666667 除以 10</text>
  <text x="162" y="113.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_2c883c7b 与 ev_41e8ca1c，assembly</text>
  <rect x="20" y="130" width="284" height="42" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="162" y="146.1" font-size="12" text-anchor="middle" font-weight="700">0x1000007d0 的五个四字节条目</text>
  <text x="162" y="163.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_41e8ca1c, cmp #0x4, ldr UXTW #0x2</text>
  <rect x="20" y="180" width="284" height="42" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="162" y="196.1" font-size="12" text-anchor="middle" font-weight="700">一个 DATA 引用，无调用边</text>
  <text x="162" y="213.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_41e8ca1c 与 ev_644b3495，0x10000811a</text>
  <rect x="20" y="230" width="284" height="42" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="162" y="246.1" font-size="12" text-anchor="middle" font-weight="700">0x100000770 至 778 的 F D C B A</text>
  <text x="162" y="263.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ev_ad37f574，39 字符串</text>
  <rect x="336" y="30" width="284" height="42" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="478" y="46.1" font-size="12" text-anchor="middle" font-weight="700">五个表值</text>
  <text x="478" y="63.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">read_bytes 0x1000007d0，length 20</text>
  <rect x="336" y="80" width="284" height="42" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="478" y="96.1" font-size="12" text-anchor="middle" font-weight="700">0x1000007e8 的五个八字节条目</text>
  <text x="478" y="113.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">read_bytes 0x1000007e8，length 40</text>
  <rect x="336" y="130" width="284" height="42" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="478" y="146.1" font-size="12" text-anchor="middle" font-weight="700">95 分对应的字母</text>
  <text x="478" y="163.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">两个表，再看 0x100004030 的 _labels</text>
  <rect x="336" y="180" width="284" height="42" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="478" y="196.1" font-size="12" text-anchor="middle" font-weight="700">谁给 _grade_label 传入分数</text>
  <text x="478" y="213.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">analyze_function entry</text>
</svg>
