  <line x1="170" y1="262" x2="170" y2="281" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-1-head-ink)"/>
  <rect class="m-knock" x="175" y="260.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
