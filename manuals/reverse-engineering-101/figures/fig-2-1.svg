  <line x1="320" y1="176" x2="439" y2="176" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-2-1-head-rose)"/>
  <rect class="m-knock" x="370.75" y="159.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="379.5" y="170" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">否</text>
