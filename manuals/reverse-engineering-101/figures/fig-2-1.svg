  <rect x="20" y="282" width="300" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="170" y="299.1" font-size="12" text-anchor="middle" font-weight="700">最终使用自己的表达</text>
  <text x="170" y="316.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">第 6(2)(c) 条、Sega、Connectix：不复制代码</text>
  <line x1="320" y1="304" x2="439" y2="304" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-2-1-head-rose)"/>
  <rect class="m-knock" x="370.75" y="287.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
