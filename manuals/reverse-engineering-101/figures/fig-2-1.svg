  <text x="170" y="60.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">U.S.C. 1201(f)(1) · 2009/24/EC Art. 6(1)(a)</text>
  <line x1="320" y1="48" x2="439" y2="48" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-2-1-head-rose)"/>
