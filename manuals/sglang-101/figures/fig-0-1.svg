<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="fig-0-1-title fig-0-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-0-1-title">如何阅读本手册的时序图</title>
  <desc id="fig-0-1-desc">六条生命线：客户端脚本、tokenizer manager、scheduler、MLX 上的模型、detokenizer manager 和 macOS。九行编号交互使用八种箭头样式：POST /v1/chat/completions 为墨色实线调用，TokenizedGenerateReqInput 为靛蓝虚点 ZMQ 消息，等待到运行为琥珀虚线状态变化，1 新 token 加 2998 缓存的 prefill 为梅紫实线模型调用，51.8 GB Metal 内存上限为橄榄虚线外部影响，Hugging Face 缓存中的模型文件为青绿实线持久写入，BatchTokenIDOutput 为靛蓝虚点消息，200 OK 与 cached_tokens 2998 为墨色虚线响应，并发 32 的 Insufficient Memory 为玫红虚线失败。</desc>
