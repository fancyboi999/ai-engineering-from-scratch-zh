<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" role="img" aria-labelledby="fig-2-5-title fig-2-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-5-title">带停止字符串的流式请求</title>
  <desc id="fig-2-5-desc">四条生命线：客户端、TokenizerManager、scheduler、detokenizer。客户端发送流式请求，scheduler 将 token ID 发给 detokenizer，后者把文本作为 SSE 输出块送回客户端。Scheduler 暂存尾部可能构成停止字符串开头的文本，匹配停止字符串后结束，detokenizer 在最后输出块前裁去停止文本。</desc>
  <defs><marker id="fig-2-5-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-2-5-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <rect x="10" y="10" width="140" height="30" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="80" y="28.6" font-size="12" text-anchor="middle" font-weight="700">客户端</text>
  <line x1="80" y1="40" x2="80" y2="484" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="170" y="10" width="140" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="240" y="28.6" font-size="12" text-anchor="middle" font-weight="700">TokenizerManager</text>
  <line x1="240" y1="40" x2="240" y2="484" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="330" y="10" width="140" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="400" y="28.6" font-size="12" text-anchor="middle" font-weight="700">调度器</text>
  <line x1="400" y1="40" x2="400" y2="484" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="490" y="10" width="140" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="560" y="28.6" font-size="12" text-anchor="middle" font-weight="700">detokenizer</text>
  <line x1="560" y1="40" x2="560" y2="484" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="20" cy="76" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="80" font-size="11" text-anchor="middle">1</text>
  <line x1="80" y1="76" x2="239" y2="76" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-2-5-head-ink)"/>
  <rect class="m-knock" x="99.5" y="59.03" width="121" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="160" y="70" font-size="11.5" text-anchor="middle">POST，stream true</text>
  <circle cx="20" cy="117" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="121" font-size="11" text-anchor="middle">2</text>
  <line x1="240" y1="117" x2="399" y2="117" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="288.25" y="100.03" width="63.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="320" y="111" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">已分词请求</text>
  <circle cx="20" cy="158" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="162" font-size="11" text-anchor="middle">3</text>
  <line x1="400" y1="158" x2="559" y2="158" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="440.2" y="141.03" width="79.6" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="480" y="152" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">新 token ID</text>
  <circle cx="20" cy="199" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="203" font-size="11" text-anchor="middle">4</text>
  <line x1="560" y1="199" x2="241" y2="199" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="379.75" y="182.03" width="40.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="400" y="193" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">新文本</text>
  <circle cx="20" cy="240" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="244" font-size="11" text-anchor="middle">5</text>
  <line x1="240" y1="240" x2="81" y2="240" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="125.95" y="223.03" width="68.1" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="160" y="234" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">SSE 输出块</text>
  <circle cx="20" cy="281" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="285" font-size="11" text-anchor="middle">6</text>
  <circle cx="400" cy="281" r="4" fill="var(--m-amber-ink, #85590c)"/>
  <rect class="m-knock" x="409" y="274.42" width="105" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="412" y="285" font-size="11" fill="var(--m-amber-ink, #85590c)">暂存可能的停止前缀</text>
  <circle cx="20" cy="322" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="326" font-size="11" text-anchor="middle">7</text>
  <circle cx="400" cy="322" r="4" fill="var(--m-amber-ink, #85590c)"/>
  <rect class="m-knock" x="409" y="315.42" width="116" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="412" y="326" font-size="11" fill="var(--m-amber-ink, #85590c)">停止字符串匹配，结束</text>
  <circle cx="20" cy="363" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="367" font-size="11" text-anchor="middle">8</text>
  <line x1="400" y1="363" x2="559" y2="363" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="387.3" y="346.03" width="185.4" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="480" y="357" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">最后 ID，finish_reason stop</text>
  <circle cx="20" cy="404" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="408" font-size="11" text-anchor="middle">9</text>
  <line x1="560" y1="404" x2="241" y2="404" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-2-5-head-indigo)"/>
  <rect class="m-knock" x="339.5" y="387.03" width="121" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="400" y="398" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">裁去停止字符串的文本</text>
  <circle cx="20" cy="445" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="20" y="449" font-size="11" text-anchor="middle">10</text>
  <line x1="240" y1="445" x2="81" y2="445" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-2-5-head-ink)"/>
  <rect class="m-knock" x="86.85" y="428.03" width="146.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="160" y="439" font-size="11.5" text-anchor="middle">最后输出块，再发 [DONE]</text>
</svg>
