  <rect x="468" y="282" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="301.1" font-size="12" text-anchor="middle" font-weight="700">aiter</text>
