<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3-title">v0.5.22 默认注意力后端</title>
  <desc id="fig-4-3-desc">决策树按模型注意力类型分为左侧 MHA、右侧 MLA。MHA：因 issue 17411，Hopper 加 CUDA 12.3 用 fa3；Blackwell SM100 用 trtllm_mha，K/V 宽度不等则 fa4；AMD 用 aiter；Apple MPS 用 torch_native；其他 GPU 用 flashinfer，模型带 attention sinks 则 triton。MLA：Hopper 用 fa3；Blackwell 用 flashinfer，DeepSeek V3 覆盖为 trtllm_mla；AMD 在 16 或 128 KV head 时用 aiter；其余用 triton。</desc>
  <defs><marker id="fig-4-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="180" y="20" width="280" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="320" y="38.25" font-size="12.5" text-anchor="middle" font-weight="700">get_default_attn_backend</text>
  <text x="320" y="55.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">未设置 --attention-backend</text>
  <rect x="20" y="100" width="280" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
