  <rect x="148" y="394" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="224" y="413.1" font-size="12" text-anchor="middle" font-weight="700">flashinfer</text>
  <text x="224" y="430.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">有 sinks 时用 triton</text>
  <line x1="348" y1="146" x2="348" y2="418" stroke="var(--m-ink-mute, #666660)" stroke-width="1"/>
