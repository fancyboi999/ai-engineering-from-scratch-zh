  <line x1="348" y1="250" x2="356" y2="250" stroke="var(--m-ink-mute, #666660)" stroke-width="1"/>
  <text x="360" y="254" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">Blackwell SM100</text>
  <rect x="468" y="226" width="152" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="544" y="245.1" font-size="12" text-anchor="middle" font-weight="700">flashinfer</text>
  <text x="544" y="262.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeepSeek V3 覆盖值</text>
