<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4-title">相同 token，三种顺序</title>
  <desc id="fig-3-4-desc">约 3,000-token prompt 的三条 token 带。稳定 prompt 复用 2,998、计算 1，TTFT 中位数 45 ms。随机 ID 在开头时只复用 5、逐轮未命中数中位数为 3,027，耗时 1,255 ms。同样 ID 在末尾则复用 2,985、计算约 45，耗时 88 ms。条带宽度仅作数量级示意，不表示同一轮的配对总数。</desc>
  <rect x="20" y="14" width="14" height="12" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="40" y="24" font-size="11.5">基数缓存复用</text>
  <rect x="260" y="14" width="14" height="12" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="280" y="24" font-size="11.5">重新 prefill</text>
  <text x="20" y="56" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">稳定 SYSTEM PROMPT</text>
  <rect x="20" y="66" width="439.85" height="30" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="459.85" y="66" width="3" height="30" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="474" y="78" font-size="11.5">2,998 已缓存</text>
  <text x="474" y="94" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TTFT 中位数 45 ms</text>
  <text x="20" y="132" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">随机 ID 在开头</text>
  <rect x="20" y="142" width="3" height="30" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="23" y="142" width="437" height="30" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="474" y="154" font-size="11.5">5 已缓存</text>
  <text x="474" y="170" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TTFT 中位数 1,255 ms</text>
  <text x="20" y="208" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">随机 ID 在末尾</text>
  <rect x="20" y="218" width="433.75" height="30" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="453.75" y="218" width="6.25" height="30" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="474" y="230" font-size="11.5">2,985 已缓存</text>
  <text x="474" y="246" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">TTFT 中位数 88 ms</text>
  <text x="20" y="282" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">条带宽度仅作示意；未命中数按逐轮数据单独取中位数。</text>
</svg>
