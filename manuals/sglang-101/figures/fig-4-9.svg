  <text x="20" y="184" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">批次含 37 请求</text>
  <rect x="20" y="194" width="66.5" height="26" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
