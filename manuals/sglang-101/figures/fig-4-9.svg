<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-4-9-title fig-4-9-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-9-title">同一行在两个批次中归约</title>
  <desc id="fig-4-9-desc">两列对比。左侧默认矩阵乘内核在批次 1 时用两个 tile 归约同一请求行，在批次 37 时用四个 tile，部分和的相加顺序不同，结果末位可能变化。右侧批次不变内核在两批次都使用同样固定切分，结果比特相同。</desc>
