<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-5-1-title">并发上限 8 后吞吐量停止增长，延迟继续增加</title>
  <desc id="fig-5-1-desc">基准扫描的两个条形图。左侧并发上限 1、8、32 的输出吞吐量为 175.15、255.63、252.74 token/s；右侧同样上限的 TTFT 中位数为 162.98、785.79、3917.54 ms。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">输出 TOK/S</text>
  <text x="340" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">TTFT 中位数，MS</text>
  <line x1="320" y1="8" x2="320" y2="228" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="56" font-size="11.5">上限 1</text>
  <rect x="80" y="40" width="105.09" height="22" fill="var(--m-olive-ink, #515f26)"/>
  <text x="191.09" y="56" font-size="11.5">175.15</text>
  <text x="340" y="56" font-size="11.5">上限 1</text>
  <rect x="400" y="40" width="6.93" height="22" fill="var(--m-olive-ink, #515f26)"/>
  <text x="412.93" y="56" font-size="11.5">163</text>
  <text x="20" y="112" font-size="11.5">上限 8</text>
  <rect x="80" y="96" width="153.38" height="22" fill="var(--m-olive-ink, #515f26)"/>
  <text x="239.38" y="112" font-size="11.5">255.63</text>
  <text x="340" y="112" font-size="11.5">上限 8</text>
  <rect x="400" y="96" width="33.4" height="22" fill="var(--m-olive-ink, #515f26)"/>
  <text x="439.4" y="112" font-size="11.5">786</text>
  <text x="20" y="168" font-size="11.5">上限 32</text>
  <rect x="80" y="152" width="151.64" height="22" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="237.64" y="168" font-size="11.5">252.74</text>
  <text x="340" y="168" font-size="11.5">上限 32</text>
  <rect x="400" y="152" width="166.5" height="22" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="572.5" y="168" font-size="11.5">3918</text>
  <text x="20" y="214" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 至 8：+46%，8 至 32：-1%</text>
  <text x="340" y="214" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 至 8：4.8 倍，8 至 32：5.0 倍</text>
</svg>
