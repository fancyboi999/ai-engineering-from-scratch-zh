  <text x="70" y="84" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每请求预留 256 输入 + 512 输出 = 768 token</text>
  <text x="70" y="120" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">第六个请求需总计 4,608</text>
