<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-3-title">4,096 token 能装五个请求，装不下六个</title>
  <desc id="fig-2-3-desc">两条表示 4,096-token KV 池。第一条五请求各预留 256 prompt 加 512 输出，共 3,840 token，余 256。第二条第六个请求还需 768，超过池末端 512 token，因此调度器让它等待。</desc>
