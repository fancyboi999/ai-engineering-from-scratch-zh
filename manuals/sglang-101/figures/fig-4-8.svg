<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-4-8-title fig-4-8-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-8-title">约束请求从到达到采样</title>
  <desc id="fig-4-8-desc">带 json_schema 的请求到达 grammar manager，以 json 加 schema 为键查缓存。命中直接进入等待队列；未命中在线程池编译，请求在语法队列等待所有 rank 就绪。每个 decode 步语法填充词表 bitmask，遮蔽 logits 后 sampler 选 token，语法再接受该 token。</desc>
  <defs><marker id="fig-4-8-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-4-8-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-4-8-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker></defs>
  <rect x="20" y="30" width="190" height="48" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="115" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">请求</text>
  <text x="115" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">sampling_params.json_schema</text>
  <rect x="240" y="30" width="170" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="325" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">语法缓存</text>
  <text x="325" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">key (&quot;json&quot;, schema)</text>
  <rect x="460" y="30" width="160" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="540" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">等待队列</text>
  <text x="540" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">可以调度</text>
  <line x1="210" y1="54" x2="239" y2="54" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8-head-ink)"/>
  <line x1="410" y1="54" x2="459" y2="54" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-8-head-amber)"/>
  <rect class="m-knock" x="420" y="37.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="434.5" y="48" font-size="11.5" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">命中</text>
  <rect x="240" y="130" width="170" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="325" y="149.25" font-size="12.5" text-anchor="middle" font-weight="700">线程池</text>
  <text x="325" y="166.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">编译，返回 future</text>
  <rect x="460" y="130" width="160" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="540" y="149.25" font-size="12.5" text-anchor="middle" font-weight="700">语法队列</text>
  <text x="540" y="166.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">所有 rank 都就绪？</text>
  <line x1="325" y1="78" x2="325" y2="130" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-4-8-head-ink)"/>
  <rect class="m-knock" x="330" y="93.03" width="40.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="333" y="104" font-size="11.5">未命中</text>
  <line x1="410" y1="154" x2="459" y2="154" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-8-head-amber)"/>
  <line x1="540" y1="130" x2="540" y2="78" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-4-8-head-amber)"/>
  <rect class="m-knock" x="545" y="93.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="548" y="104" font-size="11.5" fill="var(--m-amber-ink, #85590c)">就绪</text>
  <rect x="20" y="240" width="170" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="105" y="259.25" font-size="12.5" text-anchor="middle" font-weight="700">logits</text>
  <text x="105" y="276.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每请求一行</text>
  <rect x="240" y="240" width="170" height="48" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="325" y="259.25" font-size="12.5" text-anchor="middle" font-weight="700">词表 bitmask</text>
  <text x="325" y="276.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">移除无效 token</text>
  <rect x="460" y="240" width="160" height="48" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="540" y="259.25" font-size="12.5" text-anchor="middle" font-weight="700">采样器</text>
  <text x="540" y="276.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">选择有效 token</text>
  <line x1="190" y1="264" x2="239" y2="264" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-4-8-head-plum)"/>
  <line x1="410" y1="264" x2="459" y2="264" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-4-8-head-plum)"/>
  <text x="20" y="226" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">每个 DECODE 步</text>
  <text x="20" y="316" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">采样后语法接受 token，并更新状态</text>
</svg>
