<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="fig-6-4-title fig-6-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-4-title">cache_aware 如何选择服务器</title>
  <desc id="fig-6-4-desc">决策流程先检查负载失衡：最高减最低大于 64，且最高大于最低 1.5 倍。是则发往最低负载服务器；否则根据字符树计算匹配率。大于 0.3 发往最长匹配服务器，0.3 及以下发往最低负载。每条分支都把请求文本插入树。</desc>
  <defs><marker id="fig-6-4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="230" y="12" width="180" height="32" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="320" y="31.75" font-size="12.5" text-anchor="middle" font-weight="700">请求文本</text>
  <rect x="150" y="74" width="290" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="295" y="94.25" font-size="12.5" text-anchor="middle" font-weight="700">负载失衡？</text>
  <text x="295" y="111.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">max - min &gt; 64 且 max &gt; 1.5 x min</text>
  <rect x="150" y="168" width="340" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="188.25" font-size="12.5" text-anchor="middle" font-weight="700">匹配率 &gt; 0.3？</text>
  <text x="320" y="205.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">匹配字符 / 请求字符</text>
  <rect x="500" y="74" width="130" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="565" y="94.25" font-size="12.5" text-anchor="middle" font-weight="700">最低负载</text>
  <text x="565" y="111.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">服务器</text>
  <rect x="150" y="262" width="200" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="250" y="282.25" font-size="12.5" text-anchor="middle" font-weight="700">最长匹配</text>
  <text x="250" y="299.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">树中的服务器</text>
  <rect x="410" y="262" width="220" height="50" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="520" y="282.25" font-size="12.5" text-anchor="middle" font-weight="700">最低负载</text>
  <text x="520" y="299.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">相同时随机选择</text>
  <line x1="320" y1="44" x2="320" y2="73" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-4-head-ink)"/>
  <line x1="440" y1="99" x2="499" y2="99" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-4-head-ink)"/>
  <rect class="m-knock" x="461.25" y="82.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="470" y="93" font-size="11.5" text-anchor="middle">是</text>
  <line x1="320" y1="124" x2="320" y2="167" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-4-head-ink)"/>
  <rect class="m-knock" x="325" y="134.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="145.5" font-size="11.5">否</text>
  <line x1="250" y1="218" x2="250" y2="261" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-4-head-ink)"/>
  <rect class="m-knock" x="255" y="228.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="258" y="239.5" font-size="11.5">是</text>
  <line x1="470" y1="218" x2="470" y2="261" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-4-head-ink)"/>
  <rect class="m-knock" x="475" y="228.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="478" y="239.5" font-size="11.5">否</text>
  <text x="20" y="98" font-size="11" fill="var(--m-ink-mute, #666660)">步骤 1</text>
  <text x="20" y="192" font-size="11" fill="var(--m-ink-mute, #666660)">步骤 2</text>
  <text x="20" y="286" font-size="11" fill="var(--m-ink-mute, #666660)">步骤 3</text>
  <text x="20" y="330" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">各分支都将请求文本插入所选服务器的树</text>
</svg>
