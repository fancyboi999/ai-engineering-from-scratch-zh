<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="fig-3-6-title fig-3-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-6-title">Mamba 前缀只能从快照恢复</title>
  <desc id="fig-3-6-desc">缓存会话用 0 至 2,048-token 带表示，每 256 token 有 Mamba 状态快照。新请求匹配前 1,800 token。全注意力 KV 覆盖全部 1,800 token，但递归状态只在快照处存在，因此从 1,792-token 快照恢复，重新 prefill 1,792 至 1,800。</desc>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">缓存会话 · 2,048 TOKEN</text>
  <rect x="40" y="32" width="560" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <line x1="40" y1="58" x2="40" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="40" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">0</text>
  <line x1="110" y1="58" x2="110" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="180" y1="58" x2="180" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="180" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">512</text>
  <line x1="250" y1="58" x2="250" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="320" y1="58" x2="320" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="320" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">1,024</text>
  <line x1="390" y1="58" x2="390" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="460" y1="58" x2="460" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="460" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">1,536</text>
  <line x1="530" y1="58" x2="530" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <line x1="600" y1="58" x2="600" y2="70" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="600" y="86" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">2,048</text>
  <text x="40" y="106" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">青绿刻度：每 256 token 的 Mamba 状态快照</text>
  <text x="20" y="140" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">新请求 · 匹配 1,800 TOKEN</text>
  <rect x="40" y="152" width="490" height="26" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <rect x="530" y="152" width="2.19" height="26" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <line x1="530" y1="146" x2="530" y2="186" stroke="var(--m-teal-ink, #18696a)" stroke-width="2"/>
  <text x="40" y="204" font-size="11.5" fill="var(--m-green-ink, #336b40)">复用：截至最后快照的 1,792 token</text>
  <text x="40" y="224" font-size="11.5" fill="var(--m-plum-ink, #8a3d72)">重新 prefill：1,792 至 1,800 的八个 token</text>
  <text x="40" y="256" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每个 token 都有全注意力 KV。递归状态</text>
  <text x="40" y="274" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">只存在于保存了快照的位置。</text>
</svg>
