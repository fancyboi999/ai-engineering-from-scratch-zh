<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-3-5-title fig-3-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-5-title">一个前缀经过 HiCache 三层</title>
  <desc id="fig-3-5-desc">从左到右三层：L1 是 GPU KV 池，L2 为实例私有的锁页主机内存，L3 为 file、mooncake、hf3fs、nixl 等存储。write_through 首次命中即复制到 L2，write_through_selective 等第二次。L1 淘汰仍保留主机副本，后续匹配将主机部分载入新 GPU 槽位，领先计算一层。L3 命中不足 256 token 时跳过存储预取。</desc>
  <defs><marker id="fig-3-5-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-3-5-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <rect x="20" y="40" width="150" height="70" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="95" y="62.75" font-size="12.5" text-anchor="middle" font-weight="700">L1 · GPU 池</text>
  <text x="95" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">设备内存</text>
  <text x="95" y="95.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求与缓存</text>
  <rect x="245" y="40" width="150" height="70" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="320" y="62.75" font-size="12.5" text-anchor="middle" font-weight="700">L2 · 主机</text>
  <text x="320" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">锁页内存</text>
  <text x="320" y="95.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">单实例私有</text>
  <rect x="470" y="40" width="150" height="70" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="62.75" font-size="12.5" text-anchor="middle" font-weight="700">L3 · 存储</text>
  <text x="545" y="80.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">服务器间共享</text>
  <text x="545" y="95.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">file, mooncake</text>
  <text x="20" y="150" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">前缀何时有主机副本</text>
  <rect x="20" y="162" width="230" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="32" y="179.6" font-size="12" font-weight="700">write_through（默认）</text>
  <text x="266" y="181" font-size="12" class="m-serif">首次命中 · 阈值 1</text>
  <rect x="20" y="196" width="230" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="32" y="213.6" font-size="12" font-weight="700">write_through_selective</text>
  <text x="266" y="215" font-size="12" class="m-serif">第二次命中 · 阈值 2</text>
  <rect x="20" y="230" width="230" height="28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="32" y="247.6" font-size="12" font-weight="700">write_back</text>
  <text x="266" y="249" font-size="12" class="m-serif">仅 L1 淘汰时</text>
  <text x="20" y="282" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">V0.5.22 存储预取</text>
  <text x="20" y="304" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">匹配不足 256 token 则跳过 · 等待 1.0 s + 每 1,024 token 加 0.25 s</text>
  <g data-beat="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="0.45s" begin="indefinite" fill="freeze"/>
  <line x1="170" y1="60" x2="244" y2="60" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-3-5-head-teal)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-teal-ink, #18696a)" opacity="0"><animateMotion path="M170 60 L244 60" keyPoints="0;0;1;1" keyTimes="0;0;0.688;1" calcMode="linear" dur="0.8s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.1;0.688;1" dur="0.8s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="192.5" y="43.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="207" y="54" font-size="11.5" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">复制</text>
  </g>
  <g data-beat="2"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.571;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.05s" begin="indefinite" fill="freeze"/>
  <line x1="395" y1="60" x2="469" y2="60" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-3-5-head-teal)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-teal-ink, #18696a)" opacity="0"><animateMotion path="M395 60 L469 60" keyPoints="0;0;1;1" keyTimes="0;0.429;0.821;1" calcMode="linear" dur="1.4s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.429;0.486;0.821;1" dur="1.4s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="417.5" y="43.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="432" y="54" font-size="11.5" text-anchor="middle" fill="var(--m-teal-ink, #18696a)">备份</text>
  </g>
  <g data-beat="3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.727;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="1.65s" begin="indefinite" fill="freeze"/>
  <line x1="469" y1="96" x2="396" y2="96" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-5-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M469 96 L396 96" keyPoints="0;0;1;1" keyTimes="0;0.6;0.875;1" calcMode="linear" dur="2s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.875;1" dur="2s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="418" y="79.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="432.5" y="90" font-size="11.5" text-anchor="middle">取回</text>
  </g>
  <g data-beat="4"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0" keyTimes="0;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1" dur="2.25s" begin="indefinite" fill="freeze"/>
  <line x1="244" y1="96" x2="171" y2="96" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-5-head-ink)"/>
  <circle class="m-packet" r="3.5" fill="var(--m-ink, #1a1a1a)" opacity="0"><animateMotion path="M244 96 L171 96" keyPoints="0;0;1;1" keyTimes="0;0.692;0.904;1" calcMode="linear" dur="2.6s" begin="indefinite" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.692;0.723;0.904;1" dur="2.6s" begin="indefinite" fill="freeze"/></circle>
  <rect class="m-knock" x="193" y="79.03" width="29" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="207.5" y="90" font-size="11.5" text-anchor="middle">载入</text>
  </g>
</svg>
