<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-3-5c-title fig-3-5c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-5c-title">HiCache 保存 GPU 池淘汰的 prompt</title>
  <desc id="fig-3-5c-desc">NVIDIA L4 上 Qwen3-8B 的 TTFT 中位数对不同 2,048-token system prompt 数，每点三个种子，对数刻度。GPU 池容纳 24,094 token。四份 prompt 时双方约 360 ms；16、32 份时默认 3,259、5,449 ms，HiCache 553、817 ms；64 份超过 GPU 与主机池合计容量，默认 6,821 ms，HiCache 3,610 ms。</desc>
