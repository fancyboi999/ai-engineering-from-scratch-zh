  <rect x="315" y="10" width="150" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="390" y="28.6" font-size="12" text-anchor="middle" font-weight="700">调度器</text>
  <line x1="390" y1="40" x2="390" y2="462" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="485" y="10" width="150" height="30" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
