<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-3-title">一个 /generate 请求经过三个进程</title>
  <desc id="fig-1-3-desc">四条生命线：客户端、tokenizer manager、scheduler、detokenizer。客户端发送五 token prompt，tokenizer manager 经 ZMQ 发送 ID。Scheduler 匹配两个缓存 token、prefill 三个，68 ms 后返回首 token。随后十一个 decode 步，detokenizer 返回文本，端到端 725 ms。</desc>
