<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1-title">捕获 Mac 上的 prefill 与 decode</title>
  <desc id="fig-1-1-desc">两列来自一次单请求基准。左侧 prefill 对 512 prompt token 做一次前向，写入 512 KV 条目，首 token 延迟中位数 162.98 ms，即每 prompt token 约 0.32 ms。右侧 decode 对其后 127 token 各做一次前向，每次读取全部权重与已缓存 KV，平均每 token 4.38 ms。</desc>
  <defs><marker id="fig-1-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-1-1-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">PREFILL · 一次处理完整 PROMPT</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">DECODE · 每次一个 TOKEN</text>
  <line x1="320" y1="8" x2="320" y2="298" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="32" width="284" height="44" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="162" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">512 个 prompt token ID</text>
  <text x="162" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">random 数据集，种子 7</text>
  <rect x="20" y="110" width="284" height="54" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="162" y="132.25" font-size="12.5" text-anchor="middle" font-weight="700">一次前向传播</text>
  <text x="162" y="149.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">一批矩阵乘处理 512 token</text>
  <rect x="20" y="198" width="284" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="162" y="215.25" font-size="12.5" text-anchor="middle" font-weight="700">写入 512 个 KV 条目</text>
  <text x="162" y="232.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">为后续每一步保留</text>
  <line x1="162" y1="76" x2="162" y2="109" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-1-head-ink)"/>
  <line x1="162" y1="164" x2="162" y2="197" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-1-1-head-teal)"/>
  <text x="20" y="270" font-size="12.5" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">TTFT 中位数 162.98 ms</text>
  <text x="20" y="290" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每 prompt token 约 0.32 ms</text>
  <rect x="336" y="32" width="284" height="44" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="478" y="49.25" font-size="12.5" text-anchor="middle" font-weight="700">每请求 1 个新 token</text>
  <text x="478" y="66.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">上次 decode 生成的 token</text>
  <rect x="336" y="110" width="284" height="54" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="478" y="132.25" font-size="12.5" text-anchor="middle" font-weight="700">一次前向传播</text>
  <text x="478" y="149.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">为一个 token 读取全部权重</text>
  <rect x="336" y="198" width="284" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="478" y="215.25" font-size="12.5" text-anchor="middle" font-weight="700">读取 512 + n 个 KV 条目</text>
  <text x="478" y="232.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">并再写入一个</text>
  <line x1="478" y1="76" x2="478" y2="109" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-1-1-head-ink)"/>
  <line x1="478" y1="198" x2="478" y2="165" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-1-1-head-ink)"/>
  <text x="336" y="270" font-size="12.5" font-weight="700" fill="var(--m-plum-ink, #8a3d72)">平均 TPOT 4.38 ms</text>
  <text x="336" y="290" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">后续 127 token 各重复一次</text>
  <text x="20" y="316" font-size="11" class="m-serif" fill="var(--m-ink-mute, #666660)">Qwen3-0.6B-4bit · SGLang 0.5.22 / MLX</text>
</svg>
