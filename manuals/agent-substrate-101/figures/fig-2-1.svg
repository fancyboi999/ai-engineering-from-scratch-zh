<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-1-title">使用发布镜像与从源码安装的各步耗时</title>
  <desc id="fig-2-1-desc">两组水平柱状图展示各安装步骤的耗时秒数。在 16 vCPU 的 x86 客户机上使用发布镜像：kind 集群 55 s、部署 ate-system 162 s、部署示例 counter 94 s，共 311 s。在 24 vCPU 的 x86 客户机上从源码构建：kind 集群 56 s、部署 ate-system 163 s（失败）、重试同一步骤 266 s、部署示例 counter 47 s，共 532 s。失败步骤标为玫红色，因缺少 Docker buildx 插件而中断。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">使用发布镜像 · X86 客户机，16 VCPU</text>
  <text x="620" y="18" font-size="11.5" text-anchor="end" font-weight="700">共 311 s</text>
  <text x="180" y="47" font-size="11.5" text-anchor="end">kind 集群</text>
  <rect x="190" y="34" width="68.75" height="18" fill="var(--m-grey-ink, #5e5e59)"/>
  <text x="266.75" y="47" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">55 s</text>
  <text x="180" y="75" font-size="11.5" text-anchor="end">部署 ate-system</text>
  <rect x="190" y="62" width="202.5" height="18" fill="var(--m-blue-ink, #2f5d9a)"/>
  <text x="400.5" y="75" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">162 s</text>
  <text x="180" y="103" font-size="11.5" text-anchor="end">部署示例 counter</text>
  <rect x="190" y="90" width="117.5" height="18" fill="var(--m-violet-ink, #5b4fa3)"/>
  <text x="315.5" y="103" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">94 s</text>
  <line x1="190" y1="28" x2="190" y2="116" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="190" y1="116" x2="565" y2="116" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="190" y1="116" x2="190" y2="120" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="190" y="132" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="315" y1="116" x2="315" y2="120" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="315" y="132" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="440" y1="116" x2="440" y2="120" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="440" y="132" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <line x1="565" y1="116" x2="565" y2="120" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="565" y="132" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">300 s</text>
  <line x1="20" y1="146" x2="620" y2="146" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="170" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">从源码构建 · X86 客户机，24 VCPU</text>
  <text x="620" y="170" font-size="11.5" text-anchor="end" font-weight="700">共 532 s</text>
  <text x="180" y="199" font-size="11.5" text-anchor="end">kind 集群</text>
  <rect x="190" y="186" width="70" height="18" fill="var(--m-grey-ink, #5e5e59)"/>
  <text x="268" y="199" font-size="11.5" fill="var(--m-ink-soft, #4a4a4a)">56 s</text>
  <text x="180" y="227" font-size="11.5" text-anchor="end">部署 ate-system</text>
  <rect x="190" y="214" width="203.75" height="18" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="401.75" y="227" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">163 s，退出码 1：无 buildx</text>
  <text x="180" y="255" font-size="11.5" text-anchor="end">重试同一步骤</text>
  <rect x="190" y="242" width="332.5" height="18" fill="var(--m-blue-ink, #2f5d9a)"/>
  <text x="530.5" y="255" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">266 s</text>
  <text x="180" y="283" font-size="11.5" text-anchor="end">部署示例 counter</text>
  <rect x="190" y="270" width="58.75" height="18" fill="var(--m-violet-ink, #5b4fa3)"/>
  <text x="256.75" y="283" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">47 s</text>
  <line x1="190" y1="180" x2="190" y2="296" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="190" y1="296" x2="565" y2="296" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="190" y1="296" x2="190" y2="300" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="190" y="312" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="315" y1="296" x2="315" y2="300" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="315" y="312" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="440" y1="296" x2="440" y2="300" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="440" y="312" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">200</text>
  <line x1="565" y1="296" x2="565" y2="300" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="565" y="312" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">300 s</text>
  <text x="20" y="334" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">源码构建使用 docker buildx 制作 Envoy 镜像，并编译了一个 Rust 模块。</text>
  <text x="20" y="350" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">两种安装方式中，示例步骤均用 ko 构建了 worker 与 counter 镜像。</text>
</svg>
