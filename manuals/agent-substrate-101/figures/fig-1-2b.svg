  <title id="fig-1-2b-title">发往 my-counter-1 的六次请求，以及最后两次间隔 900 秒内的状态</title>
  <desc id="fig-1-2b-desc">上半部分为六条水平柱，展示 x86 服务器客户机上经 kubectl ate proxy 发起每次请求的客户端耗时：请求 1 0.358 s、请求 2 0.091 s、请求 3 0.067 s、请求 4 0.062 s、请求 5 0.068 s、请求 6 0.080 s。第一条为琥珀色，因为包含从黄金快照恢复的过程，多花约 0.29 s；其余为绿色，因为 actor 已在运行。下半部分为请求 5 与请求 6 之间无请求的 913 秒时间轴，共 60 次状态采样，全部 60 个点都落在 ACTOR_STATE_RUNNING 行，ACTOR_STATE_SUSPENDED 行为空。</desc>
