<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-9-4-title fig-9-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-4-title">故障演练中的六类故障：从异常现象到首个正常响应</title>
  <desc id="fig-9-4-desc">第二台 x86 服务器客户机上故障演练的六行实测结果。每行以玫红色条展示首个失败请求的耗时与状态码、执行的修复动作及其耗时，以及修复后首个返回 200 请求的耗时。删除 worker pod：0.07 s 返回 503，执行“回退”耗时 0.2 s，随后 0.33 s 返回 200；移除节点本地快照：0.08 s 返回 500，执行“回退”耗时 0.2 s，随后 0.41 s 返回 200；沙箱内进程退出：0.06 s 返回 503，执行“先挂起，再回退”耗时 0.7 s，随后 0.41 s 返回 200；超出内存上限：0.06 s 返回 503，执行“回退”耗时 0.2 s，随后 0.36 s 返回 200；worker 池已满：5.05 s 返回 503，执行“挂起另一个 actor”耗时 0.4 s，随后 0.32 s 返回 200；Postgres 中断 30 s：5.05 s 返回 503，执行“恢复 Postgres”耗时 2.1 s，随后 0.90 s 返回 200。</desc>
  <text x="16" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">注入故障</text>
  <text x="218" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-rose-ink, #b0344d)">失败请求</text>
  <text x="368" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-blue-ink, #2f5d9a)">修复动作</text>
  <text x="552" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-green-ink, #336b40)">首个 200</text>
  <line x1="16" y1="40" x2="624" y2="40" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="60" font-size="12" font-weight="700">1  删除 worker pod</text>
  <rect x="218" y="50" width="3" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="76" font-size="11" fill="var(--m-rose-ink, #b0344d)">0.07 s 返回 503</text>
  <text x="368" y="60" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">回退</text>
  <text x="368" y="76" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.2 s</text>
  <circle cx="556" cy="56" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="60" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.33 s</text>
  <line x1="16" y1="84" x2="624" y2="84" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="104" font-size="12" font-weight="700">2  移除节点本地快照</text>
  <rect x="218" y="94" width="3" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="120" font-size="11" fill="var(--m-rose-ink, #b0344d)">0.08 s 返回 500</text>
  <text x="368" y="104" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">回退</text>
  <text x="368" y="120" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.2 s</text>
  <circle cx="556" cy="100" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="104" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.41 s</text>
  <line x1="16" y1="128" x2="624" y2="128" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="148" font-size="12" font-weight="700">3  沙箱内进程退出</text>
  <rect x="218" y="138" width="3" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="164" font-size="11" fill="var(--m-rose-ink, #b0344d)">0.06 s 返回 503</text>
  <text x="368" y="148" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">先挂起，再回退</text>
  <text x="368" y="164" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.7 s</text>
  <circle cx="556" cy="144" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="148" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.41 s</text>
  <line x1="16" y1="172" x2="624" y2="172" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="192" font-size="12" font-weight="700">4  超出内存上限</text>
  <rect x="218" y="182" width="3" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="208" font-size="11" fill="var(--m-rose-ink, #b0344d)">0.06 s 返回 503</text>
  <text x="368" y="192" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">回退</text>
  <text x="368" y="208" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.2 s</text>
  <circle cx="556" cy="188" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="192" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.36 s</text>
  <line x1="16" y1="216" x2="624" y2="216" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="236" font-size="12" font-weight="700">5  worker 池已满</text>
  <rect x="218" y="226" width="121.2" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="252" font-size="11" fill="var(--m-rose-ink, #b0344d)">5.05 s 返回 503</text>
  <text x="368" y="236" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">挂起另一个 actor</text>
  <text x="368" y="252" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.4 s</text>
  <circle cx="556" cy="232" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="236" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.32 s</text>
  <line x1="16" y1="260" x2="624" y2="260" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="280" font-size="12" font-weight="700">6  Postgres 中断 30 s</text>
  <rect x="218" y="270" width="121.32" height="12" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="218" y="296" font-size="11" fill="var(--m-rose-ink, #b0344d)">5.05 s 返回 503</text>
  <text x="368" y="280" font-size="11.5" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">恢复 Postgres</text>
  <text x="368" y="296" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2.1 s</text>
  <circle cx="556" cy="276" r="3.5" fill="var(--m-green-ink, #336b40)"/>
  <text x="566" y="280" font-size="12" font-weight="700" fill="var(--m-green-ink, #336b40)">0.90 s</text>
  <line x1="16" y1="304" x2="624" y2="304" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="218" y="322" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">条形长度为收到失败响应前的耗时（0 至 5 s）</text>
</svg>
