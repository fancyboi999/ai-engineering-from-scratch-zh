<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-4-4b-title fig-4-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4b-title">恢复耗时与同一时刻并发恢复数的关系</title>
  <desc id="fig-4-4b-desc">带 gVisor、池容量为 16 个 actor 的 x86 服务器客户机上，向已挂起 50 MiB actor 发一次请求的耗时秒数与同一时刻并发请求数的关系。共 155 个请求各为一个小点（每档并发跑五轮），实线连接中位数。155 个请求中 155 个返回 200。中位数依次为：1 并发为 0.23 s、2 并发为 0.23 s、4 并发为 0.26 s、8 并发为 0.29 s、16 并发为 0.37 s。16 并发的 80 个请求中最慢耗时 0.45 s。虚线标出 0.5 s。</desc>
