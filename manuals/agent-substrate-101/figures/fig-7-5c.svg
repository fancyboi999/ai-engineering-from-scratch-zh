<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" role="img" aria-labelledby="fig-7-5c-title fig-7-5c-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-5c-title">运行中的 Agent Executor 任务遭遇底层 worker pod 被删除</title>
  <desc id="fig-7-5c-desc">两次运行，每行一次。两次中 task 均先写入第一个文件，经挂起并恢复后再写入第二个文件，随后其 worker pod 被删除。第一次运行中，挂起发生在丢失前 8.7 秒，快照仍处于 PENDING 状态：执行耗时 0.30 秒的 ax resume task 后，两个文件均丢失。第二次运行中，挂起发生在丢失前 307 秒，快照在对象存储中已处于 COMPLETED 状态：执行耗时 0.33 秒的 ax resume task 后，第一个文件保留，第二个文件丢失。两次运行中 task 在恢复前阶段均显示为 Failed，且无需手动执行回退命令。</desc>
  <defs><marker id="fig-7-5c-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-7-5c-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-7-5c-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">最近一次挂起</text>
  <text x="184" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">删除 WORKER POD</text>
  <text x="348" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">AX RESUME TASK</text>
  <text x="492" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">/WORKSPACE 目录</text>
  <rect x="20" y="28" width="150" height="72" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="28" y="51.45" font-size="11.5" font-weight="700">PENDING</text>
  <text x="28" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">丢失前 8.7 s 挂起，</text>
  <text x="28" y="83.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">快照仍在 worker 上</text>
  <rect x="184" y="28" width="150" height="72" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="192" y="51.45" font-size="11.5" font-weight="700">1.2 s 后 CRASHED</text>
  <text x="192" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">阶段保持 Failed</text>
  <text x="192" y="83.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无命令观察 41 s</text>
  <rect x="348" y="28" width="130" height="72" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="356" y="51.45" font-size="11.5" font-weight="700">RUNNING, 0.30 s</text>
  <text x="356" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">迁至另一 worker，</text>
  <text x="356" y="83.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无需手动回退</text>
  <rect x="492" y="28" width="128" height="72" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="500" y="51.45" font-size="11.5" font-weight="700">两个文件均丢失</text>
  <text x="500" y="68.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">连同挂起已保存的</text>
  <text x="500" y="83.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">那个文件也一并丢失</text>
  <line x1="170" y1="64" x2="183" y2="64" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-5c-head-amber)"/>
  <line x1="334" y1="64" x2="347" y2="64" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-5c-head-ink)"/>
  <line x1="478" y1="64" x2="491" y2="64" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-5c-head-rose)"/>
  <rect x="20" y="118" width="150" height="72" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="28" y="141.45" font-size="11.5" font-weight="700">COMPLETED</text>
  <text x="28" y="158.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">丢失前 307 s 挂起，</text>
  <text x="28" y="173.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">301 s 后完成上传</text>
  <rect x="184" y="118" width="150" height="72" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="192" y="141.45" font-size="11.5" font-weight="700">0.9 s 后 CRASHED</text>
  <text x="192" y="158.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">阶段保持 Failed</text>
  <text x="192" y="173.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无命令观察 300 s</text>
  <rect x="348" y="118" width="130" height="72" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="356" y="141.45" font-size="11.5" font-weight="700">RUNNING, 0.33 s</text>
  <text x="356" y="158.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">迁至另一 worker，</text>
  <text x="356" y="173.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无需手动回退</text>
  <rect x="492" y="118" width="128" height="72" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="500" y="141.45" font-size="11.5" font-weight="700">已存文件得以保留</text>
  <text x="500" y="158.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">挂起后新写的</text>
  <text x="500" y="173.55" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">文件丢失</text>
  <line x1="170" y1="154" x2="183" y2="154" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-5c-head-amber)"/>
  <line x1="334" y1="154" x2="347" y2="154" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-5c-head-ink)"/>
  <line x1="478" y1="154" x2="491" y2="154" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-7-5c-head-amber)"/>
  <text x="20" y="218" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每行对应一次运行（单 kind 节点、含 2 个 worker 的池）。每个 task 均运行 sleep infinity。</text>
</svg>
