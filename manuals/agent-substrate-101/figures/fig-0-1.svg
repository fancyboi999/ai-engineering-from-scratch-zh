<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="fig-0-1-title fig-0-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-0-1-title">如何阅读本手册的时序图</title>
  <desc id="fig-0-1-desc">六条生命线：客户端、atenet-router、ate-api-server、Postgres、运行 my-counter-1 的 worker pod 与外部主机。八个编号行展示八种箭头样式：带 ate-target-actor 头的 POST 为墨色实线调用，worker 分配行为青绿实线持久写入，SUSPENDED 到 RUNNING 为琥珀虚线状态迁移，端口 8443 的 CONNECT 隧道为靛蓝点线流，发往 mock-llm 的 POST 为梅紫实线模型调用，发往 example.org 的 GET 为橄榄虚线外部副作用，0.36 s 返回 count 1 的 200 为墨色虚线回复，503 无可用 worker 为玫红虚线失败。</desc>
