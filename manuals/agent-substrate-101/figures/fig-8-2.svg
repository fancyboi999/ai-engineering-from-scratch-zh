<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-labelledby="fig-8-2-title fig-8-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-2-title">三项依赖中断期间的逐秒请求结果</title>
  <desc id="fig-8-2-desc">三个面板分别对应被中断的一项依赖：Postgres 中断 61 秒、ate-api-server 中断 60 秒、Kubernetes API server 中断 86 秒。发往运行中 actor 的请求与新建恢复在前两个面板中均失败，在第三个面板中则全部成功（仅经由 kubectl ate proxy 的请求失败）。每行末尾标出失败请求总数。</desc>
  <rect x="20" y="14" width="12" height="8" fill="var(--m-green-ink, #336b40)"/>
  <text x="38" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">请求返回 200</text>
  <rect x="190" y="14" width="12" height="8" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="208" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">请求失败</text>
  <rect x="320" y="12" width="12" height="12" fill="var(--m-grey-fill, #ecebe3)"/>
  <text x="338" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">依赖中断</text>
  <line x1="468" y1="12" x2="468" y2="24" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="476" y="22" font-size="11" fill="var(--m-ink-soft, #4a4a4a)">恢复就绪</text>
  <text x="20" y="50" font-size="11" letter-spacing="1.2" fill="var(--m-ink-soft, #4a4a4a)">POSTGRES 中断，61 S</text>
  <text x="620" y="50" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">9 s 超时，随后 500；就绪后新建恢复仍失败 27 s</text>
  <rect x="151" y="58" width="201.3" height="64" fill="var(--m-grey-fill, #ecebe3)"/>
  <text x="20" y="75" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">运行中 actor</text>
  <rect x="118" y="66" width="36.3" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="154.3" y="66" width="217.8" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="372.1" y="66" width="122.1" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="75" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">66 次失败</text>
  <text x="20" y="93" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">新建恢复</text>
  <rect x="118" y="84" width="33" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="151" y="84" width="313.5" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="464.5" y="84" width="36.3" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="93" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">19 次失败</text>
  <text x="20" y="111" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">经由代理</text>
  <rect x="118" y="102" width="36.3" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="154.3" y="102" width="217.8" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="372.1" y="102" width="122.1" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="111" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">64 次失败</text>
  <line x1="358.9" y1="58" x2="358.9" y2="122" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="150" font-size="11" letter-spacing="1.2" fill="var(--m-ink-soft, #4a4a4a)">ATE-API-SERVER 中断，60 S</text>
  <text x="620" y="150" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">5 s 内返回 503；路由器自行发现新 pod</text>
  <rect x="151" y="158" width="198" height="64" fill="var(--m-grey-fill, #ecebe3)"/>
  <text x="20" y="175" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">运行中 actor</text>
  <rect x="118" y="166" width="52.8" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="170.8" y="166" width="198" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="368.8" y="166" width="148.5" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="175" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">60 次失败</text>
  <text x="20" y="193" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">新建恢复</text>
  <rect x="124.6" y="184" width="49.5" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="174.1" y="184" width="198" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="372.1" y="184" width="148.5" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="193" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">12 次失败</text>
  <text x="20" y="211" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">经由代理</text>
  <rect x="118" y="202" width="49.5" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="167.5" y="202" width="204.6" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="372.1" y="202" width="145.2" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="211" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">58 次失败</text>
  <line x1="382" y1="158" x2="382" y2="222" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="250" font-size="11" letter-spacing="1.2" fill="var(--m-ink-soft, #4a4a4a)">KUBE-APISERVER 中断，86 S</text>
  <text x="620" y="250" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">中断期服务了 86/86 个请求与 17/17 次新建恢复</text>
  <rect x="151" y="258" width="283.8" height="64" fill="var(--m-grey-fill, #ecebe3)"/>
  <text x="20" y="275" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">运行中 actor</text>
  <rect x="118" y="266" width="429" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="275" font-size="11" text-anchor="end" fill="var(--m-green-ink, #336b40)">0 次失败</text>
  <text x="20" y="293" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">新建恢复</text>
  <rect x="121.3" y="284" width="425.7" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="293" font-size="11" text-anchor="end" fill="var(--m-green-ink, #336b40)">0 次失败</text>
  <text x="20" y="311" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">经由代理</text>
  <rect x="118" y="302" width="33" height="10" fill="var(--m-green-ink, #336b40)"/>
  <rect x="151" y="302" width="372.9" height="10" fill="var(--m-rose-ink, #b0344d)"/>
  <rect x="523.9" y="302" width="23.1" height="10" fill="var(--m-green-ink, #336b40)"/>
  <text x="620" y="311" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">105 次失败</text>
  <line x1="451.3" y1="258" x2="451.3" y2="322" stroke="var(--m-ink, #1a1a1a)" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="118" y1="344" x2="547" y2="344" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="151" y1="340" x2="151" y2="348" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
