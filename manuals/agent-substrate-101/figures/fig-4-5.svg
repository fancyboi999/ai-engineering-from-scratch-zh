  <text x="336" y="252" font-size="11.5">24 个轮次同时发起，全部完成</text>
  <text x="336" y="270" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kagent 实测耗时 4.3 至 7.8 s</text>
