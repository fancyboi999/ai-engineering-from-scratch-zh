<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-4-5-title fig-4-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-5-title">每个 worker 可运行的 actor 数取决于该 worker 上报的 CPU</title>
  <desc id="fig-4-5-desc">左右两列。左列中，两个上限为 2 CPU 的 worker 各自上报 2000 millicores，各容纳两个声明 1 CPU 的 actor；第 5 个 actor 没有空位，请求在 5.06 s 后返回 503。右列中，16 vCPU 节点上一个未设上限的 kagent worker 上报 16000 millicores；同时发起 24 个轮次时，16 个 actor 运行，8 个等待。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">设上限：CPU 2, MEMORY 3GI</text>
  <text x="336" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">未设上限，16 VCPU 节点</text>
  <line x1="320" y1="8" x2="320" y2="322" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="34" width="130" height="92" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="85" y="52" font-size="11.5" text-anchor="middle" font-weight="700">worker bzgjd</text>
  <rect x="49" y="62" width="30" height="30" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
