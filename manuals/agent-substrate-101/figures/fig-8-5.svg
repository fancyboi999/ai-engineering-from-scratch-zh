<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" role="img" aria-labelledby="fig-8-5-title fig-8-5-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-5-title">v1.0.0 中各项职责的边界划分</title>
  <desc id="fig-8-5-desc">六行对应六项职责。左侧为 Substrate 在 v1.0.0 中已完成的部分：按请求挂起、维护固定数量的 worker、沙箱消亡时将 actor 标为崩溃、运行单路由器与单数据库、提供密钥管理命令、维护单一入站允许列表。右侧为运维方或 harness 必须自行补齐的部分。</desc>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">SUBSTRATE 负责</text>
  <text x="340" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">由你补充</text>
  <rect x="20" y="30" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="51.25" font-size="12.5" text-anchor="middle" font-weight="700">按需执行 SuspendActor</text>
  <text x="165" y="68.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无内置空闲计时器：60/60 次采样仍为 RUNNING</text>
  <rect x="340" y="30" width="280" height="52" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="480" y="51.25" font-size="12.5" text-anchor="middle" font-weight="700">何时挂起的决策</text>
  <text x="480" y="68.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kagent 会在每轮结束后挂起</text>
  <line x1="310" y1="56" x2="340" y2="56" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <rect x="20" y="92" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="113.25" font-size="12.5" text-anchor="middle" font-weight="700">维护固定数量的 worker</text>
  <text x="165" y="130.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">池满时请求在 5 s 后返回 503</text>
  <rect x="340" y="92" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="113.25" font-size="12.5" text-anchor="middle" font-weight="700">自动扩缩容组件</text>
  <text x="480" y="130.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">按空闲 worker 槽位而非 CPU 利用率扩缩</text>
  <line x1="310" y1="118" x2="340" y2="118" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <rect x="20" y="154" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="175.25" font-size="12.5" text-anchor="middle" font-weight="700">沙箱消亡时标为 CRASHED</text>
  <text x="165" y="192.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">沙箱内进程退出时 actor 仍为 RUNNING</text>
  <rect x="340" y="154" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="175.25" font-size="12.5" text-anchor="middle" font-weight="700">死进程探活与收敛</text>
  <text x="480" y="192.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">监听 upstream connect error 并处理</text>
  <line x1="310" y1="180" x2="340" y2="180" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <rect x="20" y="216" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="237.25" font-size="12.5" text-anchor="middle" font-weight="700">单副本 router 与单副本 Postgres</text>
  <text x="165" y="254.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">单出站网关、双副本 ate-api-server</text>
  <rect x="340" y="216" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="237.25" font-size="12.5" text-anchor="middle" font-weight="700">故障切换与高可用</text>
  <text x="480" y="254.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">配置数据库备库与多副本路由器</text>
  <line x1="310" y1="242" x2="340" y2="242" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <rect x="20" y="278" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="299.25" font-size="12.5" text-anchor="middle" font-weight="700">密钥池与三条管理命令</text>
  <text x="165" y="316.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">添加、激活与移除 JWT 密钥</text>
  <rect x="340" y="278" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="299.25" font-size="12.5" text-anchor="middle" font-weight="700">定期轮换计划</text>
  <text x="480" y="316.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无内置组件自动轮换密钥</text>
  <line x1="310" y1="304" x2="340" y2="304" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
  <rect x="20" y="340" width="290" height="52" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="361.25" font-size="12.5" text-anchor="middle" font-weight="700">单一入站允许列表</text>
  <text x="165" y="378.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">列表内的客户端可调用所有 actor</text>
  <rect x="340" y="340" width="280" height="52" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="480" y="361.25" font-size="12.5" text-anchor="middle" font-weight="700">多租户入站隔离</text>
  <text x="480" y="378.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">v1.0.0 需在 Substrate 外部实现</text>
  <line x1="310" y1="366" x2="340" y2="366" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="1.5 3.5"/>
</svg>
