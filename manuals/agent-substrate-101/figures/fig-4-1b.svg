<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="fig-4-1b-title fig-4-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-1b-title">四种 CPU 上限下 actor 实际使用的宿主核心数</title>
  <desc id="fig-4-1b-desc">固定工作负载在 1 线程与 4 线程下使用的宿主核心数对模板 cpuMillicores 上限的关系图，每点运行三次，共 24 次。1 线程中位数为：250 下 0.25 核、500 下 0.50 核、1000 下 1.01 核、2000 下 1.12 核；4 线程中位数为：250 下 0.25 核、500 下 0.50 核、1000 下 1.00 核、2000 下 2.00 核。虚线标出配额上限本身。实测点紧贴该虚线，低于 2000 millicores 时 4 线程并未比 1 线程获得更多 CPU。同一工作负载在 250 millicores 下耗时 27.4 s，在 1000 下耗时 5.1 s。所有上限下程序均看到 2 个 CPU。</desc>
