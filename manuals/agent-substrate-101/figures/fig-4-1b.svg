  <text x="466" y="190.82" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">单线程跑满单核</text>
  <text x="312" y="256.73" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">细虚线：配额上限</text>
  <text x="64" y="77.82" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">250、500、1000 下为 0.25、0.50、1.01 核，</text>
