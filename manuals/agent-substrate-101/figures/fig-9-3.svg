  <text x="232" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">执行结果</text>
  <text x="420" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-amber-ink, #85590c)">回退</text>
  <text x="506" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-green-ink, #336b40)">/WORK 内文件数</text>
  <line x1="16" y1="38" x2="624" y2="38" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
