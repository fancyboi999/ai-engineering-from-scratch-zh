<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="fig-9-3-title fig-9-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-3-title">同一工具沙箱 actor 中依次执行并回退的六项任务</title>
  <desc id="fig-9-3-desc">第二台 x86 服务器客户机上向同一工具沙箱 actor（配置单条软件源出站规则、500 millicores 与 256 MiB 内存）发送六条命令的六行实测结果。从镜像站下载文件：文件已保存，exit 0，回退耗时 0.47 s，回退后剩余 0 个文件；按域名访问外部主机：NXDOMAIN，回退耗时 0.48 s，回退后剩余 0 个文件；按 IP 访问外部主机：网关返回 403，回退耗时 0.50 s，回退后剩余 0 个文件；按域名访问 Kubernetes API：域名未解析，回退耗时 0.51 s，回退后剩余 0 个文件；2 s CPU 计算任务：墙钟耗时 2.38 s，回退耗时 0.48 s，回退后剩余 0 个文件；分配 640 MiB 内存：503，actor CRASHED，回退耗时 0.43 s，回退后剩余 0 个文件。</desc>
  <defs><marker id="fig-9-3-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
