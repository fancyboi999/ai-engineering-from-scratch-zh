<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" role="img" aria-labelledby="fig-r-3-title fig-r-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-r-3-title">七种 actor 状态、全部转换路径及各状态下的请求响应</title>
  <desc id="fig-r-3-desc">标注各状态枚举编号的状态转换参考图。CreateActor 创建处于 4 SUSPENDED 的 actor。ResumeActor 使其经 1 RESUMING 进入 2 RUNNING，SuspendActor 使其经 3 SUSPENDING 回到 SUSPENDED。恢复失败、沙箱丢失或挂起失败会使其进入 5 CRASHED（此时请求返回 503）。RevertActor 将处于崩溃、运行或挂起状态的 actor 经 7 REVERTING 回退至 SUSPENDED。DeleteActor 可将任意状态的 actor 转入 6 DELETING。每个状态框均标出实测中的请求响应结果。</desc>
  <defs><marker id="fig-r-3-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-r-3-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-r-3-head-ink-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink-mute, #666660)"/></marker><marker id="fig-r-3-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <rect x="20" y="64" width="140" height="320" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="90" y="250" font-size="12" text-anchor="middle" font-weight="700">4 SUSPENDED</text>
  <text x="90" y="267" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">不占用 worker</text>
  <text x="90" y="282" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：恢复后</text>
  <text x="90" y="297" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.36 s 返回 200</text>
  <rect x="480" y="64" width="140" height="234" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="550" y="122" font-size="12" text-anchor="middle" font-weight="700">2 RUNNING</text>
  <text x="550" y="139" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">占用一个 worker</text>
  <text x="550" y="154" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：0.06 至</text>
  <text x="550" y="169" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.09 s 返回 200</text>
  <text x="550" y="214" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">沙箱内进程退出：</text>
  <text x="550" y="229" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">仍显示 RUNNING，</text>
  <text x="550" y="244" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">请求返回 503</text>
  <rect x="250" y="64" width="140" height="62" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="320" y="82.6" font-size="12" text-anchor="middle" font-weight="700">3 SUSPENDING</text>
  <text x="320" y="99.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">写入检查点</text>
  <text x="320" y="114.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：未记录</text>
  <rect x="250" y="150" width="140" height="62" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="320" y="168.6" font-size="12" text-anchor="middle" font-weight="700">1 RESUMING</text>
  <text x="320" y="185.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">恢复沙箱环境</text>
  <text x="320" y="200.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：未记录</text>
  <rect x="250" y="236" width="140" height="62" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="320" y="254.6" font-size="12" text-anchor="middle" font-weight="700">5 CRASHED</text>
  <text x="320" y="271.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">保持至 RevertActor</text>
  <text x="320" y="286.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：0.06 s 返回 503</text>
  <rect x="250" y="322" width="140" height="62" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)" stroke-dasharray="5 4"/>
  <text x="320" y="340.6" font-size="12" text-anchor="middle" font-weight="700">7 REVERTING</text>
  <text x="320" y="357.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">回退至持久快照</text>
  <text x="320" y="372.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求：未记录</text>
  <line x1="90" y1="22" x2="90" y2="63" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-r-3-head-ink)"/>
  <text x="98" y="40" font-size="11">CreateActor</text>
  <line x1="480" y1="95" x2="391" y2="95" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <rect class="m-knock" x="392.9" y="78.42" width="85.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="435.5" y="89" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">SuspendActor</text>
  <line x1="250" y1="95" x2="161" y2="95" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <rect class="m-knock" x="186" y="78.42" width="39" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="205.5" y="89" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">检查点</text>
  <rect class="m-knock" x="165.21" y="99.42" width="80.58" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="205.5" y="110" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">节点或 bucket</text>
  <line x1="160" y1="181" x2="249" y2="181" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <rect class="m-knock" x="165.2" y="164.42" width="78.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="204.5" y="175" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">ResumeActor</text>
  <rect class="m-knock" x="174" y="185.42" width="61" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="204.5" y="196" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">每次请求时</text>
  <line x1="390" y1="181" x2="479" y2="181" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <text x="474" y="196" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">就绪</text>
  <path d="M390 118 H435 V248 H391" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fig-r-3-head-ink-mute)"/>
  <text x="429" y="143" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">挂起失败</text>
  <line x1="320" y1="212" x2="320" y2="235" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-rose)"/>
  <rect class="m-knock" x="325" y="212.92" width="50" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="223.5" font-size="11" fill="var(--m-rose-ink, #b0344d)">恢复失败</text>
  <line x1="480" y1="277" x2="391" y2="277" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-rose)"/>
  <rect class="m-knock" x="410.5" y="260.42" width="50" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="435.5" y="271" font-size="11" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">沙箱丢失</text>
  <rect class="m-knock" x="403.24" y="281.42" width="64.52" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="435.5" y="292" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">pod 或 OOM</text>
  <line x1="320" y1="298" x2="320" y2="321" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <rect class="m-knock" x="325" y="298.92" width="78.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="328" y="309.5" font-size="11" fill="var(--m-amber-ink, #85590c)">RevertActor</text>
  <line x1="250" y1="340" x2="161" y2="340" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <rect class="m-knock" x="180.5" y="323.42" width="50" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="205.5" y="334" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">回退完成</text>
  <line x1="160" y1="368" x2="249" y2="368" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-r-3-head-ink-mute)"/>
  <rect class="m-knock" x="165.2" y="351.42" width="78.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="204.5" y="362" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">RevertActor</text>
  <path d="M550 298 V353 H391" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fig-r-3-head-ink-mute)"/>
  <text x="470" y="347" font-size="11" text-anchor="middle" fill="var(--m-ink-mute, #666660)">RevertActor</text>
  <rect x="250" y="414" width="140" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="253" y="417" width="134" height="44" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="434.1" font-size="12" text-anchor="middle" font-weight="700">6 DELETING</text>
  <text x="320" y="451.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">停止工作负载</text>
  <text x="20" y="443" font-size="11">DeleteActor（任意状态）</text>
  <line x1="206" y1="439" x2="249" y2="439" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-r-3-head-ink)"/>
  <line x1="390" y1="439" x2="440" y2="439" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-r-3-head-amber)"/>
  <text x="448" y="443" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">删除数据库记录</text>
  <text x="20" y="494" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">琥珀色箭头：实测触发的状态转换。玫红色箭头：实测触发的故障转换。</text>
  <text x="20" y="511" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">灰色点线箭头：源码中存在但本次未实测触发的状态转换。</text>
  <text x="20" y="528" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">虚线边框：工作流途经的中间状态。双线边框：随后即删除记录的终止状态。</text>
  <text x="20" y="545" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">发往 CRASHED 状态 actor 的请求返回 503，响应体为 AssignWorker prerequisite not met。</text>
  <text x="20" y="562" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">对 CRASHED 状态的 actor 调用 ResumeActor 返回 FailedPrecondition。</text>
  <text x="20" y="579" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">对 SUSPENDED 状态的 actor 调用 SuspendActor 不产生任何变化。</text>
</svg>
