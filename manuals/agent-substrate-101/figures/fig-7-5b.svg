<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img" aria-labelledby="fig-7-5b-title fig-7-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-5b-title">无 workspace 任务的 Agent Executor 命令耗时与克隆仓库任务的恢复耗时</title>
  <desc id="fig-7-5b-desc">针对 Agent Executor 同一提交实测的两张图。左图为无 workspace 的单个 task 在 10 轮循环中每次运行的耗时（每点一次）：ax suspend task 中位数为 0.18 s，ax resume task 为 0.24 s，经 ax ssh 执行单条命令为 0.74 s。右图为 runner 准备 workspace 时 ax resume task 的耗时：无 workspace 为 2.29 s；无出站规则时 clone 为 12.35 s；配置 https 规则由网关做 TLS 拦截导致 git 拒绝证书时，14 次恢复的中位数为 11.62 s；配置 tlsPassthrough 规则使 clone 成功时为 9.57 s；后续保留检出目录的恢复中位数为 0.27 s。耗时较长的恢复源于 runner 的 5 次重试，而非恢复本身的开销。</desc>
