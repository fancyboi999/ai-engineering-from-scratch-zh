<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-4-2b-title fig-4-2b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-2b-title">两种沙箱类别下恢复耗时与所持内存的关系</title>
  <desc id="fig-4-2b-desc">x86 服务器客户机上从节点本地快照恢复时，向挂起 actor 发一次请求的耗时秒数与其所持随机内存 MiB 的关系。共 60 次恢复各为一个小点（每种规格与沙箱类别各 10 次），线条连接中位数。microvm 类别的中位数为：0 MiB 为 0.33 s、200 MiB 为 0.49 s、500 MiB 为 0.80 s；gvisor 类别的中位数为：0 MiB 为 0.22 s、200 MiB 为 0.47 s、500 MiB 为 1.07 s。microvm 起点高出 0.10 s，但斜率约为一半，因此两条线在略高于 200 MiB 处交叉。</desc>
