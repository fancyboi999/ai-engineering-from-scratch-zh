  <text x="214" y="22.8" font-size="11" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="214" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Service 端口 443</text>
  <line x1="214" y1="48" x2="214" y2="400" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="298" y="8" width="112" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="354" y="22.8" font-size="11" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="354" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">控制平面</text>
