  <rect x="424" y="8" width="100" height="40" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="474" y="22.8" font-size="11" text-anchor="middle" font-weight="700">Postgres</text>
  <text x="474" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">actor 行</text>
