<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-4-3b-title fig-4-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-3b-title">所在节点停止后，已挂起 actor 的状态变化</title>
  <desc id="fig-4-3b-desc">双 worker 节点集群中，节点 multi-worker2 停止后 476 秒的时间线。actor u1 原本在该节点挂起，且快照已完整上传至对象存储。该节点的两个 worker 在前 43 秒仍列为活跃，随后被标为不可用；它们的 pod 在 5 分 43 秒 后被驱逐。从首次请求开始，actor 在已停节点上处于 RESUMING，其间 43 次请求失败。到 5 分 44 秒 时 actor 进入 CRASHED，随后 57 次请求立即失败。actor 始终未迁移到另一节点。</desc>
  <text x="20" y="50" font-size="11.5" font-weight="700" fill="var(--m-ink, #1a1a1a)">节点</text>
  <text x="20" y="64" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">multi-worker2</text>
