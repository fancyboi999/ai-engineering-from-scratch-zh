<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-4-title">安装过程在 kind-control-plane 上创建的组件</title>
  <desc id="fig-2-4-desc">命名空间 ate-system 包含 11 个运行中 pod 和 1 个已完成 Job：ate-api-server、ate-controller、ate-idp-server、atelet、atenet-router、atenet-egress、k8s-credential-provider、postgres-0、rustfs 与 rustfs-bucket-init。命名空间 podcertificate-controller-system 包含 podcertificate-controller。命名空间 ate-demo-counter 包含 WorkerPool counter 的 3 个 worker pod。命名空间 otel-system 包含 jaeger、opentelemetry-collector 与 prometheus。底部两框说明对象存储位置：etcd 保存三个自定义资源 WorkerPool、SandboxConfig 和 CSIDriverConfig，Postgres 保存 atespace、模板、actor、worker 和策略。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">ATE-SYSTEM · 11 个运行中 POD，1 个已完成 JOB</text>
  <rect x="20" y="26" width="400" height="240" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink-mute, #666660)"/>
  <rect x="28" y="34" width="188" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="122" y="48.95" font-size="11.5" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="122" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2 个 pod，各 2 容器</text>
  <rect x="224" y="34" width="188" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="318" y="48.95" font-size="11.5" text-anchor="middle" font-weight="700">ate-controller</text>
  <text x="318" y="66.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 个 pod</text>
  <rect x="28" y="80" width="188" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="122" y="94.95" font-size="11.5" text-anchor="middle" font-weight="700">ate-idp-server</text>
  <text x="122" y="112.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">2 个 pod</text>
  <rect x="224" y="80" width="188" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="318" y="94.95" font-size="11.5" text-anchor="middle" font-weight="700">atelet</text>
  <text x="318" y="112.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DaemonSet，2 容器</text>
  <rect x="28" y="126" width="188" height="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="122" y="140.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-router</text>
  <text x="122" y="158.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 个 pod，2 容器</text>
  <rect x="224" y="126" width="188" height="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="318" y="140.95" font-size="11.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="318" y="158.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 个 pod，3 容器</text>
  <rect x="28" y="172" width="188" height="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="122" y="186.95" font-size="11.5" text-anchor="middle" font-weight="700">k8s-credential-provider</text>
  <text x="122" y="204.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">1 个 pod</text>
  <rect x="224" y="172" width="188" height="40" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="318" y="186.95" font-size="11.5" text-anchor="middle" font-weight="700">postgres-0</text>
  <text x="318" y="204.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">StatefulSet，2 容器</text>
  <rect x="28" y="218" width="188" height="40" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="122" y="232.95" font-size="11.5" text-anchor="middle" font-weight="700">rustfs</text>
  <text x="122" y="250.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">对象存储，1 个 pod</text>
  <rect x="224" y="218" width="188" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="318" y="232.95" font-size="11.5" text-anchor="middle" font-weight="700">rustfs-bucket-init</text>
  <text x="318" y="250.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Job，已完成</text>
  <text x="20" y="290" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">PODCERTIFICATE-CONTROLLER-SYSTEM</text>
  <rect x="20" y="298" width="400" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="220" y="312.95" font-size="11.5" text-anchor="middle" font-weight="700">podcertificate-controller</text>
  <text x="220" y="330.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">签发 pod 证书，1 个 pod</text>
  <text x="436" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">ATE-DEMO-COUNTER</text>
  <rect x="436" y="26" width="184" height="58" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="528" y="42.45" font-size="11.5" text-anchor="middle" font-weight="700">counter</text>
  <text x="528" y="59.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">WorkerPool，3 个 worker pod</text>
  <text x="528" y="74.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">镜像 ateworker-gvisor</text>
  <text x="436" y="110" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">OTEL-SYSTEM</text>
  <rect x="436" y="118" width="184" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="136.45" font-size="11.5" text-anchor="middle" font-weight="400">jaeger</text>
  <rect x="436" y="154" width="184" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="172.45" font-size="11.5" text-anchor="middle" font-weight="400">opentelemetry-collector</text>
  <rect x="436" y="190" width="184" height="30" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="208.45" font-size="11.5" text-anchor="middle" font-weight="400">prometheus</text>
  <text x="436" y="242" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">KUBE-SYSTEM</text>
  <rect x="436" y="250" width="184" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="528" y="264.95" font-size="11.5" text-anchor="middle" font-weight="700">Kubernetes v1.37.0</text>
  <text x="528" y="282.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">8 个 pod，非 Substrate 创建</text>
  <text x="20" y="360" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">对象存储位置</text>
  <rect x="20" y="368" width="290" height="40" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="165" y="383.1" font-size="12" text-anchor="middle" font-weight="700">etcd：3 个自定义资源</text>
  <text x="165" y="400.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">WorkerPool, SandboxConfig, CSIDriverConfig</text>
  <rect x="330" y="368" width="290" height="40" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="475" y="383.1" font-size="12" text-anchor="middle" font-weight="700">Postgres：其余全部对象</text>
  <text x="475" y="400.3" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">atespace、模板、actor、worker、策略</text>
