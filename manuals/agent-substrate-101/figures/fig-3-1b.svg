<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-1b-title fig-3-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-1b-title">新 actor 的首次调用耗时与模板内存的关系</title>
  <desc id="fig-3-1b-desc">x86 服务器客户机上，新 actor 首次请求（需恢复黄金快照）耗时秒数对模板所持内存 MiB 的关系。25 个新 actor 各为一个圆点，每种规格 5 个，实线连接中位数：0 MiB 为 0.23 s、50 MiB 为 0.25 s、200 MiB 为 0.62 s、500 MiB 为 5.76 s、1000 MiB 为 6.60 s。500 MiB 的 5 次首次调用耗时 1.86、3.03、5.76、6.24、6.76 s，1000 MiB 的 5 次耗时 3.46、3.56、6.60、11.85、12.75 s。另一条线展示单个 actor 从节点本地快照连续恢复 10 次的中位数，在 1000 MiB 时为 2.16 s。</desc>
