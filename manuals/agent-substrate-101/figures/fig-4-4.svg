<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-4-4-title fig-4-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-4-4-title">池满时的请求表现与 5 秒暂存预算</title>
  <desc id="fig-4-4-desc">0 至 6 秒时间轴上的四行对比，5 秒暂存预算处绘有虚线。发往有空闲 worker 池的两个请求分别在 0.32 s 与 0.36 s 返回 200。发往满池的 9 个请求各自等待 5.05 至 5.06 s 后返回 503。一个暂存的请求在 2.65 s 返回 200，因为等待 2.37 s 时腾出了一个 worker。在 30 s 压测运行中，92 个请求完成了 90 个，平均耗时 0.85 s，最慢 4.27 s。</desc>
  <line x1="244" y1="34" x2="244" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="318" y1="34" x2="318" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="392" y1="34" x2="392" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="466" y1="34" x2="466" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="540" y1="34" x2="540" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="614" y1="34" x2="614" y2="252" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="540" y1="26" x2="540" y2="252" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="534" y="22" font-size="11" text-anchor="end" font-weight="700" fill="var(--m-amber-ink, #85590c)">暂存预算 5 s</text>
  <text x="20" y="56" font-size="12" font-weight="700">有空闲 worker</text>
  <text x="20" y="72" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">p1 与 p2，无等待</text>
  <rect x="170" y="48" width="26.49" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <circle cx="196.49" cy="56" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <circle cx="193.93" cy="56" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="203.49" y="49.03" width="157.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="206.49" y="60" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">0.32 与 0.36 s 返回 200</text>
  <text x="20" y="108" font-size="12" font-weight="700">池已满</text>
  <text x="20" y="124" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">9 个请求，无空闲 worker</text>
  <rect x="170" y="100" width="374.63" height="16" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.46" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.14" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.37" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.39" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.24" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.43" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.63" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="543.91" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <circle cx="544.41" cy="108" r="3.2" fill="var(--m-rose-ink, #b0344d)"/>
  <rect class="m-knock" x="377.2" y="83.03" width="157.8" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="532" y="94" font-size="11.5" text-anchor="end" font-weight="700" fill="var(--m-rose-ink, #b0344d)">5.05 至 5.06 s 返回 503</text>
  <text x="20" y="160" font-size="12" font-weight="700">池已满</text>
  <text x="20" y="176" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">p3 等待时 p1 挂起</text>
  <rect x="170" y="152" width="195.91" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <circle cx="365.91" cy="160" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="372.91" y="153.03" width="104.9" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="375.91" y="164" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">2.65 s 返回 200</text>
  <line x1="345.38" y1="147" x2="345.38" y2="173" stroke="var(--m-violet-ink, #5b4fa3)" stroke-width="1.6"/>
  <rect class="m-knock" x="240.08" y="175.42" width="210.6" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="345.38" y="186" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">2.37 s 腾出 worker，0.28 s 后返回</text>
  <text x="20" y="212" font-size="12" font-weight="700">压测运行，30 s</text>
  <text x="20" y="228" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">完成 90 / 92</text>
  <rect x="170" y="204" width="315.91" height="16" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)" stroke-dasharray="5 4"/>
  <circle cx="485.91" cy="212" r="3.2" fill="var(--m-green-ink, #336b40)"/>
  <rect class="m-knock" x="492.91" y="205.03" width="77.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="495.91" y="216" font-size="11.5" font-weight="700" fill="var(--m-green-ink, #336b40)">最慢 4.27 s</text>
  <line x1="232.68" y1="199" x2="232.68" y2="225" stroke="var(--m-green-ink, #336b40)" stroke-width="1.6"/>
  <rect class="m-knock" x="235.68" y="227.42" width="74.2" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="238.68" y="238" font-size="11" fill="var(--m-green-ink, #336b40)">平均 0.85 s</text>
  <line x1="170" y1="34" x2="170" y2="252" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="170" y1="252" x2="614" y2="252" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="170" y1="252" x2="170" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="170" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="244" y1="252" x2="244" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="244" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">1</text>
  <line x1="318" y1="252" x2="318" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="318" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">2</text>
  <line x1="392" y1="252" x2="392" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="392" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">3</text>
  <line x1="466" y1="252" x2="466" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="466" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">4</text>
  <line x1="540" y1="252" x2="540" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="540" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">5</text>
  <line x1="614" y1="252" x2="614" y2="257" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="614" y="270" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">6</text>
  <text x="392" y="290" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">从请求发出到收到响应的秒数</text>
</svg>
