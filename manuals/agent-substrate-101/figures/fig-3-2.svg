<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-2-title">七种 actor 状态及其状态迁移</title>
  <desc id="fig-3-2-desc">状态图展示 v1.0.0 中 ActorState 枚举的七种状态。CreateActor 创建处于 ACTOR_STATE_SUSPENDED 的 actor。ResumeActor 使其经 ACTOR_STATE_RESUMING 进入 ACTOR_STATE_RUNNING。SuspendActor 使其经 ACTOR_STATE_SUSPENDING 回到 ACTOR_STATE_SUSPENDED。恢复失败、worker pod 丢失、内存超限被杀或挂起失败都会使其进入 ACTOR_STATE_CRASHED，此时请求收到 503。离开 ACTOR_STATE_CRASHED 的唯一箭头是 RevertActor，经 ACTOR_STATE_REVERTING 回到 ACTOR_STATE_SUSPENDED。DeleteActor 可将任意状态的 actor 转入 ACTOR_STATE_DELETING。在 16 vCPU、31 GB 的第二台 x86 客户机 kagent 运行中，actor 在 98 轮恢复里停留于 ACTOR_STATE_RESUMING 的中位数为 0.38 s，在 99 次挂起里停留于 ACTOR_STATE_SUSPENDING 的中位数为 0.14 s。灰色点线箭头表示从源码读到但未实跑的迁移。</desc>
  <defs><marker id="fig-3-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-3-2-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-3-2-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker><marker id="fig-3-2-head-ink-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink-mute, #666660)"/></marker></defs>
  <rect x="14" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="89" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDED</text>
  <text x="89" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无沙箱，无 worker</text>
  <rect x="245" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="320" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_RESUMING</text>
  <text x="320" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.38 s（98 次中位）</text>
  <rect x="476" y="44" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="551" y="63.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_RUNNING</text>
  <text x="551" y="80.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">worker 上有沙箱</text>
  <rect x="14" y="176" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="89" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_REVERTING</text>
  <text x="89" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">后续调用将丢失</text>
  <rect x="245" y="176" width="150" height="50" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-width="2"/>
  <text x="320" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_CRASHED</text>
  <text x="320" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">请求返回 503</text>
  <rect x="476" y="176" width="150" height="50" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="551" y="195.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_SUSPENDING</text>
  <text x="551" y="212.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">0.14 s（99 次中位）</text>
  <text x="89" y="16" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CreateActor</text>
  <line x1="89" y1="22" x2="89" y2="43" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <line x1="164" y1="69" x2="244" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="204.5" y="61" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">ResumeActor</text>
  <line x1="395" y1="69" x2="475" y2="69" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="435.5" y="61" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">恢复完成</text>
  <line x1="596" y1="94" x2="596" y2="175" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="588" y="154" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SuspendActor</text>
  <path d="M554 226 V250 H5 V69 H13" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="300" y="244" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">快照已落盘节点</text>
  <line x1="293" y1="94" x2="293" y2="175" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="285" y="154" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-rose-ink, #b0344d)">恢复失败</text>
  <path d="M512 94 V124 H363 V175" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="504" y="118" font-size="11" text-anchor="end" class="m-serif" fill="var(--m-rose-ink, #b0344d)">worker pod 丢失、内存被杀</text>
  <line x1="476" y1="201" x2="396" y2="201" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-rose)"/>
  <text x="435.5" y="193" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">挂起</text>
  <text x="435.5" y="217" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-rose-ink, #b0344d)">失败</text>
  <line x1="245" y1="201" x2="165" y2="201" stroke="var(--m-amber-ink, #85590c)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="204.5" y="193" font-size="11" text-anchor="middle" font-weight="700" class="m-serif" fill="var(--m-ink, #1a1a1a)">RevertActor</text>
  <text x="204.5" y="217" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">唯一</text>
  <text x="204.5" y="231" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">脱困路径</text>
  <line x1="70" y1="176" x2="70" y2="95" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-3-2-head-amber)"/>
  <text x="78" y="138" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">最近持久快照</text>
  <line x1="34" y1="94" x2="34" y2="175" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-3-2-head-ink-mute)"/>
  <rect x="476" y="298" width="150" height="50" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <rect x="479" y="301" width="144" height="44" fill="none" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="551" y="317.8" font-size="11" text-anchor="middle" font-weight="700">ACTOR_STATE_DELETING</text>
  <text x="551" y="334.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">随后 actor 消失</text>
  <text x="551" y="278" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DeleteActor，可从任意状态触发</text>
  <line x1="551" y1="283" x2="551" y2="297" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-3-2-head-ink)"/>
  <path d="M14 286 H40" fill="none" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <path d="M48 286 H76" fill="none" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <text x="84" y="290" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">实测追踪：琥珀色为状态迁移，玫红色为失败</text>
  <path d="M14 304 H76" fill="none" stroke="var(--m-ink-mute, #666660)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="308" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">仅见于源码、未实跑：对 SUSPENDED actor 调 RevertActor</text>
  <text x="14" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">未画出（同样仅见于源码）：对 RUNNING actor 调用 RevertActor。</text>
  <text x="14" y="342" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">RESUMING 与 SUSPENDING 的耗时来自 kagent 运行中的仅文件快照 actor。</text>
  <text x="14" y="358" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">进程退出后 actor 仍保持 RUNNING，详见第 3.5 节。</text>
</svg>
