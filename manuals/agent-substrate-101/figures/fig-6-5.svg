  <text x="76" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">不发真实密钥</text>
  <line x1="76" y1="48" x2="76" y2="356" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="141" y="8" width="118" height="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="200" y="22.8" font-size="11" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="200" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">一条 http 规则</text>
  <line x1="200" y1="48" x2="200" y2="356" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="265" y="8" width="118" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="324" y="22.8" font-size="11" text-anchor="middle" font-weight="700">凭据提供方</text>
  <text x="324" y="39.8" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">k8s.io</text>
