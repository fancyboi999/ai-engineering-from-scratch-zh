<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" role="img" aria-labelledby="fig-6-2-title fig-6-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-2-title">actor 发起的出站连接在哪里被判定放行或拒绝</title>
  <desc id="fig-6-2-desc">位于 169.254.17.2/30 的 actor f-main 将 DNS 查询发往 169.254.17.1 的 DNS 中继，并将所有 TCP 连接发往 atunnel；两者均运行在 worker pod 内。DNS 中继把策略列出的域名转发给集群 DNS，其余域名返回 NXDOMAIN。atunnel 向 atenet-egress 建立双向 TLS CONNECT，后者检查请求后连接上游主机 whoami，上游看到的来源地址为 10.244.0.22。超出策略的请求会收到 403 或连接重置。两处检查均从 ate-api-server 读取 f-main 的 EgressPolicy，其中 DNS 中继缓存 5 秒。</desc>
  <defs><marker id="fig-6-2-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-6-2-head-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-indigo-ink, #4b4f9e)"/></marker></defs>
  <rect x="240" y="20" width="200" height="46" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="340" y="38.25" font-size="12.5" text-anchor="middle" font-weight="700">ate-api-server</text>
  <text x="340" y="55.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">f-main 的 EgressPolicy default</text>
  <rect x="160" y="92" width="174" height="180" fill="none" stroke="var(--m-violet-ink, #5b4fa3)" stroke-dasharray="5 4"/>
  <text x="170" y="110" font-size="11" letter-spacing="1.2" fill="var(--m-violet-ink, #5b4fa3)">WORKER POD</text>
  <rect x="16" y="163" width="124" height="52" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="78" y="184.25" font-size="12.5" text-anchor="middle" font-weight="700">actor f-main</text>
  <text x="78" y="201.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">169.254.17.2/30</text>
  <rect x="172" y="120" width="150" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="247" y="138.25" font-size="12.5" text-anchor="middle" font-weight="700">DNS 中继</text>
  <text x="247" y="155.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">169.254.17.1:53</text>
  <rect x="172" y="212" width="150" height="46" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="247" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">atunnel</text>
  <text x="247" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">actor 证书</text>
  <rect x="450" y="120" width="120" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="510" y="138.25" font-size="12.5" text-anchor="middle" font-weight="700">集群 DNS</text>
  <text x="510" y="155.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">CoreDNS</text>
  <rect x="400" y="212" width="120" height="46" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="460" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">atenet-egress</text>
  <text x="460" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">检查出站请求</text>
  <rect x="548" y="212" width="80" height="46" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="588" y="230.25" font-size="12.5" text-anchor="middle" font-weight="700">whoami</text>
  <text x="588" y="247.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">上游主机</text>
  <path d="M78 163 V143 H171" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="84" y="136" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">DNS 查询</text>
  <path d="M78 215 V235 H171" fill="none" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="16" y="253" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">所有 TCP 连接</text>
  <line x1="322" y1="143" x2="449" y2="143" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <rect class="m-knock" x="360" y="126.03" width="52" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="386" y="137" font-size="11.5" text-anchor="middle">已列域名</text>
  <text x="172" y="183" font-size="11" fill="var(--m-rose-ink, #b0344d)">其他域名：NXDOMAIN</text>
  <line x1="322" y1="235" x2="399" y2="235" stroke="var(--m-indigo-ink, #4b4f9e)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" marker-end="url(#fig-6-2-head-indigo)"/>
  <rect class="m-knock" x="339.85" y="218.03" width="54.3" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="367" y="229" font-size="11.5" text-anchor="middle" fill="var(--m-indigo-ink, #4b4f9e)">CONNECT</text>
  <rect class="m-knock" x="341.12" y="239.42" width="51.76" height="15" fill="var(--m-panel, #f3f1e8)"/>
  <text x="367" y="250" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">双向 TLS</text>
  <line x1="520" y1="235" x2="547" y2="235" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="588" y="203" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">看到 10.244.0.22</text>
  <text x="400" y="276" font-size="11" fill="var(--m-rose-ink, #b0344d)">超出策略：403 或连接重置</text>
  <line x1="280" y1="66" x2="280" y2="119" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="288" y="84" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">策略，缓存 5 s</text>
  <line x1="432" y1="66" x2="432" y2="211" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-6-2-head-ink)"/>
  <text x="440" y="192" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">策略</text>
</svg>
