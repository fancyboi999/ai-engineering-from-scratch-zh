  <text x="54" y="61.01" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">300 s</text>
  <line x1="60" y1="270" x2="440" y2="270" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
