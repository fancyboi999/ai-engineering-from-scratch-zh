<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-6-5b-title fig-6-5b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-5b-title">凭据轮换后上游看到新值所需的秒数</title>
  <desc id="fig-6-5b-desc">对数时间轴折线图。在两种数据平面上分别将一条 replaceHeaders 规则背后的 Kubernetes Secret 修改三次，由单个 actor 每秒发一次请求。在 agentgateway 上，上游分别在 280.5、200.9、100.6 s 后看到新值，期间仍有 233、168、84 次请求携带旧值；在 Envoy 上分别耗时 1.0、1.0、1.6 s，期间有 0、0、1 次请求携带旧值。agentgateway 上三次首次看到新值的时间相隔 301 与 301 s。两种数据平面在 759 次与 275 次请求中均无失败。</desc>
