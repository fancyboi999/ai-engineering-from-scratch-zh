  <text x="376.67" y="287" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">第 3 次</text>
  <text x="250" y="304" font-size="11.5" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">按顺序对 Kubernetes Secret 的三次修改</text>
  <text x="60" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">上游看到新凭据值的秒数（对数刻度）</text>
