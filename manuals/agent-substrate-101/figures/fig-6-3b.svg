<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-6-3b-title fig-6-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-3b-title">为 example.com 添加规则后的 DNS 解析响应</title>
  <desc id="fig-6-3b-desc">秒级时间轴上的三条轨道，0 秒为策略更新命令返回时刻。在 Envoy 与 agentgateway 的持续轮询运行中，直到 -2 秒的采样均为 NXDOMAIN，此后每次采样都正常解析。在 Envoy 上此前未查询过该域名的第三次运行中，第 14 与 16 秒的请求未能解析主机，第 18 秒的请求解析成功。</desc>
