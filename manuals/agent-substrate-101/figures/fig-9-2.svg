<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" role="img" aria-labelledby="fig-9-2-title fig-9-2-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-9-2-title">两种快照保真度下挂起后首轮调用时 agent 保有的状态</title>
  <desc id="fig-9-2-desc">第二台 x86 服务器客户机上同一 agent 在挂起后首轮调用时的两列对比。在内存保真度下，它保有 6 条消息、便签、/tmp 下的文件以及已存活 11.9 秒的原进程，该轮耗时 0.30 秒。在卷保真度下，它因启动时从 SQLite 重新加载 4 条消息而保有 6 条消息，但丢失了便签与 /tmp 文件，新进程仅存活 0.3 秒，该轮耗时 5.06 秒。</desc>
  <rect x="214" y="16" width="196" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="312" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">内存保真度</text>
  <text x="312" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SNAPSHOT_FIDELITY_MEMORY</text>
  <rect x="430" y="16" width="196" height="40" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="528" y="31.25" font-size="12.5" text-anchor="middle" font-weight="700">卷保真度</text>
  <text x="528" y="48.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">SNAPSHOT_FIDELITY_VOLUMES</text>
  <line x1="16" y1="66" x2="626" y2="66" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="88" font-size="12" font-weight="700">对话消息数</text>
  <circle cx="224" cy="84" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="88" font-size="11.5" fill="var(--m-green-ink, #336b40)">6/6 条消息</text>
  <circle cx="440" cy="84" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="452" y="88" font-size="11.5" fill="var(--m-green-ink, #336b40)">6/6 条消息</text>
  <line x1="16" y1="106" x2="626" y2="106" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="128" font-size="12" font-weight="700">启动时从 SQLite 加载</text>
  <circle cx="224" cy="124" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="128" font-size="11.5" fill="var(--m-green-ink, #336b40)">0 条消息</text>
  <circle cx="440" cy="124" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="452" y="128" font-size="11.5" fill="var(--m-green-ink, #336b40)">4 条消息</text>
  <line x1="16" y1="146" x2="626" y2="146" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="168" font-size="12" font-weight="700">变量中的便签</text>
  <circle cx="224" cy="164" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="168" font-size="11.5" fill="var(--m-green-ink, #336b40)">保留</text>
  <circle cx="440" cy="164" r="4" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="452" y="168" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">丢失</text>
  <line x1="16" y1="186" x2="626" y2="186" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="208" font-size="12" font-weight="700">/tmp 下的临时文件</text>
  <circle cx="224" cy="204" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="208" font-size="11.5" fill="var(--m-green-ink, #336b40)">保留</text>
  <circle cx="440" cy="204" r="4" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="452" y="208" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">丢失</text>
  <line x1="16" y1="226" x2="626" y2="226" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="248" font-size="12" font-weight="700">进程存活时长</text>
  <circle cx="224" cy="244" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="248" font-size="11.5" fill="var(--m-green-ink, #336b40)">11.9 s，原进程</text>
  <circle cx="440" cy="244" r="4" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="452" y="248" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">0.3 s，新进程</text>
  <line x1="16" y1="266" x2="626" y2="266" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="16" y="288" font-size="12" font-weight="700">本轮耗时</text>
  <circle cx="224" cy="284" r="4" fill="var(--m-green-ink, #336b40)"/>
  <text x="236" y="288" font-size="11.5" fill="var(--m-green-ink, #336b40)">0.30 s</text>
  <circle cx="440" cy="284" r="4" fill="var(--m-rose-ink, #b0344d)"/>
  <text x="452" y="288" font-size="11.5" fill="var(--m-rose-ink, #b0344d)">5.06 s</text>
</svg>
