<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="fig-7-4-title fig-7-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-4-title">判断 Agent Substrate 是否适用的五个问题</title>
  <desc id="fig-7-4-desc">按列排列的五个问题及其背后的事实或实测数据。任一问题回答“否”都直接导向更简单的方案：GPU 节点上的单 agent 独立 pod、普通单 agent 独立 pod、单会话独立沙箱、托管沙箱服务，或先引入 harness。五个问题全答“是”则指向 Agent Substrate：实测单个 worker 可同时运行 16 个 actor，单个 kagent 轮次的恢复与挂起开销共 0.52 秒。</desc>
  <defs><marker id="fig-7-4-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">按此顺序依次判断</text>
  <text x="420" y="20" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">首次答“否”时选择</text>
  <rect x="20" y="34" width="356" height="52" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)"/>
  <circle cx="42" cy="60" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="64" font-size="11" text-anchor="middle">1</text>
  <text x="64" y="56" font-size="12.5" font-weight="700">agent 是否仅使用 CPU 运行？</text>
  <text x="64" y="74" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">v1.0.0 中 actor 无法使用 GPU</text>
  <line x1="376" y1="60" x2="419" y2="60" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="388.75" y="43.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="397.5" y="54" font-size="11.5" text-anchor="middle">否</text>
  <rect x="420" y="37" width="200" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="520" y="54.95" font-size="11.5" text-anchor="middle" font-weight="700">每个 agent 独立 pod</text>
  <text x="520" y="72.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">调度在 GPU 节点上</text>
  <line x1="42" y1="86" x2="42" y2="109" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="47" y="86.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="50" y="97.5" font-size="11.5">是</text>
  <rect x="20" y="110" width="356" height="52" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)"/>
  <circle cx="42" cy="136" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="140" font-size="11" text-anchor="middle">2</text>
  <text x="64" y="132" font-size="12.5" font-weight="700">agent 大部分时间是否处于空闲？</text>
  <text x="64" y="150" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">繁忙 actor 会全天独占 worker</text>
  <line x1="376" y1="136" x2="419" y2="136" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="388.75" y="119.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="397.5" y="130" font-size="11.5" text-anchor="middle">否</text>
  <rect x="420" y="113" width="200" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="520" y="130.95" font-size="11.5" text-anchor="middle" font-weight="700">每个 agent 独立 pod</text>
  <text x="520" y="148.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无法释放任何容量</text>
  <line x1="42" y1="162" x2="42" y2="185" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="47" y="162.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="50" y="173.5" font-size="11.5">是</text>
  <rect x="20" y="186" width="356" height="52" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)"/>
  <circle cx="42" cy="212" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="216" font-size="11" text-anchor="middle">3</text>
  <text x="64" y="208" font-size="12.5" font-weight="700">状态是否必须跨空闲期保留？</text>
  <text x="64" y="226" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">200 MiB 恢复需 0.47 s，1000 MiB 需 2.16 s</text>
  <line x1="376" y1="212" x2="419" y2="212" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="388.75" y="195.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="397.5" y="206" font-size="11.5" text-anchor="middle">否</text>
  <rect x="420" y="189" width="200" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="520" y="206.95" font-size="11.5" text-anchor="middle" font-weight="700">每个会话独立沙箱</text>
  <text x="520" y="224.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">无需快照与对象存储</text>
  <line x1="42" y1="238" x2="42" y2="261" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="47" y="238.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="50" y="249.5" font-size="11.5">是</text>
  <rect x="20" y="262" width="356" height="52" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)"/>
  <circle cx="42" cy="288" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="292" font-size="11" text-anchor="middle">4</text>
  <text x="64" y="284" font-size="12.5" font-weight="700">你能否运维 Postgres？</text>
  <text x="64" y="302" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Postgres 中断 61 s：66 个请求失败</text>
  <line x1="376" y1="288" x2="419" y2="288" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="388.75" y="271.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="397.5" y="282" font-size="11.5" text-anchor="middle">否</text>
  <rect x="420" y="265" width="200" height="46" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="520" y="282.95" font-size="11.5" text-anchor="middle" font-weight="700">托管沙箱服务</text>
  <text x="520" y="300.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">直接调 API，无需管集群</text>
  <line x1="42" y1="314" x2="42" y2="337" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="47" y="314.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="50" y="325.5" font-size="11.5">是</text>
  <rect x="20" y="338" width="356" height="52" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)"/>
  <circle cx="42" cy="364" r="9" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="42" y="368" font-size="11" text-anchor="middle">5</text>
  <text x="64" y="360" font-size="12.5" font-weight="700">是否有组件调用 SuspendActor？</text>
  <text x="64" y="378" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">空闲 900 s：每次采样仍为 RUNNING</text>
  <line x1="376" y1="364" x2="419" y2="364" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="388.75" y="347.03" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="397.5" y="358" font-size="11.5" text-anchor="middle">否</text>
  <rect x="420" y="341" width="200" height="46" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="520" y="358.95" font-size="11.5" text-anchor="middle" font-weight="700">先引入 harness</text>
  <text x="520" y="376.05" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">kagent 会在每轮后挂起</text>
  <line x1="42" y1="390" x2="42" y2="413" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-4-head-ink)"/>
  <rect class="m-knock" x="47" y="390.53" width="17.5" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="50" y="401.5" font-size="11.5">是</text>
  <rect x="20" y="414" width="600" height="76" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)" stroke-width="2.4"/>
  <text x="40" y="444" font-size="16" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">选择 Agent Substrate</text>
  <text x="40" y="464" font-size="12" class="m-serif">在少量 worker pod 上承载大量有状态 actor</text>
  <text x="40" y="480" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">实测单个 worker 同时运行 16 个 actor，每个 kagent 轮次的恢复与挂起开销为 0.52 s</text>
</svg>
