  <text x="396" y="73" font-size="11" fill="var(--m-teal-ink, #18696a)">203.8 与 504.1 MiB</text>
  <text x="396" y="88" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">等于所持内存大小</text>
  <text x="396" y="103" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">恢复 0.42 与 1.07 s</text>
  <path d="M172.0 259.0 L352.0 185.1" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="172" cy="259.04" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <circle cx="352" cy="185.11" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <polyline points="392,172 357,185.11" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="357" cy="185.11" r="2" fill="var(--m-teal-ink, #18696a)"/>
  <text x="396" y="168" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">一半零、一半随机</text>
  <text x="396" y="183" font-size="11" fill="var(--m-teal-ink, #18696a)">103.8 与 254.4 MiB</text>
  <text x="396" y="198" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">约为所持内存一半</text>
  <text x="396" y="213" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">恢复 0.28 与 0.57 s</text>
  <path d="M172.0 308.0 L352.0 307.7" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="172" cy="308.04" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <circle cx="352" cy="307.74" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <polyline points="392,272 357,307.74" fill="none" stroke="var(--m-teal-ink, #18696a)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="357" cy="307.74" r="2" fill="var(--m-teal-ink, #18696a)"/>
  <text x="396" y="268" font-size="11.5" font-weight="700" fill="var(--m-teal-ink, #18696a)">全零字节</text>
  <text x="396" y="283" font-size="11" fill="var(--m-teal-ink, #18696a)">4.0 与 4.6 MiB</text>
  <text x="396" y="298" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">两种规格均约 4 MiB</text>
  <text x="396" y="313" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">恢复 0.24 与 0.23 s</text>
  <circle cx="62.8" cy="54.73" r="3.2" fill="var(--m-teal-ink, #18696a)"/>
  <text x="71.8" y="58.73" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">单个 actor，一次 du 读数</text>
  <text x="396" y="342" font-size="11" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">恢复耗时：节点本地 10 次中位数</text>
</svg>
