<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" role="img" aria-labelledby="fig-6-6-title fig-6-6-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-6-6-title">两种数据平面按容器拆分的空闲内存占用</title>
  <desc id="fig-6-6-desc">0 至 100 MB 坐标轴上的两条堆叠柱。Envoy 数据平面共 5 个容器，总计占用 91 MB：atenet-router pod 内的 atenet-router 与 envoy，以及 atenet-egress pod 内的 envoy、ext-proc 与 sdsmint，其中仅 sdsmint 持有拦截 CA 私钥。agentgateway 数据平面共 2 个容器，总计占用 38 MB：两个 pod 内各一个 agentgateway 容器，其中 atenet-egress 内的容器持有 CA 私钥。</desc>
