<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="fig-3-4b-title fig-3-4b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4b-title">各快照保真度分别保留什么</title>
  <desc id="fig-3-4b-desc">三列对应三种快照保真度级别。SNAPSHOT_FIDELITY_VOLUMES 仅保留持久卷，恢复时启动新进程。SNAPSHOT_FIDELITY_ROOTFS 保留持久卷与根文件系统写入，恢复时同样启动新进程。SNAPSHOT_FIDELITY_MEMORY 同时保留持久卷、根文件系统写入与进程内存，因此原进程继续运行。下方各行给出 x86 服务器客户机上每种级别各一个 actor 在夹杂挂起的 25 次调用后的三项计数、节点恢复中位数及快照大小：VOLUMES：计数 内存 1，根文件 1，持久卷 250.52 s（10 次中位），快照 44 KiB；ROOTFS：计数 内存 1，根文件 25，持久卷 250.50 s（10 次中位），快照 72 KiB；MEMORY：计数 内存 25，根文件 25，持久卷 250.25 s（10 次中位），快照 56.9 MiB。</desc>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">层级</text>
  <text x="225" y="18" font-size="12" text-anchor="middle" font-weight="700">VOLUMES</text>
  <text x="385" y="18" font-size="12" text-anchor="middle" font-weight="700">ROOTFS</text>
  <text x="545" y="18" font-size="12" text-anchor="middle" font-weight="700">MEMORY</text>
  <text x="20" y="52" font-size="12" font-weight="700">持久卷</text>
  <text x="20" y="68" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">durableDir 挂载</text>
  <rect x="150" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="225" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <rect x="310" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="385" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <rect x="470" y="30" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="57.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <text x="20" y="110" font-size="12" font-weight="700">根文件系统</text>
  <text x="20" y="126" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">启动后的写入</text>
  <rect x="150" y="88" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="225" y="115.75" font-size="12.5" text-anchor="middle" font-weight="400">丢失</text>
  <rect x="310" y="88" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="385" y="115.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <rect x="470" y="88" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="115.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <text x="20" y="168" font-size="12" font-weight="700">进程内存</text>
  <text x="20" y="184" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">进程与 RAM</text>
  <rect x="150" y="146" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="225" y="173.75" font-size="12.5" text-anchor="middle" font-weight="400">丢失</text>
  <rect x="310" y="146" width="150" height="48" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)" stroke-dasharray="5 4"/>
  <text x="385" y="173.75" font-size="12.5" text-anchor="middle" font-weight="400">丢失</text>
  <rect x="470" y="146" width="150" height="48" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="545" y="173.75" font-size="12.5" text-anchor="middle" font-weight="700">保留</text>
  <text x="20" y="222" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">恢复时</text>
  <text x="20" y="280" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #666660)">计数</text>
  <text x="20" y="296" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">25 次调用后</text>
  <text x="225" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">新进程</text>
  <text x="225" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.52 s（10 次中位）</text>
  <text x="225" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">快照 44 KiB</text>
  <text x="225" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">内存 1，根文件 1，</text>
  <text x="225" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">持久卷 25</text>
  <text x="385" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">新进程</text>
  <text x="385" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.50 s（10 次中位）</text>
  <text x="385" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">快照 72 KiB</text>
  <text x="385" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">内存 1，根文件 25，</text>
  <text x="385" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">持久卷 25</text>
  <text x="545" y="222" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--m-ink, #1a1a1a)">原进程继续</text>
  <text x="545" y="238" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-violet-ink, #5b4fa3)">0.25 s（10 次中位）</text>
  <text x="545" y="254" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-teal-ink, #18696a)">快照 56.9 MiB</text>
  <text x="545" y="280" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">内存 25，根文件 25，</text>
  <text x="545" y="296" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">持久卷 25</text>
  <line x1="20" y1="264" x2="620" y2="264" stroke="var(--m-ink-mute, #666660)" stroke-width="1" stroke-opacity="0.4"/>
  <text x="20" y="326" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">枚举名均带前缀 SNAPSHOT_FIDELITY_。</text>
  <text x="20" y="342" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">右侧每个级别都包含其左侧级别保留的内容。</text>
  <text x="20" y="358" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">计数为 1 表示在最后一次恢复时重新开始计数。</text>
</svg>
