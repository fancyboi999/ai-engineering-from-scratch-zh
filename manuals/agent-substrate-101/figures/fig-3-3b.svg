<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-3b-title fig-3-3b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3b-title">同步挂起给调用方增加的等待时间</title>
  <desc id="fig-3-3b-desc">x86 服务器客户机上，kubectl ate suspend actor 返回耗时秒数与 actor 所持随机内存 MiB 的关系。共 75 次挂起各为一个小点，实线连接中位数。默认的异步挂起在快照写入节点后即返回，中位数为：0 MiB 为 0.34 s、50 MiB 为 0.50 s、200 MiB 为 0.79 s、500 MiB 为 1.17 s、1000 MiB 为 1.95 s（每种规格 10 次）。加上 --mode sync 后命令在上传至对象存储完成后才返回，中位数为：0 MiB 为 0.40 s、50 MiB 为 1.03 s、200 MiB 为 2.02 s、500 MiB 为 3.59 s、1000 MiB 为 6.41 s（每种规格 5 次）。在 1000 MiB 时同步挂起多耗时 4.5 s。</desc>
