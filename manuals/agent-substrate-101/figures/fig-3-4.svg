<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-4-title">异步挂起后快照存放在哪里</title>
  <desc id="fig-3-4-desc">x86 服务器客户机上使用默认 atelet 计时器异步挂起后，四个 actor（d0、d50、d200、d500）在 43 分钟内的时间线。前 5 分钟每份快照仅存于节点本地，状态为 PENDING；约 5 分钟至 30 分钟同时存在于节点与对象存储；约 30 分钟后节点副本被移除，仅保留对象存储副本。前三次上传在 5 分 1 秒至 5 分 2 秒完成，500 MiB 的一次在 5 分 11 秒完成。挂起 42 分钟后发起请求，各 actor 从对象存储恢复耗时分别为 0.25 s、0.52 s、1.19 s、2.44 s。柱条下方圆点展示 38 次采样中节点磁盘上的快照体积：节点副本移除前为 758 MiB，移除后为 1 MiB。</desc>
