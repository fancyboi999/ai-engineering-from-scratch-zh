<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-3-3-title">恢复耗时与 actor 所持内存的关系</title>
  <desc id="fig-3-3-desc">带 gVisor 的 x86 服务器客户机上，向已挂起 actor 发一次请求的耗时秒数与其所持随机内存 MiB 的关系。共 75 次恢复各绘为一个小点，实线连接中位数。从节点本地快照恢复的中位数为：0 MiB 为 0.22 s、50 MiB 为 0.24 s、200 MiB 为 0.47 s、500 MiB 为 1.07 s、1000 MiB 为 2.16 s（每种规格 10 次）；1000 MiB 下有一次耗时 5.09 s，其余 9 次至多 2.45 s。从同集群对象存储恢复的中位数为：0 MiB 为 0.24 s、50 MiB 为 0.41 s、200 MiB 为 0.96 s、500 MiB 为 2.26 s、1000 MiB 为 4.68 s（每种规格 5 次）。虚线标出 0.5 s：节点路径在 200 MiB 以上超过该线，对象存储路径在 50 MiB 以上超过该线。</desc>
