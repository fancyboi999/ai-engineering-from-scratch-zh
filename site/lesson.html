  <style>
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--blueprint);
      z-index: 9999;
      transition: width 0.05s linear;
      width: 0%;
    }

    .lesson-layout {
      display: flex;
      padding-top: 64px;
      min-height: 100vh;
    }

    .lesson-sidebar {
      position: fixed;
      top: 64px;
      left: 0;
      bottom: 0;
      width: 240px;
      background: var(--bg);
      border-right: 1px solid var(--rule-soft);
      overflow-y: auto;
      z-index: 50;
      padding: 24px 0;
      transition: transform 0.25s ease;
    }

    .lesson-sidebar-toggle {
      display: none;
      position: fixed;
      top: 74px;
      left: 10px;
      z-index: 60;
      background: var(--bg-surface);
      border: 1px solid var(--rule-soft);
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--ink);
      align-items: center;
      justify-content: center;
    }

    .lesson-sidebar-toggle:hover {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .lesson-sidebar::-webkit-scrollbar { width: 4px; }
    .lesson-sidebar::-webkit-scrollbar-thumb { background: var(--rule-soft); }

    .sidebar-phase-header {
      padding: 18px 20px 8px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .sidebar-lesson-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--ink-soft);
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .sidebar-lesson-link:hover {
      background: var(--blueprint-tint);
      color: var(--ink);
    }

    .sidebar-lesson-link.active {
      color: var(--blueprint);
      background: var(--blueprint-tint);
      border-left-color: var(--blueprint);
    }

    .sidebar-lesson-link.disabled {
      opacity: 0.5;
    }

    .sidebar-lesson-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border: 1px solid var(--ink-mute);
      background: transparent;
    }

    .sidebar-lesson-dot.complete {
      background: var(--blueprint);
      border-color: var(--blueprint);
    }

    .sidebar-lesson-dot.in-progress {
      background: linear-gradient(135deg, var(--blueprint) 0%, var(--blueprint) 50%, transparent 50%, transparent 100%);
      border-color: var(--blueprint);
    }

    .sidebar-lesson-dot.planned {
      border-style: dashed;
    }

    .sidebar-phase-nav {
      padding: 18px 20px;
      border-top: 1px solid var(--rule-soft);
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-phase-nav a {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: none;
    }

    .sidebar-phase-nav a:hover {
      color: var(--blueprint);
    }

    .lesson-main {
      flex: 1;
      min-width: 0;
      margin-left: 240px;
      display: flex;
      justify-content: center;
      padding: 56px 32px 96px;
    }

    .lesson-content {
      max-width: 720px;
      width: 100%;
      min-width: 0;
    }

    .lesson-article {
      max-width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* ── 视频讲解播放器 banner ─────────────────────────────── */
    .lesson-video-banner {
      margin-bottom: 32px;
      border: 1px solid var(--rule-soft);
      border-radius: 8px;
      overflow: hidden;
    }

    .lesson-video-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-surface);
      transition: background 0.15s;
    }

    .lesson-video-header:hover {
      background: var(--bg-surface-hover);
    }

    .lesson-video-icon {
      font-size: 0.9rem;
      color: var(--blueprint);
      flex-shrink: 0;
    }

    .lesson-video-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      flex: 1;
    }

    .lesson-video-sources {
      display: flex;
      gap: 8px;
      margin-right: 8px;
    }

    .lesson-video-src-btn {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--rule-soft);
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .lesson-video-src-btn:hover,
    .lesson-video-src-btn.active {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .lesson-video-toggle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--rule-soft);
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .lesson-video-toggle:hover {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .lesson-video-body {
      background: #000;
      display: none;
    }

    .lesson-video-body.open {
      display: block;
    }

    .lesson-video-body video {
      display: block;
      width: 100%;
      max-height: 56.25vw; /* 16:9 */
    }

    .lesson-video-body iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
    }

    @media (max-width: 640px) {
      .lesson-video-header { padding: 10px 12px; }
    }
    /* ────────────────────────────────────────────────────────── */

    .lesson-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--rule-soft);
      border-top-color: var(--blueprint);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .lesson-loading-text {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    .lesson-error {
      text-align: left;
      padding: 64px 0;
    }

    .lesson-error h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      text-transform: uppercase;
      color: var(--blueprint);
      margin-bottom: 12px;
    }

    .lesson-error p {
      color: var(--ink-soft);
      margin-bottom: 24px;
    }

    .lesson-article h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--blueprint);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--blueprint);
      line-height: 1;
    }

    .lesson-article h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 1.9rem);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin-top: 56px;
      margin-bottom: 18px;
      padding-bottom: 0;
      border-bottom: none;
      line-height: 1.05;
    }

    .lesson-article h2.section-build,
    .lesson-article h2.section-use,
    .lesson-article h2.section-ship {
      border-left: 3px solid var(--blueprint);
      padding-left: 16px;
    }

    .lesson-article h3 {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      margin-top: 36px;
      margin-bottom: 12px;
    }

    .lesson-article h1,
    .lesson-article h2,
    .lesson-article h3 {
      scroll-margin-top: var(--header-offset, 92px);
    }

    .lesson-article p {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 18px;
      text-align: left;
      hyphens: none;
      -webkit-hyphens: none;
    }

    .lesson-article > p:first-of-type::first-letter,
    .lesson-article .drop-cap::first-letter {
      float: left;
      font-family: var(--font-display);
      font-size: 4rem;
      line-height: 0.85;
      padding: 0.06em 0.16em 0 0;
      color: var(--blueprint);
    }

    .lesson-article .motto {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--ink);
      border-left: 2px solid var(--blueprint);
      background: var(--blueprint-tint);
      padding: 18px 22px;
      margin: 24px 0 32px;
      text-align: left;
    }

    .lesson-article blockquote {
      border-left: 2px solid var(--blueprint);
      background: var(--blueprint-tint);
      padding: 14px 22px;
      margin: 20px 0;
      color: var(--ink);
      font-family: var(--font-body);
      font-style: italic;
      text-align: left;
    }

    .lesson-article strong {
      color: var(--ink);
      font-weight: 600;
    }

    .lesson-article em {
      font-style: italic;
    }

    .lesson-article a {
      color: var(--blueprint);
      text-decoration: none;
      border-bottom: 1px solid var(--blueprint);
      transition: background 0.15s;
    }

    .lesson-article a:hover {
      background: var(--blueprint-tint);
    }

    .lesson-article hr {
      border: none;
      height: 6px;
      margin: 40px 0;
      background-image:
        repeating-linear-gradient(to right, var(--blueprint) 0, var(--blueprint) 4px, transparent 4px, transparent 8px),
        repeating-linear-gradient(to right, transparent 0, transparent 8px, var(--blueprint-tint-strong) 8px, var(--blueprint-tint-strong) 14px);
      background-size: 100% 3px, 100% 3px;
      background-position: 0 0, 0 3px;
      background-repeat: no-repeat;
    }

    .lesson-article ul {
      list-style: none;
      padding-left: 22px;
      margin-bottom: 18px;
    }

    .lesson-article ul li {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      position: relative;
      padding-left: 6px;
      margin-bottom: 4px;
      text-align: left;
    }

    .lesson-article ul li::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 0.65em;
      width: 6px;
      height: 6px;
      background: var(--blueprint);
    }

    .lesson-article ol {
      list-style: none;
      padding-left: 28px;
      margin-bottom: 18px;
      counter-reset: ol-counter;
    }

    .lesson-article ol li {
      font-family: var(--font-body);
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ink);
      position: relative;
      padding-left: 6px;
      margin-bottom: 4px;
      counter-increment: ol-counter;
      text-align: left;
    }

    .lesson-article ol li::before {
      content: counter(ol-counter, decimal-leading-zero);
      position: absolute;
      left: -28px;
      top: 0.1em;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--blueprint);
    }

    .lesson-article code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 1px 6px;
      border: 1px solid var(--rule-soft);
      color: var(--blueprint);
    }

    .lesson-article .math-inline {
      background: var(--code-bg);
      padding: 1px 6px;
      border: 1px solid var(--rule-soft);
      color: var(--blueprint);
    }

    .lesson-article .math-inline .katex {
      font-size: 1.04em;
    }

    .lesson-article pre {
      position: relative;
      margin: 20px 0;
      padding-top: 44px;
      overflow: hidden;
      border: 1px solid var(--rule-soft);
      background: var(--code-bg);
    }

    .lesson-article pre code {
      display: block;
      background: var(--code-bg);
      color: var(--ink);
      padding: 22px 24px;
      font-size: 0.86rem;
      line-height: 1.6;
      overflow-x: auto;
      border: none;
    }

    .code-lang {
      position: absolute;
      top: 0;
      left: 0;
      max-width: calc(100% - 88px);
      height: 44px;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 0 12px;
      background: var(--blueprint);
      color: var(--bg);
      z-index: 2;
    }

    .code-copy {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 88px;
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--rule-soft);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
      z-index: 2;
      transition: color 0.15s, border-color 0.15s;
    }

    .code-copy:hover {
      color: var(--blueprint);
      border-color: var(--blueprint);
    }

    .syn-keyword { color: var(--blueprint); font-weight: 500; }
    .syn-string { color: var(--ink); }
    .syn-number { color: var(--blueprint); }
    .syn-comment { color: var(--ink-mute); font-style: italic; }
    .syn-function { color: var(--ink); font-weight: 500; }
    .syn-operator { color: var(--ink-soft); }

    [data-theme="dark"] .syn-keyword { color: var(--blueprint); }
    [data-theme="dark"] .syn-string { color: var(--ink); }
    [data-theme="dark"] .syn-number { color: var(--blueprint); }
    [data-theme="dark"] .syn-comment { color: var(--ink-mute); }
    [data-theme="dark"] .syn-function { color: var(--ink); }
    [data-theme="dark"] .syn-operator { color: var(--ink-soft); }

    .lesson-article .table-wrap {
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--rule-soft);
    }

    .lesson-article table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
      font-size: 0.96rem;
    }

    .lesson-article thead th {
      background: var(--bg-surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--ink);
    }

    .lesson-article tbody td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--rule-soft);
      color: var(--ink);
      vertical-align: top;
    }

    .lesson-article tbody tr:last-child td { border-bottom: none; }

    .lesson-article tbody tr:hover {
      background: var(--blueprint-tint);
    }

    .lesson-article .key-terms-table .col-says {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--ink-soft);
    }

    .learning-objectives {
      background: transparent;
      border: 1px solid var(--blueprint);
      padding: 22px 26px;
      margin: 24px 0 32px;
    }

    .learning-objectives-title {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blueprint);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .learning-objectives ul { margin: 0; padding-left: 20px; }
    .learning-objectives li {
      margin-bottom: 6px;
      color: var(--ink);
      line-height: 1.55;
      font-size: 0.98rem;
      text-align: left;
    }

    .lesson-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 28px;
      padding: 14px 0;
      border-top: 1px solid var(--rule-soft);
      border-bottom: 1px solid var(--rule-soft);
    }

    .lesson-meta-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1px solid var(--rule-soft);
      color: var(--ink-soft);
      background: transparent;
    }

    .lesson-meta-tag.time-tag {
      border-color: var(--blueprint);
      color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .lesson-action-panel {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 24px 0 34px;
      border: 1px solid var(--blueprint);
      background: var(--blueprint-tint);
      overflow: hidden;
    }

    .lesson-action-head {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--blueprint);
    }

    .lesson-action-head > *,
    .lesson-action-body > *,
    .lesson-action-command-row > * {
      min-width: 0;
    }

    .lesson-action-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.45rem;
      line-height: 1;
      text-transform: uppercase;
      color: var(--blueprint);
    }

    .lesson-action-intro {
      max-width: 450px;
      margin: 7px 0 0;
      font-family: var(--font-body);
      font-size: 0.94rem;
      line-height: 1.45;
      color: var(--ink-soft);
      text-align: left;
    }

    .lesson-action-status {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .lesson-action-loop {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 1px solid var(--rule-soft);
    }

    .lesson-action-step {
      min-width: 0;
      min-height: 112px;
      padding: 14px 12px;
      border: 0;
      border-right: 1px solid var(--rule-soft);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition:
        color var(--motion-feedback) var(--ease-out),
        background-color var(--motion-feedback) var(--ease-out),
        opacity var(--motion-feedback) var(--ease-out);
    }

    .lesson-action-step:last-child { border-right: 0; }

    .lesson-action-step:hover,
    .lesson-action-step:focus-visible {
      color: var(--blueprint);
      background: var(--bg-surface);
    }

    .lesson-action-step.is-done {
      background: var(--blueprint);
      color: var(--bg);
    }

    .lesson-action-step-num,
    .lesson-action-step-title,
    .lesson-action-step-copy {
      display: block;
    }

    .lesson-action-step-num {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      opacity: 0.72;
    }

    .lesson-action-step-title {

  <script>

        btn.addEventListener('click', function () {

      var params = new URLSearchParams(window.location.search);

      var prerendered = window.__PRERENDERED__ || null;
      var lessonPath = prerendered ? prerendered.path : params.get('path');
      var requestedTrackId = params.get('track') || '';
      var originatingTrackId = params.get('fromTrack') || '';
      var LEARNING_PATH_ID_ALIASES = { 'mcp-engineering': 'model-context-protocol' };
      var incomingLearningPathId = params.get('learningPath') || '';
      var requestedLearningPathId = LEARNING_PATH_ID_ALIASES[incomingLearningPathId] || incomingLearningPathId;
      function replaceLearningPathInUrl(pathId) {
        if (!pathId || !window.history || !window.history.replaceState) return;
        var canonicalLearningPathUrl = new URL(window.location.href);
        canonicalLearningPathUrl.searchParams.set('learningPath', pathId);
        window.history.replaceState(null, '', canonicalLearningPathUrl.pathname + canonicalLearningPathUrl.search + canonicalLearningPathUrl.hash);
      }
      if (incomingLearningPathId && incomingLearningPathId !== requestedLearningPathId) replaceLearningPathInUrl(requestedLearningPathId);

      if (!lessonPath) {

      if (window.AIFSProgress) {
        window.AIFSProgress.recordVisit(lessonPath);

      var phaseMatch = lessonPath.match(/phases\/(\d+-[^/]+)/);
      var lessonMatch = lessonPath.match(/phases\/\d+-[^/]+\/(\d+-[^/]+)/);
      var currentPhaseSlug = phaseMatch ? phaseMatch[1] : null;

      var currentPhaseIndex = -1;
      var currentLessonIndex = -1;
      var flatLessons = [];
      var lessonQuizPromise = null;
      var ACTIVE_REF = window.__AIFS_REF || 'main';
      var SOURCE_CONFIG = window.__AIFS_SOURCE || {};
      var SOURCE_OWNER = /^[A-Za-z0-9-]+$/.test(SOURCE_CONFIG.owner || '') ? SOURCE_CONFIG.owner : 'fancyboi999';

      var REPO_TREE = 'https://github.com/fancyboi999/ai-engineering-from-scratch-zh/tree/' + encodeURIComponent(ACTIVE_REF) + '/';
      var certificationTrack = null;
      var certificationOriginTrack = null;
      var certificationLesson = null;
      var certificationMode = false;
      var certificationSupplementalMode = false;
      var learningPath = null;
      var learningPathMode = false;
      var PROGRESS_STORAGE_KEY = 'aifs:progress:v2';

      function certificationData() {
        return typeof CERTIFICATIONS !== 'undefined' && CERTIFICATIONS ? CERTIFICATIONS : null;
      }

      function certificationRefPath(ref) {
        return typeof ref === 'string' ? ref : ref && ref.path ? ref.path : '';
      }

      function certificationTrackContains(track, path) {
        return !!(track && Array.isArray(track.lessons) && track.lessons.some(function (ref) {
          return certificationRefPath(ref) === path;
        }));
      }

      function findCertificationTrack(id) {
        var certs = certificationData();
        if (!certs || !Array.isArray(certs.tracks)) return null;
        return certs.tracks.find(function (track) {
          return track.id === id || track.slug === id || track.examCode === id;
        }) || null;
      }

      function certificationContextTrack() {
        return certificationTrack || certificationOriginTrack || null;
      }

      function certificationTrackLabel(track) {
        return track && (track.examCode || track.shortName || track.credential || track.title || track.id) || '认证路线';
      }

      function phaseLessonForPath(path) {
        if (typeof PHASES === 'undefined') return null;
        for (var pi = 0; pi < PHASES.length; pi++) {
          for (var li = 0; li < PHASES[pi].lessons.length; li++) {
            var phaseLesson = PHASES[pi].lessons[li];
            var match = phaseLesson.url && phaseLesson.url.match(/(phases\/[^/?#]+\/[^/?#]+)/);
            if (match && match[1] === path) {
              return { phase: PHASES[pi], lesson: phaseLesson, phaseIndex: pi, lessonIndex: li };
            }
          }
        }
        return null;
      }

      function learningPathEntryPath(entry) {
        return typeof entry === 'string' ? entry : entry && entry.path ? entry.path : '';
      }

      function findLearningPath(id) {
        if (!id || typeof LEARNING_PATHS === 'undefined' || !Array.isArray(LEARNING_PATHS)) return null;
        return LEARNING_PATHS.find(function (path) { return path && path.id === id; }) || null;
      }

      function inferLearningPath(target) {
        if (!target || typeof LEARNING_PATHS === 'undefined' || !Array.isArray(LEARNING_PATHS)) return null;
        var preferredIds = ['agent-skills', 'model-context-protocol'];
        for (var i = 0; i < preferredIds.length; i++) {
          var preferred = findLearningPath(preferredIds[i]);
          if (preferred && learningPathContains(preferred, target)) return preferred;
        }
        return LEARNING_PATHS.find(function (path) { return learningPathContains(path, target); }) || null;
      }

      function learningPathEntries(path, includeOptional) {
        if (!path) return [];
        var required = Array.isArray(path.lessons) ? path.lessons : [];
        var optional = includeOptional && Array.isArray(path.optionalLessons) ? path.optionalLessons : [];
        return required.concat(optional);
      }

      function learningPathContains(path, target) {
        return learningPathEntries(path, true).some(function (entry) {
          return learningPathEntryPath(entry) === target;
        });
      }

      function learningPathLessonHref(path) {
        var href = lessonHref(path);
        return href + (href.indexOf('?') >= 0 ? '&' : '?') +
          'learningPath=' + encodeURIComponent(learningPath.id);
      }

      function learningPathPrerequisiteLabel(path) {
        var core = phaseLessonForPath(path);
        if (!core) return path;
        return '阶段 ' + String(core.phase.id).padStart(2, '0') + ' · ' + core.lesson.name;
      }

      function unmetLearningPathPrerequisites(entry) {
        var prerequisites = entry && Array.isArray(entry.prerequisitePaths)
          ? entry.prerequisitePaths
          : [];
        return prerequisites.filter(function (prerequisitePath) {
          return !(window.AIFSProgress && window.AIFSProgress.isLessonComplete(prerequisitePath));
        });
      }

      function learningPathPrerequisiteChecks(entry) {
        if (!learningPathMode || !window.AIFSLearningPathProgress) return [];
        return window.AIFSLearningPathProgress.unmetChecks(learningPath, entry);
      }

      function learningPathCheckIds(entry) {
        return entry && Array.isArray(entry.prerequisiteChecks)
          ? entry.prerequisiteChecks.filter(function (id) { return typeof id === 'string' && id.length > 0; })
          : [];
      }

      function learningPathPrerequisitePaths(entry) {
        return entry && Array.isArray(entry.prerequisitePaths)
          ? entry.prerequisitePaths.filter(function (path) { return typeof path === 'string' && path.length > 0; })
          : [];
      }

      function learningPathEntryLocked(entry) {
        return unmetLearningPathPrerequisites(entry).length > 0 ||
          learningPathPrerequisiteChecks(entry).length > 0;
      }

      function learningPathGateClass(entry) {
        return learningPathEntryLocked(entry) ? ' learning-path-locked' : '';
      }

      function learningPathGateAttributes(entry) {
        var ids = learningPathCheckIds(entry);
        var paths = learningPathPrerequisitePaths(entry);
        if (!ids.length && !paths.length) return '';
        var locked = learningPathEntryLocked(entry);
        return ' data-learning-path-id="' + escapeAttr(learningPath.id) + '"' +
          ' data-learning-path-gate="true"' +
          ' data-prerequisite-checks="' + escapeAttr(ids.join(' ')) + '"' +
          ' data-prerequisite-paths="' + escapeAttr(paths.join(' ')) + '"' +
          (locked ? ' aria-disabled="true"' : '');
      }

      function learningPathPreflightDefinitions() {
        if (!learningPathMode) return [];
        var referenced = {};
        for (var lessonIndex = 0; lessonIndex < flatLessons.length; lessonIndex++) {
          var ids = learningPathCheckIds(flatLessons[lessonIndex]);
          for (var checkIndex = 0; checkIndex < ids.length; checkIndex++) referenced[ids[checkIndex]] = true;
        }
        var definitions = Array.isArray(learningPath.prerequisites) ? learningPath.prerequisites : [];
        return Object.keys(referenced).map(function (id) {
          return definitions.find(function (entry) { return entry && entry.id === id; });
        }).filter(Boolean);
      }

      function learningPathPreflightHtml() {
        var checks = learningPathPreflightDefinitions();
        if (!checks.length) return '';
        var html = '<div class="learning-path-preflights" aria-label="知识前置检查">';
        for (var index = 0; index < checks.length; index++) {
          var check = checks[index];
          var confirmed = window.AIFSLearningPathProgress && window.AIFSLearningPathProgress.isConfirmed(learningPath.id, check.id);
          html += '<div class="learning-path-preflight' + (confirmed ? ' confirmed' : '') + '" data-learning-path-preflight="' + escapeAttr(check.id) + '">';
          html += '<div class="learning-path-preflight-copy"><div class="learning-path-preflight-label">必需的知识前置检查</div>';
          html += '<div class="learning-path-preflight-title">' + escapeHtml(check.title || check.id) + '</div>';
          if (check.description) html += '<div class="learning-path-preflight-description">' + escapeHtml(check.description) + '</div>';
          html += '</div><div class="learning-path-preflight-actions">';
          html += '<div class="learning-path-preflight-status" role="status" aria-live="polite">' + (confirmed ? '已确认' : '需要确认') + '</div>';
          html += '<button type="button" class="output-btn learning-path-confirm" data-learning-path-check-id="' + escapeAttr(check.id) + '" aria-pressed="' + (confirmed ? 'true' : 'false') + '" onclick="confirmLearningPathCheck(this)"' + (confirmed ? ' disabled' : '') + '>' + (confirmed ? '已确认' : '确认前置条件') + '</button>';
          html += '</div></div>';
        }
        html += '</div>';
        return html;
      }

      function learningPathPrerequisiteCallout(entry, heading) {
        var unmet = unmetLearningPathPrerequisites(entry);
        var unmetChecks = learningPathPrerequisiteChecks(entry);
        if (!unmet.length && !unmetChecks.length) return '';
        var html = '<div class="continue-callout prerequisite-callout" role="status" tabindex="-1" data-learning-path-prerequisite-callout="true"' +
          ' data-prerequisite-paths="' + escapeAttr(unmet.join(' ')) + '"' +
          ' data-prerequisite-checks="' + escapeAttr(unmetChecks.map(function (check) { return check.id; }).join(' ')) + '"><strong>' +
          escapeHtml(heading || '前置条件检查') + '</strong><br>';
        for (var index = 0; index < unmet.length; index++) {
          var prerequisitePath = unmet[index];
          var label = learningPathPrerequisiteLabel(prerequisitePath);

            html += '<span>先完成本课：' + escapeHtml(label) + '。</span>';

            var insideFocusedPath = learningPathContains(learningPath, prerequisitePath);
            var href = insideFocusedPath

      function linkUnmetLearningPathCheckIds(link) {

      function linkUnmetLearningPathPrerequisitePaths(link) {

      function linkHasUnmetLearningPathPrerequisite(link) {

          linkUnmetLearningPathCheckIds(link).length > 0;

      function syncLearningPathGateLinks() {
        var links = document.querySelectorAll('a[data-learning-path-gate]');

        }

      function findLearningPathConfirmButton(checkId) {
        var buttons = document.querySelectorAll('[data-learning-path-check-id]');
        for (var index = 0; index < buttons.length; index++) {
          if (buttons[index].getAttribute('data-learning-path-check-id') === checkId && !buttons[index].disabled) return buttons[index];
        }
        return null;
      }

      function findLearningPathPrerequisiteCallout(paths) {
        if (!paths.length) return null;
        var callouts = document.querySelectorAll('[data-learning-path-prerequisite-callout]');
        for (var index = 0; index < callouts.length; index++) {
          var describedPaths = (callouts[index].getAttribute('data-prerequisite-paths') || '').split(/\s+/).filter(Boolean);
          if (paths.some(function (path) { return describedPaths.indexOf(path) >= 0; })) return callouts[index];

      function ensureLearningPathPrerequisiteCallout(link) {

        var callout = findLearningPathPrerequisiteCallout(paths);
        if (callout || !paths.length) return callout;
        var panel = document.getElementById('continuePathPanel') || document.getElementById('learningPathPanel');
        if (!panel) return null;

        wrapper.innerHTML = learningPathPrerequisiteCallout({ prerequisitePaths: paths }, '学习本课前需要完成');

        if (window.AIFSProgress.hasLessonActivity(path)) return 'in-progress';
        return '';
      }

      function currentCertificationQuizVersion() {
        if (!certificationLesson) return '';
        var value = certificationLesson.quizVersion;
        if (typeof value !== 'string' && typeof value !== 'number') return '';
        return String(value).trim();
      }

      function mutateLessonProgress(mutator) {
        if (!lessonPath || typeof mutator !== 'function') return false;
        try {
          var raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
            var state = raw ? JSON.parse(raw) : { schemaVersion: 2, lessons: {}, updatedAt: 0 };
          if (!state || typeof state !== 'object' || !state.lessons || typeof state.lessons !== 'object') return false;
          var lesson = state.lessons[lessonPath];
          if (!lesson || typeof lesson !== 'object') {
            lesson = { answers: {}, quizPassedAt: null, checkpoints: {}, completedAt: null, completionSource: '', visitedAt: Date.now() };
            state.lessons[lessonPath] = lesson;
          }
          if (!mutator(lesson)) return false;
          state.updatedAt = Date.now();
          localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (_) {
          return false;
        }
      }

      function syncCertificationQuizProgressVersion() {
        var currentVersion = currentCertificationQuizVersion();
        if (!currentVersion) return;
        mutateLessonProgress(function (lesson) {
          var storedVersion = lesson.quizVersion === undefined || lesson.quizVersion === null ? '' : String(lesson.quizVersion);
          if (storedVersion === currentVersion) return false;
          lesson.answers = {};
          lesson.quizPassedAt = null;
          lesson.quizVersion = currentVersion;
          return true;
        });
      }

      function clearQuizSectionProgress(section) {
        if (!section) return false;
        var questionIds = Array.prototype.map.call(section.querySelectorAll('.quiz-question[id]'), function (question) {
          return question.id;
        });
        if (!questionIds.length) return false;
        var currentVersion = currentCertificationQuizVersion();
        var changed = mutateLessonProgress(function (lesson) {
          if (!lesson.answers || typeof lesson.answers !== 'object') lesson.answers = {};
          for (var i = 0; i < questionIds.length; i++) delete lesson.answers[questionIds[i]];
          lesson.quizPassedAt = null;
          if (currentVersion) lesson.quizVersion = currentVersion;
          return true;
        });
        if (changed) refreshProgressUi();
        return changed;
      }

      function initializeLessonData() {
        flatLessons = [];
        currentPhaseIndex = -1;
        currentLessonIndex = -1;
        var certs = certificationData();
        certificationLesson = certs && certs.lessonsByPath ? certs.lessonsByPath[lessonPath] || null : null;
        certificationOriginTrack = originatingTrackId ? findCertificationTrack(originatingTrackId) : null;
        certificationTrack = null;

        if (certificationOriginTrack && certificationTrackContains(certificationOriginTrack, lessonPath)) {
          certificationTrack = certificationOriginTrack;
        } else if (!certificationOriginTrack) {
          var requestedTrack = requestedTrackId ? findCertificationTrack(requestedTrackId) : null;
          if (requestedTrack && certificationTrackContains(requestedTrack, lessonPath)) {
            certificationTrack = requestedTrack;
          } else if (requestedTrack) {
            certificationOriginTrack = requestedTrack;
          }
        }
        if (!certificationTrack && !certificationOriginTrack && certificationLesson && Array.isArray(certificationLesson.trackIds)) {
          certificationTrack = findCertificationTrack(certificationLesson.trackIds[0]);
        }
        certificationMode = !!(certificationTrack && certificationTrackContains(certificationTrack, lessonPath));
        certificationSupplementalMode = !!(certificationOriginTrack && !certificationMode);
        learningPath = !certificationMode && !certificationSupplementalMode
          ? (requestedLearningPathId ? findLearningPath(requestedLearningPathId) : inferLearningPath(lessonPath))
          : null;
        learningPathMode = !!(learningPath && learningPathContains(learningPath, lessonPath));
        if (learningPathMode && !incomingLearningPathId) replaceLearningPathInUrl(learningPath.id);

        syncCertificationQuizProgressVersion();

        if (certificationLesson) {
          document.documentElement.lang = 'zh-CN';
          document.documentElement.dir = 'ltr';
        }

        if (certificationMode) {
          for (var ci = 0; ci < certificationTrack.lessons.length; ci++) {
            var certRef = certificationTrack.lessons[ci];
            var certPath = certificationRefPath(certRef);
            if (!certPath) continue;
            var embedded = certs.lessonsByPath[certPath] || null;
            var core = embedded ? null : phaseLessonForPath(certPath);
            var display = embedded || (core && core.lesson) || {};
            flatLessons.push({
              lessonIndex: ci,
              lessonName: display.name || display.title || certPath.split('/').pop().replace(/^\d+-/, '').replace(/-/g, ' '),
              lessonSlug: certPath.split('/').pop(),
              status: display.status || 'complete',
              type: certRef.role || display.type || '认证',
              lang: display.languages || display.lang || '—',
              url: display.url || '',
              path: certPath,
              isReadable: true,
              domains: Array.isArray(certRef.domains) ? certRef.domains : [],
              required: certRef.required !== false
            });
            if (certPath === lessonPath) currentLessonIndex = flatLessons.length - 1;
          }
          return;
        }

        if (learningPathMode) {
          var requiredCount = Array.isArray(learningPath.lessons) ? learningPath.lessons.length : 0;
          var pathEntries = learningPathEntries(learningPath, true);
          for (var lp = 0; lp < pathEntries.length; lp++) {
            var pathEntry = pathEntries[lp];
            var pathValue = learningPathEntryPath(pathEntry);
            var coreLesson = phaseLessonForPath(pathValue);
            if (!coreLesson) continue;
            var corePhaseSlug = extractPhaseSlug(coreLesson.phase, coreLesson.phaseIndex);
            var coreLessonSlug = extractLessonSlug(coreLesson.lesson, coreLesson.lessonIndex);
            flatLessons.push({
              phaseIndex: coreLesson.phaseIndex,
              lessonIndex: coreLesson.lessonIndex,
              phaseName: coreLesson.phase.name,
              phaseId: coreLesson.phase.id,
              phaseSlug: corePhaseSlug,
              lessonName: pathEntry && typeof pathEntry === 'object' && pathEntry.title
                ? String(pathEntry.title)
                : coreLesson.lesson.name,
              lessonSlug: coreLessonSlug,
              status: coreLesson.lesson.status,
              type: coreLesson.lesson.type,
              lang: coreLesson.lesson.lang,
              url: coreLesson.lesson.url,
              path: pathValue,
              isReadable: true,
              required: lp < requiredCount && (!pathEntry || typeof pathEntry === 'string' || pathEntry.required !== false),
              minutes: pathEntry && typeof pathEntry === 'object' ? Number(pathEntry.minutes || 0) : 0,
              group: pathEntry && typeof pathEntry === 'object' ? String(pathEntry.group || '') : '',
              checkpoint: pathEntry && typeof pathEntry === 'object' ? String(pathEntry.checkpoint || '') : '',
              checkpointEvidence: pathEntry && typeof pathEntry === 'object' && Array.isArray(pathEntry.checkpointEvidence)
                ? pathEntry.checkpointEvidence.slice()
                : [],
              prerequisitePaths: pathEntry && typeof pathEntry === 'object' && Array.isArray(pathEntry.prerequisitePaths)
                ? pathEntry.prerequisitePaths.slice()
                : [],
              prerequisiteChecks: pathEntry && typeof pathEntry === 'object' && Array.isArray(pathEntry.prerequisiteChecks)
                ? pathEntry.prerequisiteChecks.slice()
                : []
            });
            if (pathValue === lessonPath) {
              currentPhaseIndex = coreLesson.phaseIndex;
              currentLessonIndex = flatLessons.length - 1;
            }
          }
          return;
        }

        if (typeof PHASES !== 'undefined') {
          for (var i = 0; i < PHASES.length; i++) {
            var p = PHASES[i];
            var pSlug = extractPhaseSlug(p, i);
            for (var j = 0; j < p.lessons.length; j++) {
              var l = p.lessons[j];
              var lSlug = extractLessonSlug(l, j);
              flatLessons.push({
                phaseIndex: i,
                lessonIndex: j,
                phaseName: p.name,
                phaseId: p.id,
                phaseSlug: pSlug,
                lessonName: l.name,
                lessonSlug: lSlug,
                status: l.status,
                type: l.type,
                lang: l.lang,
                url: l.url,
                path: 'phases/' + pSlug + '/' + lSlug,
                isReadable: l.status === 'complete' || !!l.url
              });
              if (pSlug === currentPhaseSlug && lSlug === currentLessonSlug) {
                currentPhaseIndex = i;
                currentLessonIndex = flatLessons.length - 1;
              }
            }
          }
        }
      }

      function extractPhaseSlug(phase, index) {
        if (phase.url) {
          var m = phase.url.match(/phases\/([^/]+)/);
          if (m) return m[1];
        }
        if (phase.lessons && phase.lessons.length > 0 && phase.lessons[0].url) {
          var m2 = phase.lessons[0].url.match(/phases\/([^/]+)/);
          if (m2) return m2[1];
        }
        return String(phase.id).padStart(2, '0') + '-' + phase.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }

      function extractLessonSlug(lesson, index) {
        if (lesson.url) {
          var m = lesson.url.match(/phases\/[^/]+\/([^/]+)/);
          if (m) return m[1].replace(/\/$/, '');
        }
        return String(index + 1).padStart(2, '0') + '-' + lesson.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }

      function buildSidebar() {
        var sidebar = document.getElementById('lessonSidebar');
        if (!sidebar) return;

        if (certificationSupplementalMode) {
          var originLabel = certificationTrackLabel(certificationOriginTrack);
          var supplementalCore = phaseLessonForPath(lessonPath);
          var supplementalLesson = certificationLesson || (supplementalCore && supplementalCore.lesson) || {};
          var lessonLabel = supplementalLesson.name || supplementalLesson.title || lessonPath.split('/').pop().replace(/^\d+-/, '').replace(/-/g, ' ');
          var supplementalProgress = lessonProgressClass(lessonPath, true);

          sidebar.innerHTML = supplementalHtml;

        }

        if (certificationMode) {
          var certHtml = '<div class="sidebar-phase-nav"><a href="certification.html?id=' + encodeURIComponent(certificationTrack.id) + '">&larr; 返回 ' + escapeHtml(certificationTrack.examCode || certificationTrack.shortName || '认证路线') + '</a></div>';
          certHtml += '<div class="sidebar-phase-header">' + escapeHtml(certificationTrack.examCode || '认证') + ' · ' + escapeHtml(certificationTrack.shortName || certificationTrack.credential || certificationTrack.title || '备考路线') + '</div>';
          for (var ci = 0; ci < flatLessons.length; ci++) {
            var certLesson = flatLessons[ci];
            var certActive = certLesson.path === lessonPath;
            var certProgress = lessonProgressClass(certLesson.path, true);
            certHtml += '<a class="sidebar-lesson-link' + (certActive ? ' active' : '') + '" href="lesson?path=' + encodeURIComponent(certLesson.path) + '&track=' + encodeURIComponent(certificationTrack.id) + '">';
            certHtml += '<span class="sidebar-lesson-dot ' + certProgress + '"></span>';
            certHtml += escapeHtml(certLesson.lessonName) + '</a>';
          }
          sidebar.innerHTML = certHtml;
          return;
        }

        if (learningPathMode) {
          var pathReturnHref = 'catalog.html';
          var pathReturnLabel = '完整课程目录';
          if (learningPath.kind === 'career-route') {
            pathReturnHref = 'learning-paths.html#career-route-' + encodeURIComponent(learningPath.id);
            pathReturnLabel = '返回职业路线';
          }
          var pathHtml = '<div class="sidebar-phase-nav"><a href="' + pathReturnHref + '">&larr; ' + pathReturnLabel + '</a></div>';
          var requiredPathLessons = flatLessons.filter(function (item) { return item.required !== false; });
          var optionalPathLessons = flatLessons.filter(function (item) { return item.required === false; });
          pathHtml += '<div class="sidebar-phase-header">' + escapeHtml(learningPath.title || learningPath.id) + ' · ' + requiredPathLessons.length + ' 节课</div>';
          for (var lpi = 0; lpi < requiredPathLessons.length; lpi++) {
            var pathLesson = requiredPathLessons[lpi];
            var pathActive = pathLesson.path === lessonPath;
            pathHtml += '<a class="sidebar-lesson-link' + (pathActive ? ' active' : '') + learningPathGateClass(pathLesson) + '" href="' + learningPathLessonHref(pathLesson.path) + '"' + learningPathGateAttributes(pathLesson) + '>';
            pathHtml += '<span class="sidebar-lesson-dot ' + lessonProgressClass(pathLesson.path, true) + '"></span>';
            pathHtml += escapeHtml(pathLesson.lessonName) + '</a>';
          }
          if (optionalPathLessons.length) {
            pathHtml += '<div class="sidebar-phase-header">可选综合项目</div>';
            for (var lpo = 0; lpo < optionalPathLessons.length; lpo++) {
              var optionalLesson = optionalPathLessons[lpo];
              var optionalActive = optionalLesson.path === lessonPath;
              pathHtml += '<a class="sidebar-lesson-link' + (optionalActive ? ' active' : '') + learningPathGateClass(optionalLesson) + '" href="' + learningPathLessonHref(optionalLesson.path) + '"' + learningPathGateAttributes(optionalLesson) + '>';
              pathHtml += '<span class="sidebar-lesson-dot ' + lessonProgressClass(optionalLesson.path, true) + '"></span>';
              pathHtml += escapeHtml(optionalLesson.lessonName) + '</a>';
            }
          }
          sidebar.innerHTML = pathHtml;
          return;
        }

        if (typeof PHASES === 'undefined') return;

        var html = '';

        var prevPhaseIdx = currentPhaseIndex > 0 ? currentPhaseIndex - 1 : -1;
        var nextPhaseIdx = (currentPhaseIndex >= 0 && currentPhaseIndex < PHASES.length - 1) ? currentPhaseIndex + 1 : -1;

        if (prevPhaseIdx >= 0 || nextPhaseIdx >= 0) {
          html += '<div class="sidebar-phase-nav">';
          if (prevPhaseIdx >= 0) {
            var pp = PHASES[prevPhaseIdx];
            var ppSlug = extractPhaseSlug(pp, prevPhaseIdx);
            var ppFirstLesson = pp.lessons[0] ? extractLessonSlug(pp.lessons[0], 0) : '';
            html += '<a href="' + lessonHref('phases/' + ppSlug + '/' + ppFirstLesson) + '">&larr; 阶段 ' + String(pp.id).padStart(2, '0') + '：' + escapeHtml(pp.name) + '</a>';
          }
          if (nextPhaseIdx >= 0) {
            var np = PHASES[nextPhaseIdx];
            var npSlug = extractPhaseSlug(np, nextPhaseIdx);
            var npFirstLesson = np.lessons[0] ? extractLessonSlug(np.lessons[0], 0) : '';
            html += '<a href="' + lessonHref('phases/' + npSlug + '/' + npFirstLesson) + '">阶段 ' + String(np.id).padStart(2, '0') + '：' + escapeHtml(np.name) + ' &rarr;</a>';
          }
          html += '</div>';
        }

        if (currentPhaseIndex >= 0) {
          var phase = PHASES[currentPhaseIndex];
          html += '<div class="sidebar-phase-header">阶段 ' + String(phase.id).padStart(2, '0') + ' · ' + escapeHtml(phase.name) + '</div>';
          for (var k = 0; k < phase.lessons.length; k++) {
            var les = phase.lessons[k];
            var lesSlug = extractLessonSlug(les, k);
            var pSlugCurrent = extractPhaseSlug(phase, currentPhaseIndex);
            var isActive = lesSlug === currentLessonSlug;
            var lesReadable = les.status === 'complete' || !!les.url;
            if (lesReadable) {
              html += '<a class="sidebar-lesson-link' + (isActive ? ' active' : '') + '" href="' + lessonHref('phases/' + pSlugCurrent + '/' + lesSlug) + '">';
            } else {
              html += '<span class="sidebar-lesson-link disabled">';
            }
            html += '<span class="sidebar-lesson-dot ' + (lessonProgressClass('phases/' + pSlugCurrent + '/' + lesSlug, lesReadable) || les.status) + '"></span>';
            html += escapeHtml(les.name);
            html += lesReadable ? '</a>' : '</span>';
          }
        }

        sidebar.innerHTML = html;
      }

      function initSidebarToggle() {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('lessonSidebar');
        if (!toggle || !sidebar) return;

        toggle.addEventListener('click', function () {
          sidebar.classList.toggle('open');
          toggle.setAttribute('aria-expanded', sidebar.classList.contains('open') ? 'true' : 'false');
        });

        document.addEventListener('click', function (e) {
          if (window.innerWidth <= 900 && sidebar.classList.contains('open')) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
              sidebar.classList.remove('open');
              toggle.setAttribute('aria-expanded', 'false');
            }

      function initScrollProgress() {
        var bar = document.getElementById('scrollProgress');
        if (!bar) return;
        window.addEventListener('scroll', function () {
          var scrollTop = window.scrollY || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
          bar.style.width = pct + '%';
        }, { passive: true });

      // quiz 始终运行时获取（预渲染页与 ?path= 入口共用）
      function startQuizFetch(path, force) {
        if (lessonQuizPromise && !force) return lessonQuizPromise;
        if (prerendered && prerendered.path === path && prerendered.quiz) {
          lessonQuizPromise = Promise.resolve(prerendered.quiz);
          return lessonQuizPromise;
        }
        if (certificationLesson && path === certificationLesson.path) {
          lessonQuizPromise = Promise.resolve(certificationLesson.quiz || null);
          return lessonQuizPromise;
        }
        var source = window.AIFSContentSource;
        var localPreview = !!(source && typeof source.isLocal === 'function' && source.isLocal());
        var fetchOptions = localPreview ? { cache: 'no-store' } : undefined;
        var quizUrl = source
          ? source.repoUrl(path + '/quiz.json')
          : 'https://raw.githubusercontent.com/fancyboi999/ai-engineering-from-scratch-zh/' + ACTIVE_REF + '/' + path + '/quiz.json';
        lessonQuizPromise = fetch(quizUrl, fetchOptions)
          .then(function (res) { return res.ok ? res.json() : null; })
          .catch(function () { return null; });
        return lessonQuizPromise;
      }

      function fetchQuiz(path) {
        startQuizFetch(path)
          .then(function (data) {
            if (!data) return;
            try { renderQuiz(data); }
            catch (err) { console.error('renderQuiz failed', err); }
          });
      }

      function fetchLesson(path, retried) {
        if (certificationLesson && path === certificationLesson.path && typeof certificationLesson.markdown === 'string') {
          lessonQuizPromise = Promise.resolve(certificationLesson.quiz || null);
          try {
            renderLesson(certificationLesson.markdown);
            fetchQuiz(path);
          } catch (err) {
            console.error('renderLesson failed', err);
            showError('渲染出错', '认证课程已加载，但渲染失败。详情请查看浏览器控制台。');
          }
          return;
        }

        // 从本次部署所基于的分支拉取 docs（build.js 经 build-meta.js 写入 __AIFS_REF），
        // 使 PR preview 部署渲染自己分支的课程改动，而非永远拉 main；缺省回退 main。
        var source = window.AIFSContentSource;
        var localPreview = !!(source && typeof source.isLocal === 'function' && source.isLocal());
        var fetchOptions = localPreview ? { cache: 'no-store' } : undefined;
        var rawUrl = source
          ? source.repoUrl(path + '/docs/zh.md')
          : 'https://raw.githubusercontent.com/fancyboi999/ai-engineering-from-scratch-zh/' + ACTIVE_REF + '/' + path + '/docs/zh.md';
        startQuizFetch(path, !!retried);

        fetch(rawUrl, fetchOptions)
          .then(function (res) {
            if (!res.ok) throw new Error('fetch-failed');
            return res.text();
          })
          .then(function (md) {
            try {
              renderLesson(md);
            } catch (err) {
              console.error('renderLesson failed', err);
              showError('渲染出错', '已加载课程的 Markdown，但渲染失败。详情请查看浏览器控制台。');
              return;
            }
            fetchQuiz(path);
          })
          .catch(function () {
            if (!retried) {
              lessonQuizPromise = null;
              setTimeout(function () { fetchLesson(path, true); }, 600);
              return;
            }
            showError('未找到课程', '无法获取位于 <code>' + escapeHtml(path) + '</code> 的课程，它可能还没有编写。');
          });
      }

      function showError(title, msg) {
        var el = document.getElementById('lessonContent');
        disposeRenderedLesson(el);
        var contextTrack = certificationContextTrack();
        var backHref = contextTrack ? 'certification.html?id=' + encodeURIComponent(contextTrack.id) : 'index.html';
        var backText = contextTrack ? '返回认证路线' : '返回首页';
        el.innerHTML = '<div class="lesson-error"><h2>' + title + '</h2><p>' + msg + '</p><a href="' + backHref + '" class="btn btn-primary">' + backText + '</a></div>';

      // 客户端逐课 SEO：动态设置 canonical / description / JSON-LD（LearningResource）
      function updateLessonSeo(title, md) {
        var ORIGIN = location.origin;  // 跟随部署域名:fork 部署时 canonical/og:url/JSON-LD 自动指向自己
        var path = new URLSearchParams(location.search).get('path') || '';
        if (!path) return;  // 防御：空 path 会生成 /lessons// 这种坏 canonical
        // canonical 指向预渲染静态页（SEO 主体）；旧 ?path= URL 仅作兼容入口
        var url = ORIGIN + lessonHref(path);
        var contextTrack = certificationContextTrack();
        var desc = lessonDescription(md);
        var courseName = certificationLesson
          ? (contextTrack && (contextTrack.credential || contextTrack.title || contextTrack.shortName) || 'Claude 认证备考')
          : 'AI Engineering from Scratch 简体中文版';
        var fullTitle = title + ' · ' + courseName;
        var set = function (sel, val) { var m = document.querySelector(sel); if (m) m.setAttribute('content', val); };

        var canon = document.querySelector('link[rel="canonical"]');
        if (canon) canon.setAttribute('href', url);
        set('meta[name="description"]', desc);
        set('meta[property="og:title"]', fullTitle);
        set('meta[property="og:description"]', desc);
        set('meta[name="twitter:title"]', fullTitle);
        set('meta[name="twitter:description"]', desc);
        set('meta[property="og:image"]', ORIGIN + '/og-image.png?v=2');   // 社交卡图跟随部署域名
        set('meta[name="twitter:image"]', ORIGIN + '/og-image.png?v=2');
        var ogu = document.querySelector('meta[property="og:url"]');
        if (!ogu) { ogu = document.createElement('meta'); ogu.setAttribute('property', 'og:url'); document.head.appendChild(ogu); }
        ogu.setAttribute('content', url);

        var prev = document.getElementById('lessonJsonLd');
        if (prev) prev.remove();
        var breadcrumbs;
        if (certificationLesson) {
          breadcrumbs = [
            { '@type': 'ListItem', position: 1, name: '首页', item: ORIGIN },
            { '@type': 'ListItem', position: 2, name: '认证', item: ORIGIN + '/certifications.html' }
          ];
          if (contextTrack) {
            breadcrumbs.push({ '@type': 'ListItem', position: 3, name: courseName, item: ORIGIN + '/certification?id=' + encodeURIComponent(contextTrack.id) });
          }
          breadcrumbs.push({ '@type': 'ListItem', position: breadcrumbs.length + 1, name: title, item: url });
        } else {
          breadcrumbs = [
            { '@type': 'ListItem', position: 1, name: '首页', item: ORIGIN },
            { '@type': 'ListItem', position: 2, name: '课程表', item: ORIGIN + '/catalog.html' },
            { '@type': 'ListItem', position: 3, name: title, item: url }
          ];
        }
        var ld = {
          '@context': 'https://schema.org',
          '@graph': [
            { '@type': 'LearningResource', name: title, description: desc, url: url,
              inLanguage: 'zh-CN', isAccessibleForFree: true,
              isPartOf: { '@type': 'Course', name: courseName, url: contextTrack ? ORIGIN + '/certification.html?id=' + encodeURIComponent(contextTrack.id) : ORIGIN } },
            { '@type': 'BreadcrumbList', itemListElement: breadcrumbs }
          ]
        };
        var s = document.createElement('script');
        s.type = 'application/ld+json';
        s.id = 'lessonJsonLd';
        s.textContent = JSON.stringify(ld);
        document.head.appendChild(s);
      }

      var headingHashRestoreFrame = 0;
      var mermaidRenderSeq = 0;

      function lessonActionRunFile(files) {
        if (!Array.isArray(files)) return null;
        var supported = /\.(py|ts|js|rs|jl|sh)$/i;
        for (var i = 0; i < files.length; i++) {
          var name = files[i] && String(files[i].name || '').trim();
          if (/^main\.(py|ts|js|rs|jl|sh)$/i.test(name)) return files[i];
        }
        for (var j = 0; j < files.length; j++) {
          var fallbackName = files[j] && String(files[j].name || '').trim();
          if (files.length === 1 && supported.test(fallbackName)) return files[j];
        }
        return null;
      }

      function mountVideoPlayer(path) {
        if (!path) return;
        var article = document.querySelector('.lesson-article');
        if (!article) return;

        function inject(manifest) {
          var entry = manifest[path];
          if (!entry || !entry.r2) return; // 该课暂无视频

          var hasBili = !!(entry.bilibili);

          var banner = document.createElement('div');
          banner.className = 'lesson-video-banner';
          banner.innerHTML =
            '<div class="lesson-video-header" id="lvHeader" role="button" tabindex="0" aria-expanded="false">' +
              '<span class="lesson-video-icon">▶</span>' +
              '<span class="lesson-video-label">视频讲解</span>' +
              (hasBili
                ? '<span class="lesson-video-sources">' +
                    '<button class="lesson-video-src-btn active" data-src="r2">高清</button>' +
                    '<button class="lesson-video-src-btn" data-src="bili">Bilibili</button>' +
                  '</span>'
                : '') +
              '<button class="lesson-video-toggle" id="lvToggle">展开</button>' +
            '</div>' +
            '<div class="lesson-video-body" id="lvBody">' +
              '<video id="lvVideo" controls preload="none" playsinline></video>' +
            '</div>';

          article.parentNode.insertBefore(banner, article);

          var header  = banner.querySelector('#lvHeader');
          var body    = banner.querySelector('#lvBody');
          var toggle  = banner.querySelector('#lvToggle');
          var video   = banner.querySelector('#lvVideo');
          var srcBtns = banner.querySelectorAll('.lesson-video-src-btn');
          var currentSrc = 'r2';

          function setSource(src) {
            currentSrc = src;
            srcBtns.forEach(function (b) {
              b.classList.toggle('active', b.dataset.src === src);
            });
            if (src === 'r2') {
              body.innerHTML = '<video id="lvVideo" controls preload="none" playsinline></video>';
              body.querySelector('#lvVideo').src = entry.r2;
            } else {
              // entry.bilibili 是裸 BV 号（投稿脚本回填的就是 bvid），需拼成 B 站播放器嵌入 URL，
              // 否则裸 BV 当 iframe src 会被当相对路径解析成 404。
              body.innerHTML = '<iframe src="//player.bilibili.com/player.html?bvid=' +
                encodeURIComponent(entry.bilibili) + '&page=1&autoplay=0&high_quality=1" ' +
                'scrolling="no" frameborder="no" allowfullscreen loading="lazy"></iframe>';
            }
          }

          function openPlayer() {
            body.classList.add('open');
            toggle.textContent = '收起';
            header.setAttribute('aria-expanded', 'true');
            if (currentSrc === 'r2' && video && !video.src) {
              video.src = entry.r2;
            }
          }

          function closePlayer() {
            body.classList.remove('open');
            toggle.textContent = '展开';
            header.setAttribute('aria-expanded', 'false');
          }

          header.addEventListener('click', function (e) {
            if (e.target.closest('.lesson-video-src-btn')) return;
            body.classList.contains('open') ? closePlayer() : openPlayer();
          });
          header.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              body.classList.contains('open') ? closePlayer() : openPlayer();
            }
          });
          srcBtns.forEach(function (btn) {
            btn.addEventListener('click', function () { setSource(btn.dataset.src); });
          });

          openPlayer(); // 默认展开（preload="none" 仅显示外壳，不预下载，无带宽代价）
        }

        if (_videoManifest) { inject(_videoManifest); return; }
        fetch('/videos.json?v=1')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) { if (data) { _videoManifest = data; inject(data); } })
          .catch(function () {}); // 静默失败，不影响课程正文
      }

      function buildTOC() {
        var sidebar = document.getElementById('tocSidebar');
        if (!sidebar) return;

        var article = document.querySelector('.lesson-article');
        if (!article) {
          sidebar.innerHTML = '';
          sidebar.removeAttribute('aria-hidden');
          return;
        }

        var headings = article.querySelectorAll('h2, h3');
        if (!headings.length) {
          sidebar.innerHTML = '';
          sidebar.removeAttribute('aria-hidden');
          return;
        }

        var used = Object.create(null);

        function ensureHeadingId(heading, idx) {
          if (!heading) return '';

          var base = '';
          if (heading.id) {
            base = heading.id;
          } else if (typeof slugify === 'function') {
            base = slugify(heading.textContent || '');
          } else {
            base = String(heading.textContent || '').toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
          }
          if (!base) base = 'section-' + String(idx + 1);

          var candidate = base;
          var n = 2;

          while (used[candidate] || (document.getElementById(candidate) && document.getElementById(candidate) !== heading)) {
            candidate = base + '-' + n;
            n++;
          }
          
          used[candidate] = true;
          heading.id = candidate;
          return candidate;
        }

        var html = '<div class="toc-header">本页目录</div>';
        html += '<nav aria-label="本页目录"><ul class="toc-nav">';
        for (var i = 0; i < headings.length; i++) {
          var heading = headings[i];
          var level = heading.tagName.toLowerCase();
          var id = ensureHeadingId(heading, i);
          if (!id) continue;
          var fullText = (heading.textContent || '').trim();
          var text = fullText.replace(/^[^\p{L}\p{N}]+/u, '').trim();
          if (!text) continue;
          html += '<li class="toc-item toc-' + level + '"><a href="#' + id + '" class="toc-link" data-toc-id="' + id + '" title="' + escapeHtml(fullText) + '">' + escapeHtml(text) + '</a></li>';
        }
        html += '</ul></nav>';
        sidebar.innerHTML = html;
        sidebar.removeAttribute('aria-hidden');

        sidebar.querySelectorAll('.toc-link').forEach(function (a) {
          a.addEventListener('click', function (e) {
            var href = a.getAttribute('href');
            if (!href || href.charAt(0) !== '#') return;
            var id = href.slice(1);
            var target = document.getElementById(id);
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', '#' + id);
            if (!target.hasAttribute('tabindex')) {
              target.setAttribute('tabindex', '-1');
              target.addEventListener('blur', function blurHandler() {
                target.removeAttribute('tabindex');
                target.removeEventListener('blur', blurHandler);
              });
            }
            target.focus({ preventScroll: true });
          });
        });

        initScrollspy(headings, sidebar);
      }

      function initScrollspy(headings, sidebar) {
        sidebar = sidebar || document.getElementById('tocSidebar');
        if (!sidebar) return;

        var links = sidebar.querySelectorAll('.toc-link');
        if (!links.length || !headings || !headings.length) return;

        var headerOffsetStr = getComputedStyle(document.documentElement).getPropertyValue('--header-offset').trim();
        var headerOffset = parseInt(headerOffsetStr, 10) || 92;

        if (sidebar._tocObserver && sidebar._tocObserver.disconnect) {
          sidebar._tocObserver.disconnect();
          sidebar._tocObserver = null;
        }
        if (sidebar._tocScrollHandler) {
          window.removeEventListener('scroll', sidebar._tocScrollHandler);
          sidebar._tocScrollHandler = null;
        }
        if (sidebar._tocResizeHandler) {
          window.removeEventListener('resize', sidebar._tocResizeHandler);
          sidebar._tocResizeHandler = null;
        }

        function setActive(id) {
          if (!id || sidebar._tocActiveId === id) return;
          sidebar._tocActiveId = id;

          links.forEach(function (link) {
            var href = link.getAttribute('href');
            var match = href && href.charAt(0) === '#' ? href.slice(1) : '';
            if (match === id) link.classList.add('active');
            else link.classList.remove('active');
          });

          var activeLink = sidebar.querySelector('.toc-link.active');
          if (activeLink) {
            var linkTop = activeLink.offsetTop;
            var sidebarHeight = sidebar.clientHeight;
            var sidebarScroll = sidebar.scrollTop;
            if (linkTop < sidebarScroll + 50 || linkTop > sidebarScroll + sidebarHeight - 100) {
              sidebar.scrollTo({ top: Math.max(0, linkTop - sidebarHeight / 3), behavior: 'smooth' });
            }
          }
        }

        function fallbackByScroll() {
          var y = (window.scrollY || document.documentElement.scrollTop || 0) + headerOffset + 18;
          var active = '';
          for (var i = 0; i < headings.length; i++) {
            var h = headings[i];
            if (!h || !h.id) continue;
            var top = h.getBoundingClientRect().top + window.scrollY;
            if (top <= y) active = h.id;
            else break;
          }
          if (!active && headings[0] && headings[0].id) active = headings[0].id;
          if (active) setActive(active);
        }

        if (typeof IntersectionObserver !== 'undefined') {
          var marginOffset = headerOffset - 4;
          var obs = new IntersectionObserver(function (entries) {
            var best = null;
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              if (!e.isIntersecting) continue;
              if (!best) best = e;
              else if (e.boundingClientRect.top < best.boundingClientRect.top) best = e;
            }
            if (best && best.target && best.target.id) setActive(best.target.id);
          }, {
            root: null,
            threshold: [0.01, 0.1],
            rootMargin: '-' + marginOffset + 'px 0px -70% 0px'
          });

          Array.from(headings).forEach(function (h) {
            if (h && h.id) obs.observe(h);
          });
          sidebar._tocObserver = obs;

          var initial = (location.hash && location.hash.charAt(0) === '#') ? location.hash.slice(1) : '';
          if (initial && document.getElementById(initial)) setActive(initial);
          else if (headings[0] && headings[0].id) setActive(headings[0].id);

          return;
        }

        sidebar._tocScrollHandler = function () {
          if (window._tocTicking) return;
          window._tocTicking = true;
          window.requestAnimationFrame(function () {
            fallbackByScroll();
            window._tocTicking = false;
          });
        };
        window.addEventListener('scroll', sidebar._tocScrollHandler, { passive: true });

        sidebar._tocResizeHandler = function () {
          fallbackByScroll();
        };
        window.addEventListener('resize', sidebar._tocResizeHandler);

        fallbackByScroll();
      }
