groups:
  - id: foundations
    title: 算法基础
    summary: "支撑后续所有技术深度的数学、经典网络与 Transformer 核心。"
  - id: models
    title: 模型与服务
    summary: "后训练微调、推理加速服务与 GPU 显存量化深度优化。"
  - id: applications
    title: 场景应用
    summary: "检索增强生成 (RAG)、Prompt 工程、结构化输出与多模态系统。"
  - id: agents
    title: 智能体系统
    summary: "Agent 控制循环、MCP/A2A 通信协议、多 Agent 协同与执行沙箱。"
  - id: production
    title: 生产运维
    summary: "模型服务运维：灰度发布、系统可观测性、成本容量规划与 AI 安全。"
  - id: rounds
    title: 综合面试轮次
    summary: "完整面试轮次覆盖：系统架构设计、事故排查、手写代码与行为面试。"
