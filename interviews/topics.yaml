groups:
  - id: foundations
    title: 基础
    summary: "数学、神经网络与 Transformer，后面每个答案都建立在它们之上。"
  - id: models
    title: 模型
    summary: "模型训练后怎样调优、怎样为用户提供服务，以及怎样装进 GPU 显存。"
  - id: applications
    title: 应用
    summary: "检索、prompt、结构化输出、评估，以及能看能听的模型。"
  - id: agents
    title: Agent
    summary: "agent 循环、协议、多 agent 团队、沙箱，以及从二进制文件中取证。"
  - id: production
    title: 生产
    summary: "运营模型服务：发布、可观测性、成本、容量与安全。"
  - id: rounds
    title: 面试轮次
    summary: "完整的面试轮次：系统设计、故障排查、编程和行为面试题。"
